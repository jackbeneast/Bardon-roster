<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#F5F0EB"><meta name="referrer" content="no-referrer">
<title>Bardon Clean · Agent Portal</title>
<link rel="apple-touch-icon" href="/icons/brand-apple-touch-icon.png"><link rel="icon" type="image/png" href="/icons/brand-favicon.png"><meta name="apple-mobile-web-app-title" content="Bardon Clean">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --terracotta:#C06B3C;--terracotta-dark:#A55830;--dark:#1A1A1A;--cream:#F5F0EB;--cream-dark:#EDE6DE;
  --body:#4A4A4A;--meta:#6B635B;--btn:#A55830;--btn-hover:#8F4A27;--gold:#F4B942;--white:#FFFFFF;--line:#DDD3C8;--tint:#FBF3EE;--live:#F6E3D7;
  --ok:#2F5A35;--ok-bg:#E6EFE3;
  --serif:"Playfair Display",Georgia,serif;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--cream);color:var(--body);font:400 15px/1.55 var(--sans);margin:0}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px}
main.wrap{padding-block:4px 60px}
h1,h2,h3{font-family:var(--serif);font-weight:700;color:var(--dark);margin:0;line-height:1.2;text-wrap:balance}
h1 em,h2 em{font-style:italic;font-weight:500}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--terracotta);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cream);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding-block:14px 8px}
.brand svg{width:38px;height:38px;flex:none}
.wm{font:700 19px/1 var(--serif);color:var(--dark)}
.wm small{display:block;font:500 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--meta);margin-top:5px}
.who{margin-left:auto;text-align:right;font-size:12px;color:var(--meta);line-height:1.35;min-width:0}
.who strong{display:block;color:var(--dark);font-weight:600;font-size:13px}
.who select{font:500 13px var(--sans);border:1px solid var(--line);border-radius:6px;padding:6px;background:var(--white);color:var(--dark);max-width:180px}
.tabs{display:flex}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:11px 4px;color:var(--meta);font-weight:500;font-size:14px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--terracotta-dark);border-color:var(--terracotta)}
.n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--cream-dark);color:var(--dark);font-size:11px;line-height:18px;font-variant-numeric:tabular-nums}

.intro{padding-block:22px 4px}
.intro h1{font-size:27px}
.intro p{margin:6px 0 0;color:var(--meta);font-size:14px}
.list{display:grid;gap:12px;margin-top:14px}
.empty{background:var(--white);border:1px dashed var(--line);border-radius:8px;padding:18px;color:var(--meta);font-size:14px;margin-top:14px}
.card{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px;text-align:left;width:100%;color:inherit}
button.card:hover{border-color:#C9BBAC}
.ctop{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ctop>div{min-width:0}
.card h3{font-size:19px;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--meta)}
.pill{flex:none;font:600 12px/1 var(--sans);padding:6px 10px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill.on{background:var(--live);color:var(--btn-hover)}
.pill.on::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--terracotta);animation:pulse 1.6s infinite}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bk{background:var(--cream);color:var(--dark)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.pill.on::before{animation:none}}
.bar{height:6px;background:var(--cream-dark);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--terracotta);transition:width .5s}
.bar.ok i{background:var(--ok)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact span{display:block;font:500 11px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--meta)}
.fact b{color:var(--dark);font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.ready{font-size:14px;color:var(--dark);background:var(--tint);border-radius:6px;padding:8px 10px}
.ready b{color:var(--terracotta-dark);font-weight:600}
.team{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 13px/1 var(--sans);color:var(--dark);background:var(--cream);border-radius:999px;padding:4px 10px 4px 4px}
.av{width:22px;height:22px;border-radius:50%;background:var(--dark);color:var(--white);font:600 10px/1 var(--sans);display:grid;place-items:center}
.chip .t{color:var(--meta);font-weight:400}

/* Detail */
.detail{position:fixed;inset:0;z-index:20;background:var(--cream);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{position:sticky;top:0;background:var(--cream);border-bottom:1px solid var(--line);z-index:2}
.dhead .wrap{display:flex;align-items:center;gap:10px;padding-block:12px}
.back{background:none;border:0;color:var(--terracotta-dark);font-weight:600;padding:6px 0}
section.blk{margin-top:24px}
section.blk>h2{font-size:20px;margin-bottom:10px}
.h2i{width:32px;height:32px;border-radius:10px;background:var(--cream-dark,#EDE6DE);color:var(--terracotta-dark,#A55830);display:inline-flex;align-items:center;justify-content:center;flex:none}
section.blk>h2{display:flex;align-items:center;gap:10px}
.gl-grid .gi{display:inline-flex;vertical-align:-2px;margin-right:5px;color:var(--gold,#F4B942);font-style:normal}
ul.prep li,.std li.si{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;padding-left:0;border-left:0}
.prep li .bcb,.std li.si .bcb{margin-top:1px}
.std li.si::before{display:none}

.bk .bk-when{margin-top:6px}
.bk .bk-when b{display:block;font:700 23px/1.2 var(--serif);color:var(--dark)}
.bk .bk-when span{display:block;font-size:15px;color:var(--dark);margin-top:2px}
.bk-rows{margin:12px 0 0;display:grid;gap:6px}
.bk-rows div{display:grid;grid-template-columns:84px 1fr;gap:10px;font-size:14px}
.bk-rows dt{color:var(--meta)}
.bk-rows dd{margin:0;color:var(--dark);font-weight:500}
.prep{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.prep li{font-size:14px;color:var(--body);padding-left:16px;border-left:3px solid var(--terracotta)}
.prep b{display:block;color:var(--dark);font-weight:600}
.panel{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:16px 1fr auto;gap:10px;padding-block:8px;font-size:14px;color:var(--meta);align-items:start}
.tl li::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--line);margin-top:5px;background:var(--white)}
.tl li.hit{color:var(--dark)}
.tl li.hit::before{background:var(--terracotta);border-color:var(--terracotta)}
.tl li.last.hit::before{background:var(--ok);border-color:var(--ok)}
.tl li.now::before{box-shadow:0 0 0 4px var(--live)}
.tl time{font-variant-numeric:tabular-nums;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--cream-dark);font-size:14px;color:var(--dark)}
.row:last-child{border:0}
.row em{font-style:normal;font-size:12px;color:var(--meta);display:block}
.st{font:600 12px/1 var(--sans);white-space:nowrap}
.st.d{color:var(--ok)}.st.p{color:var(--terracotta-dark)}.st.w{color:var(--meta)}
.person{display:flex;gap:12px;align-items:center;padding-block:6px}
.person .av{width:38px;height:38px;font-size:14px}
.person b{display:block;color:var(--dark);font-weight:600}
.seg{display:inline-flex;background:var(--cream-dark);border-radius:8px;padding:3px;margin-bottom:12px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:6px;color:var(--meta);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--dark)}
.proom{margin-top:12px}
.proom h4{font:600 12px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--meta);margin:0 0 8px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.lb{position:fixed;inset:0;z-index:200;background:#0E0E0E;display:flex;flex-direction:column;color:#fff}
.lb-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px 18px;font:500 14px/1.3 Inter,sans-serif}
.lb-top b{font-weight:600}
.lb-top span{color:#B9B2AA}
.lb-x{flex:none;width:48px;height:48px;border:0;background:none;color:#fff;font-size:30px;line-height:1;cursor:pointer}
.lb-track{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.lb-track::-webkit-scrollbar{display:none}
.lb-slide{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;padding:0 4px}
.lb-slide img{max-width:100%;max-height:100%;object-fit:contain;display:block;border-radius:4px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:6px;background:rgba(255,255,255,.12);color:#fff;font-size:26px;cursor:pointer}
.lb-nav.prev{left:8px}.lb-nav.next{right:8px}
.lb-nav[hidden]{display:none}
.lb-bot{padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;font:400 13px Inter,sans-serif;color:#B9B2AA}
@media (hover:none){.lb-nav{display:none}}
.photos a{display:block;aspect-ratio:1;max-width:100%;border-radius:6px;overflow:hidden;background:var(--cream-dark)}
.tour{display:grid;gap:8px}
.tv{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 14px 10px 10px;border:0;border-radius:10px;background:var(--dark);color:var(--cream);font:500 15px/1.3 var(--sans);text-align:left;cursor:pointer}
.tv .pl{flex:none;width:44px;height:44px;border-radius:50%;background:var(--terracotta,#C06B3C);display:flex;align-items:center;justify-content:center}
.tv .pl::after{content:"";margin-left:4px;border-style:solid;border-width:9px 0 9px 14px;border-color:transparent transparent transparent #fff}
.tv b{display:block;font-weight:600}
.tv span{display:block;font-size:13px;color:#B9B2AA;margin-top:2px}
.vp{position:fixed;inset:0;z-index:210;background:#000;display:flex;flex-direction:column;color:#fff}
.vp-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px 18px;font:500 14px/1.3 Inter,sans-serif}
.vp-top b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vp-stage{flex:1;min-height:0;position:relative;padding-bottom:env(safe-area-inset-bottom,0px)}
.vp-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.gl-house{background:var(--white);border-radius:8px;padding:10px 4px 2px;margin:14px 0 4px}
.glance.done .gl-house .house{max-width:250px;margin:0 auto 4px}
.flag{border-left:3px solid var(--gold);background:var(--white);border-radius:0 8px 8px 0;padding:10px 12px;font-size:14px;margin-bottom:8px}
.flag b{display:block;color:var(--dark);font-weight:600}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px;color:var(--dark)}
.checks li{display:flex;gap:10px}
.checks li::before{content:"✓";color:var(--ok);font-weight:700;width:14px}
.checks li.no{color:var(--meta)}.checks li.no::before{content:"·"}
.cform{display:grid;gap:12px}
.cform .note{font-size:13px;color:var(--meta);margin:0}
.chips2{display:flex;flex-wrap:wrap;gap:8px}
.chips2 button{min-height:42px;padding:0 14px;border-radius:999px;border:1.5px solid #CFC5BA;background:var(--white);font:500 14px var(--sans);color:var(--dark);cursor:pointer}
.chips2 button[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:var(--cream)}
.accsum dt{font:600 12px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--meta);margin-top:10px}
.accsum dt:first-child{margin-top:0}
.accsum dd{margin:2px 0 0;font-size:15px;color:var(--dark)}
.fbtn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fbtn button{min-height:56px;border-radius:8px;border:2px solid #CFC5BA;background:var(--white);font:600 15px var(--sans);color:var(--dark);cursor:pointer}
.fbtn button[aria-pressed="true"]{border-color:var(--terracotta);background:#F6E3D7}
.again{display:grid;gap:10px}
.btn{border:0;border-radius:6px;min-height:48px;padding:0 18px;font:600 15px/1 var(--sans);display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.primary{background:var(--btn);color:var(--white)}
.btn.primary:hover{background:var(--btn-hover)}
.btn.primary:disabled{opacity:.6}
.btn.outline{background:var(--white);border:2px solid var(--btn);color:var(--btn)}
.btn.dark{background:var(--dark);color:var(--cream)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}
.contact{font-size:14px;color:var(--body);margin-top:10px}
.contact b{color:var(--dark);user-select:all}

form{display:grid;gap:14px;margin-top:16px}
label{display:grid;gap:6px;font:500 13px/1.3 var(--sans);color:var(--dark)}
label small{font-weight:400;color:var(--meta)}
input,select,textarea{font:400 16px/1.3 var(--sans);padding:11px;min-height:46px;border:1px solid #CFC5BA;border-radius:6px;background:var(--white);color:var(--dark);width:100%}
textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.okmsg{background:var(--ok-bg);color:var(--ok);padding:14px;border-radius:8px;font-size:14px}
.err{color:var(--terracotta-dark);font:500 14px/1.4 var(--sans)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--dark);color:var(--cream);padding:10px 16px;border-radius:999px;font:500 14px var(--sans);z-index:30;max-width:calc(100% - 32px);text-align:center}
.updated{font-size:12px;color:var(--meta);margin-top:8px}
footer{margin-top:36px;font-size:12px;color:var(--meta)}

/* ---- agent portal: home, bottom nav, billing, messages ---- */
body.app main.wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body.app footer{margin-bottom:8px}
.me{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0;text-align:right}
.me .nm{font-size:12px;color:var(--meta);line-height:1.35;min-width:0}
.me .nm strong{display:block;color:var(--dark);font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ini{flex:none;width:36px;height:36px;border-radius:50%;background:var(--dark);color:var(--cream);display:grid;place-items:center;font:600 13px/1 var(--sans);letter-spacing:.02em}
.hero{padding-block:24px 6px}
.hero .hi{font:500 12px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--meta)}
.hero h1{font-size:30px;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stats button{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;color:inherit;min-height:72px}
.stats button[aria-pressed="true"]{border-color:var(--dark);box-shadow:inset 0 0 0 1px var(--dark)}
.stats b{display:block;font:700 26px/1 var(--serif);color:var(--dark);font-variant-numeric:lining-nums}
.stats span{display:block;font-size:12px;color:var(--meta);margin-top:6px}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cta .btn{width:100%}
.money{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--dark);border-top:1px solid var(--cream-dark);padding-top:10px}
.money b{font-weight:600;font-variant-numeric:tabular-nums}
.tag{font:600 12px/1 var(--sans);padding:5px 9px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.due{background:var(--live);color:var(--btn-hover)}.tag.mute{background:var(--cream);color:var(--meta)}
.bsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-bottom:12px;border-bottom:1px solid var(--cream-dark)}
.bsum span{display:block;font:500 11px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--meta)}
.bsum b{display:block;font:700 20px/1.2 var(--serif);color:var(--dark);font-variant-numeric:lining-nums tabular-nums;margin-top:4px}
.bsum b.due{color:var(--btn-hover)}
.bsum small{display:block;font-size:12px;color:var(--meta)}
.doc{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--cream-dark);font-size:14px;color:var(--dark)}
.doc:last-child{border:0;padding-bottom:0}
.doc .dn{font-weight:600}
.doc .dm{font-size:13px;color:var(--meta);grid-column:1}
.doc a{grid-row:1/3;grid-column:2;color:var(--btn);font-weight:600;text-decoration:none;padding:10px 0 10px 10px}
.rsum{background:var(--dark);color:var(--cream);border-radius:10px;padding:16px;margin-top:14px;display:grid;gap:12px}
.rsum .bsum{border-color:#3A3A3A}
.rsum .bsum span{color:#B9B2AA}.rsum .bsum b{color:var(--cream)}.rsum .bsum b.due{color:#F3B38F}
.rsum p{margin:0;font-size:13px;color:#B9B2AA}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(255,255,255,.96);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.bnav button{position:relative;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font:500 11px/1 var(--sans);color:var(--meta);padding:6px 0;min-height:52px;justify-content:flex-end}
.bnav button svg{width:24px;height:24px}
.bnav button[aria-current="page"]{color:var(--btn-hover)}
.bnav .bk2 span.c{width:52px;height:52px;border-radius:50%;background:var(--dark);color:var(--cream);display:grid;place-items:center;margin-top:-24px;box-shadow:0 6px 16px rgba(26,26,26,.22)}
.bnav .bk2{color:var(--dark)}
.bnav .bk2[aria-current="page"] span.c{background:var(--btn)}
.bnav .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--btn);color:#fff;font:600 11px/18px var(--sans);padding:0 5px;text-align:center}
/* chat */
.chat{display:grid;gap:4px;margin-top:16px}
.chat .day{text-align:center;font:500 12px/1 var(--sans);color:var(--meta);margin:14px 0 6px}
.chat .sys{text-align:center;font-size:13px;color:var(--meta);margin:8px 0}
.chat .sys svg{width:120px;height:auto;display:block;margin:0 auto 4px}
.bb{text-align:left;max-width:82%;padding:10px 13px;border-radius:18px;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.bb.me{justify-self:end;background:var(--dark);color:var(--cream);border-bottom-right-radius:6px}
.bb.jk{justify-self:start;background:var(--white);color:var(--dark);border:1px solid var(--line);border-bottom-left-radius:6px}
.bb.gap{margin-top:8px}
.bb.fail{opacity:.6}
.stamp{font-size:11px;color:var(--meta);margin:2px 4px 4px}
.stamp.r{justify-self:end}.stamp.l{justify-self:start}

</div></header>

<script src="/lib/checklists.js"></script>

<script>
(function(){
  var path=location.pathname, mode, cred='';
  // Public demo for the website (/demo, /demo/rent, /demo/agent): made-up data built in the browser, nothing saved.
  var demoAud=window.BCDemo?BCDemo.match(path):null, demo={phase:'day',step:2,hold:0,saved:{}};
  if(demoAud){ mode=demoAud==='agent'?'agent':'vendor'; cred='demo'; }
  else if(/^\/a\/[\w-]+/.test(path)){ mode='agent'; cred=path.split('/')[2]; }
  else if(/^\/v\/[\w-]+/.test(path)){ mode='vendor'; cred=path.split('/')[2]; }
  else mode='admin';
  var gal=[], galKind='', accEdit=false, fbMode='', formDirty=false, data=null, tab='today', openId=null, photoMode='after', as='', err='';
  var JACK='0406 216 212', JACK_TXT='0468 193 772';
  var chatRef='', codeFor='', chatTimer=0, sending=false;
  // Redraw without moving the reader: skip if nothing changed, and put the scroll back.
  function swap(el,html){
    if(el._h===html) return false;
    var y=window.scrollY, oy=el.scrollTop;
    el.innerHTML=html; el._h=html;
    if(window.scrollY!==y) window.scrollTo(0,y);
    if(el.scrollTop!==oy) el.scrollTop=oy;
    return true;
  }
  // While someone is touching or scrolling, hold the demo's auto-play still.
  var busyUntil=0;
  ['touchstart','touchmove','wheel','scroll','keydown'].forEach(function(ev){ window.addEventListener(ev,function(){ busyUntil=Date.now()+6000; },{passive:true,capture:true}); });
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function money(v){ v=+v||0; var c=Math.abs(v%1)>0.004; return '$'+v.toLocaleString('en-AU',{minimumFractionDigits:c?2:0,maximumFractionDigits:c?2:0}); }
  function initials(n){ var p=String(n||'').replace(/\(.*?\)/g,'').trim().split(/\s+/).filter(Boolean); return ((p[0]||'?').charAt(0)+(p.length>1?p[p.length-1].charAt(0):'')).toUpperCase(); }
  function placeOf(j){ return String(j.address||j.suburb||'the property').replace(/^Sample:\s*/,''); }
  var SVG=function(d){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>'; };
  var IC={
    today:SVG('<path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
    cal:SVG('<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>'),
    plus:SVG('<path d="M12 5v14M5 12h14"/>'),
    doc:SVG('<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>'),
    chat:SVG('<path d="M4 5h16v11H9l-5 4z"/>'),
    send:SVG('<path d="M4 12 20 4l-6 16-3-7z"/>')
  };
  var $=function(id){return document.getElementById(id);};
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function ls(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function pad(n){ return (n<10?'0':'')+n; }
  function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function parse(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
  var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
  function fmtDay(s){ var d=parse(s); return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; }
  function fmtTime(t){ if(!t) return '—'; var h=+t.slice(0,2), m=t.slice(3,5); return (h%12||12)+(m==='00'?'':':'+m)+(h>=12?'pm':'am'); }
  function whenAt(s){ if(!s) return ''; var d=new Date(s), n=new Date(); return (d.toDateString()===n.toDateString()?'':['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]+' '+d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+', ')+clock(s); }
  function clock(s){ if(!s) return ''; var d=new Date(s), h=d.getHours(); return (h%12||12)+':'+pad(d.getMinutes())+(h>=12?'pm':'am'); }
  function today(){ return iso(new Date()); }
  function initial(n){ return (n||'?').charAt(0).toUpperCase(); }

  function api(q, opts){
    opts=opts||{}; var h={'content-type':'application/json'};
    if(mode==='admin'){ var k=ls('roster_admin_key'); if(k) h['x-admin-key']=k; }
    return fetch('/api/agent'+(q||''),{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined,cache:'no-store'})
      .then(function(r){ return r.json().catch(function(){return {};}).then(function(d){ if(!r.ok) throw new Error(d.error||'Something went wrong'); return d; }); });
  }
  function drawBar(){
    var b=$('demobar');
    if(!b){ var st=document.createElement('style'); st.textContent=BCDemo.css; document.head.appendChild(st);
      b=document.createElement('div'); b.id='demobar'; b.className='wrap'; $('main').parentNode.insertBefore(b,$('main')); }
    b.innerHTML=BCDemo.bar(demoAud,demo.phase,demo.phase==='day'&&demo.step<BCDemo.steps);
  }
  // On the day, the sample clean plays itself: a room finishes every few seconds, then lock-up.
  // The agent portal loops so the live listing keeps moving.
  function demoTick(){
    if(document.visibilityState!=='visible' || lb || vp || formDirty || Date.now()<busyUntil) return;
    if(demoAud!=='agent' && demo.phase!=='day') return;
    if(demo.step<BCDemo.steps){ demo.step++; load(); }
    else if(demoAud==='agent' && ++demo.hold>3){ demo.hold=0; demo.step=1; load(); }
  }
  function load(){
    if(demoAud){ data=BCDemo.data(demoAud,demo.phase,demo.step,demo.saved); err=''; render(); drawBar();
      if(mode==='vendor') document.title='Sample clean · Bardon Clean';
      return Promise.resolve(); }
    var q = mode==='agent'?'?k='+encodeURIComponent(cred) : mode==='vendor'?'?v='+encodeURIComponent(cred) : (as?'?as='+encodeURIComponent(as):'');
    return api(q).then(function(d){ data=d; err=''; render(); }).catch(function(e){ if(!data){ err=e.message; render(); } });
  }

  // ---- progress model ----
  function prog(j){
    var L=j.live, rooms=j.rooms, done=rooms.filter(function(r){return L.rooms[r]&&L.rooms[r].s==='d';});
    var arr=Object.keys(L.arrived).map(function(k){return L.arrived[k];}).sort();
    var roomTimes=Object.keys(L.rooms).map(function(r){return L.rooms[r].at;}).sort();
    var allDone=done.length===rooms.length;
    var t=[ '', arr[0]||'', arr[0]||roomTimes[0]||'', allDone?(done.map(function(r){return L.rooms[r].at;}).sort().pop()):'', L.done||'' ];
    var step=L.done?4:allDone?3:roomTimes.length?2:arr.length?1:0;
    var pct=L.done?100:Math.round(done.length/rooms.length*100);
    var label=['Booked','Team arrived','Cleaning underway','Final check','Ready'][step];
    var cls=L.done?'ok':(step>0?'on':'bk');
    if(step===0 && j.date>today()) label='Confirmed';
    if(step===0 && j.date<today()) { label='Complete'; cls='ok'; pct=100; }
    return {step:step,pct:pct,label:label,cls:cls,times:t,done:done.length};
  }
  var STEPS=['Booked','Team arrived','Cleaning underway','Final quality check','Ready'];

  function lists(){
    var t=today(), js=(data&&data.jobs)||[];
    var byTime=function(a,b){ return (a.date+a.start).localeCompare(b.date+b.start); };
    return {
      today: js.filter(function(j){return j.date===t;}).sort(byTime),
      upcoming: js.filter(function(j){return j.date>t;}).sort(byTime),
      reports: js.filter(function(j){return j.date<t || (j.date===t && j.live.done);}).sort(function(a,b){return byTime(b,a);})
    };
  }

  function chips(j){
    return '<div class="team">'+j.team.map(function(p){ var a=j.live.arrived[p.id]; return '<span class="chip"><span class="av">'+esc(initial(p.name))+'</span>'+esc(p.name)+(a?' <span class="t">· in '+clock(a)+'</span>':'')+'</span>'; }).join('')+'</div>';
  }
  function spotArt(k){ return window.BCART?'<div aria-hidden="true">'+BCART.spot(k)+'</div>':''; }
  function card(j, kind){
    var p=prog(j), L=j.live, ac=j.actual||{}, place=esc(j.address||j.suburb||'Property');
    var h='<button class="card" data-open="'+esc(j.id)+'"><div class="ctop"><div class="ct-t">'+(window.BCART?BCART.badge(BCART.serviceKey(j.service),40,p.cls==='on'?'dark':''):'')+'<div style="min-width:0"><h3>'+place+'</h3><div class="sub">'+esc([j.address?j.suburb:'',j.service].filter(Boolean).join(' · '))+(mode==='admin'&&j.client?' · '+esc(j.client):'')+'</div></div></div><span class="pill '+p.cls+'">'+esc(p.label)+'</span></div>';
    if(kind==='upcoming'){
      h+='<div class="facts"><div class="fact"><span>Date</span><b>'+fmtDay(j.date)+(j.dayT?' · Day '+j.dayN+' of '+j.dayT:'')+'</b></div><div class="fact"><span>Start</span><b>'+fmtTime(j.start)+'</b></div><div class="fact"><span>Est. finish</span><b>'+fmtTime(L.eta||j.end)+'</b></div></div>';
    } else if(kind==='reports'){
      h+='<div class="facts"><div class="fact"><span>'+(j.days?'Dates':'Date')+'</span><b>'+(j.days?fmtDay(j.days[0].date)+' – '+fmtDay(j.days[j.days.length-1].date)+' · '+j.days.length+' days':fmtDay(j.date))+'</b></div><div class="fact"><span>Finished</span><b>'+(L.done?clock(L.done):'—')+'</b></div><div class="fact"><span>Photos</span><b>'+L.photos.length+'</b></div></div>';
      if(L.flags.length) h+='<div class="ready"><b>'+L.flags.length+' note'+(L.flags.length>1?'s':'')+'</b> for your attention</div>';
    } else {
      h+='<div class="bar'+(L.done?' ok':'')+'" aria-label="'+p.pct+' percent complete"><i style="width:'+p.pct+'%"></i></div>';
      h+='<div class="facts"><div class="fact"><span>'+(ac.in?'Started':'Start')+'</span><b>'+(ac.in?clock(ac.in):fmtTime(j.start))+'</b></div><div class="fact"><span>'+(L.done||ac.out?'Finished':'Est. finish')+'</span><b>'+(ac.out?clock(ac.out):L.done?clock(L.done):fmtTime(L.eta||j.end))+'</b></div><div class="fact"><span>Rooms</span><b>'+p.done+' of '+j.rooms.length+'</b></div></div>';
    }
    if(j.readyBy && kind!=='reports') h+='<div class="ready">Ready for <b>'+esc(j.readyBy)+'</b></div>';
    if(kind==='today' && L.flags.length) h+='<div class="ready"><b>'+L.flags.length+' note'+(L.flags.length>1?'s':'')+'</b> for your attention</div>';
    if(j.team.length && kind!=='reports') h+=chips(j);
    if(mode!=='vendor') h+=moneyLine(j);
    return h+'</button>';
  }

  function render(){
    var who=$('who'), tabsEl=$('tabs'), main=$('main');
    if(err){ main.innerHTML='<div class="intro"><h1>Link not <em>working</em></h1><p>'+esc(err)+'</p></div><div class="empty">Call Jack on <b>'+JACK+'</b>.</div>'; tabsEl.hidden=true; return; }
    if(!data) return;
    if(mode==='admin'){
      who.innerHTML='<label style="display:block"><span class="sub">Viewing as</span><select id="asSel"><option value="">All jobs</option>'+(data.agents||[]).map(function(a){return '<option value="'+esc(a.id)+'"'+(a.id===as?' selected':'')+'>'+esc(a.name)+'</option>';}).join('')+'</select></label>';
    } else if(data.agent && mode==='agent'){ who.innerHTML='<div class="me"><div class="nm"><strong>'+esc(data.agent.name)+'</strong>'+esc(data.agent.agency||'')+'</div><span class="ini" aria-hidden="true">'+esc(initials(data.agent.name))+'</span></div>'; }
    else if(data.agent){ who.innerHTML='<strong>'+esc(data.agent.name)+'</strong>'+esc(data.agent.agency||''); }

    if(mode==='vendor'){
      $('kind').textContent='Your clean'; document.title='Your clean · Bardon Clean';
      tabsEl.hidden=true; openId=data.jobs[0]&&data.jobs[0].id; showDetail(true); return;
    }
    var L=lists();
    tabsEl.hidden=true; document.body.classList.add('app');
    navBar(L);
    var d=new Date(), h='';
    if(tab==='today'){

    tr.scrollLeft=i*tr.clientWidth; lbLabel();
    tr.addEventListener('scroll',function(){ cancelAnimationFrame(raf); raf=requestAnimationFrame(function(){ if(!lb) return; var n=lbIndex();
      el.querySelectorAll('.lb-slide img').forEach(function(im,k){ if(Math.abs(k-n)<=2 && !im.getAttribute('src')) im.src=im.dataset.src; }); lbLabel(); }); });
    el.addEventListener('click',function(e){ if(e.target.closest('.lb-x')) lbClose(true); else if(e.target.closest('.prev')) lbGo(-1); else if(e.target.closest('.next')) lbGo(1); });
    try{ history.pushState({lb:1},''); }catch(e){}
  }
  function lbClose(viaButton){ if(!lb) return; lb.remove(); lb=null; if(viaButton){ try{ if(history.state&&history.state.lb) history.back(); }catch(e){} } }
  window.addEventListener('popstate',function(){ if(lb) lbClose(false); });
  window.addEventListener('resize',function(){ if(lb){ var i=lbIndex(); var tr=lb.querySelector('.lb-track'); tr.scrollLeft=i*tr.clientWidth; } });
  document.addEventListener('click',function(e){ var g=e.target.closest('[data-goto]'); if(!g) return; var t=document.getElementById(g.dataset.goto); if(t) t.scrollIntoView({behavior:'smooth',block:'start'}); });
  document.addEventListener('click',function(e){ var a=e.target.closest('a[data-gi]'); if(!a) return; e.preventDefault(); lbOpen(+a.dataset.gi); });
  function tourBlock(L){ var tv=L.tour||[]; if(!tv.length) return '';
    return '<section class="blk"><h2>'+hi('video')+'<span>Property <em>tour</em></span></h2><div class="tour">'+tv.map(function(v,i){ return '<button type="button" class="tv" data-tv="'+i+'" aria-label="Played walkthrough video: '+esc(v.title)+'"><i class="pl" aria-hidden="true"></i><span style="margin:0;color:inherit"><b>'+esc(v.title)+'</b><span>'+(v.secs?vlen(v.secs)+' · ':'')+'Walkthrough video</span></span></button>'; }).join('')+'</div></section>';
  }
  // Walkthrough video player: full screen, outside the page that refreshes itself,
  // so the 30-second refresh never interrupts a video.
  var vp=null, vlist=[];
  function vlen(n){ var m=Math.floor(n/60), x=n%60; return m+':'+(x<10?'0':'')+x; }
  function vpOpen(v){
    if(vp) vpClose(false);
    var el=document.createElement('div'); el.className='vp'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Walkthrough video');
    el.innerHTML='<div class="vp-top"><b>'+esc(v.title)+'</b><button type="button" class="lb-x" aria-label="Close video">×</button></div><div class="vp-stage"><iframe src="'+esc(v.src)+'" loading="eager" allow="accelerometer;gyroscope;autoplay;encrypted-media;picture-in-picture;fullscreen" allowfullscreen title="'+esc(v.title)+'"></iframe></div>';
    el.addEventListener('click',function(e){ if(e.target.closest('.lb-x')) vpClose(true); });
    document.body.appendChild(el); vp=el; document.body.style.overflow='hidden';
    try{ history.pushState({vp:1},''); }catch(e){}
  }
  function vpClose(viaButton){ if(!vp) return; vp.remove(); vp=null; if($('detail').hidden) document.body.style.overflow=''; if(viaButton){ try{ if(history.state&&history.state.vp) history.back(); }catch(e){} } }
  window.addEventListener('popstate',function(){ if(vp) vpClose(false); });
  document.addEventListener('click',function(e){ var b=e.target.closest('button[data-tv]'); if(!b) return; var j=(data.jobs||[]).find(function(x){return x.id===openId;}), v=j&&(j.live.tour||[])[+b.dataset.tv]; if(v) vpOpen(v); });
  function closeDetail(){ openId=null; $('detail').hidden=true; document.body.style.overflow=''; }

  function toast(m){ var t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(function(){t.remove();},2600); }
  function copy(text){ try{ navigator.clipboard.writeText(text).then(function(){toast('Vendor link copied');},function(){toast(text);}); }catch(e){ toast(text); } }

  document.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    if(b.dataset.demoPhase){ demo.phase=b.dataset.demoPhase; demo.step=demo.phase==='day'?1:0; accEdit=false; fbMode=''; formDirty=false; load(); window.scrollTo(0,0); return; }
    if(b.dataset.tab){ if(b.closest('.bnav,.stats,.cta')) closeDetail(); tab=b.dataset.tab; render(); if(tab!=='messages') window.scrollTo(0,0); return; }
    if(b.dataset.open){ openId=b.dataset.open; showDetail(false); return; }
    if(b.hasAttribute('data-back')){ closeDetail(); return; }
    if(b.dataset.pm){ photoMode=b.dataset.pm; showDetail(mode==='vendor'); return; }
    if(b.dataset.share){ copy(location.origin+'/v/'+b.dataset.share); return; }
    if(b.dataset.sharejob){ var sj=(data.jobs||[]).find(function(x){return x.id===b.dataset.sharejob;}); if(sj) shareReport(sj); return; }
    if(b.dataset.askjob){ chatRef=b.dataset.askjob; closeDetail(); tab='messages'; render(); var t2=$('cText'); if(t2) t2.focus(); return; }
    if(b.dataset.quick){ var t3=$('cText'); t3.value=b.dataset.quick+(t3.value?' '+t3.value:''); lsSet('bc_draft_'+cred,t3.value); sizeBox(t3); t3.focus(); return; }
    if(b.dataset.ask){ closeDetail(); tab='messages'; render(); var t4=$('cText'); if(t4){ t4.value=b.dataset.ask; lsSet('bc_draft_'+cred,t4.value); sizeBox(t4); t4.focus(); } return; }
    if(b.hasAttribute('data-unref')){ chatRef=''; composerSync(); return; }
    if(b.hasAttribute('data-recode')){ codeFor=''; render(); return; }
    if(b.dataset.entry){ b.parentNode.querySelectorAll('button').forEach(function(x){ x.setAttribute('aria-pressed', x===b && x.getAttribute('aria-pressed')!=='true'); }); formDirty=true; return; }
    if(b.hasAttribute('data-accedit')){ accEdit=true; showDetail(true); return; }
    if(b.dataset.fb){ fbMode=b.dataset.fb; formDirty=true; showDetail(true); var ta=$('fb_t'); if(ta) ta.focus(); return; }
  });
  document.addEventListener('change',function(e){ if(e.target.id==='asSel'){ as=e.target.value; load(); } });
  document.addEventListener('input',function(e){ if(e.target.closest('#accForm,#fbForm')) formDirty=true; });
  document.addEventListener('keydown',function(e){ if(e.target.id==='cText' && e.key==='Enter' && !e.shiftKey && window.matchMedia('(hover:hover)').matches){ e.preventDefault(); sendChat(); return; } if(vp){ if(e.key==='Escape') vpClose(true); return; } if(lb){ if(e.key==='Escape') lbClose(true); else if(e.key==='ArrowLeft') lbGo(-1); else if(e.key==='ArrowRight') lbGo(1); return; } if(e.key==='Escape' && openId && mode!=='vendor') closeDetail(); });
  document.addEventListener('submit',function(e){
    if(e.target.id==='cForm'){ e.preventDefault(); sendChat(); return; }
    if(e.target.id==='vPhone'||e.target.id==='vCode'){ e.preventDefault(); var vf=e.target, ve=$('vErr'), vb=vf.querySelector('button'), isP=vf.id==='vPhone', val=vf.elements[isP?'phone':'code'].value.trim();
      if(!val){ ve.textContent=isP?'Add your mobile.':'Enter the code.'; ve.hidden=false; return; }
      if(demoAud){ toast('Demo only. Nothing was sent.'); return; }
      vb.disabled=true; vb.textContent=isP?'Sending…':'Checking…';
      api('',{method:'POST',body:isP?{action:'code',k:cred,phone:val}:{action:'verify',k:cred,code:val}}).then(function(d){ if(isP){ codeFor=val; render(); var ci=document.querySelector('#vCode input'); if(ci) ci.focus(); } else { codeFor=''; data.chat=d.chat; render(); toast('You\'re set. Message away.'); } })
        .catch(function(x){ vb.disabled=false; vb.textContent=isP?'Send code':'Confirm'; ve.textContent=x.message; ve.hidden=false; }); return; }
    if(e.target.id==='accForm'){ e.preventDefault(); var f=e.target, er=$('accErr'), bt=f.querySelector('[type=submit]'), on=f.querySelector('[data-entry][aria-pressed="true"]');
      var body={action:'access',v:cred,entry:on?on.dataset.entry:'',entryNote:f.elements.entryNote.value,parking:f.elements.parking.value,pets:f.elements.pets.value,notes:f.elements.notes.value};
      if(demoAud){ demo.saved.access={entry:body.entry,entryNote:body.entryNote,parking:body.parking,pets:body.pets,notes:body.notes}; accEdit=false; formDirty=false; load(); toast('Demo only. Nothing was sent.'); return; }
      bt.disabled=true; bt.textContent='Saving…';
      api('',{method:'POST',body:body}).then(function(d){ data.client.access=d.access; accEdit=false; formDirty=false; showDetail(true); toast('Saved. The team will see it.'); })
        .catch(function(x){ bt.disabled=false; bt.textContent='Save details for the team'; er.textContent=x.message; er.hidden=false; }); return; }
    if(e.target.id==='fbForm'){ e.preventDefault(); var g=e.target, ge=$('fbErr'), gb=g.querySelector('[type=submit]');
      if(demoAud){ demo.saved.feedback={mood:fbMode}; formDirty=false; load(); toast('Demo only. Nothing was sent.'); return; }
      gb.disabled=true; gb.textContent='Sending…';
      api('',{method:'POST',body:{action:'feedback',v:cred,mood:fbMode,text:g.elements.text.value}}).then(function(d){ data.client.feedback=d.feedback; formDirty=false; showDetail(true); })
        .catch(function(x){ gb.disabled=false; gb.textContent='Send to Jack'; ge.textContent=x.message; ge.hidden=false; }); return; }
    if(e.target.id!=='bookForm') return; e.preventDefault();
    var f=e.target, er=$('bErr'), ok=$('bOk'), btn=f.querySelector('.primary'), body={action:'book',k:cred};
    ['address','suburb','service','readyDate','readyFor','access','beds','baths','invoice','notes'].forEach(function(n){ body[n]=f.elements[n].value; });
    if(!body.address.trim()||!body.readyDate){ er.textContent='Add the address and the date it needs to be ready.'; er.hidden=false; return; }
    er.hidden=true;
    if(demoAud){ f.reset(); ok.textContent='This is a demo, so nothing was sent. To book for real, text Jack on '+JACK_TXT+'.'; ok.hidden=false; return; }
    btn.disabled=true; btn.textContent='Sending…';
    api('',{method:'POST',body:body}).then(function(){ f.reset(); btn.disabled=false; btn.textContent='Send booking request'; ok.textContent='Request sent for '+body.address+'. Jack will confirm the details and price in Messages.'; ok.hidden=false; if(mode==='agent') pullChat(); })
      .catch(function(x){ btn.disabled=false; btn.textContent='Send booking request'; er.textContent=x.message; er.hidden=false; });
  });

  if(mode==='admin' && !ls('roster_admin_key')){ err='Log in on the roster first, then open the agent portal preview from there.'; render(); }
  else if(demoAud){ load(); BCDemo.loadPhotos().then(load); setInterval(demoTick, 3000); document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') load(); }); }
  else { load(); setInterval(function(){ if(document.visibilityState!=='visible' || document.getElementById('bookForm') || formDirty) return; if(tab==='messages') return; load(); }, 30000);
    // Not on Messages: still check for Jack's replies now and then so the badge lights up.
    if(mode==='agent') setInterval(function(){ if(document.visibilityState==='visible' && tab!=='messages') pullChat(); }, 45000);
    document.addEventListener('visibilitychange',function(){ if(document.visibilityState!=='visible') return; if(tab==='messages' && mode==='agent') pullChat(); else load(); }); }
})();
</script>
<script src="/lib/track.js" defer></script>
</body></html>
