<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#F5F0EB"><meta name="referrer" content="no-referrer">
<title>Bardon Clean · Agent Portal</title>
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="/icons/favicon.png"><meta name="apple-mobile-web-app-title" content="Bardon Clean">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --terracotta:#C06B3C;--terracotta-dark:#A55830;--dark:#1A1A1A;--cream:#F5F0EB;--cream-dark:#EDE6DE;
  --body:#4A4A4A;--meta:#7A7A7A;--gold:#F4B942;--white:#FFFFFF;--line:#DDD3C8;--tint:#FBF3EE;--live:#F6E3D7;
  --ok:#2F5A35;--ok-bg:#E6EFE3;
  --serif:"Playfair Display",Georgia,serif;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--cream);color:var(--body);font:400 15px/1.55 var(--sans);margin:0}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px}
main.wrap{padding-block:4px 60px}
h1,h2,h3{font-family:var(--serif);font-weight:700;color:var(--dark);margin:0;line-height:1.2;text-wrap:balance}
h1 em,h2 em{font-style:italic;font-weight:500}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--terracotta);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cream);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding-block:14px 8px}
.brand svg{width:38px;height:38px;flex:none}
.wm{font:700 19px/1 var(--serif);color:var(--dark)}
.wm small{display:block;font:500 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--meta);margin-top:5px}
.who{margin-left:auto;text-align:right;font-size:12px;color:var(--meta);line-height:1.35;min-width:0}
.who strong{display:block;color:var(--dark);font-weight:600;font-size:13px}
.who select{font:500 13px var(--sans);border:1px solid var(--line);border-radius:6px;padding:6px;background:var(--white);color:var(--dark);max-width:180px}
.tabs{display:flex}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:11px 4px;color:var(--meta);font-weight:500;font-size:14px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--terracotta-dark);border-color:var(--terracotta)}
.n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--cream-dark);color:var(--dark);font-size:11px;line-height:18px;font-variant-numeric:tabular-nums}

.intro{padding-block:22px 4px}
.intro h1{font-size:27px}
.intro p{margin:6px 0 0;color:var(--meta);font-size:14px}
.list{display:grid;gap:12px;margin-top:14px}
.empty{background:var(--white);border:1px dashed var(--line);border-radius:8px;padding:18px;color:var(--meta);font-size:14px;margin-top:14px}
.card{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:12px;text-align:left;width:100%;color:inherit}
button.card:hover{border-color:#C9BBAC}
.ctop{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.ctop>div{min-width:0}
.card h3{font-size:19px;overflow-wrap:anywhere}
.sub{font-size:13px;color:var(--meta)}
.pill{flex:none;font:600 12px/1 var(--sans);padding:6px 10px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pill.on{background:var(--live);color:var(--terracotta-dark)}
.pill.on::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--terracotta);animation:pulse 1.6s infinite}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bk{background:var(--cream);color:var(--dark)}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.pill.on::before{animation:none}}
.bar{height:6px;background:var(--cream-dark);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--terracotta);transition:width .5s}
.bar.ok i{background:var(--ok)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact span{display:block;font:500 11px/1.3 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--meta)}
.fact b{color:var(--dark);font-weight:600;font-variant-numeric:tabular-nums;font-size:15px}
.ready{font-size:14px;color:var(--dark);background:var(--tint);border-radius:6px;padding:8px 10px}
.ready b{color:var(--terracotta-dark);font-weight:600}
.team{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 13px/1 var(--sans);color:var(--dark);background:var(--cream);border-radius:999px;padding:4px 10px 4px 4px}
.av{width:22px;height:22px;border-radius:50%;background:var(--dark);color:var(--white);font:600 10px/1 var(--sans);display:grid;place-items:center}
.chip .t{color:var(--meta);font-weight:400}

/* Detail */
.detail{position:fixed;inset:0;z-index:20;background:var(--cream);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{position:sticky;top:0;background:var(--cream);border-bottom:1px solid var(--line);z-index:2}
.dhead .wrap{display:flex;align-items:center;gap:10px;padding-block:12px}
.back{background:none;border:0;color:var(--terracotta-dark);font-weight:600;padding:6px 0}
section.blk{margin-top:24px}
section.blk>h2{font-size:20px;margin-bottom:10px}
.bk .bk-when{margin-top:6px}
.bk .bk-when b{display:block;font:700 23px/1.2 var(--serif);color:var(--dark)}
.bk .bk-when span{display:block;font-size:15px;color:var(--dark);margin-top:2px}
.bk-rows{margin:12px 0 0;display:grid;gap:6px}
.bk-rows div{display:grid;grid-template-columns:84px 1fr;gap:10px;font-size:14px}
.bk-rows dt{color:var(--meta)}
.bk-rows dd{margin:0;color:var(--dark);font-weight:500}
.prep{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.prep li{font-size:14px;color:var(--body);padding-left:16px;border-left:3px solid var(--terracotta)}
.prep b{display:block;color:var(--dark);font-weight:600}
.panel{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:16px 1fr auto;gap:10px;padding-block:8px;font-size:14px;color:var(--meta);align-items:start}
.tl li::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--line);margin-top:5px;background:var(--white)}
.tl li.hit{color:var(--dark)}
.tl li.hit::before{background:var(--terracotta);border-color:var(--terracotta)}
.tl li.last.hit::before{background:var(--ok);border-color:var(--ok)}
.tl li.now::before{box-shadow:0 0 0 4px var(--live)}
.tl time{font-variant-numeric:tabular-nums;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:10px;border-bottom:1px solid var(--cream-dark);font-size:14px;color:var(--dark)}
.row:last-child{border:0}
.row em{font-style:normal;font-size:12px;color:var(--meta);display:block}
.st{font:600 12px/1 var(--sans);white-space:nowrap}
.st.d{color:var(--ok)}.st.p{color:var(--terracotta-dark)}.st.w{color:var(--meta)}
.person{display:flex;gap:12px;align-items:center;padding-block:6px}
.person .av{width:38px;height:38px;font-size:14px}
.person b{display:block;color:var(--dark);font-weight:600}
.seg{display:inline-flex;background:var(--cream-dark);border-radius:8px;padding:3px;margin-bottom:12px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:6px;color:var(--meta);font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--dark)}
.proom{margin-top:12px}
.proom h4{font:600 12px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--meta);margin:0 0 8px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}
.lb{position:fixed;inset:0;z-index:200;background:#0E0E0E;display:flex;flex-direction:column;color:#fff}
.lb-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 8px) 8px 8px 18px;font:500 14px/1.3 Inter,sans-serif}
.lb-top b{font-weight:600}
.lb-top span{color:#B9B2AA}
.lb-x{flex:none;width:48px;height:48px;border:0;background:none;color:#fff;font-size:30px;line-height:1;cursor:pointer}
.lb-track{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.lb-track::-webkit-scrollbar{display:none}
.lb-slide{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;padding:0 4px}
.lb-slide img{max-width:100%;max-height:100%;object-fit:contain;display:block;border-radius:4px}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:6px;background:rgba(255,255,255,.12);color:#fff;font-size:26px;cursor:pointer}
.lb-nav.prev{left:8px}.lb-nav.next{right:8px}
.lb-nav[hidden]{display:none}
.lb-bot{padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;font:400 13px Inter,sans-serif;color:#B9B2AA}
@media (hover:none){.lb-nav{display:none}}
.photos a{display:block;aspect-ratio:1;max-width:100%;border-radius:6px;overflow:hidden;background:var(--cream-dark)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.flag{border-left:3px solid var(--gold);background:var(--white);border-radius:0 8px 8px 0;padding:10px 12px;font-size:14px;margin-bottom:8px}
.flag b{display:block;color:var(--dark);font-weight:600}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:14px;color:var(--dark)}
.checks li{display:flex;gap:10px}
.checks li::before{content:"✓";color:var(--ok);font-weight:700;width:14px}
.checks li.no{color:var(--meta)}.checks li.no::before{content:"·"}
.btn{border:0;border-radius:6px;min-height:48px;padding:0 18px;font:600 15px/1 var(--sans);display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.primary{background:var(--terracotta);color:var(--white)}
.btn.primary:hover{background:var(--terracotta-dark)}
.btn.primary:disabled{opacity:.6}
.btn.outline{background:var(--white);border:2px solid var(--terracotta);color:var(--terracotta-dark)}
.btn.dark{background:var(--dark);color:var(--cream)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}
.contact{font-size:14px;color:var(--body);margin-top:10px}
.contact b{color:var(--dark);user-select:all}

form{display:grid;gap:14px;margin-top:16px}
label{display:grid;gap:6px;font:500 13px/1.3 var(--sans);color:var(--dark)}
label small{font-weight:400;color:var(--meta)}
input,select,textarea{font:400 16px/1.3 var(--sans);padding:11px;min-height:46px;border:1px solid #CFC5BA;border-radius:6px;background:var(--white);color:var(--dark);width:100%}
textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.okmsg{background:var(--ok-bg);color:var(--ok);padding:14px;border-radius:8px;font-size:14px}
.err{color:var(--terracotta-dark);font:500 14px/1.4 var(--sans)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--dark);color:var(--cream);padding:10px 16px;border-radius:999px;font:500 14px var(--sans);z-index:30;max-width:calc(100% - 32px);text-align:center}
.updated{font-size:12px;color:var(--meta);margin-top:8px}
footer{margin-top:36px;font-size:12px;color:var(--meta)}
@media (max-width:420px){.facts{grid-template-columns:1fr 1fr 1fr}.two{grid-template-columns:1fr}.who{max-width:46%}}
</style></head><body>
<header class="top"><div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 48 48" role="img" aria-label="Bardon Clean"><path d="M5 21 L24 6 L43 21" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="square"/><text x="24" y="43" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-weight="700" font-size="25" fill="#1A1A1A">B</text></svg>
    <div class="wm">Bardon Clean<small id="kind">Agent portal</small></div>
    <div class="who" id="who"></div>
  </div>
  <nav class="tabs" id="tabs" role="tablist" hidden></nav>
</div></header>
<main class="wrap" id="main"><div class="intro"><h1>Loading<em>…</em></h1></div></main>
<div class="detail" id="detail" hidden></div>

<script>
(function(){
  var path=location.pathname, mode, cred='';
  if(/^\/a\/[\w-]+/.test(path)){ mode='agent'; cred=path.split('/')[2]; }
  else if(/^\/v\/[\w-]+/.test(path)){ mode='vendor'; cred=path.split('/')[2]; }
  else mode='admin';
  var gal=[], galKind='', data=null, tab='today', openId=null, photoMode='after', as='', err='';
  var JACK='0406 216 212', JACK_TXT='0468 193 772';
  var $=function(id){return document.getElementById(id);};
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function ls(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function pad(n){ return (n<10?'0':'')+n; }
  function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function parse(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
  var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
  function fmtDay(s){ var d=parse(s); return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; }
  function fmtTime(t){ if(!t) return '—'; var h=+t.slice(0,2), m=t.slice(3,5); return (h%12||12)+(m==='00'?'':':'+m)+(h>=12?'pm':'am'); }
  function clock(s){ if(!s) return ''; var d=new Date(s), h=d.getHours(); return (h%12||12)+':'+pad(d.getMinutes())+(h>=12?'pm':'am'); }
  function today(){ return iso(new Date()); }
  function initial(n){ return (n||'?').charAt(0).toUpperCase(); }

  function api(q, opts){
    opts=opts||{}; var h={'content-type':'application/json'};
    if(mode==='admin'){ var k=ls('roster_admin_key'); if(k) h['x-admin-key']=k; }
    return fetch('/api/agent'+(q||''),{method:opts.method||'GET',headers:h,body:opts.body?JSON.stringify(opts.body):undefined,cache:'no-store'})
      .then(function(r){ return r.json().catch(function(){return {};}).then(function(d){ if(!r.ok) throw new Error(d.error||'Something went wrong'); return d; }); });
  }
  function load(){
    var q = mode==='agent'?'?k='+encodeURIComponent(cred) : mode==='vendor'?'?v='+encodeURIComponent(cred) : (as?'?as='+encodeURIComponent(as):'');
    return api(q).then(function(d){ data=d; err=''; render(); }).catch(function(e){ if(!data){ err=e.message; render(); } });
  }

  // ---- progress model ----
  function prog(j){
    var L=j.live, rooms=j.rooms, done=rooms.filter(function(r){return L.rooms[r]&&L.rooms[r].s==='d';});
    var arr=Object.keys(L.arrived).map(function(k){return L.arrived[k];}).sort();
    var roomTimes=Object.keys(L.rooms).map(function(r){return L.rooms[r].at;}).sort();
    var allDone=done.length===rooms.length;
    var t=[ '', arr[0]||'', roomTimes[0]||'', allDone?(done.map(function(r){return L.rooms[r].at;}).sort().pop()):'', L.done||'' ];
    var step=L.done?4:allDone?3:roomTimes.length?2:arr.length?1:0;
    var pct=L.done?100:Math.round(done.length/rooms.length*100);
    var label=['Booked','Team arrived','Cleaning underway','Final check','Ready'][step];
    var cls=L.done?'ok':(step>0?'on':'bk');
    if(step===0 && j.date>today()) label='Confirmed';
    if(step===0 && j.date<today()) { label='Complete'; cls='ok'; pct=100; }
    return {step:step,pct:pct,label:label,cls:cls,times:t,done:done.length};
  }
  var STEPS=['Booked','Team arrived','Cleaning underway','Final quality check','Ready'];

  function lists(){
    var t=today(), js=(data&&data.jobs)||[];
    var byTime=function(a,b){ return (a.date+a.start).localeCompare(b.date+b.start); };
    return {
      today: js.filter(function(j){return j.date===t;}).sort(byTime),
      upcoming: js.filter(function(j){return j.date>t;}).sort(byTime),
      reports: js.filter(function(j){return j.date<t || (j.date===t && j.live.done);}).sort(function(a,b){return byTime(b,a);})
    };
  }

  function chips(j){
    return '<div class="team">'+j.team.map(function(p){ var a=j.live.arrived[p.id]; return '<span class="chip"><span class="av">'+esc(initial(p.name))+'</span>'+esc(p.name)+(a?' <span class="t">· in '+clock(a)+'</span>':'')+'</span>'; }).join('')+'</div>';
  }
  function card(j, kind){
    var p=prog(j), L=j.live, place=esc(j.address||j.suburb||'Property');
    var h='<button class="card" data-open="'+esc(j.id)+'"><div class="ctop"><div><h3>'+place+'</h3><div class="sub">'+esc([j.address?j.suburb:'',j.service].filter(Boolean).join(' · '))+(mode==='admin'&&j.client?' · '+esc(j.client):'')+'</div></div><span class="pill '+p.cls+'">'+esc(p.label)+'</span></div>';
    if(kind==='upcoming'){
      h+='<div class="facts"><div class="fact"><span>Date</span><b>'+fmtDay(j.date)+(j.dayT?' · Day '+j.dayN+' of '+j.dayT:'')+'</b></div><div class="fact"><span>Start</span><b>'+fmtTime(j.start)+'</b></div><div class="fact"><span>Est. finish</span><b>'+fmtTime(L.eta||j.end)+'</b></div></div>';
    } else if(kind==='reports'){
      h+='<div class="facts"><div class="fact"><span>Date</span><b>'+fmtDay(j.date)+(j.dayT?' · Day '+j.dayN+' of '+j.dayT:'')+'</b></div><div class="fact"><span>Finished</span><b>'+(L.done?clock(L.done):'—')+'</b></div><div class="fact"><span>Photos</span><b>'+L.photos.length+'</b></div></div>';
      if(L.flags.length) h+='<div class="ready"><b>'+L.flags.length+' note'+(L.flags.length>1?'s':'')+'</b> for your attention</div>';
    } else {
      h+='<div class="bar'+(L.done?' ok':'')+'" aria-label="'+p.pct+' percent complete"><i style="width:'+p.pct+'%"></i></div>';
      h+='<div class="facts"><div class="fact"><span>Start</span><b>'+fmtTime(j.start)+'</b></div><div class="fact"><span>'+(L.done?'Finished':'Est. finish')+'</span><b>'+(L.done?clock(L.done):fmtTime(L.eta||j.end))+'</b></div><div class="fact"><span>Rooms</span><b>'+p.done+' of '+j.rooms.length+'</b></div></div>';
    }
    if(j.readyBy && kind!=='reports') h+='<div class="ready">Ready for <b>'+esc(j.readyBy)+'</b></div>';
    if(j.team.length && kind!=='reports') h+=chips(j);
    return h+'</button>';
  }

  function render(){
    var who=$('who'), tabsEl=$('tabs'), main=$('main');
    if(err){ main.innerHTML='<div class="intro"><h1>Link not <em>working</em></h1><p>'+esc(err)+'</p></div><div class="empty">Call Jack on <b>'+JACK+'</b>.</div>'; tabsEl.hidden=true; return; }
    if(!data) return;
    if(mode==='admin'){
      who.innerHTML='<label style="display:block"><span class="sub">Viewing as</span><select id="asSel"><option value="">All jobs</option>'+(data.agents||[]).map(function(a){return '<option value="'+esc(a.id)+'"'+(a.id===as?' selected':'')+'>'+esc(a.name)+'</option>';}).join('')+'</select></label>';
    } else if(data.agent){ who.innerHTML='<strong>'+esc(data.agent.name)+'</strong>'+esc(data.agent.agency||''); }

    if(mode==='vendor'){
      $('kind').textContent='Your clean'; document.title='Your clean · Bardon Clean';
      tabsEl.hidden=true; openId=data.jobs[0]&&data.jobs[0].id; main.innerHTML=''; showDetail(true); return;
    }
    var L=lists();
    tabsEl.hidden=false;
    tabsEl.innerHTML=[['today','Today',L.today.length],['upcoming','Upcoming',L.upcoming.length],['reports','Reports',L.reports.length]].map(function(t){return '<button role="tab" data-tab="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'<span class="n">'+t[2]+'</span></button>';}).join('')+(mode==='agent'?'<button role="tab" data-tab="book" aria-selected="'+(tab==='book')+'">Book</button>':'');
    var d=new Date(), h='';
    if(tab==='today'){
      h+='<div class="intro"><h1>On site <em>today</em></h1><p>'+DOWL[d.getDay()]+' '+d.getDate()+' '+MONL[d.getMonth()]+'. Updates as the team works through each room.</p></div>';
      h+=L.today.length?'<div class="list">'+L.today.map(function(j){return card(j,'today');}).join('')+'</div>':'<div class="empty">No cleans at your listings today.'+(L.upcoming.length?' The next one is '+fmtDay(L.upcoming[0].date)+'.':'')+'</div>';
    } else if(tab==='upcoming'){
      h+='<div class="intro"><h1>Coming <em>up</em></h1><p>Booked cleans across your listings.</p></div>';
      h+=L.upcoming.length?'<div class="list">'+L.upcoming.map(function(j){return card(j,'upcoming');}).join('')+'</div>':'<div class="empty">Nothing booked yet.'+(mode==='agent'?' Use Book to request a clean.':'')+'</div>';
    } else if(tab==='reports'){
      h+='<div class="intro"><h1>Handover <em>reports</em></h1><p>Photos, lock-up and anything worth knowing before buyers walk through.</p></div>';
      h+=L.reports.length?'<div class="list">'+L.reports.map(function(j){return card(j,'reports');}).join('')+'</div>':'<div class="empty">Finished cleans will appear here.</div>';
    } else if(tab==='book') h+=bookForm();
    h+='<footer>Bardon Clean · Jack East · <b style="user-select:all">'+JACK+'</b><br>'+(mode==='admin'?'Preview only. Agents see just the jobs tagged to them.':'This link is private to you. Don\'t forward it. Use Copy vendor link on a job instead.')+'</footer>';
    main.innerHTML=h;
    if(openId) showDetail(false);
  }

  function bookForm(){
    return '<div class="intro"><h1>Book a <em>clean</em></h1><p>Tell us the property and when it needs to be ready. Jack will be in touch to confirm the details and price.</p></div>'+
    '<form id="bookForm" novalidate>'+
    '<div class="two"><label for="b_addr">Street address<input id="b_addr" name="address" required></label><label for="b_sub">Suburb<input id="b_sub" name="suburb"></label></div>'+
    '<label for="b_svc">Service<select id="b_svc" name="service"><option>Pre-sale clean</option><option>Deep clean</option><option>Bond clean</option><option>Other</option></select></label>'+
    '<div class="two"><label for="b_date">Needs to be ready by<input id="b_date" name="readyDate" type="date" required min="'+today()+'"></label><label for="b_for">For<select id="b_for" name="readyFor"><option>Photography</option><option>Open home</option><option>Settlement</option><option>Bond inspection</option><option>Other</option></select></label></div>'+
    '<label for="b_acc">Access<select id="b_acc" name="access"><option>Keys from our office</option><option>Lockbox</option><option>Vendor will be home</option><option>Tenant in place</option></select></label>'+
    '<div class="two"><label for="b_beds">Bedrooms<input id="b_beds" name="beds" type="number" min="0" max="20" inputmode="numeric"></label><label for="b_baths">Bathrooms<input id="b_baths" name="baths" type="number" min="0" max="20" inputmode="numeric"></label></div>'+
    '<label for="b_inv">Invoice to<select id="b_inv" name="invoice"><option>Vendor</option><option>Agency</option><option>Paid at settlement</option></select></label>'+
    '<label for="b_notes">Anything we should know <small>Pets, problem areas, items staying, stylist arriving</small><textarea id="b_notes" name="notes"></textarea></label>'+
    '<div class="err" id="bErr" hidden></div><button class="btn primary" type="submit">Send booking request</button><div class="okmsg" id="bOk" hidden></div></form>';
  }

  var LDAY=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'], LMON=['January','February','March','April','May','June','July','August','September','October','November','December'];
  function longDay(s){ var d=parse(s); return LDAY[d.getDay()]+' '+d.getDate()+' '+LMON[d.getMonth()]; }
  function icsHref(j){
    var dt=function(t){ return j.date.replace(/-/g,'')+'T'+(t||'08:00').replace(':','')+'00'; };
    var esc2=function(v){ return String(v||'').replace(/[,;\\]/g,function(c){return '\\'+c;}); };
    var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Bardon Clean//Booking//EN','BEGIN:VEVENT','UID:'+j.id+'@bardonclean.au','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z','DTSTART:'+dt(j.start),'DTEND:'+dt(j.end||j.start),
      'SUMMARY:'+esc2('Bardon Clean: '+(j.service||'clean')),'LOCATION:'+esc2([j.address,j.suburb].filter(Boolean).join(', ')),'DESCRIPTION:'+esc2('Follow your clean live: '+location.href+'  Questions: Jack '+JACK),'END:VEVENT','END:VCALENDAR'].join('\r\n');
    return 'data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);
  }
  function bookingCard(j,L){
    var started=Object.keys(L.arrived||{}).length||L.done||j.date<today();
    var h='<div class="panel bk" style="margin-top:12px"><span class="sub">Your booking</span><div class="bk-when">'+(j.days?j.days.map(function(x){ return '<b>'+esc(longDay(x.date))+'</b><span>Team arrives '+fmtTime(x.start)+(x.end?' · finishing around '+fmtTime(x.end):'')+'</span>'; }).join(''):'<b>'+esc(longDay(j.date))+'</b><span>Team arrives '+fmtTime(j.start)+(j.end?' · finishing around '+fmtTime(j.end):'')+'</span>')+'</div>';
    h+='<dl class="bk-rows">'+(j.address||j.suburb?'<div><dt>Where</dt><dd>'+esc([j.address,j.suburb].filter(Boolean).join(', '))+'</dd></div>':'')+(j.service?'<div><dt>Service</dt><dd>'+esc(j.service)+'</dd></div>':'')+(j.readyBy?'<div><dt>Ready for</dt><dd>'+esc(j.readyBy)+'</dd></div>':'')+'</dl>';
    h+='<div class="actions" style="margin-top:12px">'+(started?'':'<a class="btn outline" href="'+icsHref(j)+'" download="bardon-clean.ics">Add to calendar</a>')+'<a class="btn dark" href="sms:+61468193772">Text Jack</a></div></div>';
    if(!started){
      h+='<section class="blk"><h2>Before we <em>arrive</em></h2><div class="panel"><ul class="prep"><li><b>Access</b>Let Jack know how the team will get in (keys, lockbox or someone home), if it isn\'t sorted yet.</li><li><b>Power and water</b>Please leave both on. The team needs them to clean.</li><li><b>Pets and hazards</b>Let us know about pets, alarms or anything the team should watch for.</li></ul></div></section>';
      h+='<section class="blk"><h2>On the <em>day</em></h2><div class="panel sub" style="font-size:14px">Keep this link. As the team works it updates with their arrival, each room as it\'s finished, and before and after photos.</div></section>';
    }
    return h;
  }
  function showDetail(standalone){
    var j=(data.jobs||[]).find(function(x){return x.id===openId;}), el=$('detail');
    if(!j){ if(standalone){ $('main').innerHTML='<div class="empty">This clean is no longer listed. Call Jack on <b>'+JACK+'</b>.</div>'; } closeDetail(); return; }
    var p=prog(j), L=j.live, keep=el.scrollTop, h='';
    if(standalone){ el.hidden=true; }
    h+='<div class="wrap" style="padding-bottom:60px">';
    h+='<div class="intro"><h1>'+esc(j.address||j.suburb)+'</h1><p>'+esc([j.address?j.suburb:'',j.service,fmtDay(j.date)+(j.dayT?' (day '+j.dayN+' of '+j.dayT+')':'')].filter(Boolean).join(' · '))+'</p>'+(standalone&&data.agent?'<p>Arranged by '+esc(data.agent.name)+(data.agent.agency?', '+esc(data.agent.agency):'')+'</p>':'')+'</div>';
    if(mode==='vendor') h+=bookingCard(j,L);
    h+='<div class="panel" style="margin-top:12px;display:grid;gap:12px"><div class="ctop"><span class="sub">Status</span><span class="pill '+p.cls+'">'+esc(p.label)+'</span></div><div class="bar'+(L.done?' ok':'')+'"><i style="width:'+p.pct+'%"></i></div>';
    h+='<div class="facts"><div class="fact"><span>Start</span><b>'+fmtTime(j.start)+'</b></div><div class="fact"><span>'+(L.done?'Finished':'Est. finish')+'</span><b>'+(L.done?clock(L.done):fmtTime(L.eta||j.end))+'</b></div><div class="fact"><span>Rooms</span><b>'+p.done+' of '+j.rooms.length+'</b></div></div>';
    if(j.readyBy) h+='<div class="ready">Ready for <b>'+esc(j.readyBy)+'</b></div>';
    h+='</div>';
    if(L.updated) h+='<p class="updated">Last update '+clock(L.updated)+(new Date(L.updated).toDateString()!==new Date().toDateString()?', '+fmtDay(iso(new Date(L.updated))):'')+'. This page refreshes itself.</p>';

    h+='<section class="blk"><h2>Progress</h2><div class="panel"><ol class="tl">'+STEPS.map(function(s,i){ var hit=i<=p.step; return '<li class="'+(hit?'hit':'')+(i===p.step&&!L.done&&p.step>0?' now':'')+(i===4?' last':'')+'"><span>'+s+'</span><time>'+(i===0?fmtDay(j.date):(hit?clock(p.times[i]):''))+'</time></li>'; }).join('')+'</ol></div></section>';

    if(j.team.length) h+='<section class="blk"><h2>The <em>team</em></h2><div class="panel">'+j.team.map(function(t){ var a=L.arrived[t.id]; return '<div class="person"><span class="av">'+esc(initial(t.name))+'</span><div><b>'+esc(t.name)+(t.owner?' <span class="sub">· owner</span>':'')+'</b><span class="sub">'+(a?'Arrived '+clock(a):(j.date>=today()?'Starts '+fmtTime(j.start):'—'))+'</span></div></div>'; }).join('')+'</div></section>';

    h+='<section class="blk"><h2>Room by <em>room</em></h2><div class="panel">'+j.rooms.map(function(r){ var x=L.rooms[r], s=(x&&x.s)||'w'; return '<div class="row"><span>'+esc(r)+(x?'<em>'+(s==='d'?'Done ':'Started ')+clock(x.at)+'</em>':'')+'</span><span class="st '+s+'">'+(s==='d'?'Done':s==='p'?'In progress':'To do')+'</span></div>'; }).join('')+'</div></section>';

    var ph=L.photos.filter(function(x){return x.kind===photoMode;}); gal=[]; galKind=photoMode==='after'?'After':'Before';
    h+='<section class="blk"><h2>Photos</h2><div class="seg" role="group" aria-label="Show"><button type="button" data-pm="before" aria-pressed="'+(photoMode==='before')+'">Before <span class="n">'+L.photos.filter(function(x){return x.kind==='before';}).length+'</span></button><button type="button" data-pm="after" aria-pressed="'+(photoMode==='after')+'">After <span class="n">'+L.photos.filter(function(x){return x.kind==='after';}).length+'</span></button></div>';
    if(!ph.length) h+='<div class="empty" style="margin-top:0">'+(photoMode==='after'?'After photos appear as each room is finished.':'No before photos yet.')+'</div>';
    j.rooms.forEach(function(r){ var rp=ph.filter(function(x){return x.room===r;}); if(!rp.length) return; h+='<div class="proom"><h4>'+esc(r)+'</h4><div class="photos">'+rp.map(function(x){ var src='/api/photo?j='+encodeURIComponent(j.id)+'&p='+x.id; gal.push({src:src,room:r}); return '<a href="'+src+'" data-gi="'+(gal.length-1)+'"><img loading="lazy" src="'+src+'&s=t" alt="'+esc(r+', '+photoMode)+'"></a>'; }).join('')+'</div></div>'; });
    h+='</section>';

    h+='<section class="blk"><h2>For your <em>attention</em></h2>'+(L.flags.length?L.flags.map(function(f){return '<div class="flag"><b>'+esc(f.t)+'</b>'+esc(f.d)+'</div>';}).join(''):'<div class="panel sub">Nothing flagged. The team notes anything you should know, such as damage or marks that won\'t come out.</div>')+'</section>';

    h+='<section class="blk"><h2>Lock-<em>up</em></h2><div class="panel"><ul class="checks">'+Object.keys(data.lock).map(function(k){return '<li class="'+(L.lock[k]?'':'no')+'">'+esc(data.lock[k])+'</li>';}).join('')+'</ul>'+(Object.keys(L.lock).length<Object.keys(data.lock).length?'<p class="sub" style="margin:10px 0 0">The team ticks these off before leaving.</p>':'')+'</div></section>';

    h+='<section class="blk"><div class="actions">'+(mode!=='vendor'&&j.share?'<button type="button" class="btn primary" data-share="'+esc(j.share)+'">Copy vendor link</button>':'')+'<a class="btn outline" href="tel:+61406216212">Call Jack</a></div><p class="contact">Jack East, Bardon Clean · <b>'+JACK+'</b></p>'+(mode!=='vendor'&&j.share?'<p class="sub">The vendor link shows this clean only: progress, photos and notes.</p>':'')+'</section>';
    h+='</div>';

    if(standalone){ $('main').innerHTML=h; return; }
    el.innerHTML='<div class="dhead"><div class="wrap"><button class="back" data-back>← Back</button><span class="sub" style="margin-left:auto">'+esc(p.label)+'</span></div></div>'+h;
    if(el.hidden){ el.hidden=false; document.body.style.overflow='hidden'; el.scrollTop=0; } else el.scrollTop=keep;
  }
  // Full-screen photo viewer: swipe (or arrow keys) between every photo in the current set.
  var lb=null;
  function lbIndex(){ var tr=lb.querySelector('.lb-track'); return Math.round(tr.scrollLeft/Math.max(1,tr.clientWidth)); }
  function lbLabel(){ if(!lb) return; var i=Math.min(lb.list.length-1,Math.max(0,lbIndex())), it=lb.list[i];
    lb.querySelector('.lb-top div').innerHTML='<b>'+esc(it.room)+'</b> <span>· '+esc(galKind)+'</span>';
    lb.querySelector('.lb-bot').textContent=(i+1)+' of '+lb.list.length;
    lb.querySelector('.prev').hidden=i===0; lb.querySelector('.next').hidden=i===lb.list.length-1; }
  function lbGo(d){ var tr=lb.querySelector('.lb-track'); tr.scrollTo({left:(lbIndex()+d)*tr.clientWidth,behavior:'smooth'}); }
  function lbOpen(i){
    if(lb) return; var list=gal.slice();
    var el=document.createElement('div'); el.className='lb'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Photos');
    el.innerHTML='<div class="lb-top"><div></div><button type="button" class="lb-x" aria-label="Close">×</button></div><div class="lb-track">'+list.map(function(x,k){ return '<div class="lb-slide"><img alt="'+esc(x.room+', '+galKind)+'" src="'+(Math.abs(k-i)<=2?x.src:'')+'" data-src="'+x.src+'" decoding="async"></div>'; }).join('')+'</div><button type="button" class="lb-nav prev" aria-label="Previous">‹</button><button type="button" class="lb-nav next" aria-label="Next">›</button><div class="lb-bot"></div>';
    document.body.appendChild(el); lb=el; lb.list=list;
    var tr=el.querySelector('.lb-track'), raf=0;
    tr.scrollLeft=i*tr.clientWidth; lbLabel();
    tr.addEventListener('scroll',function(){ cancelAnimationFrame(raf); raf=requestAnimationFrame(function(){ if(!lb) return; var n=lbIndex();
      el.querySelectorAll('.lb-slide img').forEach(function(im,k){ if(Math.abs(k-n)<=2 && !im.getAttribute('src')) im.src=im.dataset.src; }); lbLabel(); }); });
    el.addEventListener('click',function(e){ if(e.target.closest('.lb-x')) lbClose(true); else if(e.target.closest('.prev')) lbGo(-1); else if(e.target.closest('.next')) lbGo(1); });
    try{ history.pushState({lb:1},''); }catch(e){}
  }
  function lbClose(viaButton){ if(!lb) return; lb.remove(); lb=null; if(viaButton){ try{ if(history.state&&history.state.lb) history.back(); }catch(e){} } }
  window.addEventListener('popstate',function(){ if(lb) lbClose(false); });
  window.addEventListener('resize',function(){ if(lb){ var i=lbIndex(); var tr=lb.querySelector('.lb-track'); tr.scrollLeft=i*tr.clientWidth; } });
  document.addEventListener('click',function(e){ var a=e.target.closest('a[data-gi]'); if(!a) return; e.preventDefault(); lbOpen(+a.dataset.gi); });
  function closeDetail(){ openId=null; $('detail').hidden=true; document.body.style.overflow=''; }

  function toast(m){ var t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(function(){t.remove();},2600); }
  function copy(text){ try{ navigator.clipboard.writeText(text).then(function(){toast('Vendor link copied');},function(){toast(text);}); }catch(e){ toast(text); } }

  document.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    if(b.dataset.tab){ tab=b.dataset.tab; render(); window.scrollTo(0,0); return; }
    if(b.dataset.open){ openId=b.dataset.open; showDetail(false); return; }
    if(b.hasAttribute('data-back')){ closeDetail(); return; }
    if(b.dataset.pm){ photoMode=b.dataset.pm; showDetail(mode==='vendor'); return; }
    if(b.dataset.share){ copy(location.origin+'/v/'+b.dataset.share); return; }
  });
  document.addEventListener('change',function(e){ if(e.target.id==='asSel'){ as=e.target.value; load(); } });
  document.addEventListener('keydown',function(e){ if(lb){ if(e.key==='Escape') lbClose(true); else if(e.key==='ArrowLeft') lbGo(-1); else if(e.key==='ArrowRight') lbGo(1); return; } if(e.key==='Escape' && openId && mode!=='vendor') closeDetail(); });
  document.addEventListener('submit',function(e){
    if(e.target.id!=='bookForm') return; e.preventDefault();
    var f=e.target, er=$('bErr'), ok=$('bOk'), btn=f.querySelector('.primary'), body={action:'book',k:cred};
    ['address','suburb','service','readyDate','readyFor','access','beds','baths','invoice','notes'].forEach(function(n){ body[n]=f.elements[n].value; });
    if(!body.address.trim()||!body.readyDate){ er.textContent='Add the address and the date it needs to be ready.'; er.hidden=false; return; }
    er.hidden=true; btn.disabled=true; btn.textContent='Sending…';
    api('',{method:'POST',body:body}).then(function(){ f.reset(); btn.disabled=false; btn.textContent='Send booking request'; ok.textContent='Request sent for '+body.address+'. Jack will be in touch to confirm the details.'; ok.hidden=false; })
      .catch(function(x){ btn.disabled=false; btn.textContent='Send booking request'; er.textContent=x.message; er.hidden=false; });
  });

  if(mode==='admin' && !ls('roster_admin_key')){ err='Log in on the roster first, then open the agent portal preview from there.'; render(); }
  else { load(); setInterval(function(){ if(document.visibilityState==='visible' && !document.getElementById('bookForm')) load(); }, 30000); document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible') load(); }); }
})();
</script>
</body></html>
