<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#F5F0EB">
<title>Desk · Bardon Clean</title>
<link rel="icon" type="image/png" href="/icons/favicon.png?v=2"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--t:#C06B3C;--td:#A55830;--dark:#1A1A1A;--cream:#F5F0EB;--cd:#EDE6DE;--body:#4A4A4A;--meta:#6B635B;--gold:#F4B942;--gd:#9A6B0E;--white:#fff;--line:#DDD3C8;--tint:#FBF3EE;--ok:#2F5A35;--okb:#E6EFE3;--red:#9B2C1F;--redb:#FBEBEB;
  --serif:"Playfair Display",Georgia,serif;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--body);font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
#app{max-width:760px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(70px + env(safe-area-inset-bottom,0px))}
a{color:var(--td)}button,input,select,textarea{font-family:var(--sans)}
:focus-visible{outline:2px solid var(--t);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top a{font:500 14px var(--sans);color:var(--meta);text-decoration:none;padding:10px 0;min-height:44px;display:inline-flex;align-items:center}
h1{font:700 30px/1.15 var(--serif);color:var(--dark);margin:2px 0 0}h1 em,h2 em{font-style:italic;font-weight:500}
h2{font:700 20px/1.2 var(--serif);color:var(--dark);margin:26px 0 10px}
h3{font:600 15.5px/1.3 var(--sans);color:var(--dark);margin:0}
.sub{color:var(--meta);font-size:13.5px;margin:4px 0 0}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 0;padding:0 16px 4px;scrollbar-width:none;position:sticky;top:0;background:var(--cream);z-index:3;padding-top:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--white);color:var(--dark);border-radius:999px;padding:0 14px;font:500 14px var(--sans);cursor:pointer;min-height:42px;white-space:nowrap}
.tab[aria-current="page"]{background:var(--dark);border-color:var(--dark);color:var(--cream)}
.tab .n{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:10px;background:var(--t);color:#fff;font:600 12px/20px var(--sans)}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.need{display:grid;gap:6px;border-left:4px solid var(--line)}
.need.p0{border-left-color:var(--red)}.need.p1{border-left-color:var(--t)}.need.p2{border-left-color:var(--gold)}
.need .ty{font:600 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--meta)}
.need.p0 .ty{color:var(--red)}
.need p{margin:0;font-size:14px;color:var(--body);overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{font:600 14.5px/1 var(--sans);border-radius:8px;min-height:44px;padding:0 14px;cursor:pointer;border:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;background:var(--td);color:#fff}
.btn.o{background:var(--white);border:1.5px solid var(--line);color:var(--dark)}
.btn.q{background:none;color:var(--meta);padding:0 8px}
.btn.sm{min-height:38px;font-size:13.5px;padding:0 12px}
.btn[disabled]{opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat span{display:block;font-size:12.5px;color:var(--meta)}.stat b{display:block;font:700 24px/1.2 var(--serif);color:var(--dark);font-variant-numeric:tabular-nums;margin-top:2px}
.stat small{display:block;font-size:12px;color:var(--meta)}
.stat.hl{background:var(--tint);border-color:#EBD3C2}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 11px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--meta);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--cd);vertical-align:top;font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}
.tw{overflow-x:auto;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:4px 8px;margin-top:10px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--cd)}.row:last-child{border:0}
.row b{color:var(--dark);font-weight:600}
.pill{display:inline-block;align-self:flex-start;flex:none;height:fit-content;font:600 11px/1 var(--sans);padding:5px 8px;border-radius:999px;background:var(--cd);color:var(--dark);white-space:nowrap}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.live{background:#F6E3D7;color:var(--td)}.pill.warn{background:#FBEBC9;color:var(--gd)}.pill.red{background:var(--redb);color:var(--red)}
label.f{display:grid;gap:4px;font:500 13px var(--sans);color:var(--dark);margin-top:10px}
input,select,textarea{font-size:16px;border:1px solid var(--line);border-radius:8px;padding:10px 11px;background:var(--white);color:var(--dark);width:100%}
textarea{min-height:76px;resize:vertical}
.inl{display:flex;gap:8px;margin-top:8px}.inl input{flex:1}
details{margin-top:8px}summary{cursor:pointer;color:var(--td);font-weight:600;font-size:14px;min-height:36px;display:flex;align-items:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.cal .h{font:600 11px var(--sans);color:var(--meta);text-align:center;padding:4px 0}
.cal button{min-height:58px;border:1px solid var(--line);border-radius:8px;background:var(--white);padding:4px;text-align:left;cursor:pointer;font:500 12px var(--sans);color:var(--dark);display:flex;flex-direction:column;gap:3px}
.cal button.free{background:var(--okb);border-color:#C8DCC4}.cal button.closed{background:var(--cd);color:var(--meta)}.cal button.full{background:var(--tint);border-color:#EBD3C2}
.cal button[aria-pressed="true"]{outline:2px solid var(--dark)}
.cal i{display:block;height:5px;border-radius:3px;background:var(--t)}.cal i.tent{background:repeating-linear-gradient(45deg,var(--t) 0 4px,#F2C9AE 4px 8px)}
.cal .w{font-size:10.5px;color:var(--gd)}
.ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block;background:var(--cd)}
.cap{white-space:pre-wrap;font-size:13.5px;background:var(--cream);border-radius:8px;padding:10px;margin-top:8px}
.empty{text-align:center;color:var(--meta);padding:28px 10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:90vw}
.mom{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--cd)}
.err{color:var(--red);font-size:14px;margin-top:6px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--cd)}
.sw input{width:24px;height:24px;accent-color:var(--ok)}
</style><script src="/lib/hubnav.js" data-tabs="tools"></script>
</head><body>
<div id="app"><div class="empty">Loading…</div></div>
<script>
(function(){
  var app=document.getElementById('app'), KEY=null;
  try{ KEY=localStorage.getItem('roster_admin_key'); }catch(e){}
  var TABS=[['needs','Needs me'],['jobs','Bookings'],['cash','Money ahead'],['diary','Diary'],['pricing','Pricing'],['leads','Leads & agents'],['nudges','Rebook & posts'],['records','Records'],['settings','Settings']];
  var tab=(location.hash.slice(1)||'needs'), cache={}, srcDays=90, pick='', openJob='';
  if(tab==='rebook') tab='nudges'; if(tab==='backup') tab='records';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function money(v,c){ v=+v||0; return (v<0?'-':'')+'$'+Math.abs(v).toLocaleString('en-AU',{minimumFractionDigits:c?2:0,maximumFractionDigits:c?2:0}); }
  var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function day(s){ if(!s) return ''; var p=String(s).slice(0,10).split('-'), d=new Date(+p[0],+p[1]-1,+p[2]); return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; }
  function clock(s){ if(!s) return ''; var d=new Date(s), h=d.getHours(); return (h%12||12)+':'+(d.getMinutes()<10?'0':'')+d.getMinutes()+(h>=12?'pm':'am'); }
  function ago(s){ if(!s) return 'never'; var n=Math.round((Date.now()-Date.parse(s))/864e5); return n<=0?'today':n===1?'yesterday':n+' days ago'; }
  function toast(m){ var t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(function(){t.remove();},2600); }
  function api(q,body){ return fetch('/api/plus'+(q||''),{method:body?'POST':'GET',headers:{'content-type':'application/json','x-admin-key':KEY||''},body:body?JSON.stringify(body):undefined,cache:'no-store'}).then(function(r){ return r.json().catch(function(){return {};}).then(function(d){ if(!r.ok) throw new Error(d.error||'Something went wrong'); return d; }); }); }
  function copy(t){ try{ navigator.clipboard.writeText(t).then(function(){ toast('Copied'); },function(){ prompt('Copy',t); }); }catch(e){ prompt('Copy',t); } }

  function shell(inner){
    var n=cache.needs?cache.needs.items.length:0;
    return '<div class="top"><a href="/?v=more" data-hb>‹ Back</a><span style="display:flex;gap:14px"><a href="/marketing/">Growth hub</a><a href="/money/">Quotes &amp; invoices</a></span></div><h1>The <em>desk</em></h1>'+
      '<nav class="tabs" aria-label="Desk sections">'+TABS.map(function(t){ return '<button type="button" class="tab" data-tab="'+t[0]+'"'+(tab===t[0]?' aria-current="page"':'')+'>'+t[1]+(t[0]==='needs'&&n?'<span class="n">'+n+'</span>':'')+'</button>'; }).join('')+'</nav>'+inner;
  }
  function draw(inner){ app.innerHTML=shell(inner); var c=app.querySelector('[aria-current="page"]'); if(c&&c.scrollIntoView) c.scrollIntoView({inline:'center',block:'nearest'}); }
  function load(part,q,force){ if(cache[part]&&!force) return Promise.resolve(cache[part]); return api('?part='+part+(q||'')).then(function(d){ cache[part]=d; return d; }); }
  function render(force){
    if(!KEY){ app.innerHTML='<div class="empty"><h1>Log in <em>first</em></h1><p>Open the hub, log in, then come back here.</p><a class="btn" href="/">Open the hub</a></div>'; return; }
    draw('<div class="empty">Loading…</div>');
    var f=VIEWS[tab]||VIEWS.needs;
    f(force).then(function(h){ draw(h); }).catch(function(e){ draw('<div class="card err">'+esc(e.message)+'</div>'); });
    if(tab!=='needs'&&!cache.needs) load('needs').then(function(d){ var b=app.querySelector('[data-tab="needs"]'); if(b&&d.items.length&&!b.querySelector('.n')) b.insertAdjacentHTML('beforeend','<span class="n">'+d.items.length+'</span>'); }).catch(function(){});
  }

  var VIEWS={
    needs:function(f){ return load('needs','',f).then(function(d){
      var h='<p class="sub">Everything waiting on you, most urgent first. Drafts open in Messages for you to edit and send. Nothing goes out on its own.</p>';
      if(!d.items.length) return h+'<div class="card empty">Nothing needs you right now.</div>';
      return h+d.items.map(function(x){ return '<div class="card need p'+x.p+'"><span class="ty">'+esc(x.type)+'</span><h3>'+esc(x.title)+'</h3>'+(x.sub?'<p>'+esc(x.sub)+'</p>':'')+
        '<div class="acts">'+x.actions.map(function(a){ return a.href&&a.href.charAt(0)==='#'?'<button type="button" class="btn o sm" data-tab="'+esc(a.href.slice(1)==='rebook'?'nudges':a.href.slice(1))+'">'+esc(a.label)+'</button>':'<a class="btn sm'+(/draft/.test(a.label)?'':' o')+'" href="'+esc(a.href)+'">'+esc(a.label)+'</a>'; }).join('')+'<button type="button" class="btn q sm" data-dismiss="'+esc(x.key)+'">Done</button></div></div>'; }).join('');
    }); },

    jobs:function(f){ return load('jobs','',f).then(function(d){
      var h='<p class="sub">Live and upcoming bookings, and the last 10 days. Everything here shows on the client\'s link.</p>';
      if(!d.jobs.length) return h+'<div class="card empty">No bookings in this window.</div>';
      return h+d.jobs.map(function(j){
        var ph=j.phase==='done'?'<span class="pill ok">Done</span>':j.phase==='live'?'<span class="pill live">On site</span>':'<span class="pill">Booked</span>';
        var o=openJob===j.key;
        var s='<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div style="min-width:0"><h3>'+esc(j.client||j.address)+'</h3><p class="sub">'+esc([j.address,j.service].filter(Boolean).join(' · '))+'<br>'+esc(day(j.date)+(j.last!==j.date?' to '+day(j.last):''))+'</p></div>'+ph+'</div>';
        var chips=[];
        if(j.phase==='booked'&&j.kind!=='regular'&&j.kind!=='other') chips.push('<span class="pill'+(j.prep.n>=j.prep.of?' ok':'')+'">Prep '+j.prep.n+'/'+j.prep.of+'</span>');
        if(j.keydate) chips.push('<span class="pill'+(j.keydate.date<=j.last?' red':'')+'">'+esc(j.keydate.what)+' '+esc(day(j.keydate.date))+'</span>');
        if(j.signoff) chips.push('<span class="pill ok">Signed off</span>');
        if(j.feedback) chips.push('<span class="pill '+(j.feedback.mood==='happy'?'ok':'red')+'">'+(j.feedback.mood==='happy'?'Happy':'Not happy')+'</span>');
        var pend=j.addons.filter(function(a){return a.state==='pending';}).length; if(pend) chips.push('<span class="pill warn">'+pend+' extra waiting</span>');
        if(j.entry.length) chips.push('<span class="pill">Entry report</span>');
        if(j.alerts) chips.push('<span class="pill">Texts on</span>');
        if(!j.access&&j.phase==='booked') chips.push('<span class="pill warn">No access details</span>');
        if(chips.length) s+='<div class="acts">'+chips.join('')+'</div>';
        s+='<div class="acts">'+(j.share?'<a class="btn o sm" href="/v/'+esc(j.share)+'" target="_blank" rel="noopener">Client link</a>':'')+'<button type="button" class="btn o sm" data-open="'+esc(j.key)+'">'+(o?'Close':'Updates, extras, notes')+'</button></div>';
        if(o){
          s+='<h3 style="margin-top:16px">Post an update to their feed</h3><p class="sub">Shows in "Happening now" on their link. Short and specific works best.</p><form class="inl" data-f="moment" data-bk="'+esc(j.key)+'"><input name="text" maxlength="200" placeholder="e.g. Oven was a big one, all sparkling now"><button class="btn sm">Post</button></form>';
          s+=j.moments.slice().reverse().map(function(m){ return '<div class="mom"><span>'+esc(clock(m.at))+' · '+esc(m.t)+'</span><button type="button" class="btn q sm" data-unmom="'+esc(m.id)+'" data-bk="'+esc(j.key)+'">Remove</button></div>'; }).join('');
          s+='<h3 style="margin-top:18px">Extras for their OK</h3><p class="sub">The client approves or declines on their link. Approved extras go on the unpaid invoice for this booking, if there is one.</p>';
          s+=j.addons.map(function(a){ return '<div class="row"><span><b>'+esc(a.title)+'</b> '+money(a.price,1)+'<br><span class="sub">'+(a.state==='pending'?'Waiting on the client':a.state==='approved'?'Approved '+clock(a.decidedAt)+(a.invoiced?' · on the invoice':' · not on an invoice yet'):'Declined')+'</span></span><span>'+(a.state==='approved'&&!a.invoiced?'<button type="button" class="btn o sm" data-addinv="'+esc(a.id)+'" data-bk="'+esc(j.key)+'">Add to invoice</button> <button type="button" class="btn q sm" data-addman="'+esc(a.id)+'" data-bk="'+esc(j.key)+'">Done by hand</button>':'')+(a.state==='pending'?'<button type="button" class="btn q sm" data-adddel="'+esc(a.id)+'" data-bk="'+esc(j.key)+'">Withdraw</button>':'')+'</span></div>'; }).join('');
          s+='<form data-f="addon" data-bk="'+esc(j.key)+'"><div class="grid2"><label class="f">What it is<input name="title" maxlength="120" placeholder="Inside oven: heavy build-up"></label><label class="f">Price inc GST<input name="price" inputmode="decimal" placeholder="80"></label></div><label class="f">Note for the client <span class="sub">Optional</span><input name="note" maxlength="400" placeholder="About 45 extra minutes. Worth it before photos."></label><button class="btn sm" style="margin-top:10px">Send for their OK</button></form>';
          s+='<h3 style="margin-top:18px">Home notes</h3><p class="sub">Kept for this address. The client can edit these too.</p><form data-f="prefs" data-bk="'+esc(j.key)+'"><textarea name="prefs" maxlength="1200">'+esc(j.prefs)+'</textarea><button class="btn o sm" style="margin-top:8px">Save notes</button></form>';
          if(j.prep.ticked.length) s+='<details><summary>Prep they\'ve ticked ('+j.prep.n+')</summary><ul>'+j.prep.ticked.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul></details>';
          if(j.entry.length) s+='<details open><summary>Entry condition report</summary>'+j.entry.map(function(e){ return '<div class="row"><a href="/api/plus?entry='+esc(e.id)+'&bk='+esc(j.key)+'" data-file>'+esc(e.name)+'</a><span class="sub">'+esc(day(e.at))+'</span></div>'; }).join('')+'</details>';
          s+='<div class="sw"><span>Show the finish estimate on their link</span><input type="checkbox" data-eta="'+esc(j.key)+'"'+(j.etaHidden||!d.settings.showEta?'':' checked')+(d.settings.showEta?'':' disabled')+'></div>';
          s+='<div class="acts"><button type="button" class="btn o sm" data-link="view" data-bk="'+esc(j.key)+'">'+(j.viewLink?'Copy view-only link':'Make a view-only link')+'</button><button type="button" class="btn o sm" data-link="ref" data-bk="'+esc(j.key)+'">'+(j.ref?'Copy referral link':'Make a referral link')+'</button></div>';
        }
        return s+'</div>';
      }).join('');
    }); },

    cash:function(f){ return load('cash','',f).then(function(d){
      var h='<p class="sub">A forward look built from your quotes, invoices, roster and regular outgoings. Xero stays the official record.</p>';
      h+='<h2>Coming <em>in</em></h2><div class="grid2"><div class="stat hl"><span>Owing on invoices</span><b>'+money(d.in.owing)+'</b>'+(d.in.overdue?'<small>'+money(d.in.overdue)+' overdue</small>':'<small>Nothing overdue</small>')+'</div><div class="stat"><span>Deposits unpaid</span><b>'+money(d.in.deposits)+'</b><small>'+d.in.depositsN+' booking'+(d.in.depositsN===1?'':'s')+' tentative</small></div><div class="stat"><span>Booked, not invoiced yet</span><b>'+money(d.in.toInvoice)+'</b><small>Accepted quotes still to come</small></div></div>';
      if(d.in.owingList.length) h+='<details><summary>Who owes what ('+d.in.owingList.length+')</summary>'+d.in.owingList.map(function(x){ return '<div class="row"><a href="/money/#/doc/'+esc(x.id)+'">'+esc(x.name)+' · #'+esc(x.num)+'</a><span><b>'+money(x.due,1)+'</b> '+(x.state==='overdue'?'<span class="pill red">Overdue</span>':x.dueDate?'<span class="sub">due '+esc(day(x.dueDate))+'</span>':'')+'</span></div>'; }).join('')+'</details>';
      h+='<h2>Going <em>out</em> <span class="sub" style="font:400 13px var(--sans)">next 14 days</span></h2><div class="grid2"><div class="stat"><span>Team wages + super</span><b>'+money(d.out.wages)+'</b><small>From the roster</small></div><div class="stat"><span>Regular outgoings</span><b>'+money(d.out.bills)+'</b><small>'+d.out.billList.length+' due</small></div></div>';
      if(d.out.billList.length) h+='<details><summary>Bills due</summary>'+d.out.billList.map(function(x){ return '<div class="row"><span>'+esc(x.name)+'</span><span>'+money(x.amt,1)+' <span class="sub">'+esc(day(x.date))+'</span></span></div>'; }).join('')+'</details>';
      h+='<h2>Set <em>aside</em></h2><div class="grid2">';
      if(d.gst) h+='<div class="stat hl"><span>GST this quarter so far</span><b>'+money(d.gst.net)+'</b><small>'+money(d.gst.collected)+' collected less '+money(d.gst.credits)+' credits, since '+esc(day(d.gst.from))+'</small></div>';
      h+='<div class="stat hl"><span>Income tax this financial year</span><b>'+money(d.tax.setAside)+'</b><small>'+d.tax.pct+'% of '+money(d.tax.profit)+' profit so far. Change the % in Settings, and check it with your accountant.</small></div></div>';
      return h;
    }); },

    diary:function(f){ return load('capacity','',f).then(function(d){
      var h='<p class="sub">Next four weeks. Green days are free to book. Striped bars are bookings with the deposit still unpaid. Up to '+d.perDay+' booking'+(d.perDay===1?'':'s')+' a day.</p>';
      var first=d.days[0], pad=(first.dow+6)%7;
      h+='<div class="cal">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(x){return '<span class="h">'+x+'</span>';}).join('');
      for(var i=0;i<pad;i++) h+='<span></span>';
