<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Bond clean evidence pack · Bardon Clean</title>
<link rel="icon" type="image/png" href="/icons/brand-favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--t:#C06B3C;--td:#A55830;--dark:#1A1A1A;--cream:#F5F0EB;--cd:#EDE6DE;--body:#4A4A4A;--meta:#6B635B;--line:#DDD3C8;--ok:#2F5A35;--okb:#E6EFE3}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--body);font:400 14px/1.5 Inter,-apple-system,Segoe UI,Arial,sans-serif}
.page{max-width:820px;margin:0 auto;padding:24px 18px 60px}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;color:var(--dark);margin:0}
h1{font-size:30px}h1 em,h2 em{font-style:italic;font-weight:500}
h2{font-size:20px;margin:28px 0 10px;padding-bottom:6px;border-bottom:2px solid var(--dark)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.btn{font:600 15px/1 Inter,sans-serif;border:0;border-radius:6px;min-height:46px;padding:0 18px;background:var(--td);color:#fff;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.o{background:#fff;color:var(--td);border:2px solid var(--td)}
.box{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 16px}
.kv span{display:block;font:600 10.5px/1.3 Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--meta)}
.kv b{color:var(--dark);font-weight:600}
.area{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-top:12px;break-inside:avoid}
.ah{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ah h3{font-size:18px}.ok{color:var(--ok);font-weight:600;font-size:13px}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.ph figure{margin:0}.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px;display:block}
.ph figcaption{font-size:11px;color:var(--meta);margin-top:2px}
ul.ck{columns:2;column-gap:20px;margin:10px 0 0;padding-left:18px;font-size:13px}ul.ck li{break-inside:avoid;margin-bottom:2px}
.note{border-left:3px solid var(--t);padding:8px 12px;background:#fff;margin-top:8px}.note b{display:block;color:var(--dark)}
.foot{margin-top:28px;font-size:12px;color:var(--meta)}
.center{text-align:center;padding:60px 10px}
@media print{body{background:#fff;font-size:11.5px}.bar{display:none}.page{padding:0}.area,.box{border-color:#ccc}h2{margin-top:18px}.ph img{aspect-ratio:4/3}@page{margin:14mm}}
</style></head><body>
<div class="page" id="app"><div class="center">Loading your evidence pack…</div></div>
<script src="/lib/checklists.js"></script>
<script>
(function(){
  var t=location.pathname.split('/')[2]||'', app=document.getElementById('app');
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  var DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
  function day(s){ var p=String(s).slice(0,10).split('-'), d=new Date(+p[0],+p[1]-1,+p[2]); return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear(); }
  function clock(s){ if(!s) return ''; var d=new Date(s), h=d.getHours(), m=d.getMinutes(); return (h%12||12)+':'+(m<10?'0':'')+m+(h>=12?'pm':'am'); }
  function src(j,p){ return '/api/photo?j='+encodeURIComponent(p.j||j.id)+'&p='+encodeURIComponent(p.id); }
  fetch('/api/agent?v='+encodeURIComponent(t),{cache:'no-store'}).then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error(d.error||'This link isn\'t working.'); return d; }); }).then(function(d){
    var j=d.jobs[0], L=j.live, P=j.plus||{}, CL=window.CHECKLISTS, bz=d.biz||{};
    document.title='Evidence pack · '+(j.address||j.suburb||'Bond clean');
    var h='<div class="bar"><button class="btn" onclick="window.print()">Save as PDF or print</button><a class="btn o" href="/v/'+esc(t)+'">Back to your clean</a></div>';
    h+='<p style="margin:0;font:600 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--meta)">Bardon Clean · Bond clean report</p><h1>'+esc(j.address||j.suburb)+'</h1><p style="margin:4px 0 0;color:var(--meta)">'+esc([j.suburb,j.service].filter(Boolean).join(' · '))+'</p>';
    var days=j.days||[{date:j.date,actual:j.actual}];
    h+='<h2>The <em>clean</em></h2><div class="box"><div class="kv">'+
      '<div><span>Date'+(days.length>1?'s':'')+'</span><b>'+days.map(function(x){return esc(day(x.date));}).join('<br>')+'</b></div>'+
      '<div><span>Finished</span><b>'+(L.done?esc(clock(L.done)+', '+day(L.done)):'—')+'</b></div>'+
      '<div><span>Areas cleaned</span><b>'+j.rooms.filter(function(r){return L.rooms[r]&&L.rooms[r].s==='d';}).length+' of '+j.rooms.length+'</b></div>'+
      '<div><span>Photos</span><b>'+L.photos.length+'</b></div>'+
      '<div><span>Team</span><b>'+esc(j.team.map(function(x){return x.name;}).join(', ')||'Bardon Clean')+'</b></div>'+
      (P.signoff?'<div><span>Signed off by client</span><b>'+esc(clock(P.signoff.at)+', '+day(P.signoff.at))+(P.signoff.name?' ('+P.signoff.name+')':'')+'</b></div>':'')+
      '</div></div>';
    if((P.entry||[]).length) h+='<h2>Entry condition <em>report</em></h2><div class="box"><p style="margin:0 0 6px">Supplied by the tenant, for comparison with the areas below:</p><ul style="margin:0;padding-left:18px">'+P.entry.map(function(f){ return '<li><a href="/api/plus?entry='+esc(f.id)+'&v='+esc(t)+'">'+esc(f.name)+'</a></li>'; }).join('')+'</ul></div>';
    h+='<h2>Area by <em>area</em></h2>';
    j.rooms.forEach(function(r){
      var x=L.rooms[r], ps=L.photos.filter(function(p){return p.room===r;}), aft=ps.filter(function(p){return p.kind==='after';}), bef=ps.filter(function(p){return p.kind==='before';});
      var tk=(L.ticked||{})[r]||[], items=CL?CL.itemsFor(r,j.service):[], on={}; tk.forEach(function(id){on[id]=1;});
      var done=items.filter(function(i){return on[i.id];});
      h+='<div class="area"><div class="ah"><h3>'+esc(r)+'</h3><span class="ok">'+(x&&x.s==='d'?'Cleaned · '+esc(clock(x.at)):'Not marked done')+'</span></div>';
      if(aft.length||bef.length) h+='<div class="ph">'+aft.slice(0,6).map(function(p){ return '<figure><img loading="lazy" src="'+src(j,p)+'" alt="'+esc(r)+' after"><figcaption>After'+(p.at?' · '+esc(clock(p.at)):'')+'</figcaption></figure>'; }).join('')+bef.slice(0,aft.length?3:6).map(function(p){ return '<figure><img loading="lazy" src="'+src(j,p)+'" alt="'+esc(r)+' before"><figcaption>Before'+(p.at?' · '+esc(clock(p.at)):'')+'</figcaption></figure>'; }).join('')+'</div>';
      if(done.length) h+='<ul class="ck">'+done.map(function(i){return '<li>'+esc(i.t)+'</li>';}).join('')+'</ul>';
      h+='</div>';
    });
    if(L.flags.length) h+='<h2>Noted by the <em>team</em></h2>'+L.flags.map(function(f){ return '<div class="note"><b>'+esc(f.t)+'</b>'+esc(f.d)+'</div>'; }).join('');
    var lk=Object.keys(d.lock||{});
    h+='<h2>Lock-up &amp; <em>handover</em></h2><div class="box"><ul style="margin:0;padding-left:18px">'+lk.map(function(k){ return '<li>'+esc(d.lock[k])+(L.lock[k]?' · '+esc(clock(L.lock[k])):' · not ticked')+'</li>'; }).join('')+'</ul></div>';
    h+='<p class="foot">'+esc(bz.legal||'Jack East T/A Bardon Clean')+' · ABN '+esc(bz.abn||'46 426 437 394')+' · 0406 216 212 · hello@bardonclean.au<br>Prepared from the record the team kept during the clean. Photo times show when each photo was added during the clean.</p>';
    app.innerHTML=h;
  }).catch(function(e){ app.innerHTML='<div class="center"><h1>Link not <em>working</em></h1><p>'+esc(e.message)+'</p><p>Call Jack on 0406 216 212.</p></div>'; });
})();
</script>
</body></html>
