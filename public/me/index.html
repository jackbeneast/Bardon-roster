<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#F5F0EB">
<title>Bardon Team</title>
<link rel="icon" type="image/png" href="/icons/favicon.png?v=2"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Bardon Team">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--tc:#C06B3C;--tcd:#A55830;--dark:#1A1A1A;--cream:#F5F0EB;--cd:#EDE6DE;--body:#4A4A4A;--white:#fff;--gold:#F4B942;--line:#E4DBD1;
  --serif:"Playfair Display",Georgia,serif;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--cream)}
body{margin:0;color:var(--dark);font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:22px 18px calc(100px + env(safe-area-inset-bottom,0px))}
a{color:var(--tcd)}
h1{font:700 32px/1.12 var(--serif);margin:6px 0 0;color:var(--dark)}
h1 em,h2 em,h3 em,.pf em{font-style:italic;font-weight:500}
h2{font:700 24px/1.2 var(--serif);margin:0}
h3{font:700 20px/1.25 var(--serif);margin:0}
p{margin:0}
.pf{font-family:var(--serif);font-weight:700}
.lbl{font:500 12px/1.4 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--body)}
.lbl.b{color:var(--dark);font-weight:600}
.sub{font-size:14px;color:var(--body)}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px}
.card.tight{padding:6px 16px}
.dark{background:var(--dark);color:var(--cream);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.dark .lbl{color:var(--gold);font-weight:600}
.dark .sub{color:var(--cd)}
.tint{background:var(--cd);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.tint .lbl{color:var(--tcd)}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border-radius:12px;font:600 16px var(--sans);text-decoration:none;border:0;cursor:pointer;width:100%;padding:0 16px;text-align:center}
.btn.p{background:var(--tcd);color:#fff}
.btn.p:active{background:#8E4B29}
.btn.k{background:var(--dark);color:var(--cream)}
.btn.o{background:var(--white);color:var(--dark);border:1.5px solid var(--dark)}
.btn.ol{background:transparent;color:var(--cream);border:1.5px solid #6A6A6A}
.btn.big{min-height:60px;font-size:17px}
.btn:disabled{background:var(--cd);color:var(--body);cursor:not-allowed;border:0}
.btn.sm{min-height:44px;font-size:14px;width:auto}
.ghost{background:none;border:0;color:var(--tcd);font:500 14px var(--sans);text-decoration:underline;cursor:pointer;padding:10px 0;min-height:44px}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--sans);border-radius:20px;padding:7px 10px;background:var(--cd);color:var(--dark);white-space:nowrap}
.pill.g{background:var(--gold)}
.pill.n{background:#F7DCCB;color:#7A3A17}
.ic{width:20px;height:20px;flex:none}
.tile{display:flex;align-items:center;gap:14px;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-decoration:none;color:var(--dark);min-height:72px}
.tile .num{width:44px;height:44px;border-radius:12px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--tcd);flex:none}
.tile .num.ok{background:var(--dark);color:var(--cream)}
.tile b{display:block;font-weight:600;font-size:16px}
.tile small{display:block;font-size:13px;color:var(--body);margin-top:2px}
.tile .chev{margin-left:auto;color:var(--body)}
.av{width:38px;height:38px;border-radius:50%;background:var(--cd);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex:none}
.av.k{background:var(--dark);color:var(--cream)}
.kv{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--cd)}
.kv:first-child{border-top:0}
.kv .lbl{width:92px;flex:none;padding-top:2px}
.kv p{font-size:15px;white-space:pre-wrap}
.it{display:flex;gap:12px;align-items:center;min-height:50px;font-size:15px;line-height:1.4;border-top:1px solid var(--cd);padding:6px 0;cursor:pointer}
.it input{width:24px;height:24px;accent-color:var(--tcd);margin:0;flex:none}
.it.on span{color:var(--body);text-decoration:line-through}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0 6px}
.prog{flex:1;height:8px;border-radius:4px;background:var(--cd);overflow:hidden}
.prog i{display:block;height:100%;background:var(--tcd)}
.step{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--cd)}
.step:first-of-type{border-top:0}
.step .n{width:26px;height:26px;border-radius:13px;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--tcd);flex:none}
.step p{padding-top:2px}
.ln{display:flex;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--cd);text-decoration:none;color:var(--dark);font-size:15px}
.ln:first-of-type{border-top:0}
.ln small{margin-left:auto;color:var(--body);font-size:13px;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gt{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--dark);font-weight:600;font-size:15px;display:flex;flex-direction:column;gap:3px;min-height:64px}
.gt span{font-size:12px;font-weight:400;color:var(--body)}
.ph{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ph img,.ph .add{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--cream);display:block}
.ph .add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:0;font:500 12px var(--sans);color:var(--dark);cursor:pointer}
.std{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;background:var(--cd);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--body);padding:10px}
img.std{padding:0}
label.f{display:block;font:500 14px/1.3 var(--sans);color:var(--dark)}
label.f small{font-weight:400;color:var(--body)}
input.t,select.t,textarea.t{width:100%;margin-top:6px;font:400 16px/1.45 var(--sans);color:var(--dark);background:var(--white);border:1px solid #CFC5BA;border-radius:10px;padding:12px;min-height:48px}
textarea.t{resize:vertical;min-height:96px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--tcd);outline-offset:2px}
.search{display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:0 14px;min-height:52px}
.search input{flex:1;border:0;outline:0;font:400 16px var(--sans);background:transparent;color:var(--dark);min-height:50px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--white);border-top:1px solid var(--line);padding:0 8px env(safe-area-inset-bottom,0px)}
.nav .in{max-width:560px;margin:0 auto;display:flex}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;min-height:56px;text-decoration:none;color:var(--body);font:500 11px var(--sans)}
.nav a[aria-current]{color:var(--tcd);font-weight:600}
.back{display:inline-flex;align-items:center;gap:4px;margin-left:-10px;min-height:44px;padding:0 10px;color:var(--dark);text-decoration:none;font:500 14px var(--sans)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--dark);color:var(--cream);padding:11px 16px;border-radius:999px;font:500 14px var(--sans);z-index:40;max-width:90vw;text-align:center}
.center{text-align:center;padding:60px 10px}
.err{color:var(--tcd);font:500 14px/1.4 var(--sans)}
.editbar{background:var(--dark);color:var(--cream);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:13px}
.editbar .ghost{color:var(--gold);padding:6px 0;min-height:36px}
.ed{font:600 13px var(--sans);color:var(--tcd);background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.hide{display:none!important}
</style></head><body>
<div id="app"><div class="center">Loading…</div></div>
<nav class="nav hide" id="nav" aria-label="Main"><div class="in"></div></nav>
<script src="/lib/checklists.js"></script>
<script type="module">
import { shiftCosts } from '/lib/wages.mjs';
var app=document.getElementById('app'), navEl=document.getElementById('nav');
var R=null, C=null, SECS=[], ADMIN=false, err='', PID='', CANT='', FLAG=null, busy={}, LOCAL={};
var LOCK=[['lights','Lights and fans off'],['ac','Air-con off'],['doors','Windows and doors locked'],['keys','Keys returned or lockbox set']];

// ---------- small helpers ----------
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k)||''; if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return ''; } }
function key(){ return ls('roster_admin_key'); }
function pad(n){ return (n<10?'0':'')+n; }
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parse(s){ var p=String(s||'').split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function addDays(s,n){ var d=parse(s); d.setDate(d.getDate()+n); return iso(d); }
function today(){ return iso(new Date()); }
var DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], FMON=['January','February','March','April','May','June','July','August','September','October','November','December'];
function fday(s,long){ var d=parse(s); return (long?DOW[d.getDay()]:DOW[d.getDay()].slice(0,3))+' '+d.getDate()+' '+(long?FMON:MON)[d.getMonth()]; }
function ftime(t){ if(!t) return ''; var h=+t.slice(0,2), m=t.slice(3,5); return (h%12||12)+(m==='00'?'':':'+m)+(h>=12?'pm':'am'); }
function fclock(isoStr){ var d=new Date(isoStr), h=d.getHours(); return (h%12||12)+':'+pad(d.getMinutes())+(h>=12?'pm':'am'); }
function hm(ms){ var m=Math.max(0,Math.round(ms/60000)); return Math.floor(m/60)+'h'+(m%60?' '+pad(m%60)+'m':''); }
function money(v){ return '$'+(Math.round(v*100)/100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,','); }
function first(n){ return String(n||'').trim().split(/\s+/)[0]; }
function initial(n){ return (String(n||'?').trim()[0]||'?').toUpperCase(); }
function toast(m){ var t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=m; document.body.appendChild(t); setTimeout(function(){t.remove();},2800); }
function tel(p){ return 'tel:'+String(p||'').replace(/[^0-9+]/g,''); }
function maps(j){ return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([j.address,j.suburb,'QLD'].filter(Boolean).join(', ')); }
function api(method,url,body){
  var h={'content-type':'application/json'}; if(key()) h['x-admin-key']=key();
  return fetch(url,{method:method,headers:h,body:body?JSON.stringify(body):undefined,cache:'no-store'}).then(function(r){
    return r.json().catch(function(){return {};}).then(function(d){ if(!r.ok){ var e=new Error(d.error||'That didn\'t save. Check your signal and try again.'); e.status=r.status; throw e; } return d; }); });
}
var I={
  home:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  job:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/></svg>',
  kit:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg>',
  me:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  tick:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>',
  cross:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  clock:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  cam:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--tcd)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  flag:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4h11l-1.5 4L16 12H5"/></svg>',
  phone:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  search:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="var(--body)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  left:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  pin:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>'
};

// ---------- data ----------
function load(){
  return Promise.all([api('GET','/api/roster'), api('GET','/api/teamapp')]).then(function(r){
    R=r[0]; C=r[1].content; SECS=r[1].sections; ADMIN=!!r[1].admin; err='';
    if(PID && !member(PID)) PID='';
    if(PID && !ADMIN && !ls('me_intro_'+PID) && !location.hash.replace(/^#\/?/,'')) { location.replace('#/intro'); }
    render();
  }).catch(function(e){ err=e.message; render(); });
}
function member(id){ return (R.team||[]).filter(function(t){return t.id===id;})[0]||null; }
function real(j){ return !j.sample && !j.example; }
function jobById(id){ return (R.jobs||[]).filter(function(j){return j.id===id;})[0]||null; }
function shiftOf(j,id){ var s=j.shifts&&j.shifts[id]; return {start:(s&&s.start)||j.start, end:(s&&s.end)||j.end}; }
function sig(j,id){ var s=shiftOf(j,id); return j.date+'|'+s.start+'|'+s.end; }
function cstate(j,id){ var c=R.confirms&&R.confirms[j.id]&&R.confirms[j.id][id]; if(!c||c.k!==sig(j,id)) return 'wait'; return c.s==='yes'?'yes':'no'; }
function mine(){ return (R.jobs||[]).filter(function(j){ return real(j)&&(j.staff||[]).indexOf(PID)>=0; }).sort(function(a,b){ return (a.date+shiftOf(a,PID).start).localeCompare(b.date+shiftOf(b,PID).start); }); }
function liveOf(j){ var L=(R.live&&R.live[j.id])||{}; return {arrived:L.arrived||{},left:L.left||{},rooms:L.rooms||{},items:L.items||{},assign:L.assign||{},photos:L.photos||[],flags:L.flags||[],supplies:L.supplies||[],lock:L.lock||{},done:L.done||''}; }
function takeLive(d,jid){ if(d.days) Object.keys(d.days).forEach(function(k){ R.live[k]=d.days[k]; }); else if(d.live) R.live[jid]=d.live; }
var DEF_ROOMS=['Kitchen','Bathrooms','Bedrooms','Living & dining','Laundry','Windows & tracks'];
function roomsOf(j){ return (j.rooms&&j.rooms.length)?j.rooms:DEF_ROOMS; }
function myRooms(j){ var L=liveOf(j), all=roomsOf(j), any=all.some(function(r){ return (L.assign[r]||[]).length; });
  if(!any) return all; return all.filter(function(r){ return (L.assign[r]||[]).indexOf(PID)>=0; }); }
function whoOn(j,r){ return (liveOf(j).assign[r]||[]).map(function(id){ var m=member(id); return m?first(m.name):''; }).filter(Boolean); }
function days(j){ if(!j.group) return [j]; return R.jobs.filter(function(x){ return x.group===j.group&&real(x); }).sort(function(a,b){ return (a.date+(a.start||'')).localeCompare(b.date+(b.start||'')); }); }
function roomStat(j,r){ var L=liveOf(j), items=CHECKLISTS.itemsFor(r,j.service), got=L.items[r]||{}, n=items.filter(function(i){return got[i.id];}).length, ph=L.photos.filter(function(p){return p.room===r&&p.kind==='after';});
  return {items:items, n:n, total:items.length, photos:ph, done:!!(L.rooms[r]&&L.rooms[r].s==='d')}; }
function guideFor(room){ var r=String(room||'').toLowerCase(), gs=C.guides.filter(function(g){return g.sec==='rooms'&&g.room;});
  for(var i=0;i<gs.length;i++){ try{ if(new RegExp(gs[i].room,'i').test(r)) return gs[i]; }catch(e){} } return null; }
function guide(id){ return C.guides.filter(function(g){return g.id===id;})[0]||null; }
function photoSrc(j,p,full){ return '/api/photo?j='+encodeURIComponent(p.j||j.id)+'&p='+p.id+(full?'':'&s=t'); }
function img(id){ return '/api/teamapp?img='+id; }
function access(j){ return (R.access||{})[j.group||j.id]||null; }
function todayJobs(){ var t=today(); return mine().filter(function(j){ return j.date===t; }); }
function nextJobs(n){ var t=today(); return mine().filter(function(j){ return j.date>=t; }).slice(0,n||50); }
function upcomingWait(){ var t=today(), e=addDays(t,14); return mine().filter(function(j){ return j.date>=t&&j.date<=e&&cstate(j,PID)==='wait'; }); }
function currentJob(){ var tj=todayJobs(); for(var i=0;i<tj.length;i++){ var L=liveOf(tj[i]); if(L.arrived[PID]&&!L.left[PID]) return tj[i]; } return tj[0]||null; }

// ---------- routing ----------
function route(){ return location.hash.replace(/^#\/?/,'').split('/').map(decodeURIComponent); }
function go(h){ if(location.hash==='#/'+h) render(); else location.hash='#/'+h; }
window.addEventListener('hashchange',function(){ FLAG=null; render(); window.scrollTo(0,0); });

function nav(active){
  var cj=currentJob(), jh=cj?'#/job/'+cj.id:'#/job';
  navEl.classList.remove('hide');
  navEl.querySelector('.in').innerHTML=[['','Today',I.home,'today'],[jh,'Job',I.job,'job'],['#/kit','Toolkit',I.kit,'kit'],['#/me','Me',I.me,'me']].map(function(x){
    return '<a href="'+(x[0]||'#/')+'"'+(active===x[3]?' aria-current="page"':'')+'>'+x[2]+x[1]+'</a>'; }).join('');
}
function back(href,label){ return '<a class="back" href="'+href+'">'+I.left+(label||'Back')+'</a>'; }
function editbar(){
  if(!ADMIN) return '';
  var m=member(PID);
  return '<div class="editbar"><span style="flex:1">You\'re logged in as Jack'+(m?' · seeing '+esc(first(m.name))+'\'s view':'')+'</span><a class="ghost" href="#/who">'+(m?'Switch':'Pick someone')+'</a></div>';
}

function render(){
  if(err){ navEl.classList.add('hide'); app.innerHTML='<div class="center"><p>'+esc(err)+'</p><p style="margin-top:16px"><button class="btn k" data-act="reload">Try again</button></p></div>'; return; }
  if(!R){ app.innerHTML='<div class="center">Loading…</div>'; return; }
  var r=route(), v=r[0]||'';
  if(v==='edit') return ADMIN?renderEdit(r[1]):go('kit');
  if(v==='basics') return ADMIN?renderBasics():go('kit');
  if(v==='guide') return renderGuide(r[1]);
  if(v==='kit') return renderKit();
  if(v==='who'||!PID) return renderWho();
  if(v==='intro') return renderIntro();
  if(v==='job') return renderJob(r[1]);
  if(v==='room') return renderRoom(r[1], r[2]);
  if(v==='wrap') return renderWrap(r[1]);
  if(v==='me') return renderMe();
  if(v==='pay') return renderPay();
  if(v==='slip') return renderSlip(r[1]);
  return renderToday();
}

// ---------- room checklist ----------
function renderRoom(id, room){
  nav('job');
  var j=jobById(id); if(!j||roomsOf(j).indexOf(room)<0){ go(''); return; }
  var st=roomStat(j,room), L=liveOf(j), got=L.items[room]||{}, g=guideFor(room), rs=myRooms(j), nx=rs[rs.indexOf(room)+1], others=whoOn(j,room).filter(function(n){ return n!==first(member(PID).name); });
  var pct=st.total?Math.round(st.n/st.total*100):0;
  var h=back('#/job/'+j.id,'Job')+'<p class="lbl">'+esc(CHECKLISTS.name(j.service))+(others.length?' · with '+esc(others.join(', ')):'')+'</p><div class="between"><h1>'+esc(room)+'</h1>'+(g?'<a class="ed" href="#/guide/'+g.id+'">How to</a>':'')+'</div>';
  h+='<div class="row" style="margin-top:12px"><div class="prog"><i style="width:'+pct+'%"></i></div><p style="font-weight:600;font-size:14px">'+st.n+' / '+st.total+'</p></div><div class="stack">';
  if(st.done) h+='<div class="tint"><p><strong>'+I.tick+' '+esc(room)+' is done.</strong> You can still fix ticks or add photos.</p></div>';
  CHECKLISTS.sectionsFor(room,j.service).forEach(function(sec,si){ var sd=sec.items.filter(function(i){return got[i.id];}).length;
    h+='<div class="card tight"><div class="sec"><p class="lbl b">'+(si+1)+' · '+esc(sec.title)+'</p><p class="sub">'+sd+' / '+sec.items.length+'</p></div>';
    sec.items.forEach(function(i){ var on=!!got[i.id]; h+='<label class="it'+(on?' on':'')+'"><input type="checkbox" data-item="'+i.id+'"'+(on?' checked':'')+'><span>'+esc(i.t)+'</span></label>'; });
    h+='</div>'; });
  h+='<div class="card" style="display:flex;flex-direction:column;gap:12px;'+(st.photos.length?'':'border:1.5px dashed var(--tcd)')+'"><div class="between"><p class="lbl b">After photos</p><p class="sub">'+(st.photos.length?st.photos.length+' taken':'At least 1 needed')+'</p></div><div class="ph">';
  st.photos.slice(-5).forEach(function(p){ h+='<a href="'+photoSrc(j,p,true)+'" target="_blank" rel="noopener"><img src="'+photoSrc(j,p)+'" alt="'+esc(room)+' after photo" loading="lazy"></a>'; });
  h+='<button class="add" data-photo'+(busy.photo?' disabled':'')+'>'+I.cam+(busy.photo?esc(busy.photo):'Take photo')+'</button></div><p class="sub">Doorway shot of the whole room first, then the detail. Nothing personal in shot. They go on the job report.</p></div>';

    else h+='<button class="btn p big" data-roomdone'+(busy.room?' disabled':'')+'>'+(st.n<st.total?'Finish '+esc(room)+' · '+(st.total-st.n)+' steps not ticked':'Finish '+esc(room))+'</button>';
  }
  if(st.done) h+=nx?'<a class="btn p big" href="#/room/'+j.id+'/'+encodeURIComponent(nx)+'">Next: '+esc(nx)+'</a>':'<a class="btn p big" href="#/wrap/'+j.id+'">All your rooms done · wrap up</a>';

var PAY=null, PAYFOR='';
function needPay(){
  if(PAYFOR===PID&&PAY) return; PAYFOR=PID; PAY={loading:true};
  var p;
  if(ADMIN) p=api('GET','/api/staff').then(function(d){ var pr=(d.profiles||{})[PID]||{}; return {slips:(d.slips||[]).filter(function(x){return x.pid===PID;}), employer:d.employer, token:pr.token||''}; });
  else { var t=ls('me_pay_'+PID); if(!t){ PAY={none:true}; return; }
    p=api('GET','/api/staff?t='+encodeURIComponent(t)).then(function(d){ if(d.pid&&d.pid!==PID) throw new Error('mismatch'); return {slips:d.slips||[], employer:d.employer, token:t}; }); }
  p.then(function(d){ d.slips.sort(function(a,b){ return b.periodEnd.localeCompare(a.periodEnd); }); PAY=d; },
    function(e){ if(!ADMIN&&(e.status===404||e.message==='mismatch')){ ls('me_pay_'+PID,null); PAY={none:true,replaced:e.status===404}; } else PAY={err:e.message}; })
   .then(function(){ var v=route()[0]; if(v==='me'||v==='pay'||v==='slip') render(); });

function paySlips(){ return (PAY&&PAY.slips)||[]; }
function estimate(from,to){ var c=[]; try{ c=shiftCosts(R.jobs.filter(real), R.team, R.pay, from, to).filter(function(x){ return x.pid===PID; }); }catch(e){}
  return {hrs:c.reduce(function(a,x){return a+x.hrs;},0), pay:c.reduce(function(a,x){return a+x.pay;},0), n:c.length}; }
function fyStart(d){ var y=+d.slice(0,4), m=+d.slice(5,7); return (m>=7?y:y-1)+'-07-01'; }
function hr(v){ return (Math.round(v*100)/100)+''; }
function per(x){ var a=parse(x.periodStart), b=parse(x.periodEnd); return a.getDate()+(a.getMonth()!==b.getMonth()?' '+MON[a.getMonth()]:'')+' – '+b.getDate()+' '+MON[b.getMonth()]; }
var KIND={wk:'Weekday',el:'Weekday early/late',sat:'Saturday',sun:'Sunday',ph:'Public holiday'};

// ---------- photos ----------
function shrink(file,max,thumb){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file), im=new Image();
    im.onload=function(){ URL.revokeObjectURL(url);
      function cv(src,w,h,m){ var sc=Math.min(1,m/Math.max(w,h)), c=document.createElement('canvas'); c.width=Math.round(w*sc); c.height=Math.round(h*sc); c.getContext('2d').drawImage(src,0,0,c.width,c.height); return c; }
      function jp(c,q){ return new Promise(function(ok,no){ c.toBlob(function(b){ b?ok(b):no(new Error('Couldn\'t read that photo')); },'image/jpeg',q); }); }
      var c=cv(im,im.naturalWidth,im.naturalHeight,max);
      Promise.all([jp(c,0.82), thumb?jp(cv(c,c.width,c.height,420),0.72):null]).then(function(r){ res({full:r[0],thumb:r[1]}); },rej); };
    im.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('Couldn\'t read that photo')); };
    im.src=url;
  });
}
function pick(multi,cb){ var inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; if(multi) inp.multiple=true; inp.hidden=true; document.body.appendChild(inp);
  inp.addEventListener('change',function(){ var fl=Array.prototype.slice.call(inp.files||[]); inp.remove(); if(fl.length) cb(fl); }); inp.click(); }
function roomPhotos(j,room,files){

  var q='/api/photo?job='+encodeURIComponent(j.id)+'&person='+encodeURIComponent(PID), ids=[], i=0;
  function one(){ if(i>=files.length) return Promise.resolve();
    var f=files[i++]; busy.photo='Uploading '+i+' of '+files.length+'…'; render();
    return shrink(f,1600,true).then(function(r){ return fetch(q+'&stage=bin&tl='+r.thumb.size,{method:'POST',headers:hd,body:new Blob([r.thumb,r.full],{type:'application/octet-stream'})}); })
      .then(function(res){ return res.json().then(function(d){ if(!res.ok||!d.id) throw new Error(d.error||'Upload failed'); ids.push(d.id); }); }).then(one); }
  one().then(function(){ return api('POST',q+'&stage=add',{ids:ids,room:room,kind:'after'}); })
    .then(function(d){ takeLive(d,j.id); busy.photo=''; toast(ids.length+' photo'+(ids.length===1?'':'s')+' added'); render(); })
    .catch(function(e){ busy.photo=''; render(); toast(e.message||'Photo didn\'t upload. Try again.'); });
