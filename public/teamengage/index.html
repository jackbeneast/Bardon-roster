<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#F5F0EB">
<title>Team app engagement</title>
<link rel="icon" type="image/png" href="/icons/favicon.png?v=2"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--tc:#C06B3C;--tcd:#A55830;--dark:#1A1A1A;--cream:#F5F0EB;--cd:#EDE6DE;--body:#4A4A4A;--white:#fff;--gold:#F4B942;--line:#E4DBD1;--green:#2F5A35;
  --serif:"Playfair Display",Georgia,serif;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--dark);font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
#app{max-width:720px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 60px}
a{color:var(--tcd)}
p{margin:0}
h1{font:700 30px/1.15 var(--serif);margin:6px 0 0}
h1 em,h2 em{font-style:italic;font-weight:500}
h2{font:700 20px/1.2 var(--serif);margin:0}
.lbl{font:500 12px/1.4 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--body)}
.lbl.b{color:var(--dark);font-weight:600}
.sub{font-size:14px;color:var(--body)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.top a,.top button{font:500 14px var(--sans);color:var(--body);text-decoration:none;background:none;border:0;cursor:pointer;min-height:44px;padding:0}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px}
.dark{background:var(--dark);color:var(--cream);border-radius:16px;padding:16px}
.dark .sub{color:var(--cd)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.big{font:700 26px/1.1 var(--serif)}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;background:var(--cd);display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.av.on{background:var(--tcd);color:#fff}
.av.off{background:var(--white);border:1.5px dashed #BFB4A8;color:var(--body)}
.person{display:flex;flex-direction:column;gap:12px;text-decoration:none;color:var(--dark)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 12px/1 var(--sans);border-radius:20px;padding:7px 10px;background:var(--cd);color:var(--dark);white-space:nowrap}
.chip.ok{background:#E3EEDF;color:var(--green)}
.chip.warn{background:#FBEBC9;color:#7A520A}
.chip.no{background:var(--white);border:1px dashed #BFB4A8;color:var(--body)}
.prog{height:8px;border-radius:4px;background:var(--cd);overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:var(--tcd);border-radius:4px}
.ln{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--cd)}
.ln:first-child{border-top:0}
.sess{padding:12px 0;border-top:1px solid var(--cd);display:flex;flex-direction:column;gap:8px}
.sess:first-of-type{border-top:0}
.act{display:flex;gap:10px;font-size:14px;color:var(--body)}
.act time{flex:none;width:58px;color:var(--body);font-variant-numeric:tabular-nums}
.act span{color:var(--dark)}
.center{text-align:center;padding:60px 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;padding:0 16px;font:600 15px var(--sans);text-decoration:none;border:0;cursor:pointer}
.btn.k{background:var(--dark);color:var(--cream)}
.btn.o{background:var(--white);color:var(--dark);border:1.5px solid var(--dark)}
button:focus-visible,a:focus-visible{outline:2px solid var(--tcd);outline-offset:2px}
</style></head><body>
<div id="app"><div class="center">Loading…</div></div>
<script>
(function(){
var app=document.getElementById('app'), D=null, P={};
var SCR={today:'Today',job:'Job brief',room:'Room checklists',wrap:'Wrap up',guide:'Toolkit guides',kit:'Toolkit',me:'Me',pay:'My pay',slip:'Payslips',intro:'Welcome tour',who:'Picking their name'};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function key(){ try{ return localStorage.getItem('roster_admin_key')||sessionStorage.getItem('roster_admin_key')||''; }catch(e){ return ''; } }
function api(u){ return fetch(u,{headers:{'x-admin-key':key()},cache:'no-store'}).then(function(r){ return r.json().then(function(d){ if(!r.ok){ var e=new Error(d.error||'Something went wrong'); e.status=r.status; throw e; } return d; }); }); }
function dur(ms){ var m=Math.round((ms||0)/60000); if(m<1){ var sec=Math.round((ms||0)/1000); return sec<1?'0 sec':sec+' sec'; } if(m<60) return m+' min'; return Math.floor(m/60)+' h'+(m%60?' '+m%60+' min':''); }
function pad(n){ return (n<10?'0':'')+n; }
function clock(iso){ var d=new Date(iso), h=d.getHours(); return (h%12||12)+':'+pad(d.getMinutes())+(h>=12?'pm':'am'); }
function day(iso){ var d=new Date(iso); return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; }
function ago(iso){ if(!iso) return ''; var s=(Date.now()-Date.parse(iso))/1000; if(s<90) return 'just now'; if(s<3600) return Math.round(s/60)+' min ago'; if(s<86400) return Math.round(s/3600)+' h ago';
  var d=Math.round(s/86400); return d===1?'yesterday':d<14?d+' days ago':day(iso); }
function first(n){ return String(n||'').trim().split(/\s+/)[0]; }
function tourChip(t,v){
  if(!t) return '<span class="chip no">Tour not started</span>';
  if(t.v&&+t.v!==+v) return '<span class="chip no">New tour not seen yet</span>';
  if(t.done) return '<span class="chip ok">✓ Finished the tour</span>';
  if(t.skipped) return '<span class="chip warn">Skipped the tour at step '+t.skipAt+' of '+t.of+'</span>';
  return '<span class="chip warn">Tour: stopped at step '+(t.max||1)+' of '+t.of+'</span>';
}
function chips(x,v){
  var h='';
  h+=x.invited?'<span class="chip">Invited '+esc(day(x.invited))+'</span>':'<span class="chip no">Not invited yet</span>';
  h+=x.first?'':(x.invited?'<span class="chip warn">Hasn\'t opened it</span>':'');
  h+=x.home?'<span class="chip ok">✓ On their home screen</span>':(x.first?'<span class="chip no">Not on home screen</span>':'');
  if(x.first) h+=tourChip(x.tour,v);
  return h;
}
function route(){ return location.hash.replace(/^#\/?/,'').split('/').map(decodeURIComponent); }
window.addEventListener('hashchange',function(){ render(); scrollTo(0,0); });
function top(back){ return '<div class="top">'+(back?'<a href="#/">‹ All the team</a>':'<a href="/?v=more">‹ Tools</a>')+'<button data-ref>Refresh</button></div>'; }

function list(){
  var ppl=D.people, opened=ppl.filter(function(x){return x.first;}).length, home=ppl.filter(function(x){return x.home;}).length, toured=ppl.filter(function(x){return x.tour&&x.tour.done&&(!x.tour.v||+x.tour.v===+D.tourV);}).length, wk=ppl.filter(function(x){return x.week.visits;}).length;
  var h=top()+'<p class="lbl">Team app</p><h1>Who\'s <em>using it</em></h1><p class="sub" style="margin-top:6px">How your team uses the app: who\'s opened it, finished the tour and comes back. Your own visits never count.</p><div class="stack">';
  h+='<div class="dark"><div class="grid3"><div><p class="big">'+opened+'<span style="font-size:16px;color:var(--cd)">/'+ppl.length+'</span></p><p class="sub">opened it</p></div><div><p class="big">'+home+'</p><p class="sub">on their home screen</p></div><div><p class="big">'+toured+'</p><p class="sub">finished the tour</p></div></div><p class="sub" style="margin-top:12px">'+wk+' of '+ppl.length+' used it in the last 7 days.</p></div>';
  ppl.forEach(function(x){
    var cls=x.week.visits?'on':x.first?'':'off';
    h+='<a class="card person" href="#/p/'+encodeURIComponent(x.pid)+'"><div class="row"><span class="av '+cls+'">'+esc((x.name[0]||'?').toUpperCase())+'</span><div style="flex:1;min-width:0"><p style="font-weight:600;font-size:16px">'+esc(x.name)+'</p><p class="sub">'+(x.last?'Last used '+esc(ago(x.last)):x.invited?'Invited, not opened yet':'Not invited yet')+'</p></div><span style="color:var(--body)">›</span></div>';
    if(x.first) h+='<div class="grid3"><div><p style="font-weight:600">'+x.week.days+'<span class="sub"> of 7</span></p><p class="sub" style="font-size:12px">days used this week</p></div><div><p style="font-weight:600">'+x.week.visits+'</p><p class="sub" style="font-size:12px">visits this week</p></div><div><p style="font-weight:600">'+dur(x.week.ms)+'</p><p class="sub" style="font-size:12px">in the app this week</p></div></div>';
    h+='<div class="chips">'+chips(x,D.tourV)+'</div></a>';
  });
  if(!ppl.length) h+='<div class="card sub">No team members yet.</div>';
  // What the team uses
  var tot=0, sk=Object.keys(D.screens).filter(function(k){ return SCR[k]&&D.screens[k]>0; }).sort(function(a,b){ return D.screens[b]-D.screens[a]; });
  sk.forEach(function(k){ tot+=D.screens[k]; });
  if(sk.length){
    h+='<div class="card" style="display:flex;flex-direction:column;gap:12px"><div class="between"><h2>What they <em>use</em></h2><p class="sub">last 30 days</p></div><p class="sub">Where the team\'s time in the app goes.</p>';
    sk.forEach(function(k){ var pc=tot?D.screens[k]/tot*100:0; h+='<div><div class="between"><p>'+esc(SCR[k])+'</p><p style="font-weight:600;white-space:nowrap">'+dur(D.screens[k])+'</p></div><div class="row" style="gap:8px;margin-top:4px"><div class="prog"><i style="width:'+pc.toFixed(1)+'%"></i></div><p class="sub" style="font-size:12px;width:36px;text-align:right">'+Math.round(pc)+'%</p></div></div>'; });
    h+='</div>';
  }
  var groups=[['Clocked in',/^Clocked in$/],['Clocked out',/^Clocked out$/],['Shifts confirmed',/^Confirmed shift/],['Rooms finished',/^Finished /],['Photos added',/^Added \d+ photo/],['Things flagged',/^Flagged: /],['Low on supplies',/^Low on supplies/],['Guides opened',/^Opened guide$/],['Payslips viewed',/^Viewed payslip$/]];
  var rows=groups.map(function(g){ var n=0; Object.keys(D.acts).forEach(function(a){ if(g[1].test(a)) n+=D.acts[a]; }); return [g[0],n]; }).filter(function(r){ return r[1]; });
  if(rows.length){ h+='<div class="card"><div class="between" style="margin-bottom:6px"><h2>What they <em>do</em></h2><p class="sub">last 30 days</p></div>'+rows.map(function(r){ return '<div class="ln"><p style="flex:1">'+r[0]+'</p><p style="font-weight:600">'+r[1]+'</p></div>'; }).join('')+'</div>'; }
  var gk=Object.keys(D.guides).sort(function(a,b){ return D.guides[b]-D.guides[a]; });
  if(gk.length){ h+='<div class="card"><div class="between" style="margin-bottom:6px"><h2>Most-read <em>guides</em></h2><p class="sub">last 30 days</p></div>'+gk.slice(0,8).map(function(g){ return '<div class="ln"><p style="flex:1">'+esc(g)+'</p><p style="font-weight:600">'+D.guides[g]+' view'+(D.guides[g]===1?'':'s')+'</p></div>'; }).join('')+'<p class="sub" style="margin-top:8px">A guide read a lot can mean it\'s useful, or that the standard isn\'t clear yet on the job.</p></div>'; }
  if(!sk.length&&!rows.length) h+='<div class="card sub">Nothing to show yet. Once the team opens the app, their visits show here.</div>';
  app.innerHTML=h+'</div>';
}

function person(pid){
  var x=P[pid], sm=(D.people.filter(function(z){return z.pid===pid;})[0])||{};
  if(!x){ app.innerHTML=top(true)+'<div class="center">Loading…</div>'; api('/api/teameng?p='+encodeURIComponent(pid)).then(function(d){ P[pid]=d; render(); }).catch(function(e){ app.innerHTML=top(true)+'<div class="center">'+esc(e.message)+'</div>'; }); return; }
  var ss=x.sessions||[], tm=ss.reduce(function(a,s){return a+(s.ms||0);},0);
  var h=top(true)+'<p class="lbl">Team app</p><h1>'+esc(x.name)+'</h1><div class="stack">';
  h+='<div class="chips">'+chips({invited:x.invited,first:x.first,home:x.home,tour:x.tour},D.tourV)+'</div>';
  h+='<div class="dark"><div class="grid3"><div><p class="big">'+ss.length+'</p><p class="sub">visits</p></div><div><p class="big">'+dur(tm)+'</p><p class="sub">in the app</p></div><div><p class="big">'+(sm.week?sm.week.days:0)+'<span style="font-size:16px;color:var(--cd)">/7</span></p><p class="sub">days this week</p></div></div><p class="sub" style="margin-top:12px">'+(x.first?'First opened '+esc(day(x.first))+' at '+clock(x.first)+'.':'Hasn\'t opened the app yet.')+(x.invited?' Invited '+esc(day(x.invited))+'.':'')+'</p></div>';
  var T=x.tour;
  if(T&&(!T.v||+T.v===+D.tourV)){ var pc=Math.round((T.max||0)/(T.of||1)*100);
    h+='<div class="card" style="display:flex;flex-direction:column;gap:10px"><div class="between"><h2>Welcome <em>tour</em></h2><p class="sub">'+(T.done?'Finished':T.skipped?'Skipped':'Not finished')+'</p></div><div class="row"><div class="prog"><i style="width:'+pc+'%"></i></div><p style="font-weight:600">'+(T.max||0)+' / '+T.of+'</p></div><p class="sub">Started '+esc(day(T.started||T.last))+' at '+clock(T.started||T.last)+(T.done?', finished at '+clock(T.done):T.skipped?', skipped at step '+T.skipAt:'')+'.</p></div>'; }
  else if(x.first) h+='<div class="card sub">They haven\'t seen the current welcome tour yet. It shows the next time they open the app.</div>';
  if(!x.first&&!sm.invited) h+='<div class="card" style="display:flex;flex-direction:column;gap:10px"><p>'+esc(first(x.name))+' hasn\'t been invited yet.</p><a class="btn k" href="/?v=more">Send the invite from Manage team</a></div>';
  else if(!x.first) h+='<div class="card" style="display:flex;flex-direction:column;gap:10px"><p>'+esc(first(x.name))+' hasn\'t opened their link yet. A quick nudge in person usually does it.</p><a class="btn o" href="/?v=more">Send the invite again</a></div>';
  if(ss.length){
    h+='<div class="card"><h2 style="margin-bottom:6px">Every <em>visit</em></h2>';
    var lastDay='';
    ss.forEach(function(s){ var d=day(s.at);
      if(d!==lastDay){ lastDay=d; h+='<p class="lbl" style="padding:12px 0 2px;border-top:1px solid var(--cd)">'+esc(d)+'</p>'; }
      var sc=Object.keys(s.scr||{}).filter(function(k){ return SCR[k]&&s.scr[k]>=1000; }).sort(function(a,b){ return s.scr[b]-s.scr[a]; });
      h+='<div class="sess"><div class="between"><p style="font-weight:600">'+clock(s.at)+(s.last&&Date.parse(s.last)-Date.parse(s.at)>60000?' – '+clock(s.last):'')+'</p><p class="sub">'+dur(s.ms)+' on screen'+(s.home?' · from home screen':'')+'</p></div>';
      if(sc.length) h+='<div class="chips">'+sc.map(function(k){ return '<span class="chip">'+esc(SCR[k])+' · '+dur(s.scr[k])+'</span>'; }).join('')+'</div>';
      (s.acts||[]).forEach(function(a){ h+='<div class="act"><time>'+clock(a.at)+'</time><span>'+esc(a.a)+'</span></div>'; });
      h+='</div>'; });
    h+='</div>';
  }
  app.innerHTML=h+'</div>';
}

function render(){
  if(!D) return;
  var r=route();
  if(r[0]==='p') return person(r[1]);
  list();
}
document.addEventListener('click',function(e){ if(e.target.closest('[data-ref]')){ D=null; P={}; app.innerHTML='<div class="center">Loading…</div>'; load(); } });
function load(){
  if(!key()){ app.innerHTML='<div class="center"><h1>Log in <em>first</em></h1><p class="sub" style="margin:10px 0 16px">Open the hub, log in, then come back here.</p><a class="btn k" href="/">Go to the hub</a></div>'; return; }
  api('/api/teameng').then(function(d){ D=d; render(); }).catch(function(e){ app.innerHTML='<div class="center"><p>'+esc(e.status===401?'Log in to the hub first.':e.message)+'</p></div>'; });
}
load();
})();
</script>
</body></html>
