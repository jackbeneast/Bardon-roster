<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#F5F0EB">
<title>Client engagement</title>
<link rel="icon" type="image/png" href="/icons/favicon.png?v=2"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--terracotta:#C06B3C;--terracotta-dark:#A55830;--dark:#1A1A1A;--cream:#F5F0EB;--cream-dark:#EDE6DE;--body:#4A4A4A;--meta:#7A7A7A;--gold:#F4B942;--gold-dark:#9A6B0E;--white:#FFFFFF;--line:#DDD3C8;--tint:#FBF3EE;--green:#2F5A35;--green-bg:#E6EFE3;
  --serif:"Playfair Display",Georgia,serif;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--body);font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
#app{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(60px + env(safe-area-inset-bottom,0px))}
a{color:var(--terracotta-dark)}
button{font-family:var(--sans)}
button:focus-visible,a:focus-visible,input:focus{outline:2px solid var(--terracotta);outline-offset:1px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.top a,.top button{font:500 14px var(--sans);color:var(--meta);text-decoration:none;background:none;border:0;cursor:pointer;padding:8px 0;min-height:40px}
.top .wm{display:flex;gap:8px;align-items:center;font:700 17px/1 var(--serif);color:var(--dark)}
.top .wm svg{width:26px;height:26px}
h1{font:700 28px/1.15 var(--serif);color:var(--dark);margin:6px 0 0}
h1 em{font-style:italic;font-weight:500}
h2{font:700 20px/1.2 var(--serif);color:var(--dark);margin:26px 0 10px}
h2 em{font-style:italic;font-weight:500}
.sub{color:var(--meta);font-size:14px;margin:4px 0 0}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px}
.center{text-align:center;padding:60px 20px;color:var(--dark)}
.btn{font:600 15px/1 var(--sans);border-radius:8px;min-height:46px;padding:0 18px;cursor:pointer;border:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--terracotta);color:#fff}
.btn.outline{background:var(--white);border:1.5px solid var(--line);color:var(--dark)}

/* What lands */
.lands{display:grid;gap:14px}
.ld .row1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ld .nm{font:600 15px/1.3 var(--sans);color:var(--dark)}
.ld .pc{font:700 18px/1 var(--serif);color:var(--dark);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--cream-dark);margin:7px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--terracotta)}
.ld .mt{font-size:13px;color:var(--meta)}
.ld .mt b{color:var(--dark);font-weight:600}

/* list */
.search{width:100%;margin-top:14px;font:400 16px var(--sans);border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:var(--white);color:var(--dark)}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
.chip{flex:none;border:1px solid var(--line);background:var(--white);color:var(--dark);border-radius:999px;padding:8px 12px;font:500 13px var(--sans);cursor:pointer;min-height:38px}
.chip[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:var(--cream)}
.list{margin-top:12px;background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cl{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--cream-dark);text-decoration:none;color:inherit;min-height:68px}
.cl:last-child{border-bottom:0}
.cl:active{background:var(--tint)}
.av{width:44px;height:44px;border-radius:50%;background:var(--cream-dark);color:var(--dark);display:grid;place-items:center;font:600 15px/1 var(--sans);position:relative}
.av.hot{background:var(--terracotta);color:#fff}
.av.warm{background:#FBEBC9;color:var(--gold-dark)}
.av.cold{background:var(--white);border:1.5px dashed #BFB4A8;color:var(--meta)}
.cl .nm{font:600 15.5px/1.3 var(--sans);color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl .pv{font-size:13.5px;color:var(--meta);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl .tm{font-size:12px;color:var(--meta);white-space:nowrap;align-self:start;padding-top:3px;text-align:right}
.tag{display:inline-block;font:600 10.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 8px;margin-top:4px}
.tag.hot{background:var(--tint);color:var(--terracotta-dark)}
.tag.warm{background:#FBEBC9;color:var(--gold-dark)}
.tag.cold{background:var(--cream-dark);color:var(--meta)}
.tag.agent{background:var(--dark);color:var(--cream)}
.mid{min-width:0}
.empty{background:var(--white);border:1px dashed var(--line);border-radius:12px;padding:26px 18px;text-align:center;color:var(--meta);margin-top:12px}

/* client */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.st{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.st b{display:block;font:700 22px/1.1 var(--serif);color:var(--dark);font-variant-numeric:tabular-nums}
.st span{font-size:12px;color:var(--meta)}
.acts{display:flex;gap:8px;margin-top:12px}
.acts .btn{flex:1;min-height:44px;font-size:14px}
.verdict{margin-top:12px;border-left:3px solid var(--terracotta);background:var(--tint);border-radius:0 8px 8px 0;padding:10px 12px;color:var(--dark);font-size:14px}
.items{display:grid;gap:10px}
.it{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px;border-left:4px solid var(--line)}
.it.hot{border-left-color:var(--terracotta)}
.it.warm{border-left-color:var(--gold)}
.it.cold{border-left-color:#BFB4A8;background:#FCFAF8}
.it .r1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.it .lb{font:600 15px/1.3 var(--sans);color:var(--dark)}
.it .sb{font-size:13px;color:var(--meta);margin-top:1px}
.it .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.it .nums div{font-size:12px;color:var(--meta)}
.it .nums b{display:block;font:600 16px/1.2 var(--sans);color:var(--dark);font-variant-numeric:tabular-nums}
.it .depth{height:6px;border-radius:3px;background:var(--cream-dark);margin-top:10px;overflow:hidden}
.it .depth i{display:block;height:100%;background:var(--dark);border-radius:3px}
.it .ft{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:12.5px;color:var(--meta)}
.it .ft a{font-weight:600;text-decoration:none}
.tl{position:relative;margin-top:4px}
.day{font:600 12px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--meta);margin:18px 0 8px}
.ev{display:grid;grid-template-columns:62px 18px 1fr;gap:8px;position:relative;padding-bottom:14px}
.ev .t{font:500 13px/1.4 var(--sans);color:var(--dark);text-align:right;font-variant-numeric:tabular-nums;padding-top:1px}
.ev .rail{position:relative}
.ev .rail:before{content:"";position:absolute;left:8px;top:0;bottom:-14px;width:2px;background:var(--cream-dark)}
.ev:last-child .rail:before{bottom:auto;height:10px}
.ev .dot{position:absolute;left:3px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--white);border:2px solid #BFB4A8}
.ev .dot.hot{background:var(--terracotta);border-color:var(--terracotta)}
.ev .dot.warm{background:var(--gold);border-color:var(--gold)}
.ev .bx{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.ev .what{font:600 14px/1.35 var(--sans);color:var(--dark)}
.ev .how{font-size:12.5px;color:var(--meta);margin-top:2px}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.pill{font:500 12px/1 var(--sans);background:var(--cream);color:var(--dark);border-radius:999px;padding:6px 9px}
.pill.key{background:var(--green-bg);color:var(--green)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--meta);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.note{font-size:12.5px;color:var(--meta);margin-top:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--dark);color:var(--cream);padding:10px 16px;border-radius:999px;font:500 14px var(--sans);z-index:30}
</style><script src="/lib/hubnav.js" data-tabs="tools"></script>
</head><body>
<div id="app"><div class="center">Loading…</div></div>
<script>
(function(){
var LOGO='<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M5 21 L24 6 L43 21" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="square"/><text x="24" y="43" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-weight="700" font-size="25" fill="#1A1A1A">B</text></svg>';
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var TYPE={quote:'Quotes',invoice:'Invoices',report:'Job reports',receipt:'Receipts',portal:'Agent portal'};
var app=document.getElementById('app');
var L=null, C={}, loadErr='', filter='all', q='';

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function key(){ return lsGet('roster_admin_key')||''; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(m){ var t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=m; document.body.appendChild(t); setTimeout(function(){t.remove();},2400); }
function api(qs){
  return fetch('/api/engage'+(qs||''),{headers:{'x-admin-key':key()},cache:'no-store'})
    .then(function(r){ return r.json().catch(function(){return {};}).then(function(d){ if(!r.ok){ var e=new Error(d.error||'Something went wrong. Try again.'); e.status=r.status; throw e; } return d; }); });
}
function dur(ms){ var s=Math.round((ms||0)/1000); if(s<60) return s+'s'; var m=Math.floor(s/60); if(m<60) return m+'m '+(s%60?(s%60)+'s':'').trim(); return Math.floor(m/60)+'h '+(m%60)+'m'; }
function dayKey(d){ return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
function hm(d){ var h=d.getHours(), m=d.getMinutes(); return (h%12||12)+':'+(m<10?'0':'')+m+(h>=12?'pm':'am'); }
function ago(iso){ if(!iso) return ''; var d=new Date(iso), s=(Date.now()-d)/1000; if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago';
  var n=new Date(), y=new Date(n); y.setDate(n.getDate()-1); if(dayKey(d)===dayKey(y)) return 'yesterday'; if(s<6*86400) return DOW[d.getDay()]; return d.getDate()+' '+MON[d.getMonth()]; }
function dayLabel(iso){ var d=new Date(iso), n=new Date(); if(dayKey(d)===dayKey(n)) return 'Today'; var y=new Date(n); y.setDate(n.getDate()-1); if(dayKey(d)===dayKey(y)) return 'Yesterday'; return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]+(d.getFullYear()!==n.getFullYear()?' '+d.getFullYear():''); }
function fday(iso){ var d=new Date(iso); return d.getDate()+' '+MON[d.getMonth()]; }
function initials(n){ n=String(n||'').replace(/\(.*?\)/g,'').trim(); if(!n) return '#'; var w=n.split(/\s+/); return (w[0][0]+(w.length>1?w[w.length-1][0]:'')).toUpperCase(); }
function mobile(v){ var d=String(v||'').replace(/[^\d+]/g,''); if(d.indexOf('+61')===0) d='0'+d.slice(3); else if(d.indexOf('61')===0&&d.length===11) d='0'+d.slice(2); return /^04\d{8}$/.test(d)?d:''; }

// How engaged: hot = really reading, warm = looked, cold = sent but never opened.
function heatClient(c){ if(c.ms>=180000||c.visits>=4) return 'hot'; if(c.visits>0) return 'warm'; if(c.sent>0) return 'cold'; return ''; }
function heatItem(it){ if(!it.opens) return it.pre?'':'cold'; if(it.ms>=90000||it.opens>=3||it.acts>0&&it.ms>=30000) return 'hot'; return 'warm'; }
function heatSes(s){ return s.ms>=60000||(s.acts||[]).length?'hot':s.ms>=10000?'warm':''; }
function readWord(ms){ return ms>=60000?'Read':ms>=10000?'Skimmed':'Glanced at'; }
var HEAT={hot:'Engaged',warm:'Looked',cold:'Not opened'};

function route(){ var h=location.hash.replace(/^#\/?/,''), p=h.split('/'); return {v:p[0]||'list', id:p[1]?decodeURIComponent(p.slice(1).join('/')):''}; }
function topbar(back){ return '<div class="top">'+(back?'<a href="#/" data-hb>← Back</a>':'<a href="/?v=more" data-hb>← Back</a>')+'<span class="wm">'+LOGO+'Bardon Clean</span><button data-act="refresh">Refresh</button></div>'; }

// ---------- list ----------
function lands(){
  var S=L.stats, rows=['quote','invoice','report','receipt','portal'].filter(function(t){ var x=S[t]; return x&&(x.sent||x.opened); });
  if(!rows.length) return '';
  var h='<h2>What <em>lands</em></h2><div class="card lands">';
  rows.forEach(function(t){ var x=S[t], rate=x.sent?Math.round(x.opened/x.sent*100):null, avg=x.opened?x.ms/x.opened:0, per=x.opened?(x.opens/x.opened):0;
    h+='<div class="ld"><div class="row1"><span class="nm">'+TYPE[t]+'</span><span class="pc">'+(rate==null?x.opened+' opened':rate+'%')+'</span></div>';
    if(rate!=null) h+='<div class="bar" role="img" aria-label="'+rate+'% opened"><i style="width:'+rate+'%"></i></div>';
    h+='<div class="mt">'+(x.sent?'<b>'+x.opened+'</b> of '+x.sent+' opened · ':'')+(x.opened?'avg <b>'+dur(avg)+'</b> reading · '+(Math.round(per*10)/10)+' opens each'+(x.acted?' · '+x.acted+' tapped through':''):'none opened yet')+'</div></div>'; });
  h+='</div><p class="note">Reading time only counts while the page is on their screen.'+(L.since?' Counting things sent since '+fday(L.since)+'.':'')+'</p>';
  return h;
}
function renderList(){
  var h=topbar(false)+'<h1>Client <em>engagement</em></h1><p class="sub">Who opens what you send, how long they read it, and what they tap.</p>';
  if(!L.since && !L.clients.some(function(c){return c.visits;})) h+='<div class="empty" style="margin-top:16px"><b style="color:var(--dark)">Tracking is on.</b><br>The next time a client opens a quote, invoice or job report link, it shows up here. Your own visits while logged in don\'t count.</div>';
  h+=lands();
  h+='<h2>Clients</h2><input class="search" type="search" placeholder="Search clients" value="'+esc(q)+'" data-q autocomplete="off">';
  function chip(v,l){ return '<button class="chip" data-f="'+v+'" aria-pressed="'+(filter===v)+'">'+l+'</button>'; }
  h+='<div class="chips">'+chip('all','All')+chip('hot','Engaged')+chip('warm','Looked')+chip('cold','Not opened')+chip('agent','Agents')+'</div>';
  var list=L.clients.filter(function(c){
    var ht=heatClient(c); if(!ht&&c.kind!=='agent') return false;
    if(q && c.name.toLowerCase().indexOf(q.toLowerCase())<0) return false;
    if(filter==='agent') return c.kind==='agent';
    if(filter!=='all' && ht!==filter) return false;
    return true;
  });
  if(!list.length) h+='<div class="empty">'+(q||filter!=='all'?'No clients match.':'No client links sent yet.')+'</div>';
  else { h+='<div class="list">'; list.forEach(function(c){ var ht=heatClient(c);
    var pv=c.visits?c.visits+' visit'+(c.visits===1?'':'s')+' · '+dur(c.ms)+' reading':'Sent '+c.sent+' thing'+(c.sent===1?'':'s')+', not opened';
    h+='<a class="cl" href="#/c/'+encodeURIComponent(c.key)+'"><span class="av '+ht+'">'+esc(initials(c.name))+'</span><span class="mid"><div class="nm">'+esc(c.name)+'</div><div class="pv">'+esc(pv)+'</div>'+(c.kind==='agent'?'<span class="tag agent">Agent</span>':ht?'<span class="tag '+ht+'">'+HEAT[ht]+'</span>':'')+'</span><span class="tm">'+(c.last?'Seen '+ago(c.last):c.lastSent?'Sent '+ago(c.lastSent):'')+'</span></a>'; });
    h+='</div>'; }
  h+='<div class="legend"><span><i style="background:var(--terracotta)"></i>Engaged: 3+ min or 4+ visits</span><span><i style="background:var(--gold)"></i>Looked</span><span><i style="border:1.5px dashed #BFB4A8"></i>Not opened</span></div>';
  app.innerHTML=h;
}

// ---------- one client ----------
function verdict(d){
  var its=d.items, opened=its.filter(function(i){return i.opens;}), cold=its.filter(function(i){return !i.opens&&!i.pre;});
  if(!its.length) return '';
  if(!opened.length&&!cold.length) return '';
  if(!opened.length) return 'Hasn\'t opened anything yet. A quick text or call may land better than another link.';
  var top=opened.slice().sort(function(a,b){return b.ms-a.ms;})[0];
  var s='Spent the most time on <b>'+esc(top.label)+'</b> ('+dur(top.ms)+(top.opens>1?' over '+top.opens+' visits':'')+').';
  if(cold.length) s+=' Never opened '+cold.length+' other link'+(cold.length===1?'':'s')+'.';
  var back=opened.filter(function(i){return i.opens>=3;}); if(back.length && back[0]!==top) s+=' Keeps coming back to '+esc(back[0].label)+'.';
  return s;
}
function itemLink(it){
  if(it.doc) return '<a href="/money/#/doc/'+esc(it.doc)+'">Open</a>';
  if(it.share) return '<a href="/v/'+esc(it.share)+'" target="_blank" rel="noopener">Open</a>';
  return '';
}
function renderClient(id){
  var d=C[id];
  var h=topbar(true);
  if(!d){ app.innerHTML=h+'<div class="center">Loading…</div>'; return; }
  var S=d.sessions, tot=S.reduce(function(t,x){return t+(x.ms||0);},0), last=S[0]&&S[0].last;
  var devs={}; S.forEach(function(x){ devs[x.dev]=(devs[x.dev]||0)+1; }); var dev=Object.keys(devs).sort(function(a,b){return devs[b]-devs[a];})[0];
  h+='<h1>'+esc(d.name)+'</h1><p class="sub">'+(d.kind==='agent'?'Real estate agent':'Client')+(last?' · last seen '+ago(last):' · hasn\'t opened anything yet')+(dev?' · mostly on '+dev:'')+'</p>';
  h+='<div class="stats"><div class="st"><b>'+S.length+'</b><span>Visits</span></div><div class="st"><b>'+dur(tot)+'</b><span>Reading time</span></div><div class="st"><b>'+d.items.filter(function(i){return i.opens;}).length+'<small style="font:500 14px var(--sans);color:var(--meta)">/'+d.items.length+'</small></b><span>Links opened</span></div></div>';
  var m=mobile(d.phone);
  if(m) h+='<div class="acts"><a class="btn primary" href="/messages/#/t/'+m+'?name='+encodeURIComponent(d.name)+'">Text '+esc(d.name.split(' ')[0])+'</a><a class="btn outline" href="tel:'+m+'">Call</a></div>';
  var v=verdict(d); if(v) h+='<div class="verdict">'+v+'</div>';

  if(d.items.length){
    h+='<h2>What they\'ve <em>been sent</em></h2><div class="items">';
    d.items.forEach(function(it){ var ht=heatItem(it);
      h+='<div class="it '+ht+'"><div class="r1"><div><div class="lb">'+esc(it.label)+'</div>'+(it.sub?'<div class="sb">'+esc(it.sub)+'</div>':'')+'</div><span class="tag '+ht+'" style="margin-top:0;flex:none">'+(ht==='hot'?'Read closely':ht==='warm'?'Opened':ht==='cold'?'Not opened':'Before tracking')+'</span></div>';
      if(it.opens){
        h+='<div class="nums"><div><b>'+it.opens+'×</b>opened</div><div><b>'+dur(it.ms)+'</b>reading</div><div><b>'+it.sc+'%</b>scrolled</div></div><div class="depth" role="img" aria-label="Scrolled '+it.sc+'% of the page"><i style="width:'+it.sc+'%"></i></div>';
        h+='<div class="ft"><span>First opened '+dayLabel(it.first)+', '+hm(new Date(it.first))+(it.opens>1?' · last '+ago(it.last):'')+'</span>'+itemLink(it)+'</div>';
      } else h+='<div class="ft"><span>'+(it.sent?'Sent '+dayLabel(it.sent):'Sent')+(it.state?' · '+esc(it.state):'')+'</span>'+itemLink(it)+'</div>';
      h+='</div>'; });
    h+='</div>';
  }

  h+='<h2>Activity <em>timeline</em></h2>';
  if(!S.length) h+='<div class="empty">No visits yet.</div>';
  else {
    h+='<div class="tl">'; var lastDay='';
    S.forEach(function(s){ var dk=dayLabel(s.at); if(dk!==lastDay){ h+='<div class="day">'+dk+'</div>'; lastDay=dk; }
      var ht=heatSes(s), acts=(s.acts||[]);
      h+='<div class="ev"><div class="t">'+hm(new Date(s.at))+'</div><div class="rail"><span class="dot '+ht+'"></span></div><div class="bx"><div class="what">'+readWord(s.ms)+' '+esc(s.item.label)+'</div><div class="how">'+dur(s.ms)+' on screen · scrolled '+(s.sc||0)+'% · '+esc(s.dev||'mobile')+'</div>';
      if(acts.length) h+='<div class="pills">'+acts.map(function(a){ var k=/accept|pay|copied|deposit|submitted/i.test(a.a); return '<span class="pill'+(k?' key':'')+'">'+esc(a.a)+'</span>'; }).join('')+'</div>';
      h+='</div></div>'; });
    h+='</div>';
  }
  h+='<p class="note">Reading time counts only while the page is open on their screen. Opening a link inside a text preview doesn\'t count as a visit.</p>';
  app.innerHTML=h;
}

// ---------- shell ----------
function render(){
  if(loadErr==='login'){ app.innerHTML='<div class="center">'+LOGO.replace('<svg','<svg style="width:48px;height:48px"')+'<h1 style="margin-top:12px">Log in <em>first</em></h1><p class="sub">Open the hub, log in with your password, then come back here.</p><p><a class="btn primary" href="/">Go to the hub</a></p></div>'; return; }
  if(loadErr){ app.innerHTML=topbar(false)+'<div class="empty">'+esc(loadErr)+'</div>'; return; }
  var r=route();
  if(r.v==='c') return renderClient(r.id);
  if(!L){ app.innerHTML='<div class="center">Loading…</div>'; return; }
  renderList();
}
function loadList(){ if(!key()){ loadErr='login'; render(); return Promise.resolve(); }
  return api().then(function(d){ L=d; loadErr=''; render(); }).catch(function(e){ loadErr=e.status===401?'login':e.message; render(); }); }
function loadClient(id){ if(!key()){ loadErr='login'; render(); return Promise.resolve(); }
  return api('?c='+encodeURIComponent(id)).then(function(d){ C[id]=d; loadErr=''; if(route().id===id) render(); }).catch(function(e){ loadErr=e.status===401?'login':e.message; render(); }); }
function go(){ var r=route(); render(); window.scrollTo(0,0); if(r.v==='c') loadClient(r.id); else if(!L) loadList(); }

app.addEventListener('click',function(e){
  var f=e.target.closest('[data-f]'); if(f){ filter=f.dataset.f; render(); return; }
  if(e.target.closest('[data-act="refresh"]')){ var r=route(); (r.v==='c'?loadClient(r.id):loadList()).then(function(){ toast('Up to date'); }); }
});
app.addEventListener('input',function(e){ if(e.target.matches('[data-q]')){ q=e.target.value; var pos=e.target.selectionStart; renderList(); var s=app.querySelector('[data-q]'); s.focus(); try{ s.setSelectionRange(pos,pos); }catch(x){} } });
window.addEventListener('hashchange',go);
go();
})();
</script>
