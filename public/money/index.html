<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#F5F0EB">
<title>Quotes & Invoices</title>
<link rel="icon" type="image/png" href="/icons/favicon.png?v=2"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--terracotta:#C06B3C;--terracotta-dark:#A55830;--dark:#1A1A1A;--cream:#F5F0EB;--cream-dark:#EDE6DE;--body:#4A4A4A;--meta:#7A7A7A;--gold:#F4B942;--white:#FFFFFF;--line:#DDD3C8;--tint:#FBF3EE;
  --serif:"Playfair Display",Georgia,serif;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--body);font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
#app{max-width:720px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom,0px))}
a{color:var(--terracotta-dark)}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.top a,.top button{font:500 14px var(--sans);color:var(--meta);text-decoration:none;background:none;border:0;cursor:pointer;padding:8px 0}
.top .wm{display:flex;gap:8px;align-items:center;font:700 17px/1 var(--serif);color:var(--dark)}
.top .wm svg{width:26px;height:26px}
h1{font:700 28px/1.15 var(--serif);color:var(--dark);margin:6px 0 0}
h1 em,h2 em{font-style:italic;font-weight:500}
h2{font:700 20px/1.2 var(--serif);color:var(--dark);margin:0}
.sub{color:var(--meta);font-size:14px;margin:4px 0 0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px}
.kpi b{display:block;font:700 19px/1.2 var(--serif);color:var(--dark);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--meta)}
.kpi.dark{background:var(--dark);border-color:var(--dark)}.kpi.dark b{color:var(--cream)}.kpi.dark span{color:#BDB5AD}
.kpi.warn b{color:var(--terracotta-dark)}
@media (max-width:400px){.kpi b{font-size:16px}}
.seg{display:flex;background:var(--cream-dark);border-radius:10px;padding:4px;margin-top:18px}
.seg button{flex:1;border:0;background:none;border-radius:7px;min-height:42px;font:600 14px var(--sans);color:var(--meta);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--dark);box-shadow:0 1px 3px rgba(26,26,26,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:12px -16px 0;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--white);color:var(--dark);border-radius:999px;padding:8px 12px;font:500 13px var(--sans);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:var(--cream)}
.search{width:100%;margin-top:10px;font:400 16px var(--sans);border:1px solid var(--line);border-radius:8px;padding:11px 12px;background:var(--white);color:var(--dark)}
.list{display:grid;gap:8px;margin-top:12px}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:13px 14px;text-align:left;font:inherit;color:inherit;cursor:pointer;width:100%}
.row .c{font:700 16px/1.3 var(--serif);color:var(--dark);min-width:0;overflow-wrap:anywhere}
.row .a{font:600 15px/1.3 var(--sans);color:var(--dark);text-align:right;font-variant-numeric:tabular-nums}
.row .m{font-size:13px;color:var(--meta);min-width:0;overflow-wrap:anywhere}
.pill{display:inline-block;font:600 10.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:5px 8px;background:var(--cream-dark);color:var(--dark);white-space:nowrap}
.pill.draft{background:var(--cream);color:var(--meta);border:1px dashed var(--line)}
.pill.viewed{background:#FCEFD0;color:#7A5A12}
.pill.accepted,.pill.paid{background:#E6EFE3;color:#2F5A35}
.pill.overdue,.pill.expired,.pill.declined{background:#FBEBD9;color:#8A4A1F}
.pill.part-paid{background:#E9EEF5;color:#2D4A6B}
.empty{background:var(--white);border:1px dashed var(--line);border-radius:10px;padding:22px;text-align:center;color:var(--meta);margin-top:12px}
.alert{display:block;width:100%;text-align:left;margin-top:10px;background:var(--white);border:1px solid var(--line);border-left:4px solid var(--terracotta);border-radius:8px;padding:11px 12px;font:inherit;font-size:14px;color:var(--dark);cursor:pointer}
.alert.ok{border-left-color:#2F5A35}
.alert.gold{border-left-color:var(--gold)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--white);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .sum{flex:1;min-width:0;font-size:12px;color:var(--meta);line-height:1.2}
.bar .sum b{display:block;font:700 19px/1.2 var(--serif);color:var(--dark);font-variant-numeric:tabular-nums}
.btn{font:600 15px/1 var(--sans);border-radius:8px;min-height:48px;padding:0 18px;cursor:pointer;border:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--terracotta);color:var(--white)}
.btn.primary:hover{background:var(--terracotta-dark)}
.btn.primary:disabled{opacity:.6}
.btn.dark{background:var(--dark);color:var(--cream)}
.btn.outline{background:var(--white);border:2px solid var(--terracotta);color:var(--terracotta)}
.btn.plain{background:var(--white);border:1px solid var(--line);color:var(--dark)}
.btn.grow{flex:1}
.ghost{background:none;border:0;color:var(--terracotta);font:500 14px var(--sans);text-decoration:underline;cursor:pointer;padding:8px 0}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.card h2{margin-bottom:12px}
.card .hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.card .hrow h2{margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.full{grid-column:1/-1}
@media (max-width:440px){.grid{grid-template-columns:1fr}}
label.l{display:block;font:500 13px/1.3 var(--sans);color:var(--dark);min-width:0}
label.l small{font-weight:400;color:var(--meta)}
input,select,textarea{width:100%;margin-top:6px;font:400 16px/1.35 var(--sans);color:var(--dark);background:var(--white);border:1px solid #CFC5BA;border-radius:6px;padding:11px;min-height:46px}
textarea{resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--terracotta);outline-offset:1px}
.check{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--dark);margin-top:12px;cursor:pointer}
.check input{width:22px;height:22px;min-height:0;margin:0;accent-color:var(--terracotta)}
.item{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;background:var(--white)}
.item .ititle{font:600 15px var(--sans)}
.item .nums{display:grid;grid-template-columns:80px 1fr auto;gap:10px;align-items:end;margin-top:10px}
.item .lt{font:600 15px var(--sans);color:var(--dark);font-variant-numeric:tabular-nums;padding-bottom:12px;text-align:right;min-width:90px}
.item .tools{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;border-top:1px solid var(--cream-dark);padding-top:6px}
.item .tools button{background:none;border:0;font:500 13px var(--sans);color:var(--meta);padding:8px 8px;cursor:pointer;min-height:36px}
.item .tools button.rm{color:var(--terracotta-dark);margin-left:auto}
.addrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.totals{margin-top:14px;font-variant-numeric:tabular-nums}
.totals div{display:flex;justify-content:space-between;padding:5px 0;font-size:15px;color:var(--dark)}
.totals .g{border-top:2px solid var(--dark);margin-top:6px;padding-top:10px;font:700 20px var(--serif)}
.hint{font-size:13px;color:var(--meta);margin-top:8px}
.hint-card{margin-top:12px;background:var(--tint);border-radius:8px;padding:11px 13px;font-size:14px;color:var(--dark)}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--cream-dark);font-size:14px;color:var(--meta)}
.tl li:last-child{border-bottom:0}
.tl li.on{color:var(--dark)}
.tl li.on span:first-child::before{content:"● ";color:var(--terracotta)}
.tl li span:first-child::before{content:"○ ";color:var(--line)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts .btn{width:100%;min-height:50px;font-size:14px}
.acts .wide{grid-column:1/-1}
.menu{background:var(--white);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:14px}
.menu button,.menu a{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 16px;background:none;border:0;border-bottom:1px solid var(--cream-dark);font:500 15px var(--sans);color:var(--dark);text-align:left;cursor:pointer;text-decoration:none}
.menu button:last-child,.menu a:last-child{border-bottom:0}
.menu .chev{color:var(--meta)}
.lib{display:grid;gap:8px;margin-top:10px}
.lib button{display:block;width:100%;text-align:left;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit;color:inherit;cursor:pointer}
.lib b{display:block;font:600 15px var(--sans);color:var(--dark)}
.lib span{display:block;font-size:13px;color:var(--meta);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib .tag{display:inline-block;font:600 10.5px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;background:var(--tint);color:var(--terracotta-dark);border-radius:4px;padding:4px 6px;margin-top:6px}
.scrim{position:fixed;inset:0;background:rgba(26,26,26,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--white);width:100%;max-width:600px;max-height:90vh;overflow:auto;border-radius:14px 14px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{font:700 22px/1.2 var(--serif);color:var(--dark);margin:0 0 12px}
.sheet h3 em{font-style:italic;font-weight:500}
.sheet .actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.err{color:var(--terracotta-dark);font:500 13px/1.4 var(--sans);margin-top:10px}
.toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--dark);color:var(--cream);padding:10px 16px;border-radius:999px;font:500 14px var(--sans);z-index:40;max-width:90vw;text-align:center}
.center{text-align:center;padding:60px 16px;color:var(--dark)}
.pricegrid{display:grid;gap:10px;margin-top:10px}
.prow{border:1px solid var(--line);border-radius:10px;padding:12px}
.prow b{font:600 15px var(--sans);color:var(--dark)}
.prow .grid3 label{font-size:12px}
.sendopt{display:grid;gap:8px}
.sendopt a,.sendopt button{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--white);font:600 15px var(--sans);color:var(--dark);text-decoration:none;cursor:pointer;text-align:left}
.sendopt small{display:block;font:400 13px var(--sans);color:var(--meta);margin-top:2px}
.sendopt .ic{width:36px;height:36px;border-radius:50%;background:var(--tint);color:var(--terracotta-dark);display:grid;place-items:center;flex:none;font-size:16px}
.pc small{display:block;font:400 12.5px/1.3 var(--sans);color:var(--meta)}
.pc div{align-items:flex-start}
.pc .be{border-top:1px solid var(--line);margin-top:4px;padding-top:9px;font-weight:600}
.byday{margin-top:12px}
.byday>div{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.byday button{border:1px solid var(--line);background:var(--white);border-radius:8px;padding:8px 4px;text-align:center;cursor:pointer;font:inherit;color:var(--dark)}
.byday button[aria-pressed="true"]{border:2px solid var(--terracotta);background:var(--tint)}
.byday small{display:block;font-size:11.5px;color:var(--meta)}
.byday b{display:block;font:600 15px var(--sans);font-variant-numeric:tabular-nums}
.byday i{display:block;font-style:normal;font-size:11.5px;color:var(--terracotta-dark)}
.verdict{margin-top:12px;border-radius:8px;padding:11px 13px;font-size:14px;line-height:1.4}
.verdict b{display:block;font:600 15px var(--sans);margin-bottom:2px}
.verdict.bad{background:#FBEBD9;color:#8A4A1F}.verdict.warn{background:#FCEFD0;color:#5E4510}.verdict.ok{background:#E6EFE3;color:#2F5A35}
.pay{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--cream-dark);font-size:14px;color:var(--dark)}
</style></head><body>
<div id="app"><div class="center">Loading…</div></div>
<script src="/lib/confirm.js"></script>
<script src="/lib/sms.js"></script>
<script src="/lib/templates.js"></script>
<script>
(function(){
  var app=document.getElementById('app');
  var S={docs:[],settings:null,card:false,jobs:[],reqs:[]}, loaded=false, loadErr='';
  var tab=lsGet('money_tab')||'quote', filter='all', q='', draft=null, dirty=false;
  var LIMIT=40, IMP=null, PREFILL=null;
  var SERVICES=['Pre-sale clean','Bond clean','Deep clean','Regular clean','Commercial','Other'];
  var LOGO='<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M5 21 L24 6 L43 21" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="square"/><text x="24" y="43" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-weight="700" font-size="25" fill="#1A1A1A">B</text></svg>';
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var LABEL={draft:'Draft',sent:'Sent',viewed:'Viewed',accepted:'Accepted',declined:'Declined',expired:'Expired',paid:'Paid','part-paid':'Part paid',overdue:'Overdue'};

  function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function money(v,dp){ v=+v||0; var n=dp===0?0:2; return (v<0?'−':'')+'$'+Math.abs(v).toLocaleString('en-AU',{minimumFractionDigits:n,maximumFractionDigits:n}); }
  function r2(v){ return Math.round(v*100)/100; }
  function pad(n){ return (n<10?'0':'')+n; }
  function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function today(){ return iso(new Date()); }
  function addDays(s,n){ var p=s.split('-'), d=new Date(+p[0],+p[1]-1,+p[2]); d.setDate(d.getDate()+n); return iso(d); }
  function fdate(s,dow){ if(!s) return ''; var p=s.slice(0,10).split('-'), d=new Date(+p[0],+p[1]-1,+p[2]); return (dow?DOW[d.getDay()]+' ':'')+d.getDate()+' '+MON[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''); }
  function ftime(s){ if(!s) return ''; var d=new Date(s), h=d.getHours(); return fdate(iso(d))+', '+(h%12||12)+':'+pad(d.getMinutes())+(h>=12?'pm':'am'); }
  function toast(m){ var t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(function(){t.remove();},2600); }
  function first(n){ return String(n||'').trim().split(/\s+/)[0]||'there'; }
  function key(){ return lsGet('roster_admin_key')||''; }
  function api(method,url,body){
    return fetch(url,{method:method,headers:{'content-type':'application/json','x-admin-key':key()},body:body?JSON.stringify(body):undefined,cache:'no-store'})
      .then(function(r){ return r.json().catch(function(){return {};}).then(function(d){ if(!r.ok){ var e=new Error(d.error||'Something went wrong. Try again.'); e.status=r.status; throw e; } return d; }); });
  }
  function totals(d){ var sub=r2((d.items||[]).reduce(function(a,i){return a+(+i.qty||1)*(+i.price||0);},0)), gst=d.gst?r2(sub*.1):0, total=r2(sub+gst), paid=r2((d.payments||[]).reduce(function(a,p){return a+p.amt;},0)); return {sub:sub,gst:gst,total:total,paid:paid,due:r2(Math.max(0,total-paid)),deposit:d.kind==='quote'&&d.depositPct?r2(total*d.depositPct/100):0}; }
  function docById(id){ for(var i=0;i<S.docs.length;i++) if(S.docs[i].id===id) return S.docs[i]; return null; }
  function jobFor(d){ var jid=d.jobId; if(!jid&&d.quoteId){ var q=docById(d.quoteId); jid=q&&q.jobId; } return jid?S.jobs.filter(function(j){return j.id===jid;})[0]||null:null; }
  function reportLink(d){ var j=d.kind==='invoice'&&!d.isDeposit?jobFor(d):null; return j&&j.share?location.origin+'/v/'+j.share:''; }
  function link(d){ return location.origin+'/'+(d.kind==='invoice'?'i':'q')+'/'+d.token; }
  function title(d){ return (d.kind==='quote'?'Quote':'Invoice')+' #'+d.num; }
  function phoneSms(p){ return String(p||'').replace(/[^0-9+]/g,''); }

  function load(){
    if(!key()){ loadErr='login'; render(); return Promise.resolve(); }
    return Promise.all([api('GET','/api/docs'), api('GET','/api/roster').catch(function(){return {jobs:[]};}), api('GET','/api/request').catch(function(){return {requests:[]};}), api('GET','/api/books?costs=1').catch(function(){return null;})]).then(function(r){ S.reqs=r[2].requests||[]; S.costs=r[3];
      BCSms.check(key()); BCTpl.load(key()).catch(function(){}); S.docs=r[0].docs; S.settings=r[0].settings; S.card=r[0].card; S.jobs=(r[1].jobs||[]).filter(function(j){return !j.sample;});
      loaded=true; loadErr=''; render();
    }).catch(function(e){ loadErr=e.status===401?'login':e.message; render(); });
  }

  // ---------- Routing ----------
  function route(){ var h=location.hash.replace(/^#\/?/,'').split('/'); return {v:h[0]||'list', id:h[1]||''}; }
  function go(h){ if(location.hash==='#/'+h) render(); else location.hash='#/'+h; }
  var curHash=location.hash, bounce=false;
  window.addEventListener('hashchange',function(){
    if(bounce){ bounce=false; curHash=location.hash; return; }
    if(dirty && route().v!=='edit' && !confirm('Leave without saving your changes?')){ bounce=true; location.hash=curHash; return; }
    curHash=location.hash; dirty=false; draft=null; render(); window.scrollTo(0,0);
  });

  function topbar(back){ return '<div class="top">'+(back?'<a href="'+back+'">← Back</a>':'<a href="/">← Hub</a>')+'<span class="wm">'+LOGO+'Bardon Clean</span><button data-act="refresh">Refresh</button></div>'; }

  function render(){
    if(loadErr==='login'){ app.innerHTML='<div class="center">'+LOGO.replace('<svg','<svg style="width:48px;height:48px"')+'<h1 style="margin-top:12px">Log in <em>first</em></h1><p class="sub">Open the hub, log in with your password, then come back here.</p><p><a class="btn primary" href="/">Go to the hub</a></p></div>'; return; }
    if(loadErr){ app.innerHTML='<div class="center"><p>'+esc(loadErr)+'</p><button class="btn dark" data-act="refresh">Try again</button></div>'; return; }
    if(!loaded){ app.innerHTML='<div class="center">Loading…</div>'; return; }
    var r=route();
    if(r.v==='edit') return renderEdit(r.id);
    if(r.v==='doc') return renderDoc(r.id);
    if(r.v==='library') return renderLibrary();
    if(r.v==='settings') return renderSettings();
    if(r.v==='import') return renderImport();
    if(r.v==='req') return renderReq(r.id);
    renderList();
  }

  // ---------- List ----------
  function renderList(){
    var inv=S.docs.filter(function(d){return d.kind==='invoice';}), quo=S.docs.filter(function(d){return d.kind==='quote';});
    var owed=0, overdue=0, out=0, outN=0;
    inv.forEach(function(d){ if(d.state!=='draft'){ owed+=d.totals.due; if(d.state==='overdue') overdue+=d.totals.due; } });
    quo.forEach(function(d){ if(d.state==='sent'||d.state==='viewed'){ out+=d.totals.total; outN++; } });
    var h=topbar()+'<h1>Quotes &amp; <em>invoices</em></h1>';

  // ---------- Price check: break-even and the price to grow on ----------
  // Staff wages + super for their hours, job materials and a share of overheads
  // (both per hour, from the last 90 days), then Jack's own time, a growth margin,
  // and the income tax that comes out of both.
  // Staff hours and Jack's hours are entered separately. Older quotes stored a
  // combined total (hrs) with Jack's share (own); convert those on the fly.
  function estOf(d){ var e=d.est||{}; if(e.staff==null&&e.hrs!==''&&e.hrs!=null){ e.staff=Math.max(0,(+e.hrs||0)-(+e.own||0)); delete e.hrs; d.est=e; } return e; }
  function dayKind(d){ var C=S.costs; if(!d) return 'wk'; if((C.ph||[]).indexOf(d)>=0) return 'ph'; var w=new Date(d+'T00:00:00').getDay(); return w===0?'sun':w===6?'sat':'wk'; }
  var KIND={wk:'weekday',sat:'Saturday',sun:'Sunday',ph:'public holiday'};
  function priceCalc(d,force){
    var C=S.costs, T=C.pricing||{}, e=estOf(d), own=+e.own||0, staff=+e.staff||0, hrs=staff+own;
    var kind=force||e.day||dayKind(d.serviceDate), rate=+C.rates[kind]||+C.rates.wk, ownerRate=T.ownerRate!=null?+T.ownerRate:+C.rates.wk;
    var labour=staff*rate*(1+C.superRate), mat=e.mat!==''&&e.mat!=null?+e.mat||0:hrs*(+C.matPerHr||0), oh=hrs*(+C.ohPerHr||0);
    var be=labour+mat+oh, you=own*ownerRate, m=(+T.margin||0)/100, t=(+T.tax||0)/100;
    var target=m<1?(be+you)/(1-m):be+you, grow=target-be-you;
    var t0=totals(d), ex=d.gst?t0.sub:(C.gstReg?t0.sub/1.1:t0.sub);
    var left=ex-be-you;
    return {hrs:hrs,own:own,staff:staff,kind:kind,rate:rate,ownerRate:ownerRate,labour:labour,mat:mat,oh:oh,be:be,you:you,target:target,grow:grow,
      taxYou:you*t, taxGrow:Math.max(0,grow)*t, m:m, t:t, ex:ex, left:left, nice:Math.ceil(target/5)*5};
  }
  function checkHtml(d){
    var C=S.costs, T=C.pricing||{}, e=estOf(d), h='<div class="hrow"><h2>Price <em>check</em></h2></div>';
    h+='<p class="sub" style="margin-top:-6px">Enter staff hours and your hours and it works out break-even and the price that pays you and grows the business.</p>';
    h+='<div class="grid3" style="margin-top:12px"><label class="l">Staff hours <small>all staff added up</small><input type="number" inputmode="decimal" step="0.5" min="0" data-est="staff" value="'+esc(e.staff||'')+'" placeholder="e.g. 2 × 6 = 12"></label>';
    h+='<label class="l">Your hours <small>on the job</small><input type="number" inputmode="decimal" step="0.5" min="0" data-est="own" value="'+esc(e.own||'')+'" placeholder="0"></label>';
    h+='<label class="l">Materials <small>$ ex GST</small><input type="number" inputmode="decimal" step="1" min="0" data-est="mat" value="'+esc(e.mat==null?'':e.mat)+'" placeholder="'+(C.matPerHr!=null?'auto':'0')+'"></label></div>';
    var auto=d.serviceDate?'From service date ('+KIND[dayKind(d.serviceDate)]+')':'From service date (none set: weekday)';
    h+='<label class="l" style="margin-top:10px">Staff pay rate<select data-est="day"><option value="">'+auto+'</option>'+['wk','sat','sun','ph'].map(function(k){ return '<option value="'+k+'"'+(e.day===k?' selected':'')+'>'+KIND[k].charAt(0).toUpperCase()+KIND[k].slice(1)+' · '+money(C.rates[k])+'/hr</option>'; }).join('')+'</select></label>';
    h+='<div id="pcout">'+checkOut(d)+'</div>';
    h+='<button type="button" class="ghost" data-act="targets" style="font-size:13px">Your targets: '+money(T.ownerRate!=null?T.ownerRate:C.rates.wk)+'/hr for you · '+(T.margin)+'% growth margin · '+T.tax+'% income tax. Change</button>';
    return h;
  }
  function checkOut(d){
    var C=S.costs, x=priceCalc(d), gst=C.gstReg?1.1:1;
    if(!x.hrs) return '<div class="hint-card" style="margin-top:12px">Add staff hours and/or your hours to see break-even.'+(C.hrs<20?' Your overhead rate needs more logged jobs and expenses to be reliable.':'')+'</div>';
    var h='<div class="totals pc">';
    if(x.staff>0) h+='<div><span>Staff wages + '+Math.round(C.superRate*100)+'% super <small>'+r1(x.staff)+' hrs at '+money(x.rate)+' '+KIND[x.kind]+'</small></span><span>'+money(x.labour)+'</span></div>';
    h+='<div><span>Materials <small>'+((d.est||{}).mat!=null&&(d.est||{}).mat!==''?'your figure':C.matPerHr!=null?money(C.matPerHr)+'/hr, your average':'none logged yet')+'</small></span><span>'+money(x.mat)+'</span></div>';
    h+='<div><span>Share of overheads <small>'+(C.ohPerHr!=null?r1(x.hrs)+' hrs at '+money(C.ohPerHr)+'/hr':'not enough data yet')+'</small></span><span>'+money(x.oh)+'</span></div>';
    h+='<div class="be"><span>Break-even <small>covers costs, pays you nothing</small></span><span>'+money(x.be)+'</span></div>';
    if(x.own>0) h+='<div><span>Your time <small>'+r1(x.own)+' hrs at '+money(x.ownerRate)+'</small></span><span>'+money(x.you)+'</span></div>';
    h+='<div><span>Growth margin <small>'+Math.round(x.m*100)+'% of price</small></span><span>'+money(x.grow)+'</span></div>';
    h+='<div class="g"><span>Price to grow'+(C.gstReg?' <small>ex GST</small>':'')+'</span><span>'+money(x.target)+'</span></div>';
    if(C.gstReg) h+='<div style="font-size:14px;color:var(--meta)"><span>Client pays inc GST</span><span>'+money(x.target*1.1)+'</span></div>';
    h+='</div>';
    h+='<p class="hint">Set aside about '+money(x.taxYou+x.taxGrow)+' of this for income tax ('+Math.round(x.t*100)+'% of your pay and the growth margin), leaving '+money(x.you-x.taxYou)+' for you and '+money(x.grow-x.taxGrow)+' to reinvest.'+(C.gstReg?' GST isn\'t yours, so it\'s left out of every figure above.':'')+' Overtime and travel aren\'t included.</p>';
    if(x.ex>0){
      var cls=x.ex<x.be-0.5?'bad':x.ex<x.target-0.5?'warn':'ok';
      var msg=cls==='bad'?'This quote is '+money(x.be-x.ex)+' under break-even. You lose money before paying yourself.'
        :cls==='warn'?'This quote covers costs'+(x.own>0?(x.left>=0?' and your time':' but pays you '+money(Math.max(0,x.ex-x.be))+' of '+money(x.you)+' for your time'):'')+', but is '+money(x.target-x.ex)+' short of the price to grow.'
        :'This quote clears the price to grow by '+money(x.ex-x.target)+'.';
      h+='<div class="verdict '+cls+'"><b>Your quote: '+money(x.ex)+(C.gstReg?' ex GST':'')+'</b><span>'+msg+'</span></div>';
    }
    if(x.staff>0){
      h+='<div class="byday"><span class="l">Price to grow by day'+(C.gstReg?' <small>ex GST</small>':'')+'</span><div>'+['wk','sat','sun','ph'].map(function(k){ var y=priceCalc(d,k); return '<button type="button" data-day="'+k+'" aria-pressed="'+(k===x.kind)+'"><small>'+(k==='wk'?'Weekday':k==='ph'?'Pub. hol':KIND[k].slice(0,3))+'</small><b>'+money(y.nice,0)+'</b>'+(k!=='wk'?'<i>+'+money(y.nice-priceCalc(d,'wk').nice,0)+'</i>':'<i>&nbsp;</i>')+'</button>'; }).join('')+'</div></div>';
    }
    h+='<button type="button" class="btn outline" style="width:100%;margin-top:10px" data-act="usetarget">Use '+money(x.nice)+(C.gstReg?' ex GST ('+money(x.nice*gst)+' inc)':'')+'</button>';
    return h;
  }
  function r1(v){ return Math.round(v*10)/10; }
  function redrawCheck(){ var el=document.getElementById('pcout'); if(el&&draft) el.innerHTML=checkOut(draft); }
  function useTarget(){
    var x=priceCalc(draft), others=0, idx=-1;
    draft.items.forEach(function(it,i){ if(idx<0&&(it.auto||draft.items.length===1)) idx=i; });
    if(idx<0&&!draft.items.length){ draft.items.push({title:draft.service,desc:'',qty:1,price:'',auto:true}); idx=0; }
    if(idx<0){ toast('Several items: adjust them to total '+money(x.nice)); return; }
    draft.items.forEach(function(it,i){ if(i!==idx) others+=(+it.qty||1)*(+it.price||0); });
    var q=+draft.items[idx].qty||1, p=r2((x.nice-others)/q);
    if(p<=0){ toast('Your other items already exceed that price'); return; }

    var notes=[].concat(rp.clashes,rp.dupes,rp.warnings);
    if(notes.length) h+='<div class="card"><h2>Worth <em>knowing</em></h2><ul style="margin:0;padding-left:18px">'+notes.map(function(x){return '<li style="margin-bottom:6px">'+esc(x)+'</li>';}).join('')+'</ul></div>';
    h+='<p class="hint">Left out: '+esc(rp.skipped.concat(rp.files.filter(function(f){return f.kind==='unknown';}).map(function(f){return f.name+' (not a Jobber report I know)';})).join('; ')||'nothing')+'. Jobber payments stay out of the Xero sync, so nothing is counted twice there.</p>';
    if(!IMP.done) h+='<div class="bar"><div class="in"><button class="btn outline" data-act="imp-reset">Start again</button><button class="btn primary grow" data-act="imp-go">Import</button></div></div>';
    else h+='<div class="acts"><button class="btn primary wide" data-go="list">See quotes &amp; invoices</button></div>';
    app.innerHTML=h;
  }
  function runImport(commit,btn){
    if(btn){ btn.disabled=true; btn.textContent='Importing…'; }
    return api('POST','/api/docs',{action:'jobber-import',files:IMP.files,commit:commit}).then(function(r){
      IMP.res=r; IMP.err=''; IMP.busy=false; if(commit){ IMP.done=true; return load(); } render();
    }).catch(function(x){ IMP.busy=false; if(btn){ btn.disabled=false; btn.textContent='Import'; toast(x.message); } else { IMP.res=null; IMP.err=x.message; render(); } });
  }
  document.addEventListener('change',function(e){
    if(e.target.id!=='impFiles') return;
    var fl=[].slice.call(e.target.files||[]); if(!fl.length) return;
    IMP={busy:true,files:[]}; render();
    Promise.all(fl.map(function(f){ return f.text().then(function(t){ return {name:f.name,text:t}; }); })).then(function(files){ IMP.files=files; return runImport(false); }).catch(function(){ IMP={err:'Couldn\'t read those files. Try again.'}; render(); });
  });

  function renderSettings(){
    var st=S.settings, b=st.biz, k=st.bank;
    function f(path,label,val,type,ph){ return '<label class="l">'+label+'<input data-s="'+path+'" '+(type?'type="'+type+'" inputmode="'+(type==='number'?'numeric':'text')+'"':'')+' value="'+esc(val)+'" placeholder="'+esc(ph||'')+'"></label>'; }
    var h=topbar('#/list')+'<h1>Business <em>details</em></h1>';
    h+='<div class="card"><h2>On every <em>document</em></h2><div class="grid">'+f('biz.name','Trading name',b.name)+f('biz.legal','Legal name',b.legal)+f('biz.abn','ABN',b.abn)+f('biz.phone','Phone (calls)',b.phone)+f('biz.sms','Text number (Mobile Message)',b.sms,'','0468 193 772')+'<div class="full">'+f('biz.address','Address',b.address)+'</div>'+f('biz.email','Email',b.email)+f('biz.web','Website',b.web)+'</div><label class="check"><input type="checkbox" data-s="gst"'+(st.gst?' checked':'')+'>Registered for GST (invoices say "Tax invoice" and add GST by default)</label></div>';
    h+='<div class="card"><h2>Bank <em>details</em></h2><p class="hint" style="margin-top:-6px">Shown on invoices so clients can pay by transfer, with the invoice number as the reference.</p><div class="grid"><div class="full">'+f('bank.name','Account name',k.name,'','Jack East')+'</div>'+f('bank.bsb','BSB',k.bsb,'','000-000')+f('bank.acct','Account number',k.acct)+'</div></div>';
    h+='<div class="card"><h2>Card <em>payments</em></h2>'+(S.card?'<div class="hint-card">On. Invoices show a Pay by card button through Stripe, and card payments are recorded here automatically.</div>':'<div class="hint-card"><b>Off.</b> To switch on: in Stripe, copy your secret key (Developers, API keys). In Netlify, open this site, then Site configuration, Environment variables, and add <b>STRIPE_SECRET_KEY</b> with that key. Redeploy, and the Pay by card button appears.</div>')+'</div>';
    h+='<div class="card"><h2>Numbers and <em>defaults</em></h2><div class="grid">'+f('nextQuote','Next quote number',st.nextQuote,'number')+f('nextInvoice','Next invoice number',st.nextInvoice,'number')+f('depositPct','Deposit to book (%)',st.depositPct,'number')+f('quoteValidDays','Quotes valid for (days)',st.quoteValidDays,'number')+'<div class="full">'+f('invoiceDueDays','Invoices due after (days, 0 = on receipt)',st.invoiceDueDays,'number')+'</div></div></div>';
    var bk=st.booking||{perDay:1,lead:2,weeks:6,sat:false};
    h+='<div class="card"><h2>Clients pick their <em>date</em></h2><p class="hint" style="margin-top:-6px">When a quote has no clean date, the client chooses from days that aren\'t full when they accept. It goes straight on the roster.</p><div class="grid">'+f('booking.perDay','Jobs you take per day',bk.perDay,'number')+f('booking.lead','Earliest, days from today',bk.lead,'number')+'<div class="full">'+f('booking.weeks','How many weeks ahead to offer',bk.weeks,'number')+'</div></div><label class="check"><input type="checkbox" data-s="booking.sat"'+(bk.sat?' checked':'')+'> Offer Saturdays</label></div>';
    h+='<div class="bar"><div class="in"><button class="btn primary grow" data-act="savesettings">Save details</button></div></div>';
    app.innerHTML=h;
  }

  // ---------- Events ----------
  app.addEventListener('input',function(e){
    var t=e.target;
    if(t.dataset.search!==undefined){ q=t.value; var rl=document.getElementById('rows'); var list=S.docs.filter(function(d){return d.kind===tab && match(d,filter) && (!q||(d.num+' '+d.client.name+' '+d.site+' '+d.suburb).toLowerCase().indexOf(q.toLowerCase())>=0);}); rl.innerHTML=rows(list); return; }
    if(t.tagName==='TEXTAREA'){ t.style.height='auto'; t.style.height=Math.min(t.scrollHeight+2,520)+'px'; }
    if(!draft) { if(t.dataset.p){ var pr=t.closest('.prow'), v=function(k){return +pr.querySelector('[data-p="'+k+'"]').value||0;}; pr.querySelector('[data-ex]').textContent='3 bed 2 bath: '+money(r2(v('base')+v('bed')*3+v('bath')*2))+' + GST'; } return; }
    if(t.dataset.est){ draft.est=draft.est||{}; draft.est[t.dataset.est]=t.value; dirty=true; redrawCheck(); return; }
    if(t.dataset.f){ var val=t.type==='checkbox'?t.checked:t.value; setPath(draft,t.dataset.f,val); dirty=true; if(t.dataset.f==='depositPct'||t.dataset.f==='gst') redrawTotals(); if(t.dataset.f==='serviceDate'){ var pc=document.getElementById('pcheck'); if(pc) pc.innerHTML=checkHtml(draft); } return; }
    if(t.dataset.it){ var card=t.closest('.item'), i=+card.dataset.i; draft.items[i][t.dataset.it]=t.value; if(t.dataset.it==='title'||t.dataset.it==='desc') delete draft.items[i].auto; dirty=true; if(t.dataset.it==='qty'||t.dataset.it==='price'){ card.querySelector('[data-lt]').textContent=money((+draft.items[i].qty||0)*(+draft.items[i].price||0)); redrawTotals(); } }
  });
  app.addEventListener('change',function(e){
    var t=e.target;
    if(t.dataset.pick){ pick(t.dataset.pick,t.value); return; }
    if(draft&&t.dataset.f==='service'){ renderEdit(); }
    if(draft&&t.type==='checkbox'&&t.dataset.f){ setPath(draft,t.dataset.f,t.checked); redrawTotals(); }
  });
  app.addEventListener('click',function(e){
    var el;
    if((el=e.target.closest('[data-open]'))){ go('doc/'+el.dataset.open); return; }
    if((el=e.target.closest('[data-go]'))){ go(el.dataset.go); return; }
    if((el=e.target.closest('[data-new]'))){ draft=null; go('edit/new-'+el.dataset.new); return; }
    if((el=e.target.closest('[data-req]'))){ go('req/'+el.dataset.req); return; }
    if((el=e.target.closest('[data-rqf]'))){ RQF=el.dataset.rqf; renderList(); return; }
    if((el=e.target.closest('[data-day]'))&&draft){ draft.est=draft.est||{}; draft.est.day=el.dataset.day; dirty=true; var pc=document.getElementById('pcheck'); if(pc) pc.innerHTML=checkHtml(draft); return; }
    if((el=e.target.closest('[data-tab]'))){ tab=el.dataset.tab; lsSet('money_tab',tab); filter='all'; q=''; renderList(); return; }
    if((el=e.target.closest('[data-filter]'))){ filter=el.dataset.filter; renderList(); return; }
    if((el=e.target.closest('[data-libedit]'))){ libEdit(el.dataset.libedit); return; }
    if((el=e.target.closest('[data-receipt]'))){ var rd=docById(route().id); if(rd) receiptSheet(rd,el.dataset.receipt); return; }
    if((el=e.target.closest('[data-unpay]'))){ if(!el.dataset.sure){ el.dataset.sure=1; el.textContent='Tap to confirm'; return; } api('POST','/api/docs',{action:'unpay',id:route().id,pid:el.dataset.unpay}).then(load).then(function(){toast('Payment removed');}); return; }
    var card=e.target.closest('.item');
    if(card&&draft){ var i=+card.dataset.i;
      if(e.target.closest('[data-rm]')){ draft.items.splice(i,1); dirty=true; redrawItems(); return; }
      if((el=e.target.closest('[data-mv]'))){ var j=i+(+el.dataset.mv), x=draft.items[i]; draft.items[i]=draft.items[j]; draft.items[j]=x; dirty=true; redrawItems(); return; }
      if(e.target.closest('[data-save-lib]')){ var it=draft.items[i]; if(!it.title){ toast('Give the item a name first'); return; } var n=JSON.parse(JSON.stringify(S.settings)); n.library.push({id:'l'+Date.now().toString(36),title:it.title,desc:it.desc,price:+it.price||0,service:''}); saveSettings(n,'Saved to library').catch(function(x){toast(x.message);}); return; }
    }
    if(!(el=e.target.closest('[data-act]'))) return;
    var a=el.dataset.act, d=docById(route().id);
    if(a==='usetarget'){ useTarget(); return; }
    if(a==='targets'){ targetsSheet(); return; }
    if(a==='refresh'){ load().then(function(){ toast('Up to date'); }); return; }
    if(a==='more'){ LIMIT+=200; render(); return; }
    if(a==='copyform'){ var fu=location.origin+'/quote'; (navigator.clipboard?navigator.clipboard.writeText(fu):Promise.reject()).then(function(){ toast('Link copied'); },function(){ prompt('Copy this link',fu); }); return; }
    var rq=route().v==='req'?reqById(route().id):null;
    if(rq&&a==='req-quote'){ quoteFromReq(rq); return; }
    if(rq&&a==='req-text'){ e.preventDefault(); var msg=(window.BCTpl&&BCTpl.get('lead_first')?BCTpl.fill(BCTpl.get('lead_first').text,BCTpl.varsFor({name:rq.name,service:rq.serviceLabel,suburb:rq.suburb})).text:reqText(rq)), mob=String(rq.phone||'').replace(/[^\d+]/g,'').replace(/^\+61/,'0').replace(/^61(?=4\d{8}$)/,'0');
      // With Mobile Message on, the conversation lives in Messages: open it with this text ready to send.
      if(BCSms.ready&&/^04\d{8}$/.test(mob)){ location.href='/messages/#/t/'+mob+'?name='+encodeURIComponent(rq.name||'')+'&draft='+encodeURIComponent(msg); return; }
      if(!BCSms.go(el,rq.phone,msg,key(),{ref:'req:'+rq.id,toast:toast})) location.href=el.href; return; }
    if(rq&&a==='req-archive'){ reqStatus(rq,'archived').then(function(){ toast('Archived'); go('list'); }); return; }
    if(rq&&a==='req-new'){ reqStatus(rq,'new').then(function(){ toast('Moved to new'); render(); }); return; }
    if(rq&&a==='req-delete'){ if(!el.dataset.sure){ el.dataset.sure=1; el.firstChild.nodeValue='Tap again to delete'; return; } api('POST','/api/request',{action:'delete',id:rq.id}).then(load).then(function(){ toast('Deleted'); go('list'); }); return; }
    if(a==='imp-go'){ runImport(true,el); return; }
    if(a==='imp-reset'){ IMP=null; render(); return; }
    if(a==='autofill'){ autofill(); return; }
    if(a==='fromlib'){ libSheet(); return; }
    if(a==='additem'){ draft.items.push({title:'',desc:'',qty:1,price:''}); dirty=true; redrawItems(); var all=app.querySelectorAll('.item'); var last=all[all.length-1]; if(last){ last.scrollIntoView({behavior:'smooth',block:'center'}); last.querySelector('input').focus(); } return; }
    if(a==='save'){ saveDraft(el); return; }
    if(a==='send'&&d){ sendSheet(d,false); return; }
    if(a==='remind'&&d){ sendSheet(d,true); return; }
    if(a==='paid'&&d){ paySheet(d); return; }
    if(a==='tojob'&&d){ jobSheetQ(d); return; }
    if(a==='confirm'&&d){ confirmSheet(d); return; }
    if(a==='copylink'&&d){ try{ navigator.clipboard.writeText(link(d)).then(function(){toast('Client link copied');}); }catch(x){ toast(link(d)); } return; }
    if(a==='mark-accepted'||a==='mark-declined'||a==='mark-sent'){ api('POST','/api/docs',{action:'status',id:d.id,status:a.slice(5)}).then(load).then(function(){ toast(a==='mark-accepted'?(d.serviceDate?'Accepted and added to the roster':'Marked accepted'):'Updated'); }).catch(function(x){toast(x.message);}); return; }
    if(a==='inv-full'||a==='inv-balance'){ el.disabled=true; api('POST','/api/docs',{action:'invoice',id:d.id,mode:a==='inv-balance'?'balance':'full'}).then(function(r){ return load().then(function(){ go('doc/'+r.id); toast('Invoice created as a draft. Check it, then send.'); }); }).catch(function(x){ el.disabled=false; toast(x.message); }); return; }
    if(a==='dup'||a==='dup-quote'){ api('POST','/api/docs',{action:'duplicate',id:d.id,kind:a==='dup-quote'?'quote':d.kind}).then(function(r){ return load().then(function(){ go('edit/'+r.id); toast('Copy made. Update it and save.'); }); }).catch(function(x){toast(x.message);}); return; }
    if(a==='del'){ if(!el.dataset.sure){ el.dataset.sure=1; el.firstChild.textContent='Tap again to delete for good'; return; } api('POST','/api/docs',{action:'delete',id:d.id}).then(load).then(function(){ go('list'); toast('Deleted'); }); return; }
    if(a==='saveprices'){ var n=JSON.parse(JSON.stringify(S.settings)); n.prices={}; Array.prototype.forEach.call(app.querySelectorAll('.prow'),function(p){ var o={}; ['base','bed','bath'].forEach(function(k){ o[k]=+p.querySelector('[data-p="'+k+'"]').value||0; }); o.hrs=p.querySelector('[data-p="hrs"]').value.trim(); n.prices[p.dataset.svc]=o; }); saveSettings(n,'Prices saved').catch(function(x){toast(x.message);}); return; }
    if(a==='saveterms'){ var n2=JSON.parse(JSON.stringify(S.settings)); n2.terms=document.getElementById('terms').value; saveSettings(n2,'Policies saved').catch(function(x){toast(x.message);}); return; }
    if(a==='savesettings'){ var n3=JSON.parse(JSON.stringify(S.settings)); Array.prototype.forEach.call(app.querySelectorAll('[data-s]'),function(i){ var p=i.dataset.s.split('.'); var v=i.type==='checkbox'?i.checked:(i.type==='number'?+i.value:i.value.trim()); if(p.length>1) n3[p[0]][p[1]]=v; else n3[p[0]]=v; }); el.disabled=true; saveSettings(n3,'Details saved').then(function(){ el.disabled=false; }).catch(function(x){ el.disabled=false; toast(x.message); }); return; }
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeSheet(); });
  window.addEventListener('beforeunload',function(e){ if(dirty){ e.preventDefault(); e.returnValue=''; } });

  load();
  setInterval(function(){ if(document.visibilityState==='visible'&&!draft&&!document.getElementById('scrim')&&route().v!=='settings'&&route().v!=='library') load(); },60000);
})();
</script>
</body></html>
