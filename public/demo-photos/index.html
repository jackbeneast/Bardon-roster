<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#F5F0EB">
<title>Website demo photos</title>
<link rel="icon" type="image/png" href="/icons/favicon.png?v=2"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--terracotta:#C06B3C;--terracotta-dark:#A55830;--dark:#1A1A1A;--cream:#F5F0EB;--cream-dark:#EDE6DE;--body:#4A4A4A;--meta:#7A7A7A;--gold:#F4B942;--white:#FFFFFF;--line:#DDD3C8;--tint:#FBF3EE;--ok:#2F5A35;--ok-bg:#E6EFE3;
  --serif:"Playfair Display",Georgia,serif;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--body);font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
#app{max-width:760px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(90px + env(safe-area-inset-bottom,0px))}
a{color:var(--terracotta-dark)}
button{font-family:var(--sans);cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--terracotta);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.top a{font:500 14px var(--sans);color:var(--meta);text-decoration:none;padding:10px 0}
.top .wm{display:flex;gap:8px;align-items:center;font:700 17px/1 var(--serif);color:var(--dark)}
.top .wm svg{width:26px;height:26px}
h1{font:700 28px/1.15 var(--serif);color:var(--dark);margin:6px 0 0}
h1 em,h2 em{font-style:italic;font-weight:500}
h2{font:700 20px/1.2 var(--serif);color:var(--dark);margin:28px 0 10px}
.sub{color:var(--meta);font-size:14px;margin:4px 0 0}
.note{margin-top:14px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--dark)}
.note b{font-weight:600}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.room{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px}
.room h3{margin:0 0 8px;font:600 15px/1.2 var(--sans);color:var(--dark)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slot{position:relative;aspect-ratio:4/3;border-radius:8px;border:1.5px dashed #C9BEB2;background:var(--cream);padding:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:flex-start;color:var(--meta);font:500 12px var(--sans);min-height:44px}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .lb{position:relative;z-index:1;margin:6px;background:rgba(26,26,26,.78);color:#fff;border-radius:999px;padding:4px 8px;font:600 10.5px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase}
.slot.empty .lb{background:transparent;color:var(--meta);letter-spacing:0;text-transform:none;font:500 12px var(--sans);padding:0}
.slot.filled{border-style:solid;border-color:transparent}
.slot[aria-pressed="true"]{outline:3px solid var(--terracotta);outline-offset:1px}
.clear{margin-top:6px;background:none;border:0;color:var(--meta);font:500 12.5px var(--sans);padding:6px 0;min-height:32px;text-decoration:underline}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--dark);color:var(--cream);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14.5px}
.bar button{background:none;border:1px solid #5A5550;color:var(--cream);border-radius:8px;min-height:40px;padding:0 14px;font:500 14px var(--sans)}
.job{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.jh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.jh b{display:block;font:600 15.5px/1.3 var(--sans);color:var(--dark)}
.jh span{font-size:13px;color:var(--meta)}
.use{background:var(--terracotta);color:#fff;border:0;border-radius:8px;min-height:40px;padding:0 14px;font:600 14px var(--sans)}
.jr{margin-top:12px}
.jr h4{margin:0 0 6px;font:600 12px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--meta)}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.ph{flex:none;position:relative;width:96px;height:72px;border-radius:8px;overflow:hidden;border:0;padding:0;background:var(--cream-dark)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .k{position:absolute;left:4px;bottom:4px;background:rgba(26,26,26,.78);color:#fff;border-radius:999px;padding:3px 6px;font:600 9.5px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase}
.ph.on{outline:3px solid var(--ok);outline-offset:-3px}
.empty{background:var(--white);border:1px dashed var(--line);border-radius:12px;padding:24px 16px;text-align:center;color:var(--meta);margin-top:10px}
.center{text-align:center;padding:60px 20px;color:var(--dark)}
.btn{font:600 15px/1 var(--sans);border-radius:8px;min-height:46px;padding:0 18px;border:0;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.primary{background:var(--terracotta);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--dark);color:var(--cream);padding:10px 16px;border-radius:999px;font:500 14px var(--sans);z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.2)}
</style></head><body>
<div id="app"><div class="center">Loading…</div></div>
<script>
(function(){
var LOGO='<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M5 21 L24 6 L43 21" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="square"/><text x="24" y="43" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-weight="700" font-size="25" fill="#1A1A1A">B</text></svg>';
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var app=document.getElementById('app'), D=null, err='', active=null; // active = {room, kind}
function key(){ try{ return localStorage.getItem('roster_admin_key')||''; }catch(e){ return ''; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(m){ var t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=m; document.body.appendChild(t); setTimeout(function(){t.remove();},2000); }
function thumb(x){ return '/api/photo?j='+encodeURIComponent(x.j)+'&p='+x.id+'&s=t'; }
function fday(s){ var p=s.split('-'); return +p[2]+' '+MON[+p[1]-1]+' '+p[0]; }
function api(method,body,qs){
  return fetch('/api/demo'+(qs||''),{method:method,headers:{'content-type':'application/json','x-admin-key':key()},body:body?JSON.stringify(body):undefined,cache:'no-store'})
    .then(function(r){ return r.json().catch(function(){return {};}).then(function(d){ if(!r.ok){ var e=new Error(d.error||'Something went wrong'); e.status=r.status; throw e; } return d; }); });
}
function save(msg){ return api('POST',{sel:D.sel}).then(function(d){ D.sel=d.sel; render(); toast(msg||'Saved'); }).catch(function(e){ toast(e.message); }); }
function isPicked(x){ var s=D.sel[x.room]; return !!(s&&s[x.kind]&&s[x.kind].id===x.id); }
function pickedAnywhere(x){ return D.rooms.some(function(r){ var s=D.sel[r]; return s&&((s.before&&s.before.id===x.id)||(s.after&&s.after.id===x.id)); }); }

function render(){
  if(err==='login'){ app.innerHTML='<div class="center">'+LOGO.replace('<svg','<svg style="width:48px;height:48px"')+'<h1 style="margin-top:12px">Log in <em>first</em></h1><p class="sub">Open the hub, log in with your password, then come back here.</p><p><a class="btn primary" href="/">Go to the hub</a></p></div>'; return; }
  if(err){ app.innerHTML='<div class="center">'+esc(err)+'</div>'; return; }
  if(!D){ return; }
  var filled=0; D.rooms.forEach(function(r){ var s=D.sel[r]||{}; if(s.before) filled++; if(s.after) filled++; });
  var h='<div class="top"><a href="/">← Hub</a><span class="wm">'+LOGO+'Bardon Clean</span><a href="/demo" target="_blank" rel="noopener" style="color:var(--terracotta-dark)">Open demo</a></div>';
  h+='<h1>Website demo <em>photos</em></h1><p class="sub">Pick a before and after for each room. They show on the public demo your website links to. '+filled+' of '+(D.rooms.length*2)+' chosen.</p>';
  h+='<div class="note"><b>Anyone can see these.</b> Skip photos that show family photos, mail, the street number, number plates or anything personal.</div>';

  h+='<h2>On the <em>demo</em></h2><div class="slots">';
  D.rooms.forEach(function(r){ var s=D.sel[r]||{};
    h+='<div class="room"><h3>'+esc(r)+'</h3><div class="pair">';
    ['before','after'].forEach(function(k){ var x=s[k], on=active&&active.room===r&&active.kind===k;
      h+='<button type="button" class="slot '+(x?'filled':'empty')+'" data-slot="'+esc(r)+'|'+k+'" aria-pressed="'+on+'" aria-label="'+esc(r)+' '+k+(x?', chosen. Tap to change':', tap to choose')+'">'+(x?'<img alt="" loading="lazy" src="'+thumb(x)+'"><span class="lb">'+(k==='before'?'Before':'After')+'</span>':'<span class="lb">'+(k==='before'?'Before':'After')+(on?' · now pick':' · tap to choose')+'</span>')+'</button>'; });
    h+='</div>'+((s.before||s.after)?'<button type="button" class="clear" data-clear="'+esc(r)+'">Clear '+esc(r.toLowerCase())+'</button>':'')+'</div>'; });
  h+='</div>';

  h+='<h2>Your job <em>photos</em></h2>';
  if(!D.jobs.length) h+='<div class="empty">No sorted before and after photos on the roster yet. Photos show here once the team sorts them into rooms on a job.</div>';
  D.jobs.forEach(function(j){
    var rooms={}; j.photos.forEach(function(x){ (rooms[x.room]||(rooms[x.room]=[])).push(x); });
    var useful=D.rooms.filter(function(r){ return rooms[r]; }).length;
    h+='<div class="job"><div class="jh"><div><b>'+esc([j.suburb,j.service].filter(Boolean).join(' · ')||'Job')+'</b><span>'+fday(j.date)+(j.client?' · '+esc(j.client):'')+' · '+j.photos.length+' photos</span></div>'+(useful?'<button type="button" class="use" data-use="'+esc(j.key)+'">Use this job</button>':'')+'</div>';
    Object.keys(rooms).sort(function(a,b){ return (D.rooms.indexOf(a)+99)%99-(D.rooms.indexOf(b)+99)%99; }).forEach(function(r){
      var list=rooms[r].slice().sort(function(a,b){ return a.kind===b.kind?0:a.kind==='before'?-1:1; });
      h+='<div class="jr"><h4>'+esc(r)+(D.rooms.indexOf(r)<0?' · not on the demo':'')+'</h4><div class="strip">'+list.map(function(x){
        return '<button type="button" class="ph'+(pickedAnywhere(x)?' on':'')+'" data-ph="'+esc(j.key)+'|'+x.id+'" aria-label="'+esc(r)+' '+x.kind+'"><img alt="" loading="lazy" src="'+thumb(x)+'"><span class="k">'+(x.kind==='before'?'Before':'After')+'</span></button>'; }).join('')+'</div></div>'; });
    h+='</div>';
  });
  if(active) h+='<div class="bar" role="status"><span>Choosing <b>'+esc(active.room)+' · '+(active.kind==='before'?'Before':'After')+'</b>. Tap a photo below.</span><button type="button" data-cancel>Cancel</button></div>';
  app.innerHTML=h;
}
function findPhoto(jk,id){ var j=D.jobs.find(function(x){return x.key===jk;}); return j&&j.photos.find(function(x){return x.id===id;}); }

app.addEventListener('click',function(e){
  var t;
  if((t=e.target.closest('[data-slot]'))){ var p=t.dataset.slot.split('|'); active=(active&&active.room===p[0]&&active.kind===p[1])?null:{room:p[0],kind:p[1]}; render();
    if(active){ var jl=app.querySelector('.job'); if(jl) jl.scrollIntoView({behavior:'smooth',block:'start'}); } return; }
  if(e.target.closest('[data-cancel]')){ active=null; render(); return; }
  if((t=e.target.closest('[data-clear]'))){ delete D.sel[t.dataset.clear]; save('Cleared'); return; }
  if((t=e.target.closest('[data-use]'))){
    var j=D.jobs.find(function(x){return x.key===t.dataset.use;}), n=0;
    D.rooms.forEach(function(r){ ['before','after'].forEach(function(k){ var x=j.photos.find(function(p){return p.room===r&&p.kind===k;}); if(x){ (D.sel[r]||(D.sel[r]={}))[k]={j:x.j,id:x.id}; n++; } }); });
    active=null; save(n+' photo'+(n===1?'':'s')+' added from this job'); window.scrollTo({top:0,behavior:'smooth'}); return; }
  if((t=e.target.closest('[data-ph]'))){
    var q=t.dataset.ph.split('|'), x=findPhoto(q[0],q[1]); if(!x) return;
    var room=active?active.room:x.room, kind=active?active.kind:x.kind;
    if(D.rooms.indexOf(room)<0){ toast('Tap a slot up top first, then this photo'); return; }
    (D.sel[room]||(D.sel[room]={}))[kind]={j:x.j,id:x.id};
    active=null; save(room+' · '+(kind==='before'?'Before':'After')+' set'); return; }
});

if(!key()){ err='login'; render(); }
else api('GET',null,'?pick=1').then(function(d){ D=d; render(); }).catch(function(e){ err=e.status===401?'login':e.message; render(); });
})();
</script>
</body></html>
