<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#F5F0EB">
<title>Website photos</title>
<link rel="icon" type="image/png" href="/icons/favicon.png?v=2"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--terracotta:#C06B3C;--terracotta-dark:#A55830;--dark:#1A1A1A;--cream:#F5F0EB;--cream-dark:#EDE6DE;--body:#4A4A4A;--meta:#7A7A7A;--gold:#F4B942;--white:#FFFFFF;--line:#DDD3C8;--ok:#2F5A35;
  --serif:"Playfair Display",Georgia,serif;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--body);font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
#app{max-width:760px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(60px + env(safe-area-inset-bottom,0px))}
a{color:var(--terracotta-dark)}
button{font-family:var(--sans);cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--terracotta);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.top a{font:500 14px var(--sans);color:var(--meta);text-decoration:none;padding:10px 0}
.top .wm{display:flex;gap:8px;align-items:center;font:700 17px/1 var(--serif);color:var(--dark)}
.top .wm svg{width:26px;height:26px}
h1{font:700 28px/1.15 var(--serif);color:var(--dark);margin:6px 0 0}
h1 em,h2 em{font-style:italic;font-weight:500}
h2{font:700 20px/1.2 var(--serif);color:var(--dark);margin:28px 0 10px}
.sub{color:var(--meta);font-size:14px;margin:4px 0 0}
.auto{margin-top:14px;background:var(--dark);color:var(--cream);border-radius:12px;padding:16px;display:grid;gap:10px}
.auto p{margin:0;font-size:14px;color:#CFC6BC}
.auto b{color:var(--cream);font-weight:600}
.auto .go{background:var(--terracotta);color:#fff;border:0;border-radius:8px;min-height:48px;font:600 15.5px var(--sans)}
.auto .go:disabled{opacity:.6}
.prog{height:6px;border-radius:3px;background:#3A3A3A;overflow:hidden}.prog i{display:block;height:100%;background:var(--gold);transition:width .2s}
.note{margin-top:12px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;color:var(--dark)}
.note b{font-weight:600}
.picked{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.picked{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card .im{position:relative;aspect-ratio:4/3;background:var(--cream-dark)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .n{position:absolute;left:8px;top:8px;background:var(--dark);color:var(--cream);border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font:600 12px var(--sans);padding:0 7px}
.card .x{position:absolute;right:6px;top:6px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(26,26,26,.8);color:#fff;font:500 20px/1 var(--sans)}
.card .meta{padding:8px 10px 10px}
.card .meta b{display:block;font:600 13.5px/1.3 var(--sans);color:var(--dark)}
.card .meta span{font-size:12px;color:var(--ok)}
.job{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.job b{display:block;font:600 15px/1.3 var(--sans);color:var(--dark)}
.job .d{font-size:13px;color:var(--meta)}
.strip{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;-webkit-overflow-scrolling:touch}
.ph{flex:none;position:relative;width:104px;height:78px;border-radius:8px;overflow:hidden;border:0;padding:0;background:var(--cream-dark)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .k{position:absolute;left:4px;bottom:4px;background:rgba(26,26,26,.78);color:#fff;border-radius:999px;padding:3px 6px;font:600 9.5px/1 var(--sans)}
.ph.on{outline:3px solid var(--ok);outline-offset:-3px}
.ph.hid img{opacity:.25;filter:grayscale(1)}
.ph.hid:after{content:"Hidden";position:absolute;inset:0;display:grid;place-items:center;font:600 12px var(--sans);color:var(--dark)}
.cands{display:grid;gap:8px;margin-top:12px}
.cand{display:grid;gap:4px;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--cream);padding:10px;font:inherit;color:inherit;cursor:pointer}
.cand b{color:var(--dark)}.cand span{font-size:13px;color:var(--meta)}
.cand .cimg{display:flex;gap:4px}.cand img{width:72px;height:54px;object-fit:cover;border-radius:6px}
.ph.on:after{content:"✓";position:absolute;right:4px;top:4px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;font:600 12px/20px var(--sans);text-align:center}
.where{display:grid;gap:8px}
.spot{display:flex;gap:12px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:8px}
.spot .im{position:relative;flex:none;width:112px;height:78px;border-radius:8px;overflow:hidden;background:var(--cream-dark);display:grid;place-items:center;text-align:center;font:500 11px/1.3 var(--sans);color:var(--meta);padding:4px}
.spot .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.spot .tx{flex:1;min-width:0}
.spot .tx b{display:block;font:600 14px/1.3 var(--sans);color:var(--dark)}
.spot .tx span{display:block;font-size:12.5px;color:var(--meta)}
.spot .tx span.ok{color:var(--ok)}
.spot .acts{display:flex;flex-direction:column;gap:6px;flex:none}
.sm{min-height:36px;padding:0 12px;border-radius:8px;border:1.5px solid var(--terracotta);background:transparent;color:var(--terracotta-dark);font:600 13px var(--sans)}
.sm.ghost{border-color:var(--line);color:var(--meta)}
.pg{font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--meta);margin:14px 0 2px}
.uses{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.uses i{font:600 11px/1 var(--sans);font-style:normal;padding:4px 7px;border-radius:999px;background:var(--cream-dark);color:var(--dark)}
.uses i.big{background:var(--dark);color:var(--cream)}
.uses i.off{background:transparent;border:1px dashed var(--line);color:var(--meta)}
.pill{display:inline-block;font:600 11px/1 var(--sans);padding:4px 8px;border-radius:999px;background:#FBF3EE;color:var(--terracotta-dark);vertical-align:middle;margin-left:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px}
.chips button{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--white);color:var(--dark);font:500 13.5px var(--sans)}
.chips button[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:var(--cream)}
.pick{position:sticky;top:0;z-index:20;margin:0 -16px;padding:10px 16px;background:var(--terracotta);color:#fff;display:flex;gap:10px;align-items:center;justify-content:space-between;font:600 14px/1.3 var(--sans)}
.pick button{flex:none;min-height:36px;padding:0 12px;border-radius:8px;border:1.5px solid #fff;background:transparent;color:#fff;font:600 13px var(--sans)}
.more{width:100%;margin-top:10px;min-height:46px;border-radius:8px;border:1.5px solid var(--line);background:var(--white);color:var(--dark);font:600 14.5px var(--sans)}
.empty{background:var(--white);border:1px dashed var(--line);border-radius:12px;padding:24px 16px;text-align:center;color:var(--meta);margin-top:10px}
.center{text-align:center;padding:60px 20px;color:var(--dark)}
.btn{font:600 15px/1 var(--sans);border-radius:8px;min-height:46px;padding:0 18px;border:0;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.primary{background:var(--terracotta);color:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--dark);color:var(--cream);padding:10px 16px;border-radius:999px;font:500 14px var(--sans);z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.2)}
</style></head><body>
<div id="app"><div class="center">Loading…</div></div>
<script>
(function(){
var LOGO='<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M5 21 L24 6 L43 21" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="square"/><text x="24" y="43" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-weight="700" font-size="25" fill="#1A1A1A">B</text></svg>';
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var TARGET=8;
var app=document.getElementById('app'), D=null, err='', busy=null, why={}, target=null, filt='all', shown=15, showPick='';
var SHOW=[['presale','Pre-sale','/demo and the agent portal'],['bond','Bond','/demo/rent'],['deep','Deep','the agent portal\'s live listing']];
var DEMO_ROOMS=['Kitchen','Bathrooms','Bedrooms','Living & dining','Laundry','Windows & tracks'];
function svcOf(s){ s=String(s||''); return /pre.?sale/i.test(s)?'presale':/bond|lease|move/i.test(s)?'bond':/deep/i.test(s)?'deep':'other'; }
function key(){ try{ return localStorage.getItem('roster_admin_key')||''; }catch(e){ return ''; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(m){ var t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=m; document.body.appendChild(t); setTimeout(function(){t.remove();},2200); }
function thumb(x){ return '/api/photo?j='+encodeURIComponent(x.j)+'&p='+x.id+'&s=t'; }
function fday(s){ var p=s.split('-'); return +p[2]+' '+MON[+p[1]-1]+' '+p[0]; }
function api(method,body,qs){
  return fetch('/api/demo'+(qs||''),{method:method,headers:{'content-type':'application/json','x-admin-key':key()},body:body?JSON.stringify(body):undefined,cache:'no-store'})
    .then(function(r){ return r.json().catch(function(){return {};}).then(function(d){ if(!r.ok){ var e=new Error(d.error||'Something went wrong'); e.status=r.status; throw e; } return d; }); });
}
function save(msg){ return api('POST',{afters:D.afters,slots:D.slots,show:D.show}).then(function(d){ D.afters=d.afters; D.slots=d.slots||{}; D.show=d.show||{}; render(); if(msg) toast(msg); }).catch(function(e){ toast(e.message); }); }
// Sample reports: a real job's sorted photos (team-sorted only, never guesses)
function sortedOf(j){ return j.photos.filter(function(x){ return x.room&&x.kind; }); }
function pairsOf(j){ var r={}; sortedOf(j).forEach(function(x){ (r[x.room]=r[x.room]||{})[x.kind]=1; }); return Object.keys(r).filter(function(k){ return r[k].before&&r[k].after; }).length; }
function showHtml(){
  var h='<h2>Sample <em>reports</em></h2><p class="sub">Pick a real finished job to be the sample report people see in the demo: its before and after photos, room by room, and the checks the team ticked. The address and client name are never shown. Tap a photo to hide it.</p>';
  h+='<div class="note"><b>Check every photo.</b> Befores show the home as it was. Hide anything with family photos, faces, mail, the street number or number plates.</div>';
  SHOW.forEach(function(k){ var sel=D.show[k[0]], j=sel&&D.jobs.find(function(x){ return x.key===sel.key; });
    h+='<div class="job"><b>'+k[1]+' sample</b><span class="d">Shows on '+k[2]+'</span>';
    if(j){ var ph=sortedOf(j), hid={}; (sel.hide||[]).forEach(function(id){ hid[id]=1; });
      var vis=ph.filter(function(x){ return !hid[x.id]; });
      h+='<p class="sub" style="margin:8px 0 0">'+esc([j.suburb,j.service].filter(Boolean).join(' · '))+' · '+fday(j.date)+' · '+vis.filter(function(x){return x.kind==='before';}).length+' before, '+vis.filter(function(x){return x.kind==='after';}).length+' after'+(ph.length-vis.length?' · '+(ph.length-vis.length)+' hidden':'')+'</p>';
      h+='<div class="strip">'+ph.map(function(x){ return '<button type="button" class="ph'+(hid[x.id]?' hid':'')+'" data-hide="'+k[0]+'|'+x.id+'" aria-pressed="'+!hid[x.id]+'" aria-label="'+esc(x.room+', '+x.kind+(hid[x.id]?', hidden':''))+'"><img alt="" loading="lazy" src="'+thumb(x)+'"><span class="k">'+esc(x.room)+' · '+(x.kind==='before'?'B':'A')+'</span></button>'; }).join('')+'</div>';
      h+='<div style="display:flex;gap:8px;margin-top:10px"><button type="button" class="sm" data-showpick="'+k[0]+'">Change job</button><button type="button" class="sm ghost" data-showrm="'+k[0]+'">Remove</button></div>';
    } else h+='<div style="margin-top:10px"><button type="button" class="sm" data-showpick="'+k[0]+'">Choose a job</button></div>';
    if(showPick===k[0]){
      var cands=D.jobs.filter(function(x){ return svcOf(x.service)===k[0] && pairsOf(x); }).sort(function(a,b){ return pairsOf(b)-pairsOf(a) || b.date.localeCompare(a.date); });
      if(!cands.length) h+='<p class="sub" style="margin-top:10px">No '+k[1].toLowerCase()+' jobs with sorted before and after photos of the same room yet.</p>';
      else h+='<div class="cands">'+cands.slice(0,12).map(function(x){ var so=sortedOf(x); return '<button type="button" class="cand" data-showset="'+k[0]+'|'+esc(x.key)+'"><span class="cimg">'+so.filter(function(q){return q.kind==='after';}).slice(0,3).map(function(q){ return '<img alt="" loading="lazy" src="'+thumb(q)+'">'; }).join('')+'</span><b>'+esc([x.suburb,fday(x.date)].filter(Boolean).join(' · '))+'</b><span>'+pairsOf(x)+' room'+(pairsOf(x)===1?'':'s')+' with before and after · '+so.length+' photos'+(x.client?' · '+esc(x.client):'')+'</span></button>'; }).join('')+'</div>';
    }
    h+='</div>';
  });
  return h;
}
function isOn(id){ if(target&&target!=='gallery'){ var a=D.slots[target]; return !!(a&&a.id===id); } return D.afters.some(function(a){ return a.id===id; }); }
// A photo the team sorted keeps its room and before/after. An unsorted one uses Claude's guess,
// unless it was unsure or the photo looked private.
function eff(x){
  if(x.room&&x.kind) return x;
  var g=D.guess[x.id]; if(!g||g.priv||g.kind!=='after') return null;
  return {room:g.room||'',kind:'after',j:x.j,id:x.id,at:x.at,auto:true};
}
function aftersOf(j){ return j.photos.map(eff).filter(function(x){ return x&&x.kind==='after'; }); }
function rated(x){ return D.rate[x.id]; }
// Where each gallery photo appears: the homepage gallery shows the first 3, 5 or 7; the demo job link gives
// each of its rooms a photo from that room, then fills empty rooms with what's left (same rules as /demo).
function usesOf(list){
  var n=list.length>=7?7:list.length>=5?5:list.length>=3?3:0, out=list.map(function(){ return []; }), used={};
  list.forEach(function(a,i){ if(i<n) out[i].push(i===0?['big','Gallery · large']:['','Gallery #'+(i+1)]); });
  DEMO_ROOMS.forEach(function(r){ for(var i=0;i<list.length;i++) if(!used[i]&&list[i].room===r){ used[i]=r; return; } });
  DEMO_ROOMS.forEach(function(r){ var have=false; for(var k in used) if(used[k]===r) have=true; if(have) return; for(var i=0;i<list.length;i++) if(!used[i]){ used[i]=r; return; } });
  Object.keys(used).forEach(function(i){ out[i].push(['','Demo · '+used[i]]); });
  out.forEach(function(u){ if(!u.length) u.push(['off','Spare, not shown']); });
  return out;
}
function spotOf(id){ return D.spots.find(function(x){ return x.id===id; }); }

function render(){
  if(err==='login'){ app.innerHTML='<div class="center">'+LOGO.replace('<svg','<svg style="width:48px;height:48px"')+'<h1 style="margin-top:12px">Log in <em>first</em></h1><p class="sub">Open the hub, log in with your password, then come back here.</p><p><a class="btn primary" href="/">Go to the hub</a></p></div>'; return; }
  if(err){ app.innerHTML='<div class="center">'+esc(err)+'</div>'; return; }
  if(!D) return;
  var total=D.jobs.reduce(function(n,j){ return n+aftersOf(j).length; },0), unsorted=D.jobs.reduce(function(n,j){ return n+j.photos.filter(function(x){ return !x.room&&!D.guess[x.id]; }).length; },0);
  var h='<div class="top"><a href="/">← Hub</a><span class="wm">'+LOGO+'Bardon Clean</span><a href="/demo" target="_blank" rel="noopener" style="color:var(--terracotta-dark)">Open demo</a></div>';
  var njobs=D.jobs.filter(function(j){ return aftersOf(j).length; }).length;
  if(target) h+='<div class="pick"><span>Tap a photo below for: '+esc(target==='gallery'?'the homepage gallery':spotOf(target).page+' · '+spotOf(target).spot)+'</span><button type="button" data-cancel>Cancel</button></div>';
  h+='<h1>Website &amp; demo <em>photos</em></h1><p class="sub">Your best after photos from all '+D.jobs.length+' jobs on the roster, and exactly where each one shows on bardonclean.au.</p>';
  h+='<div class="auto">';
  if(busy) h+='<p><b>'+(busy.phase==='sort'?'Sorting '+busy.total+' photos the team didn\'t sort…':busy.phase==='rate'?'Claude is rating '+busy.total+' after photos…':'Looking through '+busy.total+' after photos…')+'</b> '+(busy.phase==='rate'?'Judging how well each shows off the clean, and leaving out anything private.':busy.phase==='sort'?'Finding the after shots among them.':'Checking sharpness, light and framing.')+'</p><div class="prog"><i style="width:'+Math.round(busy.done/Math.max(1,busy.total)*100)+'%"></i></div>';
  else h+='<p><b>Let the hub choose.</b> '+(D.ai?'It looks through the after shots from every job (sorting any the team didn\'t), checks sharpness and light, then has Claude rate the strongest for how well they show off the clean and leave out anything private.':'It scores every after photo for sharpness, good light and landscape framing.')+' It skips near-duplicates, mixes rooms and jobs, keeps the best '+TARGET+' for the gallery and puts the best fit in every page spot below (it won\'t touch spots you chose yourself).</p><button type="button" class="go" data-auto'+(total||unsorted?'':' disabled')+'>'+(D.afters.length?'Pick my best afters again':'Pick my best afters')+'</button>';
  h+='</div>';
  h+='<div class="note"><b>Give them a quick look.</b> These are public. '+(D.ai?'Claude leaves out photos showing family photos, faces, mail, the street number or number plates, but it can miss things.':'The hub judges light and sharpness, not privacy, so remove anything showing family photos, mail, the street number or number plates.')+'</div>';

  // 1. Single-photo spots, page by page
  h+='<h2>Page by <em>page</em></h2><p class="sub">One photo for each spot. Empty spots keep the photo the website has now.</p><div class="where">';
  var lastPg='';
  D.spots.forEach(function(sp){ var a=D.slots[sp.id];
    if(sp.page!==lastPg){ h+='<div class="pg">'+esc(sp.page)+'</div>'; lastPg=sp.page; }
    h+='<div class="spot"><div class="im">'+(a?'<img alt="" loading="lazy" src="'+thumb(a)+'">':'Current website photo')+'</div><div class="tx"><b>'+esc(sp.spot)+'</b>'+
      (a?'<span>'+esc(a.room||'After')+(a.service?' · '+esc(a.service.replace(/ clean$/i,'')):'')+'</span><span class="ok">'+(a.man?'Your pick':'Picked by the hub')+'</span>':'<span>Best: '+esc(sp.room)+(sp.svc?', '+({presale:'pre-sale',bond:'bond',deep:'deep'})[sp.svc]+' job':'')+'</span>')+
      '</div><div class="acts"><button type="button" class="sm" data-set="'+sp.id+'">'+(a?'Change':'Choose')+'</button>'+(a?'<button type="button" class="sm ghost" data-clr="'+sp.id+'" aria-label="Go back to the current website photo">Reset</button>':'')+'</div></div>'; });
  h+='</div>';

  // 2. Gallery + demo link
  h+='<h2>Gallery &amp; <em>demo link</em> <span style="font:500 14px var(--sans);color:var(--meta)">'+D.afters.length+'</span></h2><p class="sub">The homepage “Handed back like this” gallery <span class="pill">Not live yet</span> and the <a href="/demo" target="_blank" rel="noopener">sample job link</a>. Each photo shows where it appears.</p>';
  if(!D.afters.length) h+='<div class="empty">'+(total?'Nothing chosen yet. Tap the button above, or tap photos below to add them.':'No after photos on the roster yet. They appear here once the team adds after photos to a job.')+'</div>';
  else { var U=usesOf(D.afters); h+='<div class="picked" style="margin-top:10px">'; D.afters.forEach(function(a,i){
    h+='<div class="card"><div class="im"><img alt="" loading="lazy" src="'+thumb(a)+'"><span class="n">'+(i+1)+'</span><button type="button" class="x" data-rm="'+a.id+'" aria-label="Remove photo '+(i+1)+'">×</button></div><div class="meta"><b>'+esc(a.room||'After')+(a.service?' · '+esc(a.service.replace(/ clean$/i,'')):'')+'</b>'+(rated(a)?'<span>Claude '+rated(a).r+'/5</span>':why[a.id]?'<span>'+esc(why[a.id])+'</span>':'')+
      '<div class="uses">'+U[i].map(function(u){ return '<i class="'+u[0]+'">'+esc(u[1])+'</i>'; }).join('')+'</div></div></div>'; });
    h+='</div><p class="sub" style="margin-top:8px">Number 1 is the large gallery photo. Tap × to remove one'+(D.afters.length<12?', or <button type="button" class="sm" data-set="gallery" style="min-height:30px">Add a photo</button>':'')+'</p>'; }

  h+=showHtml();

  // 3. Every job's afters
  var cnt={all:0,presale:0,bond:0,deep:0,other:0}, list=D.jobs.filter(function(j){ if(!aftersOf(j).length) return false; cnt.all++; cnt[svcOf(j.service)]++; return filt==='all'||svcOf(j.service)===filt; });
  h+='<h2>All your <em>afters</em> <span style="font:500 14px var(--sans);color:var(--meta)">'+njobs+' job'+(njobs===1?'':'s')+'</span></h2>';
  h+='<div class="chips">'+[['all','All'],['presale','Pre-sale'],['bond','Bond'],['deep','Deep'],['other','Other']].filter(function(c){ return c[0]==='all'||cnt[c[0]]; }).map(function(c){ return '<button type="button" data-filt="'+c[0]+'" aria-pressed="'+(filt===c[0])+'">'+c[1]+' '+cnt[c[0]]+'</button>'; }).join('')+'</div>';
  list.slice(0,shown).forEach(function(j){ var af=aftersOf(j);
    h+='<div class="job"><b>'+esc([j.suburb,j.service].filter(Boolean).join(' · ')||'Job')+'</b><span class="d">'+fday(j.date)+(j.client?' · '+esc(j.client):'')+' · '+af.length+' after'+(af.length===1?'':'s')+'</span><div class="strip">'+
      af.map(function(x){ return '<button type="button" class="ph'+(isOn(x.id)?' on':'')+'" data-ph="'+esc(j.key)+'|'+x.id+'" aria-pressed="'+isOn(x.id)+'" aria-label="'+esc(x.room||'After photo')+'"><img alt="" loading="lazy" src="'+thumb(x)+'">'+(x.room||rated(x)?'<span class="k">'+esc(x.room||'After')+(rated(x)?' · '+rated(x).r+'/5':'')+'</span>':'')+'</button>'; }).join('')+'</div></div>';
  });
  if(list.length>shown) h+='<button type="button" class="more" data-more>Show more jobs ('+(list.length-shown)+' more)</button>';
  app.innerHTML=h;
}

// ---- automatic picking ----
// Each thumbnail is shrunk on a canvas and measured for brightness, contrast, colour,
// sharpness and a small layout fingerprint (to spot near-identical shots).
function loadImg(src){ return new Promise(function(res){ var im=new Image(); im.onload=function(){ res(im); }; im.onerror=function(){ res(null); }; im.src=src; }); }
function measure(im){
  var W=160, H=120, c=document.createElement('canvas'); c.width=W; c.height=H;
  var cx=c.getContext('2d',{willReadFrequently:true}); cx.drawImage(im,0,0,W,H);
  var d=cx.getImageData(0,0,W,H).data, g=new Float32Array(W*H), sum=0, sq=0, sat=0, i;
  for(i=0;i<W*H;i++){ var r=d[i*4], gg=d[i*4+1], b=d[i*4+2], v=(0.299*r+0.587*gg+0.114*b)/255; g[i]=v; sum+=v; sq+=v*v; sat+=(Math.max(r,gg,b)-Math.min(r,gg,b))/255; }
  var lum=sum/(W*H), std=Math.sqrt(Math.max(0,sq/(W*H)-lum*lum)), lap=0;
  for(var y=1;y<H-1;y++) for(var x=1;x<W-1;x++){ i=y*W+x; lap+=Math.abs(4*g[i]-g[i-1]-g[i+1]-g[i-W]-g[i+W]); }
  var fp=new Float32Array(32*24), m=0, s2=0;
  for(var by=0;by<24;by++) for(var bx=0;bx<32;bx++){ var a=0; for(var yy=0;yy<5;yy++) for(var xx=0;xx<5;xx++) a+=g[(by*5+yy)*W+bx*5+xx]; fp[by*32+bx]=a/25; m+=a/25; }
  m/=fp.length; for(i=0;i<fp.length;i++){ fp[i]-=m; s2+=fp[i]*fp[i]; } s2=Math.sqrt(s2)||1; for(i=0;i<fp.length;i++) fp[i]/=s2;
  return { lum:lum, std:std, sat:sat/(W*H), sharp:lap/((W-2)*(H-2)), fp:fp, land:im.naturalWidth>=im.naturalHeight };
}
function corr(a,b){ var s=0; for(var i=0;i<a.length;i++) s+=a[i]*b[i]; return s; }
function exposure(l){ return Math.max(0,1-Math.abs(l-0.6)/0.38); }
function rank(list,key){ var v=list.map(function(x){return x.f[key];}).sort(function(a,b){return a-b;}); list.forEach(function(x){ x[key+'R']=v.indexOf(x.f[key])/Math.max(1,v.length-1); }); }
function reason(x){ var b=[]; if(x.sharpR>0.66) b.push('sharp'); if(exposure(x.f.lum)>0.75) b.push('well lit'); if(x.f.land) b.push('landscape'); if(x.stdR>0.66) b.push('strong contrast');
  return b.length?b.join(' · ').replace(/^./,function(c){return c.toUpperCase();}):'Good all-round'; }
var JOBS=100000, PERJOB=60; // every job on the roster
// Runs calls three at a time with a progress bar; stops queueing new ones after an error.
function runCalls(phase,calls,total,done){
  if(!calls.length) return done('');
  busy={phase:phase,done:0,total:total}; render();
  var i=0, running=0, failed='';
  function pump(){
    if(running===0&&(failed||i>=calls.length)) return done(failed);
    while(!failed&&running<3&&i<calls.length){ (function(c){ running++;
      c.run().catch(function(e){ failed=e.message||'Something went wrong'; if(e.status===503) D.ai=false; })
        .then(function(){ running--; busy.done+=c.n; render(); pump(); }); })(calls[i++]); }
  }
  pump();
}
function batch(items,size){ var out=[]; items.forEach(function(it){ var last=out[out.length-1]; if(last&&last.job===it.job&&last.items.length<size) last.items.push(it.x); else out.push({job:it.job,items:[it.x]}); }); return out; }
function hhmm(s){ var d=new Date(s); return isNaN(d)?'':d.toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit',timeZone:'Australia/Brisbane'}); }
function autoPick(){
  if(busy) return;
  var jobs=D.jobs.slice(0,JOBS), warn='';
  // 1. Sort photos the team didn't (each photo is only ever sent once; the guesses are kept)
  var todo=[]; if(D.ai) jobs.forEach(function(j){ var n=0; j.photos.forEach(function(x){ if(!x.room&&!D.guess[x.id]&&n<PERJOB){ n++; todo.push({job:j.key,x:x}); } }); });
  runCalls('sort',batch(todo,4).map(function(bt){ return {n:bt.items.length,run:function(){
    return api('POST',{job:bt.job,items:bt.items.map(function(x){ return {j:x.j,id:x.id,at:hhmm(x.at)}; })},'?sort=1').then(function(d){ Object.keys(d.guess||{}).forEach(function(k){ D.guess[k]=d.guess[k]; }); }); }}; }),todo.length,function(e){
    if(e) warn=e;
    // 2. Measure every after photo on the phone
    var list=[]; jobs.forEach(function(j){ aftersOf(j).slice(0,PERJOB).forEach(function(x){ list.push({job:j,x:x}); }); });
    if(!list.length){ busy=null; render(); toast(warn||'No after photos to choose from yet'); return; }
    busy={phase:'measure',done:0,total:list.length}; render();
    var i=0, ok=[], live=0, fin=false;
    // six thumbnails at a time, so even hundreds of jobs go through quickly
    function next(){
      if(fin) return;
      if(i>=list.length&&live===0){ fin=true; ok.sort(function(a,b){ return list.indexOf(a)-list.indexOf(b); }); return measured(); }
      while(live<6&&i<list.length){ (function(it){ live++;
        loadImg(thumb(it.x)).then(function(im){ if(im){ try{ it.f=measure(im); ok.push(it); }catch(e){} } live--; busy.done++; if(busy.done%10===0||busy.done===busy.total) render(); next(); }); })(list[i++]); }
    }
    next();
    function measured(){
      rank(ok,'sharp'); rank(ok,'std'); rank(ok,'sat');
      ok.forEach(function(x){ x.local=(0.40*x.sharpR+0.30*exposure(x.f.lum)+0.18*x.stdR+0.12*x.satR)*(x.f.land?1:0.6); });
      // 3. Claude rates the strongest-looking afters (up to 8 per job, never the same photo twice)
      var cand=[]; if(D.ai) jobs.forEach(function(j){ ok.filter(function(x){ return x.job===j; }).sort(function(a,b){ return b.local-a.local; }).slice(0,8)
        .forEach(function(x){ if(!D.rate[x.x.id]) cand.push({job:j.key,x:x.x}); }); });
      runCalls('rate',batch(cand,5).map(function(bt){ return {n:bt.items.length,run:function(){
        return api('POST',{job:bt.job,items:bt.items.map(function(x){ return {j:x.j,id:x.id}; })},'?rate=1').then(function(d){ Object.keys(d.rate||{}).forEach(function(k){ D.rate[k]=d.rate[k]; }); }); }}; }),cand.length,function(e2){
        if(e2) warn=e2; choose(ok,warn); });
    }
  });
}
function choose(ok,warn){
  // Claude's rating leads when there is one; private or weak (under 3) photos are left out.
  var pool=ok.filter(function(x){ var r=D.rate[x.x.id]; return !r||(!r.p&&r.r>=3); });
  pool.forEach(function(x){ var r=D.rate[x.x.id]; x.score=r?r.r+x.local:(D.ai?x.local-1:x.local); });
  pool.sort(function(a,b){ return b.score-a.score; });
  var pick=[], perRoom={}, perJob={};
  function tryAdd(x,roomCap,jobCap){
    if(pick.length>=TARGET||pick.indexOf(x)>=0) return;
    var r=x.x.room||'?';
    if((perRoom[r]||0)>=roomCap||(perJob[x.job.key]||0)>=jobCap) return;
    if(pick.some(function(p){ return corr(p.f.fp,x.f.fp)>0.85; })) return; // near-duplicate
    pick.push(x); perRoom[r]=(perRoom[r]||0)+1; perJob[x.job.key]=(perJob[x.job.key]||0)+1;
  }
  pool.forEach(function(x){ tryAdd(x,1,3); });       // one per room, spread across jobs
  pool.forEach(function(x){ tryAdd(x,1,8); });       // one per room, any job
  pool.forEach(function(x){ tryAdd(x,2,8); });       // then a second shot of the strongest rooms
  pool.forEach(function(x){ tryAdd(x,4,12); });      // fill up if photos are scarce
  why={}; pick.forEach(function(p){ why[p.x.id]=reason(p); });
  D.afters=pick.map(function(p){ return { j:p.x.j, id:p.x.id, room:p.x.room, service:p.job.service }; });
  // Fill each page spot (except ones Jack chose himself): landscape only, favouring the right kind of job and room,
  // a different photo for every spot, and not the gallery's lead photo when there's another good option.
  var taken={}; Object.keys(D.slots).forEach(function(k){ if(D.slots[k].man) taken[D.slots[k].id]=1; });
  D.spots.forEach(function(sp){ if(D.slots[sp.id]&&D.slots[sp.id].man) return;
    var best=null, bs=-1e9;
    pool.forEach(function(x){ if(!x.f.land||taken[x.x.id]) return;
      var sc=x.score+(sp.svc&&svcOf(x.job.service)===sp.svc?1.5:0)+(x.x.room===sp.room?1:0)-(pick[0]===x?0.8:0);
      if(sc>bs){ bs=sc; best=x; } });
    if(best){ taken[best.x.id]=1; D.slots[sp.id]={ j:best.x.j, id:best.x.id, room:best.x.room, service:best.job.service }; }
    else delete D.slots[sp.id];
  });
  busy=null;
  save((pick.length?'Picked your best '+pick.length+' after'+(pick.length===1?'':'s'):'No after photos good enough yet')+(warn?' · '+warn:''));
  window.scrollTo({top:0,behavior:'smooth'});
}
function findPhoto(jk,id){ var j=D.jobs.find(function(x){return x.key===jk;}); var x=j&&aftersOf(j).find(function(p){return p.id===id;}); return x?{job:j,x:x}:null; }

app.addEventListener('click',function(e){
  var t;
  if(e.target.closest('[data-auto]')){ autoPick(); return; }
  if((t=e.target.closest('[data-rm]'))){ var id=t.dataset.rm; D.afters=D.afters.filter(function(a){ return a.id!==id; }); save('Removed'); return; }
  if(e.target.closest('[data-cancel]')){ target=null; render(); return; }
  if((t=e.target.closest('[data-showpick]'))){ showPick=showPick===t.dataset.showpick?'':t.dataset.showpick; render(); return; }
  if((t=e.target.closest('[data-showset]'))){ var q2=t.dataset.showset.split('|'); D.show[q2[0]]={key:q2[1],hide:[]}; showPick=''; save('Sample report set. Check its photos below.'); return; }
  if((t=e.target.closest('[data-showrm]'))){ delete D.show[t.dataset.showrm]; save('Sample report removed'); return; }
  if((t=e.target.closest('[data-hide]'))){ var q3=t.dataset.hide.split('|'), sel=D.show[q3[0]]; if(!sel) return; var hs=sel.hide||[]; sel.hide=hs.indexOf(q3[1])>=0?hs.filter(function(x){ return x!==q3[1]; }):hs.concat([q3[1]]); save(sel.hide.indexOf(q3[1])>=0?'Hidden from the demo':'Showing in the demo'); return; }
  if(e.target.closest('[data-more]')){ shown+=15; render(); return; }
  if((t=e.target.closest('[data-filt]'))){ filt=t.dataset.filt; shown=15; render(); return; }
  if((t=e.target.closest('[data-set]'))){ target=t.dataset.set; var sp=target!=='gallery'&&spotOf(target); if(sp&&sp.svc&&filt==='all'){ filt=sp.svc; shown=15; } render();
    var jl=document.querySelector('.job'); if(jl) jl.scrollIntoView({behavior:'smooth',block:'start'}); else toast('No after photos to choose from yet'); return; }
  if((t=e.target.closest('[data-clr]'))){ delete D.slots[t.dataset.clr]; save('Back to the current website photo'); return; }
  if((t=e.target.closest('[data-ph]'))){
    var q=t.dataset.ph.split('|'), f=findPhoto(q[0],q[1]); if(!f) return;
    if(target&&target!=='gallery'){ var sid=target; D.slots[sid]={ j:f.x.j, id:f.x.id, room:f.x.room, service:f.job.service, man:1 }; target=null; filt='all'; save('Set for '+spotOf(sid).page+' · '+spotOf(sid).spot); window.scrollTo({top:0,behavior:'smooth'}); return; }
    if(target==='gallery') target=null;
    if(isOn(f.x.id)){ D.afters=D.afters.filter(function(a){ return a.id!==f.x.id; }); save('Removed'); }
    else if(D.afters.length>=12) toast('That\'s 12 already. Remove one first.');
    else { D.afters.push({ j:f.x.j, id:f.x.id, room:f.x.room, service:f.job.service }); save('Added'); }
  }
});

if(!key()){ err='login'; render(); }
else api('GET',null,'?pick=1').then(function(d){ D=d; D.show=D.show||{}; D.guess=D.guess||{}; D.rate=D.rate||{}; D.slots=D.slots||{}; D.spots=D.spots||[]; render(); // Re-pick when nothing is chosen yet, or a chosen photo is from a job the website doesn't show (e.g. a regular clean)
  var keys={}; D.jobs.forEach(function(j){ j.photos.forEach(function(x){ keys[x.id]=1; }); });
  var stale=D.afters.some(function(a){ return !keys[a.id]; });
  if((!D.afters.length||stale||!Object.keys(D.slots).length)&&D.jobs.length) autoPick(); })
  .catch(function(e){ err=e.status===401?'login':e.message; render(); });
})();
</script>
