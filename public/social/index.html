<style>
:root{--t:#C06B3C;--td:#A55830;--d:#1A1A1A;--c:#F5F0EB;--cd:#EDE6DE;--b:#4A4A4A;--m:#7A7A7A;--g:#F4B942;--w:#fff;--l:#DDD3C8;--ok:#2F5A35;--okb:#E6EFE3;--warn:#8A5A00;--warnb:#FBF0D9;

*{box-sizing:border-box}
body{margin:0;background:var(--c);color:var(--b);font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
#app{max-width:680px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px))}
a{color:var(--td)}
button{font-family:var(--sans);cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--t);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top a,.top button.bk{font:500 14px var(--sans);color:var(--m);text-decoration:none;padding:10px 0;background:none;border:0}
.wm{font:700 17px/1 var(--serif);color:var(--d)}
h1{font:700 28px/1.15 var(--serif);color:var(--d);margin:6px 0 0}
h1 em,h2 em{font-style:italic;font-weight:500}
h2{font:700 20px/1.25 var(--serif);color:var(--d);margin:26px 0 10px}
h3{font:600 15.5px/1.3 var(--sans);color:var(--d);margin:0}
.sub{color:var(--m);font-size:14px;margin:4px 0 0}
.sum{margin-top:14px;background:var(--d);color:var(--c);border-radius:14px;padding:16px;display:grid;gap:12px}
.sum .row{display:flex;gap:10px}
.sum .k{flex:1;background:#2A2826;border-radius:10px;padding:10px 12px}
.sum .k b{display:block;font:700 22px/1.1 var(--serif);color:var(--c)}
.sum .k span{font-size:12.5px;color:#BFB6AC}
.sum p{margin:0;font-size:14px;color:#CFC6BC}.sum p b{color:var(--c);font-weight:600}
.tabs{display:flex;gap:6px;margin:16px 0 4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs a{flex:none;min-height:40px;display:inline-flex;align-items:center;padding:0 14px;border-radius:999px;border:1.5px solid var(--l);background:var(--w);color:var(--d);font:500 14px var(--sans);text-decoration:none}
.tabs a[aria-current="page"]{background:var(--d);border-color:var(--d);color:var(--c)}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 8px;font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--m)}
.post{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--w);border:1px solid var(--l);border-radius:12px;padding:10px;margin-top:8px;text-decoration:none;color:inherit}
.post .im{flex:none;width:74px;height:74px;border-radius:9px;overflow:hidden;background:var(--cd);display:flex}
.post .im img{width:100%;height:100%;object-fit:cover;display:block}
.post .im.two img{width:50%}
.post .tx{flex:1;min-width:0;display:grid;gap:3px}
.post .tx b{font:600 15px/1.3 var(--sans);color:var(--d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post .tx span{font-size:13px;color:var(--m);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.post .ar{color:var(--m);font-size:20px}
.post.done{opacity:.62}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 11px/1 var(--sans);letter-spacing:.04em;padding:5px 8px;border-radius:999px;vertical-align:1px}
.chip.gbp{background:#E3ECF8;color:#1F4E8C}.chip.ig{background:#F6E3D8;color:var(--td)}
.chip.ok{background:var(--okb);color:var(--ok)}.chip.wait{background:var(--warnb);color:var(--warn)}.chip.off{background:var(--cd);color:var(--m)}
.hint{margin-top:12px;background:var(--w);border:1px solid var(--l);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--d)}
.hint.warn{background:var(--warnb);border-color:#EED9A8}
.empty{margin-top:10px;text-align:center;color:var(--m);font-size:14px;padding:18px;border:1.5px dashed var(--l);border-radius:12px}
/* post detail */
.pv{margin-top:12px;background:var(--cd);border-radius:12px;overflow:hidden;position:relative;display:grid;place-items:center;min-height:240px}
.pv img{display:block;width:100%;height:auto}
.pv .ld{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;color:var(--m)}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{min-height:46px;padding:0 16px;border-radius:9px;border:1.5px solid var(--l);background:var(--w);color:var(--d);font:600 14.5px var(--sans);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--t);border-color:var(--t);color:#fff}
.btn.dark{background:var(--d);border-color:var(--d);color:var(--c)}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.full{width:100%}
.btn:disabled{opacity:.55}
.btn.sm{min-height:38px;padding:0 12px;font-size:13.5px}
.row2{display:flex;gap:8px;margin-top:8px}.row2>*{flex:1}
label.l{display:block;font:600 13px var(--sans);color:var(--d);margin:14px 0 6px}
textarea,input[type=text],select{width:100%;font:400 15px/1.5 var(--sans);color:var(--d);background:var(--w);border:1.5px solid var(--l);border-radius:9px;padding:10px 12px}
textarea{min-height:220px;resize:vertical}
textarea.note{min-height:76px}
.cnt{font-size:12px;color:var(--m);text-align:right;margin-top:4px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--w);border:1px solid var(--l);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:14px;color:var(--d)}
.tog input{width:22px;height:22px;accent-color:var(--t)}
input[type=range]{width:100%;accent-color:var(--t)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;position:relative;padding-left:40px;font-size:14.5px;color:var(--d)}
.steps li:before{content:counter(s);position:absolute;left:0;top:-1px;width:28px;height:28px;border-radius:50%;background:var(--d);color:var(--c);display:grid;place-items:center;font:600 13px/1 var(--sans)}
.steps li small{display:block;color:var(--m);font-size:13px;margin-top:2px}
.card{background:var(--w);border:1px solid var(--l);border-radius:12px;padding:14px 16px;margin-top:10px}
.card p{margin:6px 0 0;font-size:14.5px}
.card ul{margin:8px 0 0;padding-left:18px;font-size:14.5px}.card li{margin:4px 0}
.verdict{font:600 11px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:999px;margin-left:6px;vertical-align:2px}
.v1{background:var(--okb);color:var(--ok)}.v2{background:#E3ECF8;color:#1F4E8C}.v3{background:var(--warnb);color:var(--warn)}.v4{background:var(--cd);color:var(--m)}
table.fq{width:100%;border-collapse:collapse;font-size:14.5px;margin-top:6px}
table.fq td,table.fq th{padding:9px 6px;border-bottom:1px solid var(--cd);text-align:left;vertical-align:top}
table.fq th{font:600 12px var(--sans);color:var(--m);text-transform:uppercase;letter-spacing:.06em}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--w);border-top:1px solid var(--l);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.bar .in{max-width:680px;margin:0 auto;display:flex;gap:8px}.bar .in>*{flex:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--d);color:var(--c);padding:11px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:92vw;text-align:center}
.center{text-align:center;padding:60px 10px}
.writing{font-size:13px;color:var(--m);display:flex;align-items:center;gap:8px;margin-top:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--t);animation:p 1.2s ease-in-out infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.ba{background:var(--w);border:1px solid var(--l);border-radius:12px;padding:10px;margin-top:10px}
.ba .ims{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ba .ims a{position:relative;display:block;border-radius:8px;overflow:hidden;background:var(--cd);aspect-ratio:3/4}
.ba .ims img{width:100%;height:100%;object-fit:cover;display:block}
.ba .ims span{position:absolute;left:6px;top:6px;font:600 11px/1 var(--sans);padding:5px 7px;border-radius:999px;background:rgba(26,26,26,.82);color:var(--c)}
.ba .ims a+a span{background:var(--t);color:#fff}
.ba .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:9px;font-size:13px;color:var(--m)}
.ba .why{margin:6px 0 0;font-size:14.5px;color:var(--d)}
.ba .row2{margin-top:10px}
.ba.dim{opacity:.7}
.chip.top{background:var(--d);color:var(--c)}
details.more{margin-top:10px}
.idea .ih{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:0}
.idea .ic{flex:none;width:38px;height:38px;border-radius:10px;background:var(--d);color:var(--c);display:grid;place-items:center;font-size:16px}
.idea .im2{display:block;font-size:12.5px;color:var(--m);margin-top:3px}
.idea.dn{opacity:.7}
.lnk{background:none;border:0;padding:0 4px;color:var(--td);font:600 13.5px var(--sans);text-decoration:underline}details.more summary{cursor:pointer;font:600 14px var(--sans);color:var(--td);padding:8px 0}
</style>

<script>
(function(){
var app=document.getElementById('app'), D=null, err='', cur=null, imgCache={}, writing={}, wq=[], wBusy=false, notes={};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var CH={gbp:'Google',ig:'Instagram'}, SVC={presale:'Pre-sale',bond:'Bond',deep:'Deep',other:''};
var SIZE={gbp:[1200,900],ig:[1080,1350]};
function key(){ try{ return localStorage.getItem('roster_admin_key')||''; }catch(e){ return ''; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(m,ms){ var o=document.querySelector('.toast'); if(o) o.remove(); var t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=m; document.body.appendChild(t); setTimeout(function(){t.remove();},ms||2400); }
function purl(x,t){ return '/api/photo?j='+encodeURIComponent(x.j)+'&p='+x.id+(t?'&s=t':''); }
function pd(s){ var p=s.split('-'); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); }
function addD(s,n){ var d=pd(s); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function dayLbl(s){ if(s===D.today) return 'Today'; if(s===addD(D.today,1)) return 'Tomorrow'; if(s===addD(D.today,-1)) return 'Yesterday'; var d=pd(s); return DOW[d.getUTCDay()]+' '+d.getUTCDate()+' '+MON[d.getUTCMonth()]; }
function api(method,body){
  return fetch('/api/social',{method:method,headers:{'content-type':'application/json','x-admin-key':key()},body:body?JSON.stringify(body):undefined,cache:'no-store'})
    .then(function(r){ return r.json().catch(function(){return {};}).then(function(d){ if(!r.ok){ var e=new Error(d.error||'Something went wrong'); e.status=r.status; e.off=d.off; throw e; } return d; }); });
}
var queue=Promise.resolve();
function inLine(fn){ var p=queue.then(fn,fn); queue=p.catch(function(){}); return p; }
function put(p){ if(!p) return; var i=D.posts.findIndex(function(x){return x.id===p.id;}); if(i>=0) D.posts[i]=p; else D.posts.push(p); D.posts.sort(function(a,b){ return (a.date+a.ch).localeCompare(b.date+b.ch); }); }
function byId(id){ return D.posts.find(function(p){return p.id===id;}); }
function copyText(t){
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).catch(function(){ legacyCopy(t); }); return; } }catch(e){}
  legacyCopy(t);
}
function legacyCopy(t){ var a=document.createElement('textarea'); a.value=t; a.setAttribute('readonly',''); a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); a.setSelectionRange(0,t.length); try{ document.execCommand('copy'); }catch(e){} a.remove(); }

// ---------- branded images (drawn here on the phone, from the job photos) ----------
function loadImg(src){
  if(imgCache[src]) return imgCache[src];
  imgCache[src]=new Promise(function(res,rej){ var i=new Image(); i.onload=function(){res(i);}; i.onerror=function(){ delete imgCache[src]; rej(new Error('Photo didn\'t load')); }; i.src=src; });
  return imgCache[src];
}
var fontsReady=null;
function fonts(){
  if(!fontsReady) fontsReady=Promise.all(['700 60px "Playfair Display"','600 26px Inter','500 24px Inter'].map(function(f){ return document.fonts&&document.fonts.load?document.fonts.load(f).catch(function(){}):null; })).then(function(){},function(){});
  return fontsReady;
}
function rr(x,X,Y,W,H,R){ x.beginPath(); x.moveTo(X+R,Y); x.arcTo(X+W,Y,X+W,Y+H,R); x.arcTo(X+W,Y+H,X,Y+H,R); x.arcTo(X,Y+H,X,Y,R); x.arcTo(X,Y,X+W,Y,R); x.closePath(); }
function cover(x,img,X,Y,W,H,fx,fy){
  var s=Math.max(W/img.width,H/img.height), sw=W/s, sh=H/s;
  var sx=(img.width-sw)*(fx==null?.5:fx), sy=(img.height-sh)*(fy==null?.5:fy);
  x.drawImage(img,sx,sy,sw,sh,X,Y,W,H);
}
function wrap(x,t,maxW){ var w=t.split(/\s+/), out=[], line=''; w.forEach(function(word){ var tr=line?line+' '+word:word; if(x.measureText(tr).width>maxW&&line){ out.push(line); line=word; } else line=tr; }); if(line) out.push(line); return out; }
function pill(x,t,X,Y,bg,fg,font,padX,h,alignRight){
  x.font=font; var w=x.measureText(t).width+padX*2, px=alignRight?X-w:X;
  x.fillStyle=bg; rr(x,px,Y,w,h,h/2); x.fill();
  x.fillStyle=fg; x.textBaseline='middle'; x.fillText(t,px+padX,Y+h/2+1); x.textBaseline='alphabetic';
}
function overflowAxis(p,img){ var sz=SIZE[p.ch], W=sz[0], H=sz[1]; if(p.kind==='pair'){ if(p.ch==='ig') H=(H-16)/2; else W=(W-16)/2; } return img.width/img.height > W/H ? 'x':'y'; }
function draw(p){
  var sz=SIZE[p.ch], W=sz[0], H=sz[1];
  return fonts().then(function(){ return Promise.all((p.ph||[]).map(function(x){ return loadImg(purl(x)); })); }).then(function(imgs){
    var c=document.createElement('canvas'); c.width=W; c.height=H; var x=c.getContext('2d');
    x.fillStyle='#F5F0EB'; x.fillRect(0,0,W,H);
    var fx=p.fx==null?.5:p.fx, fy=p.fy==null?.5:p.fy, U=W/1080;
    if(p.kind==='pair'&&imgs.length===2){
      var g=16, pad=Math.round(34*U), ph=Math.round(54*U), f='600 '+Math.round(27*U)+'px Inter';
      if(p.ch==='ig'){ var h=(H-g)/2; cover(x,imgs[0],0,0,W,h,fx,fy); cover(x,imgs[1],0,h+g,W,h,fx,fy);
        pill(x,'Before',pad,pad,'rgba(26,26,26,.82)','#F5F0EB',f,Math.round(22*U),ph); pill(x,'After',pad,h+g+pad,'#C06B3C','#fff',f,Math.round(22*U),ph);
        pill(x,'Bardon Clean',W-pad,H-pad-ph,'#F5F0EB','#1A1A1A','700 '+Math.round(30*U)+'px "Playfair Display"',Math.round(22*U),ph,true);
      } else { var w=(W-g)/2; cover(x,imgs[0],0,0,w,H,fx,fy); cover(x,imgs[1],w+g,0,w,H,fx,fy);
        pill(x,'Before',pad,pad,'rgba(26,26,26,.82)','#F5F0EB',f,Math.round(22*U),ph); pill(x,'After',w+g+pad,pad,'#C06B3C','#fff',f,Math.round(22*U),ph);
        pill(x,'Bardon Clean',W-pad,H-pad-ph,'#F5F0EB','#1A1A1A','700 '+Math.round(30*U)+'px "Playfair Display"',Math.round(22*U),ph,true);
      }
    } else if(imgs.length){
      cover(x,imgs[0],0,0,W,H,fx,fy);
      var M=Math.round(72*U), txt=p.txt&&p.head;
      var gr=x.createLinearGradient(0,H*(txt?.45:.7),0,H); gr.addColorStop(0,'rgba(26,26,26,0)'); gr.addColorStop(1,'rgba(26,26,26,'+(txt?.82:.55)+')'); x.fillStyle=gr; x.fillRect(0,0,W,H);
      x.fillStyle='#F5F0EB'; x.font='700 '+Math.round(36*U)+'px "Playfair Display"'; x.textBaseline='alphabetic';
      x.fillText('Bardon Clean',M,H-M+Math.round(8*U));
      x.font='500 '+Math.round(24*U)+'px Inter'; x.fillStyle='#E9DFD4'; x.textAlign='right'; x.fillText('bardonclean.au',W-M,H-M+Math.round(6*U)); x.textAlign='left';
      if(txt){
        var fs=Math.round((p.ch==='ig'?80:64)*U); x.font='700 '+fs+'px "Playfair Display"'; x.fillStyle='#F5F0EB';
        var lines=wrap(x,p.head,W-M*2).slice(0,3), lh=Math.round(fs*1.08), base=H-M-Math.round(78*U);
        lines.forEach(function(l,i){ x.fillText(l,M,base-(lines.length-1-i)*lh); });
        x.fillStyle='#C06B3C'; x.fillRect(M,base-(lines.length-1)*lh-fs-Math.round(26*U),Math.round(60*U),Math.round(6*U));
      }
    }
    return new Promise(function(res){ c.toBlob(function(b){ res(b); },'image/jpeg',.92); });
  });
}
function fileName(p){ return 'bardon-'+(p.ch==='ig'?'instagram':'google')+'-'+p.date+'.jpg'; }

// ---------- Claude writes captions in the background ----------
function needsWrite(p){ return D.ai && !p.ai && !p.edited && !p.status && (p.ph||[]).length && p.date<=addD(D.today,6); }
function queueWrite(id,front){ if(writing[id]) return; wq=wq.filter(function(x){return x!==id;}); if(front) wq.unshift(id); else wq.push(id); pump(); }
function pump(){
  if(wBusy||!wq.length) return; var id=wq.shift(); wBusy=true; writing[id]=1; rerenderIf(id);
  var n=0;
  (function step(){
    inLine(function(){ return api('POST',{action:'write',id:id}); }).then(function(d){
      if(d.post) put(d.post); if(d.note){ notes[id]=d.note; }
      if(d.again&&++n<5) { rerenderIf(id,true); return step(); }
      done();
    }).catch(function(e){ notes[id]=e.off?'':'Claude couldn\'t write this one ('+e.message+'). The ready-made caption below is fine to use.'; if(e.off) D.ai=false; done(); });
  })();
  function done(){ delete writing[id]; wBusy=false; rerenderIf(id,true); pump(); }
}
function rerenderIf(id,photoMayChange){ if(cur&&cur.id===id){ if(photoMayChange) cur.blob=null; render(); } else if(!cur) render(); }

// ---------- views ----------
function weekStats(){
  var d=pd(D.today), mon=addD(D.today,-((d.getUTCDay()+6)%7)), sun=addD(mon,6);
  var wk=D.posts.filter(function(p){ return p.date>=mon&&p.date<=sun&&p.status!=='skipped'; });
  var last={}; D.posts.forEach(function(p){ if(p.status==='posted'&&(!last[p.ch]||p.date>last[p.ch])) last[p.ch]=p.date; });
  return {done:wk.filter(function(p){return p.status==='posted';}).length, total:wk.length, last:last};
}
function ago(s){ if(!s) return 'not yet'; var n=Math.round((pd(D.today)-pd(s))/864e5); return n<=0?'today':n===1?'yesterday':n+' days ago'; }
function tabs(on){ return '<nav class="tabs" aria-label="Sections"><a href="#/"'+(on==='posts'?' aria-current="page"':'')+'>Posts</a><a href="#/how"'+(on==='how'?' aria-current="page"':'')+'>How &amp; how often</a><a href="#/ba"'+(on==='ba'?' aria-current="page"':'')+'>Before &amp; afters</a><a href="#/ideas"'+(on==='ideas'?' aria-current="page"':'')+'>Photo &amp; video ideas</a><a href="#/more"'+(on==='more'?' aria-current="page"':'')+'>Other platforms</a></nav>'; }
function head(){ return '<div class="top"><a href="/?v=more" data-hb>‹ Back</a><span class="wm">Bardon Clean</span></div>'; }
function thumbHtml(p){
  if(!(p.ph||[]).length) return '<span class="im"></span>';
  return '<span class="im'+(p.kind==='pair'?' two':'')+'">'+p.ph.map(function(x){ return '<img src="'+purl(x,1)+'" alt="" loading="lazy">'; }).join('')+'</span>';
}
function postRow(p){
  var st=p.status==='posted'?'<span class="chip ok">Posted</span>':p.status==='skipped'?'<span class="chip off">'+(p.auto?'Missed':'Skipped')+'</span>':p.date<D.today?'<span class="chip wait">Catch up</span>':'';
  var sub=(p.ap?'★ Your pick · ':'')+(p.kind==='pair'?'Before & after':'After photo')+(p.room?' · '+p.room:'')+(SVC[p.svc]?' · '+SVC[p.svc]:'');
  if(!(p.ph||[]).length) sub='Needs a photo';
  return '<a class="post'+(p.status?' done':'')+'" href="#/p/'+p.id+'">'+thumbHtml(p)+'<span class="tx"><span><span class="chip '+p.ch+'">'+CH[p.ch]+'</span> '+st+'</span><b>'+esc(dayLbl(p.date))+' · '+esc(p.head||'')+'</b><span>'+esc(sub)+(writing[p.id]?' · writing…':'')+'</span></span><span class="ar" aria-hidden="true">›</span></a>';
}
function viewList(){
  var t=D.today, ws=weekStats(), P=D.posts;
  var todays=P.filter(function(p){return p.date===t&&!p.status;});
  var catchup=P.filter(function(p){return p.date<t&&!p.status;});
  var soon=P.filter(function(p){return p.date>t&&!p.status;}).slice(0,10);
  var past=P.filter(function(p){return p.status&&p.date>=addD(t,-21);}).reverse().slice(0,8);
  var next=soon[0];
  var h=head()+'<h1>Social &amp; <em>Google</em> posts</h1><p class="sub">Made from your job photos. Open one, tap share, paste, post.</p>';
  h+='<div class="sum"><div class="row"><div class="k"><b>'+ws.done+' of '+ws.total+'</b><span>posted this week</span></div><div class="k"><b>'+(todays.length+catchup.length)+'</b><span>ready to post now</span></div></div>';
  h+='<p>Google: last post <b>'+ago(ws.last.gbp)+'</b>. Instagram: last post <b>'+ago(ws.last.ig)+'</b>.'+(next&&!todays.length?' Next up: <b>'+esc(dayLbl(next.date))+', '+CH[next.ch]+'</b>.':'')+'</p></div>';
  if(!D.ai) h+='<div class="hint warn">Captions are the ready-made versions. Claude writes better, photo-specific ones once the Claude key (ANTHROPIC_API_KEY) is set in Netlify, the same key the photo sorting uses.</div>';
  h+=tabs('posts');
  h+='<div class="sect"><span>Today</span><span>'+todays.length+'</span></div>';
  h+=todays.length?todays.map(postRow).join(''):'<div class="empty">'+(P.some(function(p){return p.date===t&&p.status==='posted';})?'Today\'s done. Nice.':'Nothing due today.')+' <div class="row2"><button type="button" class="btn sm" data-extra="gbp">Make a Google post</button><button type="button" class="btn sm" data-extra="ig">Make an Instagram post</button></div></div>';
  if(catchup.length) h+='<div class="sect"><span>Catch up</span><span>'+catchup.length+'</span></div><p class="sub" style="margin:-2px 0 0">Missed ones wait here for a week, then drop off. Post one today or skip it.</p>'+catchup.map(postRow).join('');
  h+='<div class="sect"><span>Coming up</span><span>'+soon.length+'</span></div>'+(soon.length?soon.map(postRow).join(''):'<div class="empty">No posts planned.</div>');
  if(past.length) h+='<div class="sect"><span>Done recently</span></div>'+past.map(postRow).join('');
  if(P.some(function(p){ return !p.status&&!(p.ph||[]).length; })) h+='<div class="hint warn">Some posts need a photo. Photos come from jobs: the team\'s sorted after photos plus anything you upload in <a href="/demo-photos/">Website &amp; demo photos</a>.</div>';
  return h;
}
function stepsFor(p){

    '<li>Tap <b>Copy text &amp; share</b> below, then <b>Save Image</b> in the share sheet.<small>The post text is now copied too.</small></li>'+
    '<li>Tap <b>Open my Google profile</b>. Make sure you\'re signed in to the Google account that manages Bardon Clean.</li>'+
    '<li>On your profile, tap <b>Add update</b>.<small>On some screens it\'s under <b>Promote</b>, or <b>Posts › Add post</b>.</small></li>'+
    '<li>Tap <b>Add photo</b> and choose the image you just saved.</li>'+
    '<li>Long-press the description box and tap <b>Paste</b>.</li>'+
    '<li>Optional: <b>Add button › Learn more</b>. Come back here, tap <b>Copy button link</b>, and paste it in.<small>Links to '+esc(link.replace('https://',''))+'</small></li>'+
    '<li>Tap <b>Post</b>. Google checks it first, so it can take a little while to show. Then come back and tap <b>Mark posted</b>.</li></ol>';
  return '<ol class="steps">'+
    '<li>Tap <b>Copy caption &amp; share</b> below.<small>The caption is now copied.</small></li>'+
    '<li>In the share sheet, tap <b>Instagram</b>, then <b>Feed</b> if it asks.<small>Not in the list? Tap <b>Save Image</b>, open Instagram, tap <b>+</b>, choose <b>Post</b> and pick the photo.</small></li>'+
    '<li>Skip filters. The image is already finished.</li>'+
    '<li>Tap the caption box, long-press, <b>Paste</b>.</li>'+
    '<li>If Facebook is linked, leave <b>Share to Facebook</b> on (see Other platforms).</li>'+
    '<li>Tap <b>Share</b>, then come back here and tap <b>Mark posted</b>.</li></ol>';
}
function viewPost(p){
  var h='<div class="top"><a href="#/" data-hb>‹ Back</a><span class="wm">Bardon Clean</span></div>';
  h+='<h1 style="font-size:24px"><span class="chip '+p.ch+'" style="font-size:12px;vertical-align:5px">'+CH[p.ch]+'</span> '+esc(dayLbl(p.date))+'</h1>';
  if(p.status==='posted') h+='<div class="hint" style="background:var(--okb);border-color:#CFE0CB;color:var(--ok)">Posted'+(p.postedAt?' '+esc(dayLbl(new Date(Date.parse(p.postedAt)+36e6).toISOString().slice(0,10)).toLowerCase()):'')+'. <button type="button" class="btn sm" data-status="" style="margin-left:6px">Undo</button></div>';
  if(p.status==='skipped') h+='<div class="hint">'+(p.auto?'Missed, and dropped off after a week.':'Skipped.')+' <button type="button" class="btn sm" data-status="" style="margin-left:6px">Bring it back</button></div>';
  if(notes[p.id]) h+='<div class="hint warn">'+esc(notes[p.id])+'</div>';
  if(!(p.ph||[]).length){
    h+='<div class="hint warn">No photo available for this one yet. Sorted after photos from jobs (or your uploads in <a href="/demo-photos/">Website &amp; demo photos</a>) feed these posts.</div><div class="ctl"><button type="button" class="btn" data-swap="">Try again</button></div>';
    return h;
  }
  h+='<div class="pv" id="pv">'+(cur.url?'<img src="'+cur.url+'" alt="The finished image for this post">':'<span class="ld">Making the image…</span>')+'</div>';
  if(writing[p.id]) h+='<div class="writing"><span class="dot"></span>Claude is checking the photo and writing the caption…</div>';
  h+='<div class="ctl"><button type="button" class="btn sm" data-swap="">Different photo</button>'+'<button type="button" class="btn sm" data-reject>Never use this photo</button></div>';
  if(p.kind!=='pair') h+='<label class="tog"><span>Headline on the image</span><input type="checkbox" id="txt"'+(p.txt?' checked':'')+'></label>';
  if(p.kind!=='pair'&&p.txt) h+='<label class="l" for="hd">Headline</label><input type="text" id="hd" maxlength="60" value="'+esc(p.head||'')+'">';
  h+='<label class="l" for="fpos">Photo position</label><input type="range" id="fpos" min="0" max="100" value="'+Math.round(((cur.axis==='x'?p.fx:p.fy)==null?.5:(cur.axis==='x'?p.fx:p.fy))*100)+'" aria-label="Move the photo within the frame">';
  h+='<label class="l" for="cap">'+(p.ch==='gbp'?'Post text':'Caption')+'</label><textarea id="cap"'+(writing[p.id]?' readonly':'')+'>'+esc(p.cap||'')+'</textarea><div class="cnt" id="cnt">'+(p.cap||'').length+(p.ch==='gbp'?' / 1500':' / 2200')+'</div>';
  if(D.ai&&!p.status) h+='<label class="l" for="note">Anything about this job? <span style="font-weight:400;color:var(--m,#777)">(optional)</span></label><textarea id="note" class="note" maxlength="400" placeholder="e.g. 50-year-old oven, three hours on the door glass alone. Or a pet peeve, a funny moment, how the client reacted.">'+esc(p.note||'')+'</textarea>';
  h+='<div class="ctl"><button type="button" class="btn sm" data-rewrite'+(D.ai&&!writing[p.id]?'':' disabled')+'>'+((p.note||'').trim()?'Write it with my note':(p.ai?'Rewrite with Claude':'Write with Claude'))+'</button>'+(p.ch==='gbp'?'<button type="button" class="btn sm" data-copylink>Copy button link</button>':'')+'</div>';
  h+='<h2>How to post <em>this one</em></h2>'+stepsFor(p);
  if(p.ch==='gbp') h+='<div class="row2"><a class="btn" href="https://www.google.com/search?q=my+business" target="_blank" rel="noopener">Open my Google profile</a></div>';
  else h+='<div class="row2"><a class="btn" href="instagram://camera" data-ig>Open Instagram</a></div>';
  if(!p.status) h+='<div class="row2"><button type="button" class="btn" data-status="skipped">Skip this one</button><button type="button" class="btn" data-save>Save image only</button></div>';
  h+='<div class="bar"><div class="in">'+(p.status==='posted'?'<a class="btn dark" href="#/">Back to posts</a>':'<button type="button" class="btn primary" data-share'+(cur.blob?'':' disabled')+'>'+(p.ch==='ig'?'Copy caption &amp; share':'Copy text &amp; share')+'</button><button type="button" class="btn okb" data-status="posted" style="flex:.7">Mark posted</button>')+'</div></div>';
  return h;
}
function viewHow(){
  var s=D.settings, gd=(D.days.gbp[s.gbp]||[]).map(function(d){return DOWL[d];}), id=(D.days.ig[s.ig]||[]).map(function(d){return DOWL[d];});
  var h=head()+'<h1>How &amp; <em>how often</em></h1>'+tabs('how');
  h+='<h2>Your posting rhythm</h2><table class="fq"><thead><tr><th></th><th>How often</th><th>Days</th></tr></thead><tbody><tr><td><b>Google</b></td><td>'+s.gbp+' a week</td><td>'+gd.join(', ')+'</td></tr><tr><td><b>Instagram</b></td><td>'+s.ig+' a week</td><td>'+id.join(', ')+'</td></tr></tbody></table>';
  h+='<div class="card"><h3>The routine</h3><ul><li>On each post day you get a phone ping at 8am (Tools › Phone notifications › Marketing). The post is already made: photo, branding and caption.</li><li>Post whenever you have two minutes that day. Time of day matters far less than not skipping.</li><li>Missed one? It sits in <b>Catch up</b> for a week. Post it any day, or skip it.</li><li>Every post uses a different photo, rotating areas and services, so the feed never repeats itself.</li><li>Posts use after photos from real jobs. Every second Instagram post is a before &amp; after, using only the pairs you marked post-worthy (Before &amp; afters tab). Google stays after-only.</li></ul></div>';
  h+='<div class="card"><h3>Why this much, and no more</h3><p>A steady rhythm you can actually keep beats bursts followed by silence. Two Google updates a week keeps a recent post on your listing for people searching locally. Three Instagram posts a week keeps you visible to followers without turning into a second job. If a week is flat out, drop Instagram to 2, not Google.</p></div>';
  h+='<label class="l" for="sg">Google posts per week</label><select id="sg">'+[1,2,3].map(function(n){return '<option value="'+n+'"'+(n===s.gbp?' selected':'')+'>'+n+'</option>';}).join('')+'</select>';
  h+='<label class="l" for="si">Instagram posts per week</label><select id="si">'+[2,3,4].map(function(n){return '<option value="'+n+'"'+(n===s.ig?' selected':'')+'>'+n+'</option>';}).join('')+'</select>';
  h+='<h2>Posting to <em>Google</em></h2><div class="card">'+stepsFor({ch:'gbp',svc:'other'}).replace(/ below/g,' on the post')+'</div>';
  h+='<div class="card"><h3>Google\'s rules worth knowing</h3><ul><li>No phone numbers in the post text. Google may reject the post. (The captions here never include one.)</li><li>Hashtags do nothing on Google, so the Google captions don\'t use them.</li><li>One photo per post. Posts older than six months get archived, which is another reason to keep posting.</li><li>Once a month, also add 3 to 5 good after photos to your profile\'s <b>Photos</b> section. Save them from any post here.</li></ul></div>';
  h+='<h2>Posting to <em>Instagram</em></h2><div class="card">'+stepsFor({ch:'ig'}).replace(/ below/g,' on the post')+'</div>';
  h+='<div class="card"><h3>What the captions follow</h3><ul><li>Only what\'s in the photo. No made-up stories or numbers.</li><li>Plain words for what was done (cleaned, degreased, detailed). Never "restored", "like new" or "spotless".</li><li>No promises on quote turnaround, booking lead times, return visits or sale prices.</li><li>Nothing that identifies the home: no client names, streets or suburbs. Photos flagged private are never used.</li><li>Your real standards, used one at a time: fresh cloths every clean, tools cleaned before and after, tested products, team paid above award, fully insured.</li><li>You can edit any caption before you post. Edits are kept.</li></ul></div>';
  h+='<div class="card"><h3>Get better photos into the bank</h3><ul><li>The team\'s sorted <b>after</b> photos feed every post. More sorted after photos means better posts.</li><li>Wide, bright, uncluttered shots work best. Skip toilets, drains and anything personal.</li></ul></div>';
  return h;
}

var BA=null, baErr='', baF='', baOpen={};
var AREAS=['Kitchen','Bathrooms','Bedrooms','Living & dining','Laundry','Windows & tracks','Outdoor & garage'];
function baCard(x){
  var h='<div class="ba'+(x.jk==='n'?' dim':'')+'" id="ba-'+x.a.id+'"><div class="ims"><a href="'+purl(x.b)+'" target="_blank" rel="noopener"><img src="'+purl(x.b,1)+'" alt="Before" loading="lazy"><span>Before</span></a><a href="'+purl(x.a)+'" target="_blank" rel="noopener"><img src="'+purl(x.a,1)+'" alt="After" loading="lazy"><span>After</span></a></div>';
  h+='<div class="meta">'+(x.shot?'<span>'+esc(x.shot)+'</span>':'')+(x.post?'<span class="chip '+(x.post.status==='posted'?'ok':'wait')+'">'+(x.post.status==='posted'?'Posted':'In a post')+'</span>':'')+(x.solo?'<span class="chip off">After used on '+CH[x.solo.ch]+'</span>':'')+'<span>Tap a photo to see it full size</span></div>';
  h+='<div class="row2"><button type="button" class="btn sm'+(x.jk==='y'?' okb':'')+'" data-jk="y" data-aid="'+x.a.id+'" aria-pressed="'+(x.jk==='y')+'">'+(x.jk==='y'?'✓ ':'')+'Post-worthy</button><button type="button" class="btn sm'+(x.jk==='n'?' dark':'')+'" data-jk="n" data-aid="'+x.a.id+'" aria-pressed="'+(x.jk==='n')+'">'+(x.jk==='n'?'✓ ':'')+'Not using</button></div>';
  if(x.jk==='y'&&x.post) h+='<div class="row2"><a class="btn sm" href="#/p/'+x.post.id+'">Open the post</a></div>';
  else if(x.jk==='y') h+='<div class="row2"><button type="button" class="btn sm primary" data-pp="ig" data-aid="'+x.a.id+'">Instagram post</button><button type="button" class="btn sm" data-pp="gbp" data-aid="'+x.a.id+'">Google (after only)</button></div>';
  return h+'</div>';
}
function viewBA(){
  var h=head()+'<h1>Before &amp; <em>afters</em></h1><p class="sub">Every line-up camera pair, by property and area. Mark the ones worth posting. Post-worthy pairs, and any you add to a client\'s report, go into your upcoming posts: Instagram as a before &amp; after, Google as the after photo. Look for ★ Your pick on the posts list.</p>'+tabs('ba');
  if(baErr) return h+'<div class="hint warn">'+esc(baErr)+' <button type="button" class="btn sm" data-bareload>Try again</button></div>';
  if(!BA) return h+'<div class="empty">Loading pairs…</div>';
  if(!BA.length) return h+'<div class="empty">No line-up pairs yet. When the team takes after photos with the line-up camera, the pairs land here.</div>';
  var n={'':0,y:0,n:0}; BA.forEach(function(x){ n[x.jk||'']++; });
  if(!baF) baF=n['']?'todo':'y';
  h+='<div class="sum"><div class="row"><div class="k"><b>'+n['']+'</b><span>to review</span></div><div class="k"><b>'+n.y+'</b><span>post-worthy</span></div><div class="k"><b>'+n.n+'</b><span>not using</span></div></div><p>Post-worthy pairs also fill every second Instagram post automatically. Google stays after-only.</p></div>';
  h+='<nav class="tabs" aria-label="Show">'+[['todo','To review ('+n['']+')'],['y','Post-worthy ('+n.y+')'],['n','Not using ('+n.n+')'],['all','All ('+BA.length+')']].map(function(f){ return '<a href="#/ba" data-baf="'+f[0]+'"'+(baF===f[0]?' aria-current="page"':'')+'>'+f[1]+'</a>'; }).join('')+'</nav>';
  var list=BA.filter(function(x){ return baF==='all'||(baF==='todo'?!x.jk:x.jk===baF); });
  if(!list.length) return h+'<div class="empty">'+(baF==='todo'?'All reviewed. Nice.':'Nothing here yet.')+'</div>';
  var props=[], byP={};
  list.forEach(function(x){ if(!byP[x.key]){ byP[x.key]={x:x,items:[]}; props.push(byP[x.key]); } byP[x.key].items.push(x); });
  props.forEach(function(g){
    var open=baOpen[g.x.key]!==false, ar={}, order=[];
    g.items.forEach(function(x){ var r=x.room||'Other'; if(!ar[r]){ ar[r]=[]; order.push(r); } ar[r].push(x); });
    order.sort(function(p,q){ var i=AREAS.indexOf(p), j=AREAS.indexOf(q); return (i<0?99:i)-(j<0?99:j); });
    h+='<details class="more" data-prop="'+esc(g.x.key)+'"'+(open?' open':'')+' style="margin-top:18px"><summary style="font:700 18px/1.3 var(--serif);color:var(--d)">'+esc(g.x.prop)+' <span style="font:500 13px var(--sans);color:var(--m)">· '+esc([SVC[g.x.svc],g.x.date?dayLbl(g.x.date):''].filter(Boolean).join(' · '))+' · '+g.items.length+' pair'+(g.items.length===1?'':'s')+'</span></summary>';
    order.forEach(function(r){ h+='<div class="sect"><span>'+esc(r)+'</span><span>'+ar[r].length+'</span></div>'+ar[r].map(baCard).join(''); });
    h+='</details>';
  });
  return h;
}
function loadBA(){
  return fetch('/api/social?pairs=1',{headers:{'x-admin-key':key()},cache:'no-store'}).then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error(d.error||'Couldn\'t load pairs'); return d; }); })
    .then(function(d){ BA=d.pairs; baErr=''; if(location.hash==='#/ba') render(); })
    .catch(function(e){ baErr=e.message; if(location.hash==='#/ba') render(); });
}

function iTicks(){ try{ var o=JSON.parse(localStorage.getItem('bc_ideas')||'{}'); return o.d===D.today?o:{d:D.today,t:{}}; }catch(e){ return {d:D.today,t:{}}; } }
function iSave(o){ try{ localStorage.setItem('bc_ideas',JSON.stringify(o)); }catch(e){} }
var IX=null, ixErr='', ixBusy=false, ixAuto=false, ixOpen={};
var FMTI={'Reel':'▶','Story':'◷','Carousel':'▤','Photo':'◻','Talking to camera':'◉'};
function loadIX(){
  return fetch('/api/social?ideas=1',{headers:{'x-admin-key':key()},cache:'no-store'}).then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error(d.error||'Couldn\'t load ideas'); return d; }); })
    .then(function(d){ IX=d; ixErr=''; if(d.ai&&!ixAuto&&!d.ideas.some(function(x){return x.at===d.today;})){ ixAuto=true; freshIX(); } if(location.hash==='#/ideas') render(); })
    .catch(function(e){ ixErr=e.message; if(location.hash==='#/ideas') render(); });
}
function freshIX(){
  if(ixBusy) return; ixBusy=true; if(location.hash==='#/ideas') render();
  api('POST',{action:'ideas',svc:iF==='all'?'':iF}).then(function(d){ (d.add||[]).slice().reverse().forEach(function(x){ IX.ideas.unshift(x); ixOpen[x.id]=1; }); })
    .catch(function(e){ toast(e.message,3600); })
    .then(function(){ ixBusy=false; if(location.hash==='#/ideas'){ render(); } });
}
function ideaCard(x){
  var open=!!ixOpen[x.id], sv=SVC[x.svc]||'Any job';
  var h='<div class="card idea'+(x.st==='done'?' dn':'')+'"><button type="button" class="ih" data-iopen="'+x.id+'" aria-expanded="'+open+'"><span class="ic" aria-hidden="true">'+(FMTI[x.fmt]||'▶')+'</span><span style="flex:1;min-width:0"><h3>'+esc(x.t)+'</h3><span class="im2">'+esc([x.fmt,sv,x.len].filter(Boolean).join(' · '))+(x.at===D.today&&!x.st?' · <b style="color:var(--t)">New</b>':'')+'</span></span><span aria-hidden="true" style="color:var(--m)">'+(open?'–':'+')+'</span></button>';
  if(open){
    h+='<p>'+esc(x.hook)+'</p><div class="sect" style="margin:14px 0 6px"><span>What to film</span></div><ol class="steps">'+x.shots.map(function(y){ return '<li>'+esc(y)+'</li>'; }).join('')+'</ol>';
    if(x.txt) h+='<p style="margin-top:12px"><span style="color:var(--m);font-size:13px">On-screen text</span><br><b style="color:var(--d)">'+esc(x.txt)+'</b></p>';
    if(x.cap) h+='<p><span style="color:var(--m);font-size:13px">Caption starter</span><br>'+esc(x.cap)+' <button type="button" class="lnk" data-icopy="'+x.id+'">Copy</button></p>';
    h+='<div class="row2" style="margin-top:12px"><button type="button" class="btn sm'+(x.st==='fav'?' dark':'')+'" data-ist="fav" data-iid="'+x.id+'" aria-pressed="'+(x.st==='fav')+'">'+(x.st==='fav'?'★ Saved':'☆ Save')+'</button><button type="button" class="btn sm'+(x.st==='done'?' okb':'')+'" data-ist="done" data-iid="'+x.id+'" aria-pressed="'+(x.st==='done')+'">'+(x.st==='done'?'✓ Filmed':'Filmed it')+'</button><button type="button" class="btn sm" data-ist="no" data-iid="'+x.id+'">Not for me</button></div>';
  }
  return h+'</div>';
}
function viewIdeas(){
  var h=head()+'<h1>Photo &amp; <em>video</em> ideas</h1><p class="sub">Fresh concepts for your next jobs. New ones every day, or tap for more any time. The more you save and skip, the better they get.</p>'+tabs('ideas');
  if(ixErr) return h+'<div class="hint warn">'+esc(ixErr)+' <button type="button" class="btn sm" data-ixreload>Try again</button></div>';
  if(!IX) return h+'<div class="empty">Loading ideas…</div>';
  if(IX.jobs.length) h+='<div class="hint"><b>Coming up:</b> '+IX.jobs.map(function(j){ return esc(j.when.charAt(0).toUpperCase()+j.when.slice(1))+', '+esc((SVC[j.svc]||'clean').toLowerCase()); }).join(' · ')+'</div>';
  h+='<nav class="tabs" aria-label="Ideas for">'+ISVC.map(function(s){ return '<a href="#/ideas" data-if="'+s[0]+'"'+(iF===s[0]?' aria-current="page"':'')+'>'+(s[0]==='all'?'Any job':s[1])+'</a>'; }).join('')+'</nav>';
  if(!IX.ai) h+='<div class="hint warn">Fresh ideas need the Claude key (ANTHROPIC_API_KEY) in Netlify, the same one the captions use. The basics below still work.</div>';
  else h+='<button type="button" class="btn primary full" style="margin-top:12px" data-ixnew'+(ixBusy?' disabled':'')+'>'+(ixBusy?'<span class="dot"></span> Thinking up new ideas…':'✦ Give me 6 fresh ideas'+(iF!=='all'?' for '+esc(ISVC.filter(function(s){return s[0]===iF;})[0][1].toLowerCase()):''))+'</button>';
  var fit=function(x){ return iF==='all'||x.svc===iF||x.svc==='any'; };
  var nw=IX.ideas.filter(function(x){ return !x.st&&fit(x); }), fav=IX.ideas.filter(function(x){ return x.st==='fav'; }), dn=IX.ideas.filter(function(x){ return x.st==='done'; });
  if(fav.length) h+='<h2>Saved <em>for the next job</em></h2>'+fav.map(ideaCard).join('');
  h+='<h2>Fresh <em>ideas</em></h2>';
  h+=nw.length?nw.slice(0,18).map(ideaCard).join(''):'<div class="empty">'+(ixBusy?'Working on it…':'No new ideas here yet. Tap the button above.')+'</div>';
  if(nw.length>18) h+='<p class="sub" style="text-align:center;margin-top:10px">Older unused ideas are tucked away. Save the good ones so they stay at the top.</p>';
  if(dn.length) h+='<details class="more"><summary>Filmed ('+dn.length+')</summary>'+dn.slice(0,30).map(ideaCard).join('')+'</details>';
  h+='<details class="more" style="margin-top:18px"><summary>The basics: what to get on every job</summary>'+basicsHtml()+'</details>';
  return h;
}
function basicsHtml(){
  var tk=iTicks(), h='<p class="sub">The reliable shots that every Reel and post can draw on. Ticks clear each day.</p>';
  var groups=IDEAS.filter(function(g){ return !g.svc||iF==='all'||g.svc===iF; });
  groups.forEach(function(g){
    h+='<div class="sect" style="margin-top:20px"><span>'+esc(g.g)+'</span></div>'+(g.n?'<p class="sub">'+esc(g.n)+'</p>':'');
    g.items.forEach(function(x){
      var on=!!tk.t[x.id];
      h+='<div class="card'+(on?' ' :'')+'"'+(on?' style="opacity:.62"':'')+'><label class="tog" style="margin:0;padding:0;border:0;background:none;align-items:flex-start"><span><h3>'+esc(x.t)+'</h3>'+(x.how?'<p>'+esc(x.how)+'</p>':'')+'<p style="font-size:13px;color:var(--m)">'+esc(x.len)+' · '+esc(x.fmt)+' · '+esc(x.use)+(x.txt?'<br>On-screen text: <b style="color:var(--d);font-weight:600">'+esc(x.txt)+'</b>':'')+'</p></span><input type="checkbox" data-itk="'+x.id+'"'+(on?' checked':'')+' aria-label="Filmed: '+esc(x.t)+'"></label></div>';
    });
  });
  h+='<div class="sect" style="margin-top:20px"><span>Filming rules</span></div><div class="card"><ul><li>Wipe the lens first. Lights on, blinds open.</li><li>Vertical for Instagram and Stories. Landscape for walkthroughs, the website and agents.</li><li>Hold still for 2 to 3 seconds at the start and end of every clip. It makes cutting easy.</li><li>Move slowly, or don\'t move at all. Lean the phone on something for close-ups.</li><li>No faces, names, house numbers, mail, family photos, street views or personal belongings. Skip toilets and drains.</li><li>Only film in homes where the client is fine with photos.</li></ul></div>';
  h+='<div class="sect" style="margin-top:20px"><span>Turning clips into posts</span></div><div class="card"><ol class="steps" style="margin-top:4px"><li>Once a week, make one Reel from that week\'s clips.<small>Instagram › + › Reel › pick 3 to 5 clips › trim each to 2 to 5 seconds.</small></li><li>Add the on-screen text from the idea, and a track from Instagram\'s audio library.</li><li>Caption: one plain line on what was done, then "Pre-sale, bond and deep cleaning across Brisbane\'s inner west."</li><li>Short clips (30 seconds or less) can also go on Google: your profile › Add photos › pick the video.</li><li>The full walkthrough goes on the job itself, so it shows on the client and agent links.</li></ol></div>';
  h+='<div class="row2" style="margin-top:14px"><button type="button" class="btn sm" data-iclear>Clear today\'s ticks</button></div>';
  return h;
}
function render(){
  if(err==='login'){ app.innerHTML='<div class="center"><h1>Log in <em>first</em></h1><p class="sub">Open the hub, log in with your password, then come back here.</p><p><a class="btn primary" href="/">Go to the hub</a></p></div>'; return; }
  if(err){ app.innerHTML='<div class="center"><h1>Couldn\'t <em>load</em></h1><p class="sub">'+esc(err)+'</p><p><button class="btn" onclick="location.reload()">Try again</button></p></div>'; return; }
  if(!D) return;
  var r=location.hash.replace(/^#/,'')||'/', m=r.match(/^\/p\/(\w+)/), keepY=window.scrollY;
  if(m){
    var p=byId(m[1]); if(!p){ location.hash='#/'; return; }
    if(!cur||cur.id!==p.id){ cur={id:p.id,blob:null,url:null,axis:'y'}; keepY=0; if(needsWrite(p)) queueWrite(p.id,true); }
    app.innerHTML=viewPost(p);
    if(!cur.blob&&(p.ph||[]).length) makeImage(p);
  } else {
    if(cur){ cur=null; keepY=0; }
    if(r==='/ba'&&!BA&&!baErr) loadBA();
    if(r==='/ideas'&&!IX&&!ixErr) loadIX();
    app.innerHTML=r==='/how'?viewHow():r==='/more'?viewMore():r==='/ba'?viewBA():r==='/ideas'?viewIdeas():viewList();
  }
  window.scrollTo(0,keepY);
}
var mkSeq=0;
function makeImage(p){
  var seq=++mkSeq, id=p.id;
  draw(p).then(function(b){
    if(!cur||cur.id!==id||seq!==mkSeq) return;
    if(cur.url) URL.revokeObjectURL(cur.url);
    cur.blob=b; cur.url=URL.createObjectURL(b);
    loadImg(purl(p.ph[p.kind==='pair'?1:0])).then(function(img){ if(cur&&cur.id===id){ cur.axis=overflowAxis(p,img); } }).catch(function(){}).then(function(){
      var pv=document.getElementById('pv'); if(pv) pv.innerHTML='<img src="'+cur.url+'" alt="The finished image for this post">';
      var sb=document.querySelector('[data-share]'); if(sb) sb.disabled=false;
      var fp=document.getElementById('fpos'); var pp=byId(id); if(fp&&pp){ var v=cur.axis==='x'?pp.fx:pp.fy; fp.value=Math.round((v==null?.5:v)*100); }
    });
  }).catch(function(e){ var pv=document.getElementById('pv'); if(pv) pv.innerHTML='<span class="ld">'+esc(e.message)+'. <button type="button" class="btn sm" data-swap="">Use a different photo</button></span>'; });
}
function save(id,body,quiet){ body.action='save'; body.id=id; return inLine(function(){ return api('POST',body); }).then(function(d){ var p=byId(id); if(p&&d.post){ ['cap','head','txt','fx','fy','edited'].forEach(function(k){ p[k]=d.post[k]; }); } if(!quiet) toast('Saved'); }).catch(function(e){ toast(e.message); }); }

// ---------- actions ----------
document.addEventListener('click',function(e){
  var t=e.target.closest('button,a'); if(!t) return;
  var p=cur&&byId(cur.id);
  if(t.hasAttribute('data-share')&&p&&cur.blob){
    copyText(p.cap||'');
    var f=null; try{ f=new File([cur.blob],fileName(p),{type:'image/jpeg'}); }catch(x){}
    if(f&&navigator.canShare&&navigator.canShare({files:[f]})){
      navigator.share({files:[f]}).then(function(){ toast(p.ch==='ig'?'Now paste the caption in Instagram, then Mark posted':'Now open your Google profile and paste the text',3600); }).catch(function(x){ if(x&&x.name!=='AbortError') toast('Couldn\'t open sharing. Use Save image only.'); });
    } else { download(p); toast((p.ch==='ig'?'Caption':'Text')+' copied and image saved',3000); }
    return;
  }
  if(t.hasAttribute('data-save')&&p&&cur.blob){ download(p); return; }
  if(t.hasAttribute('data-copylink')&&p){ copyText(D.pages[p.svc]||D.pages.other); toast('Link copied'); return; }
  if(t.hasAttribute('data-bareload')){ BA=null; baErr=''; render(); return; }
  if(t.hasAttribute('data-pp')){
    var ch=t.getAttribute('data-pp'), aid=t.getAttribute('data-aid'); t.disabled=true;
    inLine(function(){ return api('POST',{action:'pairpost',aid:aid,ch:ch}); }).then(function(d){ put(d.post); BA=null; loadBA(); location.hash='#/p/'+d.post.id; }).catch(function(x){ t.disabled=false; toast(x.message); });
    return;
  }
  if(t.hasAttribute('data-ixnew')){ freshIX(); return; }
  if(t.hasAttribute('data-ixreload')){ IX=null; ixErr=''; render(); return; }
  if(t.hasAttribute('data-iopen')){ var oi=t.getAttribute('data-iopen'); if(ixOpen[oi]) delete ixOpen[oi]; else ixOpen[oi]=1; render(); return; }
  if(t.hasAttribute('data-icopy')){ var cx=IX&&IX.ideas.find(function(y){return y.id===t.getAttribute('data-icopy');}); if(cx){ copyText(cx.cap); toast('Caption starter copied'); } return; }
  if(t.hasAttribute('data-ist')){
    var ix=IX&&IX.ideas.find(function(y){return y.id===t.getAttribute('data-iid');}); if(!ix) return;
    var nv=t.getAttribute('data-ist'); nv=ix.st===nv?'':nv; var was2=ix.st; ix.st=nv; if(nv==='no') delete ixOpen[ix.id]; render();
    if(nv==='no') toast('Got it. Fewer like that.');
    api('POST',{action:'idea',id:ix.id,st:nv}).catch(function(e){ ix.st=was2; render(); toast(e.message); });
    return;
  }
  if(t.hasAttribute('data-if')){ e.preventDefault(); iF=t.getAttribute('data-if'); render(); return; }
  if(t.hasAttribute('data-iclear')){ iSave({d:D.today,t:{}}); render(); toast('Ticks cleared'); return; }
  if(t.hasAttribute('data-baf')){ e.preventDefault(); baF=t.getAttribute('data-baf'); render(); window.scrollTo(0,0); return; }
  if(t.hasAttribute('data-jk')){
    var jaid=t.getAttribute('data-aid'), x=BA&&BA.find(function(y){return y.a.id===jaid;}); if(!x) return;
    var v=t.getAttribute('data-jk'); v=x.jk===v?'':v; var was=x.jk; x.jk=v;
    // In "To review", the card leaves the list; keep the screen where it is.
    render();
    inLine(function(){ return api('POST',{action:'pairjudge',aid:jaid,v:v}); }).catch(function(er){ x.jk=was; render(); toast(er.message); });
    return;
  }
  if(t.hasAttribute('data-ig')){ setTimeout(function(){ if(document.visibilityState==='visible') toast('If Instagram didn\'t open, open it from your home screen'); },1500); return; }
  if(t.hasAttribute('data-status')&&p){
    var st=t.getAttribute('data-status'); t.disabled=true;
    inLine(function(){ return api('POST',{action:'status',id:p.id,status:st}); }).then(function(d){ put(d.post); if(st==='posted'){ toast('Posted. Nice work.'); location.hash='#/'; } else render(); }).catch(function(x){ t.disabled=false; toast(x.message); });
    return;
  }
  if((t.hasAttribute('data-swap')||t.hasAttribute('data-reject'))&&p){
    var rej=t.hasAttribute('data-reject'); if(rej&&!confirmSoft(t)) return;
    t.disabled=true; delete notes[p.id];
    inLine(function(){ return api('POST',{action:'swap',id:p.id,kind:t.getAttribute('data-swap')||'',reject:rej}); }).then(function(d){ put(d.post); cur.blob=null; if(cur.url){ URL.revokeObjectURL(cur.url); cur.url=null; } render(); if(D.ai&&!d.post.edited&&(d.post.ph||[]).length) queueWrite(p.id,true); if(!(d.post.ph||[]).length) toast('No other photos left to use right now'); }).catch(function(x){ t.disabled=false; toast(x.message); });
    return;
  }
  if(t.hasAttribute('data-rewrite')&&p){ if(noteT){ clearTimeout(noteT); noteT=null; var ne=document.getElementById('note'); if(ne) save(p.id,{note:ne.value},true); } delete notes[p.id]; queueWrite(p.id,true); render(); return; }
  if(t.hasAttribute('data-extra')){
    t.disabled=true;
    inLine(function(){ return api('POST',{action:'extra',ch:t.getAttribute('data-extra')}); }).then(function(d){ put(d.post); location.hash='#/p/'+d.post.id; }).catch(function(x){ t.disabled=false; toast(x.message); });
  }
});
var armed=null;
function confirmSoft(t){ if(armed===t){ armed=null; return true; } armed=t; var was=t.textContent; t.textContent='Tap again to confirm'; setTimeout(function(){ if(armed===t){ armed=null; t.textContent=was; } },3000); return false; }
function download(p){ var a=document.createElement('a'); a.href=cur.url; a.download=fileName(p); document.body.appendChild(a); a.click(); a.remove(); }
var noteT,capT=null;
document.addEventListener('input',function(e){
  var p=cur&&byId(cur.id); var t=e.target;
  if(t.id==='cap'&&p){ p.cap=t.value; p.edited=1; var c=document.getElementById('cnt'); if(c) c.textContent=t.value.length+(p.ch==='gbp'?' / 1500':' / 2200'); clearTimeout(capT); capT=setTimeout(function(){ save(p.id,{cap:t.value},true); },700); }
  if(t.id==='note'&&p){ var had=!!(p.note||'').trim(); p.note=t.value; clearTimeout(noteT); noteT=setTimeout(function(){ save(p.id,{note:t.value},true); },600); if(had!==!!t.value.trim()){ var rb=document.querySelector('[data-rewrite]'); if(rb) rb.textContent=t.value.trim()?'Write it with my note':(p.ai?'Rewrite with Claude':'Write with Claude'); } }
  if(t.id==='hd'&&p){ p.head=t.value; clearTimeout(capT); capT=setTimeout(function(){ save(p.id,{head:t.value},true); makeImage(p); },500); }
  if(t.id==='fpos'&&p){ var v=+t.value/100; if(cur.axis==='x') p.fx=v; else p.fy=v; clearTimeout(capT); capT=setTimeout(function(){ makeImage(p); save(p.id,cur.axis==='x'?{fx:v}:{fy:v},true); },180); }
});
document.addEventListener('change',function(e){
  var p=cur&&byId(cur.id), t=e.target;
  if(t.id==='txt'&&p){ p.txt=t.checked?1:0; save(p.id,{txt:p.txt},true); cur.blob=null; render(); }
  if(t.id==='sg'||t.id==='si'){
    var gb=+document.getElementById('sg').value, ig=+document.getElementById('si').value;
    inLine(function(){ return api('POST',{action:'settings',gbp:gb,ig:ig}); }).then(function(d){ D.settings=d.settings; D.posts=d.posts; render(); toast('Rhythm updated. The plan has been redone.'); }).catch(function(x){ toast(x.message); });
  }
});
document.addEventListener('change',function(e){ var c=e.target; if(!c.hasAttribute||!c.hasAttribute('data-itk')) return; var o=iTicks(); if(c.checked) o.t[c.getAttribute('data-itk')]=1; else delete o.t[c.getAttribute('data-itk')]; iSave(o); render(); });
window.addEventListener('hashchange',render);
// Keep "The rest" open across redraws (the page redraws as Claude rates each batch).
document.addEventListener('toggle',function(e){ var k=e.target&&e.target.getAttribute&&e.target.getAttribute('data-prop'); if(k) baOpen[k]=e.target.open; },true);
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&D&&!cur) load(true); });

function load(quiet){
  return api('GET').then(function(d){
    D=d; err=''; render();
    D.posts.filter(needsWrite).slice(0,6).forEach(function(p){ queueWrite(p.id); });
  }).catch(function(e){ if(!quiet){ err=e.status===401?'login':e.message; render(); } });
}
if(!key()){ err='login'; render(); } else load();
})();
</script>
