<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#F5F0EB">
<title>Growth hub · Bardon Clean</title>
<link rel="icon" type="image/png" href="/icons/favicon.png?v=2"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--t:#C06B3C;--td:#A55830;--dark:#1A1A1A;--cream:#F5F0EB;--cd:#EDE6DE;--body:#4A4A4A;--meta:#6B635B;--gold:#F4B942;--gd:#9A6B0E;--white:#fff;--line:#DDD3C8;--tint:#FBF3EE;--ok:#2F5A35;--okb:#E6EFE3;--red:#9B2C1F;--redb:#FBEBEB;
  --serif:"Playfair Display",Georgia,serif;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--body);font:400 15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
#app{max-width:760px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 16px calc(70px + env(safe-area-inset-bottom,0px))}
a{color:var(--td)}button,input,select,textarea{font-family:var(--sans)}
:focus-visible{outline:2px solid var(--t);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top a{font:500 14px var(--sans);color:var(--meta);text-decoration:none;padding:10px 0;min-height:44px;display:inline-flex;align-items:center}
h1{font:700 30px/1.15 var(--serif);color:var(--dark);margin:2px 0 0}h1 em,h2 em{font-style:italic;font-weight:500}
h2{font:700 20px/1.2 var(--serif);color:var(--dark);margin:26px 0 10px}
h3{font:600 15.5px/1.3 var(--sans);color:var(--dark);margin:0}
.sub{color:var(--meta);font-size:13.5px;margin:4px 0 0}
p.lead{margin:6px 0 0;font-size:14.5px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px -16px 0;padding:8px 16px 4px;scrollbar-width:none;position:sticky;top:0;background:var(--cream);z-index:3}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--white);color:var(--dark);border-radius:999px;padding:0 14px;font:500 14px var(--sans);cursor:pointer;min-height:42px;white-space:nowrap}
.tab[aria-current="page"]{background:var(--dark);border-color:var(--dark);color:var(--cream)}
.tab .n{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:10px;background:var(--t);color:#fff;font:600 12px/20px var(--sans)}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.card.hl{background:var(--tint);border-color:#EBD3C2}
.card.due{border-left:4px solid var(--t)}
.todo{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--white);border:1px solid var(--line);border-left:4px solid var(--t);border-radius:12px;padding:12px 14px;margin-top:8px;cursor:pointer;font:500 15px var(--sans);color:var(--dark);min-height:52px}
.todo b{font:700 22px/1 var(--serif);color:var(--td);margin-right:10px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.btn{font:600 14.5px/1 var(--sans);border-radius:8px;min-height:44px;padding:0 14px;cursor:pointer;border:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;background:var(--td);color:#fff}
.btn.o{background:var(--white);border:1.5px solid var(--line);color:var(--dark)}
.btn.q{background:none;color:var(--meta);padding:0 8px}
.btn.sm{min-height:38px;font-size:13.5px;padding:0 12px}
.btn[disabled]{opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
.stat{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat span{display:block;font-size:12.5px;color:var(--meta)}.stat b{display:block;font:700 24px/1.2 var(--serif);color:var(--dark);font-variant-numeric:tabular-nums;margin-top:2px}
.stat small{display:block;font-size:12px;color:var(--meta)}
.stat.hl{background:var(--tint);border-color:#EBD3C2}
.stat.good b{color:var(--ok)}.stat.bad b{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 11px/1.2 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--meta);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid var(--cd);vertical-align:top;font-variant-numeric:tabular-nums}
td.r,th.r{text-align:right}
.tw{overflow-x:auto;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:4px 8px;margin-top:10px}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--cd);align-items:flex-start}.row:last-child{border:0}
.row b{color:var(--dark);font-weight:600}
.pill{display:inline-block;flex:none;height:fit-content;font:600 11px/1 var(--sans);padding:5px 8px;border-radius:999px;background:var(--cd);color:var(--dark);white-space:nowrap}
.pill.ok{background:var(--okb);color:var(--ok)}.pill.live{background:#F6E3D7;color:var(--td)}.pill.warn{background:#FBEBC9;color:var(--gd)}.pill.red{background:var(--redb);color:var(--red)}
label.f{display:grid;gap:4px;font:500 13px var(--sans);color:var(--dark);margin-top:10px}
input,select,textarea{font-size:16px;border:1px solid var(--line);border-radius:8px;padding:10px 11px;background:var(--white);color:var(--dark);width:100%}
textarea{min-height:76px;resize:vertical}
details{margin-top:8px}summary{cursor:pointer;color:var(--td);font-weight:600;font-size:14px;min-height:40px;display:flex;align-items:center}
.cap{white-space:pre-wrap;font-size:13.5px;background:var(--cream);border-radius:8px;padding:10px;margin-top:8px;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--meta);padding:24px 10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:90vw}
.err{color:var(--red);font-size:14px;margin-top:6px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--cd)}
.sw input{width:24px;height:24px;flex:none;accent-color:var(--ok)}
.bar{height:10px;border-radius:5px;background:var(--cd);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--t)}
.bar.q i{background:var(--gold)}
.wk{display:grid;grid-template-columns:110px 1fr 46px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--cd);font-size:14px}.wk:last-child{border:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:0 12px;min-height:36px;font:500 13px var(--sans);cursor:pointer;color:var(--dark)}
.chip[aria-pressed="true"]{background:var(--dark);color:var(--cream);border-color:var(--dark)}
.sws{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.sws span{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:6px 10px}.sws i{width:22px;height:22px;border-radius:5px;border:1px solid rgba(0,0,0,.1)}
.guide h3{margin-top:16px}.guide p,.guide li{font-size:14.5px}.guide ul,.guide ol{padding-left:20px;margin:6px 0}
.star{color:var(--gd)}
</style><script src="/lib/hubnav.js" data-tabs="tools"></script>
</head><body>
<div id="app"><div class="empty">Loading…</div></div>
<script>
(function(){
  var app=document.getElementById('app'), KEY=null;
  try{ KEY=localStorage.getItem('roster_admin_key'); }catch(e){}
  var TABS=[['overview','Overview'],['leads','Leads & speed'],['reviews','Reviews'],['agents','Agents'],['clients','Past clients'],['ads','Sources & ads'],['content','Content'],['pr','PR'],['brand','Brand'],['settings','Settings'],['guide','How to use']];
  var tab=(location.hash.slice(1)||'overview'), cache={}, srcDays=90, stageF='', editAgent='', logAgent='', prKind='';
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function money(v){ v=+v||0; return (v<0?'-':'')+'$'+Math.abs(Math.round(v)).toLocaleString('en-AU'); }
  var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function day(s){ if(!s) return ''; var p=String(s).slice(0,10).split('-'), d=new Date(+p[0],+p[1]-1,+p[2]); return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; }
  function ago(s){ if(!s) return 'never'; var n=Math.round((Date.now()-Date.parse(s))/864e5); return n<=0?'today':n===1?'yesterday':n+' days ago'; }
  function mins(m){ if(m==null) return '–'; if(m<60) return m+' min'; if(m<1440) return (Math.round(m/6)/10)+' h'; return Math.round(m/1440)+' d'; }
  function today(){ var d=new Date(Date.now()+10*3600e3); return d.toISOString().slice(0,10); }
  function toast(m){ var t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(function(){t.remove();},2600); }
  function api(q,body,path){ return fetch((path||'/api/marketing')+(q||''),{method:body?'POST':'GET',headers:{'content-type':'application/json','x-admin-key':KEY||''},body:body?JSON.stringify(body):undefined,cache:'no-store'}).then(function(r){ return r.json().catch(function(){return {};}).then(function(d){ if(!r.ok) throw new Error(d.error||'Something went wrong'); return d; }); }); }
  function copy(t){ try{ navigator.clipboard.writeText(t).then(function(){ toast('Copied'); },function(){ prompt('Copy',t); }); }catch(e){ prompt('Copy',t); } }
  function load(part,q,force){ var k=part+(q||''); if(cache[k]&&!force) return Promise.resolve(cache[k]); return api('?part='+part+(q||'')).then(function(d){ cache[k]=d; return d; }); }
  function drop(){ cache={}; }
  function textBtn(href,label,mark){ return href?'<a class="btn sm" href="'+esc(href)+'"'+(mark?' data-mark=\''+esc(JSON.stringify(mark))+'\'':'')+'>'+esc(label||'Text (draft ready)')+'</a>':'<span class="sub">No mobile on file.</span>'; }

  function shell(inner){
    var n=cache.overview?cache.overview.todo.reduce(function(a,x){return a+x.n;},0):0;
    return '<div class="top"><a href="/?v=more" data-hb>‹ Back</a><a href="/desk/">The desk</a></div><h1>Growth <em>hub</em></h1>'+
      '<nav class="tabs" aria-label="Growth hub sections">'+TABS.map(function(t){ return '<button type="button" class="tab" data-tab="'+t[0]+'"'+(tab===t[0]?' aria-current="page"':'')+'>'+t[1]+(t[0]==='overview'&&n?'<span class="n">'+n+'</span>':'')+'</button>'; }).join('')+'</nav>'+inner;
  }
  function draw(inner){ app.innerHTML=shell(inner); var c=app.querySelector('[aria-current="page"]'); if(c&&c.scrollIntoView) c.scrollIntoView({inline:'center',block:'nearest'}); }
  function render(force){
    if(!KEY){ app.innerHTML='<div class="empty"><h1>Log in <em>first</em></h1><p>Open the hub, log in, then come back here.</p><a class="btn" href="/">Open the hub</a></div>'; return; }
    draw('<div class="empty">Loading…</div>');
    var f=VIEWS[tab]||VIEWS.overview;
    Promise.resolve(f(force)).then(function(h){ draw(h); }).catch(function(e){ draw('<div class="card err">'+esc(e.message)+'</div>'); });
  }

  // ---------------- Media opportunities (lib/media.mjs) ----------------
  var MEDIA=null, mScan=false, mSeas=false, mRel={}, mOpen={};
  function mediaHtml(m){
    var h='<h2>Media <em>opportunities</em></h2>';
    if(!m||m.err) return h+'<div class="card err">'+esc(m&&m.err||'Couldn\'t load')+'</div>';
    if(!m.ai) return h+'<div class="card">This needs the Claude key (ANTHROPIC_API_KEY) in Netlify, the same one the captions use.</div>';
    h+='<p class="sub">Every morning the hub reads the week\'s Australian news on cleaning, renting, bonds, mould, selling and home care, and picks the stories where you\'re a credible expert voice. You get a phone ping when there\'s one.'+(m.last?' Last checked '+esc(ago(m.last.at))+(m.last.err?' (didn\'t finish: '+esc(m.last.err)+')':': '+m.last.read+' stories read, '+m.last.found+' worth your time')+'.':'')+'</p>';
    h+='<div class="acts"><button type="button" class="btn sm" data-mscan'+(mScan?' disabled':'')+'>'+(mScan?'Reading the news…':'Check the news now')+'</button><button type="button" class="btn o sm" data-mseas'+(mSeas?' disabled':'')+'>'+(mSeas?'Thinking…':'3 story ideas')+'</button></div>';
    var O=m.opps;
    if(!O.length) return h+'<div class="card empty">Nothing yet. Tap Check the news now, or tap 3 story ideas.</div>';
    return h+O.map(oppCard).join('');
  }
  function oppCard(o){
    var n=o.news, open=mOpen[o.id]||'', fresh=o.at===today();
    var h='<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><h3>'+esc(n?n.title:o.title)+'</h3><p class="sub">'+esc(n?[n.src,day(n.date)].filter(Boolean).join(' · '):'Seasonal story · '+day(o.at))+'</p></div><span class="pill'+(o.score>=5?' live':o.score>=4?' ok':'')+'">'+(o.st==='saved'?'In pitches':o.score>=5?'Strong':o.score>=4?'Good fit':'Worth a look')+(fresh&&o.st!=='saved'?' · new':'')+'</span></div>';
    h+='<p><b>Why now:</b> '+esc(o.why)+'</p><p><b>Your angle:</b> '+esc(o.angle)+'</p><p class="sub"><b>Who to pitch:</b> '+esc(o.outlets)+'</p>';
    h+='<div class="acts">'+(n?'<a class="btn o sm" href="'+esc(n.url)+'" target="_blank" rel="noopener">Read the story</a>':'')+'<button type="button" class="btn o sm" data-mopen="'+o.id+'" data-w="pitch" aria-expanded="'+(open==='pitch')+'">Pitch email</button><button type="button" class="btn sm" data-mrel="'+o.id+'"'+(mRel[o.id]?' disabled':'')+'>'+(mRel[o.id]?'Writing…':o.rel?'Media release':'Write the media release')+'</button></div>';
    if(open==='pitch') h+='<div class="card" style="background:var(--cream,#F5F0EB)"><p class="sub">Subject</p><p><b>'+esc(o.subj)+'</b></p><p style="white-space:pre-wrap">'+esc(o.pitch)+'</p><div class="acts"><button type="button" class="btn o sm" data-mcopy="'+o.id+'" data-w="pitch">Copy</button><a class="btn o sm" href="mailto:?subject='+encodeURIComponent(o.subj)+'&body='+encodeURIComponent(o.pitch)+'">Open in email</a></div></div>';
    if(open==='rel'&&o.rel) h+='<div class="card" style="background:var(--cream,#F5F0EB)"><p class="sub">Draft. Check every line is true before it goes out.</p><p style="white-space:pre-wrap;font-size:14px">'+esc(o.rel.text)+'</p><div class="acts"><button type="button" class="btn o sm" data-mcopy="'+o.id+'" data-w="rel">Copy</button><a class="btn o sm" href="mailto:?subject='+encodeURIComponent('Media release: '+o.rel.head)+'&body='+encodeURIComponent(o.rel.text)+'">Open in email</a><button type="button" class="btn q sm" data-mrel="'+o.id+'" data-again="1">Rewrite</button></div></div>';
    h+='<div class="acts">'+(o.st==='saved'?'':'<button type="button" class="btn q sm" data-mpitch="'+o.id+'">Add to my pitches</button>')+'<button type="button" class="btn q sm" data-mno="'+o.id+'">Not relevant</button></div>';
    return h+'</div>';
  }
  function mFind(id){ return MEDIA&&MEDIA.opps.find(function(x){ return x.id===id; }); }
  function mRedraw(){ if(tab==='pr') VIEWS.pr(false).then(function(h){ var y=window.scrollY; draw(h); window.scrollTo(0,y); }); }
  function mScanNow(){
    mScan=true; mRedraw(); var start=Date.now();
    function finish(m){ mScan=false; if(m) toast(m); delete cache.media; mRedraw(); }
    function sync(){ api('',{action:'media-scan'}).then(function(d){ finish(d.found?d.found+' new '+(d.found===1?'story':'stories')+' worth your time':'Nothing new worth your time today'); }).catch(function(x){ finish(x.message); }); }
    fetch('/.netlify/functions/media-scan-background',{method:'POST',headers:{'x-admin-key':KEY||''}}).then(function(r){
      if(r.status!==202) return sync();
      (function poll(){ setTimeout(function(){ api('?part=media').then(function(m){ if(m.last&&Date.parse(m.last.at)>start-2000){ cache.media=m; finish(m.last.err?m.last.err:(m.last.found?m.last.found+' new worth your time':'Nothing new worth your time today')); } else if(Date.now()-start<120000) poll(); else finish('Still reading. Check back in a few minutes.'); }).catch(function(){ if(Date.now()-start<120000) poll(); else finish(); }); },5000); })();
    }).catch(sync);
  }

  var VIEWS={
    // ---------------- Overview ----------------
    overview:function(f){ return load('overview','',f).then(function(d){
      var h='<p class="lead">How the business is growing, and the few things worth doing this week. Measured in leads, won jobs and revenue.</p>';
      if(d.todo.length){ h+='<h2>Worth doing <em>now</em></h2>'+d.todo.map(function(x){ return '<button type="button" class="todo" data-tab="'+x.tab+'"><span><b>'+x.n+'</b>'+esc(x.label)+'</span><span>›</span></button>'; }).join(''); }
      else h+='<div class="card empty">Nothing waiting on you here. Nice.</div>';
      var sp=d.speed, rv=d.reviews;
      h+='<h2>The <em>numbers</em></h2><div class="grid2">';
      h+='<div class="stat hl"><span>Won, last 90 days</span><b>'+money(d.revenue.total)+'</b><small>'+d.revenue.agents+'% from agents · '+d.revenue.repeat+'% repeat &amp; referral</small></div>';
      h+='<div class="stat"><span>Leads, last 30 days</span><b>'+d.funnel.leads+' → '+d.funnel.quoted+' → '+d.funnel.won+'</b><small>leads → quoted → won'+(d.funnel.rate!=null?' · '+d.funnel.rate+'% of quotes won':'')+'</small></div>';
      h+='<div class="stat '+(sp.median==null?'':sp.median<=sp.target?'good':'bad')+'"><span>Median first reply</span><b>'+mins(sp.median)+'</b><small>Target '+sp.target+' min'+(sp.waiting?' · <b style="display:inline;font:600 12px var(--sans);color:var(--red)">'+sp.waiting+' waiting</b>':'')+'</small></div>';
      h+='<div class="stat"><span>Google reviews this month</span><b>'+(rv.newMonth!=null?rv.newMonth:rv.leftMonth)+' <span style="font:400 14px var(--sans);color:var(--meta)">of '+rv.target+'</span></b><small>'+(rv.latest?rv.latest.rating+'★ · '+rv.latest.count+' total ('+day(rv.latest.date)+')':'Log your rating in Reviews')+' · '+rv.asked30+' asked in 30 days</small></div>';
      h+='<div class="stat"><span>Active agent partners</span><b>'+d.agentsActive+'</b><small>Referred a job in the last 90 days</small></div>';
      h+='<div class="stat"><span>Clients opted in to offers</span><b>'+d.consent.yes+' <span style="font:400 14px var(--sans);color:var(--meta)">of '+d.consent.clients+'</span></b><small>'+(d.consent.out?d.consent.out+' unsubscribed':'None unsubscribed')+'</small></div>';
      h+='</div>';
      h+='<h2>Next four <em>weeks</em></h2><div class="card">'+d.weeks.map(function(w){ return '<div class="wk"><span>'+esc(day(w.from))+'</span><div class="bar'+(w.quiet?' q':'')+'"><i style="width:'+Math.min(100,w.pct)+'%"></i></div><b style="text-align:right;color:'+(w.quiet?'var(--gd)':'var(--dark)')+'">'+w.pct+'%</b></div>'; }).join('')+'<p class="sub">Share of booking slots filled each week (Mon to Sat). Yellow = under your quiet-week line.</p></div>';
      if(d.levers.length) h+='<div class="card hl"><h3>Fill the quiet '+(d.quiet===1?'week':'weeks')+'</h3><p class="sub">Cheapest first.</p>'+d.levers.map(function(l){ return '<div class="row"><span>'+esc(l.label)+'</span><button type="button" class="btn o sm" data-tab="'+l.tab+'">Go</button></div>'; }).join('')+'</div>';
      if(d.revenue.top.length) h+='<h2>Where work <em>comes from</em></h2><div class="tw"><table><thead><tr><th>Source · 90 days</th><th class="r">Leads</th><th class="r">Won</th><th class="r">Revenue</th></tr></thead><tbody>'+d.revenue.top.map(function(x){ return '<tr><td>'+esc(x.source)+'</td><td class="r">'+x.leads+'</td><td class="r">'+x.won+'</td><td class="r"><b>'+money(x.revenue)+'</b></td></tr>'; }).join('')+'</tbody></table></div><div class="acts"><button type="button" class="btn o sm" data-tab="ads">All sources &amp; spend</button></div>';
      if(d.channels.length) h+='<h2>Paid <em>channels</em></h2><div class="tw"><table><thead><tr><th>Channel</th><th class="r">Spend</th><th class="r">Won</th><th class="r">Per won job</th></tr></thead><tbody>'+d.channels.map(function(c){ return '<tr><td>'+esc(c.label)+'</td><td class="r">'+money(c.spend)+'</td><td class="r">'+c.won+'</td><td class="r"><b>'+(c.perWon!=null?money(c.perWon):'–')+'</b></td></tr>'; }).join('')+'</tbody></table></div>';
      return h;
    }); },

    // ---------------- Leads & speed ----------------

  function buildLink(){
    var o=document.getElementById('lbOut'); if(!o) return;
    var g=function(k){ var e=document.querySelector('[data-lb="'+k+'"]'); return e?e.value.trim():''; };
    var w=g('where'), svc=g('svc'), camp=g('camp').toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-|-$/g,'');
    var src={gbp:'gbp',instagram:'instagram',facebook:'facebook','google-ads':'google',flyer:'flyer',email:'email',agent:'agent'}[w];
    var med={gbp:'post',instagram:'social',facebook:'social','google-ads':'cpc',flyer:'print',email:'email',agent:'print'}[w];
    var q=['utm_source='+src,'utm_medium='+med];
    if(camp) q.push('utm_campaign='+camp); else if(svc) q.push('utm_campaign='+svc);

    o.textContent=location.origin+'/quote?'+q.join('&');

  function replyDraft(){

  var GUIDE='<div class="guide"><p class="lead">The Growth hub turns what the hub already knows (leads, quotes, jobs, photos, clients and the roster) into the handful of marketing jobs worth doing each week. Nothing marketing-related is ever sent without you tapping send, except the optional instant "got it" text.</p>'+
    '<h3>Your week</h3><ol><li><b>As leads land:</b> your phone pings. Reply fast. If someone waits past your target, you get a second ping.</li><li><b>10am daily:</b> if any finished clients haven\'t been asked for a review, you get a ping. Open Reviews, tap Text (draft ready), send.</li><li><b>Post days:</b> your Google or Instagram post is ready in Social &amp; Google posts.</li><li><b>Monday (15 min):</b> open Overview. Work through "Worth doing now": agents due a touch, past clients to nudge, referral thank-yous. Glance at the four-week bars.</li><li><b>Monthly (30 min):</b> log ad spend in Sources &amp; ads, log your Google rating in Reviews, decide keep, cut or scale for each paid channel. If you run Google Ads, upload the won-jobs file.</li><li><b>Quarterly:</b> send each partner agent their wrap-up from Agents, and refresh your target agent list.</li></ol>'+
    '<h3>Overview</h3><p>The numbers that change decisions: revenue won by source (and how much comes from agents, repeat and referral clients), leads → quoted → won, your median first-reply time, reviews this month against your target, active agent partners and how many clients have opted in to offers. The four-week bars show how full each week is. If a week is under your quiet-week line, a card lists the cheapest ways to fill it.</p>'+
    '<h3>Leads &amp; speed</h3><p>Who is waiting on a first reply, with a live clock. Your reply speed over 30 days. The optional instant "got it" text (off by default). Leads, quotes and wins by service.</p>'+
    '<h3>Reviews</h3><p>Every finished client from the last 45 days appears once, newest first. Tap Text (draft ready) to open the message in Messages; the hub marks them as asked. After a few days they move to one gentle reminder. Mark "They left one" when you see it on Google. Log your Google rating and total now and then so the hub can count new reviews each month. The reply helper drafts responses to good and bad reviews.</p>'+
    '<h3>Agents</h3><p>Your agent pipeline: Target → Introduced → Met → First job → Regular (or Not now). Portal agents with jobs appear automatically. Each card has a draft for its stage (an intro with the portal demo, a follow-up, or a quarterly wrap-up listing the listings you cleaned for them). Texting from the card logs the touch. Partners are flagged when they haven\'t heard from you in a while.</p>'+
    '<h3>Past clients</h3><p>Deep-clean clients coming up to their next clean, and bond and pre-sale clients who are moving and may need a clean at the new place. Each nudge includes "Reply STOP to opt out." Anyone who unsubscribed is blocked. Referrals: make a personal link for recent clients in one tap, see who they referred, and mark the thank-you given. Consent: who opted in, how and when.</p>'+
    '<h3>Sources &amp; ads</h3><p>Every source with leads, wins, win rate and revenue. Log spend by channel to see cost per lead, cost per won job and revenue per dollar. Make tracked links for posts, ads, flyers and QR codes. For Google Ads, download the won-jobs file once a month and upload it to Google Ads so it learns which clicks became paying jobs.</p>'+
    '<h3>Content, PR and Brand</h3><p>Content links to your posting tools. PR keeps media contacts, pitches and coverage together. Brand holds your colours, approved copy blocks (only facts you\'ve stated) and links to logo files, flyers and photos.</p>'+
    '<h3>The rules this follows</h3><ul><li><b>Spam Act:</b> marketing texts need consent, must say who they\'re from, and must offer an opt-out. Consent comes from the tick-boxes, and STOP replies are honoured automatically.</li><li><b>Google:</b> ask every client the same way. Don\'t ask only happy clients and don\'t offer anything for reviews.</li><li><b>ACCC:</b> no incentives for reviews. Referral thank-yous are fine and are kept separate from reviews.</li></ul><p class="sub">General information, not legal advice.</p></div>';

    if(t.dataset.lb) buildLink();
  });
  app.addEventListener('input',function(e){ if(e.target.dataset.lb) buildLink(); });
  app.addEventListener('submit',function(e){
    var f=e.target, k=f.dataset.f; if(!k) return; e.preventDefault();
    var bt=f.querySelector('button:not([type=button])'); if(bt) bt.disabled=true;
    var v={}; [].forEach.call(f.elements,function(i){ if(i.name) v[i.name]=i.value; });
    function ok(m){ toast(m||'Saved'); editAgent=''; logAgent=''; refresh(); }
    function fail(x){ if(bt) bt.disabled=false; var er=f.querySelector('.err'); if(er){ er.textContent=x.message; er.hidden=false; } else toast(x.message); }
    var map={rating:'rating',agent:'agent-save',alog:'agent-log',spend:'spend-add',pr:'pr-save',consent:'consent-add'};
    if(k==='agent') v.id=f.dataset.id; if(k==='alog') v.id=f.dataset.id;
    api('',Object.assign({action:map[k]},v)).then(function(){ ok(); }).catch(fail);
  });
  window.addEventListener('hashchange',function(){ var t=location.hash.slice(1); if(t&&t!==tab){ tab=t; render(); } });
  render();
  if(tab!=='overview') load('overview').then(function(d){ var b=app.querySelector('[data-tab="overview"]'), n=d.todo.reduce(function(a,x){return a+x.n;},0); if(b&&n&&!b.querySelector('.n')) b.insertAdjacentHTML('beforeend','<span class="n">'+n+'</span>'); }).catch(function(){});
})();
</script>
</body></html>
