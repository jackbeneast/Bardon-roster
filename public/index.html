<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#F5F0EB">
<title>Bardon Clean Roster</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="icon" type="image/png" href="/icons/favicon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BardonCleanHub"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --terracotta:#C06B3C;--terracotta-dark:#A55830;--dark:#1A1A1A;--cream:#F5F0EB;--cream-dark:#EDE6DE;
  --body:#4A4A4A;--meta:#7A7A7A;--gold:#F4B942;--white:#FFFFFF;--line:#DDD3C8;--tint:#FBF3EE;
  --serif:"Playfair Display",Georgia,serif;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--cream);color:var(--body);font:400 15px/1.5 var(--sans);margin:0}
#app{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:20px 96px}
h1{font:700 28px/1.15 var(--serif);color:var(--dark);margin:0;text-wrap:balance}
h1 em{font-style:italic;font-weight:500}
.sub{color:var(--meta);font-size:14px;margin:4px 0 0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand svg{width:40px;height:40px;flex:none}
.brand .wm{font:700 20px/1 var(--serif);color:var(--dark);letter-spacing:.01em}
.brand .wm small{display:block;font:500 11px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--meta);margin-top:5px}
.mode{font:500 12px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--meta);border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:var(--white)}
.mode.edit{color:var(--terracotta);border-color:var(--terracotta)}

.bar{display:flex;gap:8px;overflow-x:auto;margin:18px -16px 0;padding:2px 16px 6px;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.chip{flex:none;font:500 14px/1 var(--sans);border:1px solid var(--line);background:var(--white);color:var(--dark);border-radius:999px;padding:10px 14px;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--dark);color:var(--cream);border-color:var(--dark)}
.chip .n{font-variant-numeric:tabular-nums;color:var(--meta);font-size:12px}
.chip[aria-pressed="true"] .n{color:#BDB5AD}

.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.nav .range{font:600 14px/1.2 var(--sans);color:var(--dark);text-align:center;flex:1}
.icon-btn{border:1px solid var(--line);background:var(--white);color:var(--dark);border-radius:6px;min-width:44px;min-height:40px;font:600 14px var(--sans);cursor:pointer;padding:0 12px}

.warn{margin-top:14px;background:var(--white);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:6px;padding:10px 12px;font-size:14px;color:var(--dark)}

.day{margin-top:22px}
.day h2{font:600 13px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--meta);margin:0 0 10px;display:flex;gap:8px;align-items:center}
.day h2 .today{color:var(--terracotta)}
.day .empty{font-size:14px;color:var(--meta);padding:4px 0}
.jobs{display:grid;gap:10px}
.job{background:var(--white);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;grid-template-columns:64px 1fr;gap:12px;text-align:left;width:100%;font:inherit;color:inherit}
button.job{cursor:pointer}
button.job:hover{border-color:#C9BBAC}
.job.unassigned{border-left:4px solid var(--terracotta)}
.time{font:600 15px/1.2 var(--sans);color:var(--dark);font-variant-numeric:tabular-nums}
.time small{display:block;font-weight:400;font-size:12px;color:var(--meta);margin-top:3px}
.what{min-width:0}
.client{font:700 17px/1.25 var(--serif);color:var(--dark)}
.meta{font-size:13px;color:var(--meta);margin-top:2px;overflow-wrap:anywhere}
.svc{display:inline-block;font:500 11px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--terracotta-dark);background:var(--tint);border-radius:4px;padding:4px 6px;margin-top:8px}
.ex{display:inline-block;font:500 11px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:#7A5A12;background:#FCEFD0;border-radius:4px;padding:4px 6px;margin-top:8px;margin-left:4px}
.who{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.person{display:inline-flex;align-items:center;gap:6px;font:500 13px/1 var(--sans);color:var(--dark);background:var(--cream);border-radius:999px;padding:4px 10px 4px 4px}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 10px/1 var(--sans);color:var(--white);background:var(--dark)}
.none{font:600 13px/1 var(--sans);color:var(--terracotta)}
.notes{font-size:13px;color:var(--body);margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere}

.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--terracotta);color:var(--white);border:0;border-radius:999px;min-height:54px;padding:0 22px;font:600 16px/1 var(--sans);box-shadow:0 6px 18px rgba(26,26,26,.18);cursor:pointer}
.fab:hover{background:var(--terracotta-dark)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
.ghost{background:none;border:0;color:var(--terracotta);font:500 14px var(--sans);text-decoration:underline;cursor:pointer;padding:8px 0;margin-right:14px}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(26,26,26,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--white);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:12px}}
.sheet h3{font:700 22px/1.2 var(--serif);color:var(--dark);margin:0 0 14px}
.sheet h3 em{font-style:italic;font-weight:500}
.fgrid{display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.l{font:500 13px/1.3 var(--sans);color:var(--dark);display:block}
.sheet input,.sheet select,.sheet textarea{width:100%;margin-top:6px;font:400 16px/1.3 var(--sans);color:var(--dark);background:var(--white);border:1px solid #CFC5BA;border-radius:6px;padding:11px;min-height:46px}
.sheet textarea{min-height:76px;resize:vertical}
.sheet input:focus,.sheet select:focus,.sheet textarea:focus,button:focus-visible{outline:2px solid var(--terracotta);outline-offset:1px}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pick label{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:9px 14px;font:500 14px/1 var(--sans);color:var(--dark);cursor:pointer}
.pick label:has(input:checked){background:var(--dark);color:var(--cream);border-color:var(--dark)}
.pick input{position:absolute;opacity:0;pointer-events:none}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{font:600 15px/1 var(--sans);border-radius:6px;min-height:48px;padding:0 18px;cursor:pointer;border:0}
.btn.primary{background:var(--terracotta);color:var(--white);flex:1}
.btn.primary:hover{background:var(--terracotta-dark)}
.btn.primary:disabled{opacity:.6;cursor:progress}
.btn.outline{background:none;border:2px solid var(--line);color:var(--dark)}
.btn.danger{background:none;border:0;color:var(--terracotta-dark);text-decoration:underline;padding:0 6px}
.err{color:var(--terracotta-dark);font:500 13px/1.4 var(--sans);margin-top:10px}
.team-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--cream-dark)}
.shifts{display:grid;gap:10px;margin-top:10px}
.shift-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;background:var(--cream);border-radius:6px;padding:10px}
.shift-row .nm{font:600 14px/1.2 var(--sans);color:var(--dark);align-self:center}
.shift-row input{margin-top:4px;min-height:42px;padding:8px}
.shift-row label{font:500 12px/1 var(--sans);color:var(--meta)}
.person .st{color:var(--meta);font-weight:400;margin-left:2px}
.copybox{width:100%;min-height:180px;font:400 14px/1.5 var(--sans)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--dark);color:var(--cream);padding:10px 16px;border-radius:999px;font:500 14px var(--sans);z-index:30}
.cs{display:inline-flex;align-items:center;gap:4px;font:600 12px/1 var(--sans);border-radius:999px;padding:6px 10px;white-space:nowrap}
.cs.ok{background:#E6EFE3;color:#2F5A35}.cs.wait{background:#FCEFD0;color:#7A5A12}.cs.no{background:#F8E1D6;color:var(--terracotta-dark)}
.person .mk{font-weight:700;margin-left:4px}.person .mk.ok{color:#2F5A35}.person .mk.wait{color:#B58A1B}.person .mk.no{color:var(--terracotta-dark)}
.cf{margin-top:12px;padding-top:12px;border-top:1px solid var(--cream-dark)}
.cf .ask{font:600 14px/1.3 var(--sans);color:var(--dark);margin:0 0 4px}
.fd{margin-top:16px;background:var(--white);border:1px solid var(--line);border-top:4px solid var(--terracotta);border-radius:8px;padding:16px}
.fd .kick{font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--terracotta-dark);margin:0 0 6px}
.fd h2{font:700 22px/1.2 var(--serif);color:var(--dark);margin:0 0 4px}
.fd .when{font:600 16px/1.35 var(--sans);color:var(--dark);margin:10px 0 0;background:var(--tint);border-radius:6px;padding:10px 12px}
.fd dl{margin:12px 0 0;display:grid;gap:12px}
.fd dt{font:600 12px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--meta);margin-bottom:4px}
.fd dd{margin:0;color:var(--dark);font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.fd a{color:var(--terracotta-dark)}
.fd .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.cf .hint{font-size:13px;color:var(--meta);margin:0 0 10px}
.cf .row{display:flex;gap:8px;flex-wrap:wrap}
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn.yes{background:#2F5A35;color:#fff;flex:1}.btn.nope{background:none;border:2px solid var(--line);color:var(--dark)}
.warn.bad{border-left-color:var(--terracotta)}
.warn button{margin-left:6px}
.crow{padding:12px 0;border-bottom:1px solid var(--cream-dark)}
.crow .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.crow .nm{font:600 15px/1.3 var(--sans);color:var(--dark)}
.crow .ds{font-size:13px;color:var(--meta);margin-top:2px}
.crow .chg{font-size:12px;color:#7A5A12;margin-top:4px}
.seg{display:flex;gap:6px;margin-top:10px}
.seg button{flex:1;min-height:42px;border:1px solid var(--line);background:var(--white);border-radius:6px;font:500 13px var(--sans);color:var(--dark);cursor:pointer;padding:0 6px}
.seg button[aria-pressed="true"][data-v="yes"]{background:#2F5A35;color:#fff;border-color:#2F5A35}
.seg button[aria-pressed="true"][data-v="wait"]{background:#FCEFD0;color:#7A5A12;border-color:#E8D29A}
.seg button[aria-pressed="true"][data-v="no"]{background:var(--terracotta);color:#fff;border-color:var(--terracotta)}
.seg a{flex:none;display:inline-flex;align-items:center;font:500 13px var(--sans);color:var(--terracotta);padding:0 6px}
.cgroup h4{font:600 12px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--meta);margin:18px 0 0}
.team-row input{margin-top:6px}
footer{margin-top:30px;font-size:12px;color:var(--meta)}
.rates{margin-top:28px;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.rates summary{font:600 14px/1.4 var(--sans);color:var(--dark);cursor:pointer}
.rates table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px;font-variant-numeric:tabular-nums}
.rates td{padding:8px 0;border-bottom:1px solid var(--cream-dark);color:var(--dark)}
.rates td:last-child{text-align:right;font-weight:600;white-space:nowrap;padding-left:12px}
.rates p{font-size:12px;color:var(--meta);margin:8px 0 0}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}

.btn:disabled{opacity:.6}
.lv{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--sans);border-radius:999px;padding:6px 10px;margin-top:8px;background:var(--cream);color:var(--dark)}
.lv.on{background:#F6E3D7;color:var(--terracotta-dark)}.lv.on::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--terracotta)}
.lv.ok{background:#E6EFE3;color:#2F5A35}
.ag{font-size:12px;color:var(--terracotta-dark);margin-top:6px}
.lsec{margin-top:18px;padding-top:14px;border-top:1px solid var(--cream-dark)}
.lsec h4{font:600 12px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--meta);margin:0 0 10px}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--cream-dark)}
.lrow:last-child{border:0}
.lrow .nm{font:600 14px/1.3 var(--sans);color:var(--dark)}
.lrow .ds{font-size:12px;color:var(--meta)}
.rseg{display:flex;gap:4px;flex:none}
.rseg button{min-height:36px;border:1px solid var(--line);background:var(--white);border-radius:6px;font:500 12px var(--sans);color:var(--dark);padding:0 9px;cursor:pointer}
.rseg button[aria-pressed="true"][data-st="p"]{background:var(--terracotta);border-color:var(--terracotta);color:#fff}
.rseg button[aria-pressed="true"][data-st="d"]{background:#2F5A35;border-color:#2F5A35;color:#fff}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-top:10px}
.thumb{position:relative;aspect-ratio:1;max-width:100%;border-radius:6px;overflow:hidden;background:var(--cream-dark)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb span{position:absolute;left:4px;bottom:4px;font:600 10px/1 var(--sans);background:rgba(26,26,26,.75);color:#fff;border-radius:4px;padding:3px 5px}
.thumb button{position:absolute;right:3px;top:3px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(26,26,26,.75);color:#fff;font:600 14px/1 var(--sans);cursor:pointer}
.tick{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:15px;color:var(--dark);cursor:pointer}
.tick input{width:22px;height:22px;min-height:0;margin:0;accent-color:#2F5A35}
.flagi{border-left:3px solid var(--gold);background:var(--cream);border-radius:0 6px 6px 0;padding:8px 10px;margin-bottom:8px;font-size:14px;color:var(--dark);display:flex;gap:8px;justify-content:space-between}
.flagi b{display:block}
.linkbox{font:400 13px/1.4 var(--sans);background:var(--cream);border-radius:6px;padding:8px 10px;word-break:break-all;color:var(--dark);margin-top:6px;user-select:all}
.req{margin-top:14px;background:var(--white);border:1px solid var(--line);border-left:4px solid var(--terracotta);border-radius:6px;padding:12px;font-size:14px;color:var(--dark)}
.req .rk{font:600 12px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--terracotta-dark);margin-bottom:6px}
.req p{margin:4px 0;color:var(--body)}
.req .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* On-the-go: bottom bar, today screen, quick actions */
body.has-nav #app{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--white);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font:500 11px/1 var(--sans);color:var(--meta);padding:6px 2px;min-height:52px;cursor:pointer;position:relative}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--terracotta-dark)}
.tabbar .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--terracotta);color:#fff;font:600 10px/17px var(--sans);padding:0 4px}
.tabbar .add{color:var(--dark)}
.tabbar .add span.c{width:50px;height:50px;border-radius:50%;background:var(--terracotta);color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 4px 14px rgba(192,107,60,.35)}
.tabbar .add span.c svg{width:26px;height:26px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.topbar .wm{font:700 18px/1 var(--serif);color:var(--dark)}
.topbar .refresh{background:none;border:0;color:var(--meta);font:500 12px var(--sans);cursor:pointer;padding:6px 0}
.sect{font:600 13px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--meta);margin:26px 0 10px;display:flex;justify-content:space-between;align-items:center}
.sect .today{color:var(--terracotta)}
.qc{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:12px}
.qc + .qc{margin-top:14px}
.qc .qtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.qc .qtop>div{min-width:0}
.qc h2{font:700 21px/1.2 var(--serif);color:var(--dark);margin:0;overflow-wrap:anywhere}
.qc .qmeta{font-size:13px;color:var(--meta);margin-top:3px}
.qc .lv{margin-top:0;flex:none}
.qprog{display:flex;align-items:center;gap:10px;margin-top:14px;font:500 13px var(--sans);color:var(--dark);font-variant-numeric:tabular-nums}
.qprog .pb{flex:1;height:6px;background:var(--cream-dark);border-radius:3px;overflow:hidden}
.qprog .pb i{display:block;height:100%;background:var(--terracotta)}
.qprog .pb.ok i{background:#2F5A35}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.qa button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:76px;border-radius:8px;border:1px solid var(--line);background:var(--cream);color:var(--dark);font:600 13px/1.15 var(--sans);cursor:pointer;padding:8px 4px;text-align:center}
.qa button svg{width:26px;height:26px}
.qa button.cam{background:var(--dark);border-color:var(--dark);color:var(--cream)}
.qa button.done{background:#E6EFE3;border-color:#CFE0CA;color:#2F5A35}
.qa button small{font-weight:400;font-size:11px;opacity:.8}
.qlinks{display:flex;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.qlinks button,.qlinks a{background:none;border:0;color:var(--terracotta-dark);font:500 14px var(--sans);text-decoration:underline;cursor:pointer;padding:8px 0}
.mini{display:grid;gap:8px}
.mini button{display:grid;grid-template-columns:62px 1fr;gap:10px;text-align:left;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit;color:inherit;cursor:pointer;width:100%}
.mini .t{font:600 14px/1.2 var(--sans);color:var(--dark);font-variant-numeric:tabular-nums}
.mini .t small{display:block;font-weight:400;color:var(--meta);font-size:12px;margin-top:2px}
.mini .c{font:700 16px/1.25 var(--serif);color:var(--dark)}
.mini .m{font-size:13px;color:var(--meta);margin-top:2px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.rgrid label{display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;text-align:center;min-height:64px;border-radius:8px;background:var(--cream);border:1px solid var(--line);font:600 15px/1.2 var(--sans);color:var(--dark);cursor:pointer;padding:8px}
.rgrid label.has{border-color:#CFE0CA;background:#F1F6EF}
.rgrid label small{display:block;font-weight:400;font-size:11px;color:var(--meta)}
.kindsw{display:flex;gap:6px;margin:0 0 12px}

</style></head><body>

(function(){

  }

  }

  function ss(k,v){ try{ if(v===undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k,v);}catch(e){ return null; } }

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function firstJob(id){ var mine=state.jobs.filter(function(j){return (j.staff||[]).indexOf(id)>=0;}).sort(function(a,b){return (a.date+shiftOf(a,id).start).localeCompare(b.date+shiftOf(b,id).start);}); return mine[0]||null; }

  }
  function needsConfirm(){ var t=iso(today), e=iso(addDays(today,DAYS-1)), out=[]; state.jobs.forEach(function(j){ if(j.example||j.sample||j.date<t||j.date>e) return; (j.staff||[]).forEach(function(id){ if(!member(id)||isBoss(id)) return; out.push({j:j,id:id,c:cstate(j,id)}); }); }); return out.sort(function(a,b){ return (a.j.date+shiftOf(a.j,a.id).start).localeCompare(b.j.date+shiftOf(b.j,b.id).start); }); }

  function livePost(body, btn, ctx){

    return api('/api/live',{method:'POST',body:body}).then(function(d){ state.live[ctx.jobId]=d.live; if(liveOpen) drawLive(); else if(!document.getElementById('scrim')) render(); })
      .catch(function(e){ if(btn) btn.disabled=false; var er=document.getElementById('liveErr'); if(er){ er.textContent=e.message; er.hidden=false; } toast(e.message); });
  }
  function liveClick(e){

    if(b.dataset.finish){ var j=state.jobs.find(function(x){return x.id===liveOpen.jobId;}), L=liveOf(j); if(b.dataset.finish!=='undo' && !b.dataset.sure){ var left=roomsOf(j).filter(function(r){return !(L.rooms[r]&&L.rooms[r].s==='d');}).length, lk=Object.keys(LOCK).filter(function(k){return !L.lock[k];}).length; if(left||lk){ b.dataset.sure='1'; b.textContent=(left?left+' room'+(left>1?'s':'')+' not done':'')+(left&&lk?', ':'')+(lk?lk+' lock-up item'+(lk>1?'s':'')+' unticked':'')+'. Tap again to finish anyway'; return; } }

  function shrink(file){
    return new Promise(function(res,rej){
      var url=URL.createObjectURL(file), img=new Image();
      img.onload=function(){ var max=1600, w=img.naturalWidth, h=img.naturalHeight, sc=Math.min(1,max/Math.max(w,h)); var c=document.createElement('canvas'); c.width=Math.round(w*sc); c.height=Math.round(h*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); c.toBlob(function(b){ b?res(b):rej(new Error('Couldn\'t read that photo')); },'image/jpeg',0.82); };
      img.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('Couldn\'t read that photo')); };
      img.src=url;
    });
  }

  // ---------- Wage estimate per pay period ----------
  // Rates match the Pay Run tool. Award figures: Cleaning Services Award, casual Level 1.
  var DEF_RATES={wk:37.50,el:37.91,sat:47.39,sun:60.93,ph:74.47};
  var AWD=(function(){ var base=33.85/1.25, r=function(v){return Math.round(v*100)/100;}; return {ot1:r(base*1.75),ot2:r(base*2.25),otSun:r(base*2.25),otPh:r(base*2.75)}; })();
  // Queensland statewide public holidays (qld.gov.au). Add others (e.g. Ekka) in settings.
  var QLD_PH={'2026-01-01':'New Year\'s Day','2026-01-26':'Australia Day','2026-04-03':'Good Friday','2026-04-04':'Easter Saturday','2026-04-05':'Easter Sunday','2026-04-06':'Easter Monday','2026-04-25':'Anzac Day','2026-05-04':'Labour Day','2026-10-05':'King\'s Birthday','2026-12-25':'Christmas Day','2026-12-26':'Boxing Day','2026-12-28':'Boxing Day (extra)','2027-01-01':'New Year\'s Day','2027-01-26':'Australia Day','2027-03-26':'Good Friday','2027-03-27':'Easter Saturday','2027-03-28':'Easter Sunday','2027-03-29':'Easter Monday','2027-04-26':'Anzac Day','2027-05-03':'Labour Day','2027-10-04':'King\'s Birthday','2027-12-25':'Christmas Day','2027-12-26':'Boxing Day','2027-12-27':'Christmas (extra)','2027-12-28':'Boxing Day (extra)'};
  var wageOff=0;
  function paySet(){ var p=state.pay||{}; var r=Object.assign({},DEF_RATES,p.rates||{}); return {cycle:p.cycle===2?2:1, anchor:p.anchor||'2026-10-05', lunch:p.lunch!==false, rates:r, ph:p.ph||[]}; }
  function isPH(d){ var p=paySet(); return !!QLD_PH[d] || p.ph.indexOf(d)>=0; }
  function periodFor(off){
    var p=paySet(), len=p.cycle*7, a=parse(p.anchor), diff=Math.round((today-a)/864e5);
    var s=addDays(a, Math.floor(diff/len)*len + off*len);
    return {start:s, end:addDays(s,len-1), len:len};
  }
  function mins(t){ return t? +t.slice(0,2)*60 + +t.slice(3,5) : NaN; }

  function hrsTxt(v){ return (Math.round(v*100)/100)+''; }
  function wageCalc(per){
    var p=paySet(), R=p.rates, s0=iso(per.start), e0=iso(per.end);
    var LBL={wk:'Weekday',el:'Weekday early/late',sat:'Saturday',sun:'Sunday',ph:'Public holiday'};
    var people=[], warn=[];
    state.team.forEach(function(t){
      if(t.owner) return;
      var sh=[];
      state.jobs.forEach(function(j){
        if(j.sample||j.date<s0||j.date>e0||(j.staff||[]).indexOf(t.id)<0) return;
        var s=shiftOf(j,t.id), span=(mins(s.end)-mins(s.start))/60;
        if(!(span>0)){ warn.push(t.name.split(' ')[0]+' on '+fmtDay(parse(j.date))+' has no valid shift times.'); return; }
        var lunch=p.lunch&&span>4.5?0.5:0, dow=parse(j.date).getDay();
        var kind=isPH(j.date)?'ph':dow===0?'sun':dow===6?'sat':(mins(s.start)<360||mins(s.end)>1080)?'el':'wk';
        sh.push({job:j,date:j.date,start:s.start,end:s.end,span:span,lunch:lunch,hrs:span-lunch,kind:kind,ord:0,ot:0,pay:0,c:cstate(j,t.id).v});
      });
      if(!sh.length) return;
      sh.sort(function(a,b){return (a.date+a.start).localeCompare(b.date+b.start);});
      var ordPay=0, otPay=0, otHrs=0, hrs=0, reasons=[];
      for(var w=0; w<per.len/7; w++){
        var ws=iso(addDays(per.start,w*7)), we=iso(addDays(per.start,w*7+6));
        var wk=sh.filter(function(x){return x.date>=ws&&x.date<=we;}), days=[], weekOrd=0;
        wk.forEach(function(x){ if(days.indexOf(x.date)<0) days.push(x.date); });
        days.forEach(function(d,di){
          var dayOrd=0, dayOT=0;
          wk.filter(function(x){return x.date===d;}).forEach(function(x){
            var ord=0, ot=0, rate=R[x.kind];
            if(di>=5){ ot=x.hrs; reasons.push('6th day'); }
            else { ord=Math.min(x.hrs, Math.max(0,7.6-dayOrd), Math.max(0,38-weekOrd)); ot=x.hrs-ord; if(ot>0.001) reasons.push(x.hrs>Math.max(0,7.6-dayOrd)?'over 7.6 hrs in a day':'over 38 hrs in a week'); }
            dayOrd+=ord; weekOrd+=ord;
            var op=0;
            if(ot>0){
              if(x.kind==='ph') op=ot*Math.max(AWD.otPh,rate);
              else if(x.kind==='sun') op=ot*Math.max(AWD.otSun,rate);
              else { var f=Math.min(ot,Math.max(0,2-dayOT)); op=f*Math.max(AWD.ot1,rate)+(ot-f)*Math.max(AWD.ot2,rate); }
            }
            dayOT+=ot; x.ord=ord; x.ot=ot; x.pay=ord*rate+op;
            ordPay+=ord*rate; otPay+=op; otHrs+=ot; hrs+=x.hrs;
          });
        });
      }
      var gross=ordPay+otPay, sup=ordPay*0.12;
      people.push({t:t,sh:sh,hrs:hrs,otHrs:otHrs,gross:gross,sup:sup,cost:gross+sup,reasons:reasons.filter(function(v,i,a){return a.indexOf(v)===i;}),un:sh.filter(function(x){return x.c!=='yes';}).length});
    });
    var tot={hrs:0,gross:0,sup:0,cost:0,otHrs:0,shifts:0,un:0};
    people.forEach(function(x){ tot.hrs+=x.hrs; tot.gross+=x.gross; tot.sup+=x.sup; tot.cost+=x.cost; tot.otHrs+=x.otHrs; tot.shifts+=x.sh.length; tot.un+=x.un; });
    return {people:people,tot:tot,warn:warn,LBL:LBL};
  }

  function renderWages(){
    var per=periodFor(wageOff), c=wageCalc(per), p=paySet(), t=c.tot;
    var h=topbar('Wage <em>estimate</em>');
    h+='<div class="nav"><button class="icon-btn" data-wnav="-1" aria-label="Previous pay period">&larr;</button><div class="range">'+fmtDay(per.start)+' to '+fmtDay(per.end)+(wageOff===0?'<br><small style="font-weight:400;color:var(--meta)">This pay period</small>':'')+'</div>'+(wageOff!==0?'<button class="icon-btn" data-wnav="0">Now</button>':'')+'<button class="icon-btn" data-wnav="1" aria-label="Next pay period">&rarr;</button></div>';
    h+='<div class="wsum"><div class="wbox dark"><b>'+money(t.cost)+'</b><span>Total cost to you</span></div><div class="wbox"><b>'+money(t.gross)+'</b><span>Gross wages</span></div><div class="wbox"><b>'+money(t.sup)+'</b><span>Super (12%)</span></div><div class="wbox"><b>'+hrsTxt(t.hrs)+'</b><span>Paid hours, '+t.shifts+' shift'+(t.shifts===1?'':'s')+'</span></div></div>';
    if(t.otHrs>0.001) h+='<div class="warn">'+hrsTxt(t.otHrs)+' hrs of overtime in this period, already costed at overtime rates.</div>';
    if(t.un) h+='<div class="warn" style="border-left-color:var(--terracotta)">'+t.un+' shift'+(t.un===1?' isn\'t':'s aren\'t')+' confirmed yet. Included in the estimate.</div>';
    c.warn.forEach(function(w){ h+='<div class="warn">'+esc(w)+'</div>'; });
    if(!c.people.length) h+='<div class="hint-card">No team shifts rostered in this pay period yet. Your own shifts aren\'t counted.</div>';
    c.people.forEach(function(x){
      h+='<div class="sect"><span>'+esc(x.t.name)+'</span><span>'+money(x.cost)+'</span></div><div class="wrows">';
      x.sh.forEach(function(s){
        h+='<button type="button" class="wrow" data-edit="'+s.job.id+'"><span class="wd">'+fmtDay(parse(s.date))+'<small>'+range(s.start,s.end)+'</small></span><span class="wm2">'+esc(s.job.client||'Job')+(s.job.suburb?' · '+esc(s.job.suburb):'')+'<small>'+c.LBL[s.kind]+(isPH(s.date)&&QLD_PH[s.date]?' ('+esc(QLD_PH[s.date])+')':'')+' · '+hrsTxt(s.hrs)+' hrs'+(s.lunch?' after lunch':'')+(s.ot>0.001?' · <b class="ot">'+hrsTxt(s.ot)+' OT</b>':'')+(s.c==='yes'?'':' · '+(s.c==='no'?'<b class="ot">can\'t make it</b>':'not confirmed'))+'</small></span><span class="wa">'+money(s.pay)+'</span></button>';
      });
      h+='<div class="wfoot"><span>'+hrsTxt(x.hrs)+' hrs'+(x.otHrs>0.001?' ('+hrsTxt(x.otHrs)+' OT: '+x.reasons.join(', ')+')':'')+'</span><span>'+money(x.gross)+' + '+money(x.sup)+' super</span></div></div>';
    });
    h+='<p class="sub" style="margin-top:18px;font-size:12.5px">Estimate before tax. '+(p.lunch?'Takes off a 30-min unpaid lunch on shifts over 4½ hrs. ':'')+'Overtime past 7.6 hrs a day, 38 a week or on a 6th day uses Cleaning Services Award casual rates, or your rate if higher. Super is 12% of ordinary pay. Only counts rostered shifts, not hours actually worked.</p>';
    h+='<div class="menu"><button type="button" data-act="paysettings">'+IC.grid+'Pay period, rates and holidays<span class="chev">›</span></button></div>';
    return h;
  }
  function paySettingsSheet(){
    var p=paySet(), R=p.rates;
    function rt(k,label){ return '<label class="l">'+label+'<input type="number" step="0.01" inputmode="decimal" name="r_'+k+'" value="'+R[k].toFixed(2)+'"></label>'; }
    var h='<h3>Pay <em>settings</em></h3><form id="payForm" class="fgrid" novalidate>';
    h+='<label class="l">How often you pay<select name="cycle"><option value="1"'+(p.cycle===1?' selected':'')+'>Weekly</option><option value="2"'+(p.cycle===2?' selected':'')+'>Fortnightly</option></select></label>';
    h+='<label class="l">A pay period start date<input type="date" name="anchor" value="'+esc(p.anchor)+'"><span class="sub" style="display:block;font-size:12px">Any past or future start. Periods repeat from it.</span></label>';
    h+='<div class="rgrid2">'+rt('wk','Weekday')+rt('el','Weekday before 6am / after 6pm')+rt('sat','Saturday')+rt('sun','Sunday')+rt('ph','Public holiday')+'</div>';
    h+='<label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--dark)"><input type="checkbox" name="lunch"'+(p.lunch?' checked':'')+' style="width:20px;height:20px;min-height:0;margin:0">Take off 30-min unpaid lunch on shifts over 4½ hrs</label>';
    h+='<label class="l">Extra public holidays <span style="color:var(--meta);font-weight:400">(e.g. Ekka, one date per line, YYYY-MM-DD)</span><textarea name="ph" placeholder="2027-08-11">'+esc(p.ph.join('\n'))+'</textarea><span class="sub" style="display:block;font-size:12px">Queensland statewide holidays for 2026 and 2027 are already included.</span></label>';
    h+='<div class="err" id="payErr" hidden></div><div class="actions"><button type="button" class="btn outline" data-close>Cancel</button><button type="submit" class="btn primary">Save</button></div></form>';
    var s=openSheet(h), f=s.querySelector('#payForm');
    s.querySelector('[data-close]').onclick=closeSheet;
    f.onsubmit=function(e){ e.preventDefault(); var err=s.querySelector('#payErr'), r={}, bad='';
      ['wk','el','sat','sun','ph'].forEach(function(k){ var v=parseFloat(f.elements['r_'+k].value); if(!(v>0)) bad='Fill in every rate.'; r[k]=v; });
      var ph=f.elements.ph.value.split(/[\s,]+/).filter(Boolean); if(ph.some(function(d){return !/^\d{4}-\d{2}-\d{2}$/.test(d);})) bad='Write holiday dates like 2027-08-11.';
      if(!f.elements.anchor.value) bad='Pick a pay period start date.';
      if(bad){ err.textContent=bad; err.hidden=false; return; }
      wageOff=0;
      save({team:state.team,jobs:state.jobs,pay:{cycle:+f.elements.cycle.value,anchor:f.elements.anchor.value,lunch:f.elements.lunch.checked,rates:r,ph:ph}}, f.querySelector('.primary'), err, 'Pay settings saved');
    };
  }
  function renderMore(){
    var h=topbar('Tools');
    function it(act,icon,label){ return '<button type="button" data-act="'+act+'">'+icon+label+'<span class="chev">›</span></button>'; }
    h+='<div class="sect"><span>Roster</span></div><div class="menu" style="margin-top:0">'+it('confirms',IC.tick,'Shift confirmations')+'<button type="button" data-view="wages">'+IC.grid+'Wage estimate<span class="chev">›</span></button>'+it('team',IC.team,'Manage team')+it('copy',IC.text,'Copy roster to text')+it('info',IC.info,'First-day info')+'</div>';
    TOOLS.forEach(function(g){ h+='<div class="sect"><span>'+esc(g[0])+'</span></div><div class="tl2" style="margin-top:0">'+g[1].map(toolRow).join('')+'</div>'; });
    h+='<details class="olds"><summary>Design files and old drafts ('+OLD.length+')</summary><div class="tl2">'+OLD.map(function(o){return toolRow([o[0],'',o[1]]);}).join('')+'</div></details>';
    h+='<details class="rates"><summary>Casual pay rates</summary><table><tbody><tr><td>Monday to Friday</td><td>$37.50</td></tr><tr><td>Mon–Fri, start before 6am or finish after 6pm</td><td>$37.91</td></tr><tr><td>Saturday</td><td>$47.39</td></tr><tr><td>Sunday</td><td>$60.93</td></tr><tr><td>Public holiday</td><td>$74.47</td></tr></tbody></table><p>Per hour, before tax, plus 12% super. From 1 October 2026.</p></details>';
    h+='<div class="hint-card"><strong>On your home screen:</strong> in Safari tap Share, then Add to Home Screen. It opens straight to Today. Log in once inside it.</div>';
    h+='<div class="menu">'+it('logout',IC.out,'Log out of editing')+'</div>';
    return h;
  }

  // Quick photo: pick before/after + room, camera opens straight away
  function photoSheet(jobId, pid, kind){
    var j=state.jobs.find(function(x){return x.id===jobId;}); if(!j) return; var L=liveOf(j);
    function draw(){
      var h='<h3><em>'+(kind==='before'?'Before':'After')+'</em> photo</h3><div class="kindsw"><button type="button" data-k="before" aria-pressed="'+(kind==='before')+'">Before</button><button type="button" data-k="after" aria-pressed="'+(kind==='after')+'">After</button></div><p class="sub" style="margin:0 0 10px">Tap the room. The camera opens.</p><div class="rgrid">';
      roomsOf(j).forEach(function(r,i){ var n=L.photos.filter(function(p){return p.room===r&&p.kind===kind;}).length; h+='<label for="cam'+i+'" class="'+(n?'has':'')+'">'+esc(r)+(n?'<small>'+n+' taken</small>':'')+'</label><input id="cam'+i+'" type="file" accept="image/*" capture="environment" data-room="'+esc(r)+'" hidden>'; });
      h+='</div><div class="lsec"><h4>Several from your photo library</h4><div class="two"><select id="libRoom" style="margin:0">'+roomsOf(j).map(function(r){return '<option>'+esc(r)+'</option>';}).join('')+'</select><label class="btn outline" for="libFile" style="display:flex;align-items:center;justify-content:center;cursor:pointer">Choose photos</label></div><input id="libFile" type="file" accept="image/*" multiple hidden></div>';
      h+='<div class="actions"><button type="button" class="btn outline" data-close style="flex:1">Done</button></div>';
      s.querySelector('.sheet').innerHTML=h;
      s.querySelector('[data-close]').onclick=closeSheet;
    }
    var s=openSheet('');
    draw();
    s.addEventListener('click',function(e){ var b=e.target.closest('[data-k]'); if(b){ kind=b.dataset.k; draw(); } });
    s.addEventListener('change',function(e){
      var t=e.target; if(!t.files||!t.files.length) return;
      var room=t.id==='libFile'?s.querySelector('#libRoom').value:t.dataset.room, files=Array.prototype.slice.call(t.files);
      closeSheet(); uploadPhotos(files, room, kind, {jobId:jobId,pid:pid});
    });
  }
  function noteSheet(jobId, pid){
    var h='<h3>Note for the <em>agent</em></h3><p class="sub" style="margin:-6px 0 10px">Anything they should know before photos or buyers.</p><form id="nf" class="fgrid" novalidate><label class="l" for="n_t">What is it<input id="n_t" placeholder="e.g. Oven seal cracked" required></label><label class="l" for="n_d">Details (optional)<textarea id="n_d"></textarea></label><div class="err" id="nErr" hidden></div><div class="actions"><button type="button" class="btn outline" data-close>Cancel</button><button type="submit" class="btn primary">Add note</button></div></form>';
    var s=openSheet(h), f=s.querySelector('#nf');
    s.querySelector('[data-close]').onclick=closeSheet;
    f.onsubmit=function(e){ e.preventDefault(); var t=f.querySelector('#n_t').value.trim(); if(!t){ var er=s.querySelector('#nErr'); er.textContent='Add a short title.'; er.hidden=false; return; }
      livePost({action:'flag',title:t,detail:f.querySelector('#n_d').value}, f.querySelector('.primary'), {jobId:jobId,pid:pid}).then(function(){ closeSheet(); render(); toast('Note added. The agent can see it.'); }); };
  }

  function rosterText(id){
    var s=iso(start), e=iso(addDays(start,DAYS-1));
    var list=state.jobs.filter(function(j){ return j.date>=s && j.date<=e && (id==='all' || (j.staff||[]).indexOf(id)>=0); }).sort(function(a,b){ var x=id==='all'?a.start:shiftOf(a,id).start, y=id==='all'?b.start:shiftOf(b,id).start; return (a.date+x).localeCompare(b.date+y); });
    var m=member(id), out=(m?'Hi '+m.name.split(' ')[0]+', your Bardon Clean jobs:':'Bardon Clean roster:')+'\n';
    if(!list.length) return out+'\nNo jobs booked for '+fmtDay(start)+' to '+fmtDay(addDays(start,DAYS-1))+'.';
    var last='';
    list.forEach(function(j){
      if(j.date!==last){ out+='\n'+fmtDay(parse(j.date))+'\n'; last=j.date; }
      var tm=id==='all'?{start:j.start,end:j.end}:shiftOf(j,id); out+='• '+range(tm.start,tm.end)+'  '+(j.client||'')+(j.suburb?', '+j.suburb:'')+' ('+(j.service||'')+')';
      if(id==='all'){ var names=(j.staff||[]).map(function(x){var p=member(x); if(!p) return ''; var t=shiftOf(j,x); return p.name+(differs(j,x)?' ('+range(t.start,t.end)+')':'');}).filter(Boolean); out+=' - '+(names.length?names.join(', '):'UNASSIGNED'); }
      out+='\n';
    });
    if(m && !m.owner) out+='\nPlease confirm each shift on the roster: '+location.origin+'/';
    return out;
  }
  function copySheet(){
    var sel = filter!=='open' ? filter : 'all';
    var h='<h3>Copy <em>roster</em></h3><label class="l" for="f_who">Whose jobs<select id="f_who"><option value="all">Everyone</option>'+state.team.map(function(t){return '<option value="'+t.id+'"'+(t.id===sel?' selected':'')+'>'+esc(t.name)+'</option>';}).join('')+'</select></label>';
    h+='<p class="sub">Covers '+fmtDay(start)+' to '+fmtDay(addDays(start,DAYS-1))+'. Paste it into a text message.</p><textarea class="copybox" id="f_copy" readonly></textarea>';
    h+='<div class="actions"><button type="button" class="btn outline" data-close>Close</button><button type="button" class="btn primary" data-copy>Copy text</button></div>';
    var s=openSheet(h), who=s.querySelector('#f_who'), box=s.querySelector('#f_copy');
    function fill(){ box.value=rosterText(who.value); }
    who.onchange=fill; fill();
    s.querySelector('[data-close]').onclick=closeSheet;
    s.querySelector('[data-copy]').onclick=function(){
      var t=box.value;
      function fallback(){ box.focus(); box.select(); toast('Text selected. Tap Copy.'); }
      try{ navigator.clipboard.writeText(t).then(function(){ toast('Copied'); }, fallback); } catch(e){ fallback(); }
    };
  }

  function toast(msg){ var t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(function(){t.remove();},2200); }

  // ---------- Save ----------
  function save(next, btn, errEl, doneMsg){
    if (saving) return;
    saving=true; var label=btn?btn.textContent:''; if(btn){ btn.disabled=true; btn.textContent='Saving…'; }
    var body={info:next.info||state.info,agents:next.agents||state.agents,pay:next.pay||state.pay||undefined,team:next.team,jobs:next.jobs.map(function(j){ var c=Object.assign({},j); delete c.confirm; delete c.example; return c; })};
    api('/api/roster',{method:'PUT',body:body}).then(function(){ saving=false; closeSheet(); if(pendingReq && doneMsg==='Job added'){ var rid=pendingReq; pendingReq=null; return api('/api/agent',{method:'POST',body:{action:'dismiss',id:rid}}).catch(function(){}).then(refresh); } return refresh(); }).then(function(){ toast(doneMsg||'Saved'); })
    .catch(function(e){
      saving=false; if(btn){ btn.disabled=false; btn.textContent=label; }
      if(e.status===401){ key(null); canEdit=false; closeSheet(); render(); toast('Log in again to edit'); return; }
      if(errEl){ errEl.textContent=e.message||'That didn\'t save. Try again.'; errEl.hidden=false; }
    });
  }
  function refresh(){
    return api('/api/roster').then(function(d){
      state={team:d.team||[],jobs:d.jobs||[],confirms:d.confirms||{},info:d.info||{},acks:d.acks||{},agents:d.agents||[],live:d.live||{},requests:d.requests||[],pay:d.pay||null}; adminSet=d.adminSet; loaded=true; loadErr='';
      if(key() && !d.admin){ key(null); }
      canEdit=!!d.admin;
      if (filter!=='all' && filter!=='open' && !member(filter)) filter='all';
      if(!document.getElementById('scrim')) render(); else if(liveOpen) drawLive();
    }).catch(function(e){ if(!loaded){ loadErr='Couldn\'t load the roster. Check your signal.'; render(); } });
  }
  function resetSheet(){
    var h='<h3>Reset your <em>password</em></h3><p class="sub" style="margin:-6px 0 10px">Enter the reset code Claude gave you, then choose a new password.</p><form id="rf" class="fgrid" novalidate><label class="l" for="r_code">Reset code<input id="r_code" autocapitalize="characters" autocomplete="one-time-code" placeholder="XXXX-XXXX-XXXX-XXXX" required></label><label class="l" for="r_pw">New password<input id="r_pw" type="password" autocomplete="new-password" required></label><div class="err" id="rErr" hidden></div><div class="actions"><button type="button" class="btn outline" data-close>Cancel</button><button type="submit" class="btn primary">Reset and log in</button></div></form>';
    var s=openSheet(h), f=s.querySelector('#rf'), er=s.querySelector('#rErr');
    s.querySelector('[data-close]').onclick=closeSheet;
    f.onsubmit=function(e){ e.preventDefault(); var pw=f.querySelector('#r_pw').value, b=f.querySelector('.primary'); b.disabled=true;
      api('/api/admin',{method:'POST',body:{action:'reset',code:f.querySelector('#r_code').value,password:pw}}).then(function(){ key(pw); closeSheet(); return refresh(); }).then(function(){ toast('Password reset. Editing on'); })
        .catch(function(x){ b.disabled=false; er.textContent=x.message; er.hidden=false; }); };
  }
  function loginSheet(){
    var setup=!adminSet;
    var h='<h3>'+(setup?'Set your <em>password</em>':'Jack\'s <em>login</em>')+'</h3>'+(setup?'<p class="sub" style="margin:-6px 0 10px">First time here. Choose the password you\'ll use to edit the roster. Keep it to yourself.</p>':'')+'<form id="lf" class="fgrid" novalidate><label class="l" for="f_pw">Password<input id="f_pw" type="password" autocomplete="'+(setup?'new-password':'current-password')+'" required></label><div class="err" id="lErr" hidden></div><div class="actions"><button type="button" class="btn outline" data-close>Cancel</button><button type="submit" class="btn primary">'+(setup?'Set password':'Log in')+'</button></div></form>';
    if(!setup) h+='<p class="sub" style="margin-top:14px"><button type="button" class="ghost" data-forgot style="padding:0">Forgot your password?</button></p>';
    var s=openSheet(h), f=s.querySelector('#lf'), er=s.querySelector('#lErr');
    s.querySelector('[data-close]').onclick=closeSheet;
    var fg=s.querySelector('[data-forgot]'); if(fg) fg.onclick=resetSheet;
    f.onsubmit=function(e){
      e.preventDefault(); var pw=f.querySelector('#f_pw').value, b=f.querySelector('.primary'); b.disabled=true;
      var p = setup ? api('/api/admin',{method:'POST',body:{action:'setup',password:pw}}).then(function(){ key(pw); }) : (key(pw), api('/api/admin',{method:'POST',body:{}}).then(function(d){ if(!d.ok){ key(null); throw new Error('Wrong password'); } }));
      p.then(function(){ closeSheet(); return refresh(); }).then(function(){ toast('Editing on'); })
       .catch(function(err){ b.disabled=false; er.textContent=err.message; er.hidden=false; });
    };
  }

  // ---------- Events ----------
  app.addEventListener('click', function(e){
    var ak=e.target.closest('[data-ack]'); if(ak){ ak.disabled=true; ak.textContent='Saving…'; api('/api/ack',{method:'POST',body:{personId:ak.dataset.ack}}).then(function(d){ state.acks[ak.dataset.ack]=d.ack; render(); toast('Thanks! See you there.'); }).catch(function(er){ ak.disabled=false; ak.textContent='Got it'; toast(er.message); }); return; }
    var r=e.target.closest('[data-reply]'); if(r){ if(r.dataset.reply==='yes') sendReply(r.dataset.j, r.dataset.p, 'yes', '', r); else replyNo(r.dataset.j, r.dataset.p); return; }
    var vw=e.target.closest('[data-view]'); if(vw){ setView(vw.dataset.view); return; }
    var qa=e.target.closest('[data-qa]'); if(qa){ var q=qa.dataset.qa, jid=qa.dataset.j, qp=qa.dataset.p||'';
      if(q==='before'||q==='after') photoSheet(jid,qp,q);
      else if(q==='note') noteSheet(jid,qp);
      else if(q==='arrive'){ var L0=liveOf(state.jobs.find(function(x){return x.id===jid;})); if(L0.arrived[qp]) liveSheet(jid,qp); else livePost({action:'arrive',who:qp},qa,{jobId:jid,pid:qp}).then(function(){ toast('Arrival sent'); }); }
      else { liveSheet(jid,qp); if(q==='finish') setTimeout(function(){ var sh=document.querySelector('.sheet'); if(sh) sh.scrollTop=sh.scrollHeight; },60); }
      return; }
    var wn=e.target.closest('[data-wnav]'); if(wn){ wageOff = wn.dataset.wnav==='0'?0:wageOff+(+wn.dataset.wnav); render(); return; }
    var cl=e.target.closest('[data-copylink2]'); if(cl){ copyText(cl.dataset.copylink2); return; }
    var vc=e.target.closest('[data-vcopy]'); if(vc){ copyText(location.origin+'/v/'+vc.dataset.vcopy); return; }
    var lv=e.target.closest('[data-live]'); if(lv){ liveSheet(lv.dataset.live, lv.dataset.p||''); return; }
    var rq=e.target.closest('[data-req]'); if(rq){ var r=(state.requests||[]).find(function(x){return x.id===rq.dataset.req;}); if(r){ pendingReq=r.id; jobSheet(null); fillForm({client:'',suburb:r.suburb,address:r.address,date:r.readyDate,start:'08:00',end:'16:00',service:SERVICES.indexOf(r.service)>=0?r.service:'Pre-sale clean',staff:[],agentId:r.agentId,readyBy:r.readyFor+' '+fmtDay(parse(r.readyDate)),notes:[r.beds?r.beds+' bed':'',r.baths?r.baths+' bath':'','Access: '+r.access,'Invoice: '+r.invoice,r.notes].filter(Boolean).join('. ')}); } return; }
    var rx=e.target.closest('[data-reqx]'); if(rx){ if(!rx.dataset.sure){ rx.dataset.sure='1'; rx.textContent='Tap again'; return; } api('/api/agent',{method:'POST',body:{action:'dismiss',id:rx.dataset.reqx}}).then(refresh).then(function(){toast('Request dismissed');}).catch(function(er){toast(er.message);}); return; }
    var t=e.target.closest('[data-filter],[data-nav],[data-edit],[data-act]'); if(!t) return;
    if (t.dataset.filter){ filter=t.dataset.filter; ls('roster_filter',filter); render(); return; }
    if (t.dataset.nav){ start = t.dataset.nav==='today' ? new Date(today) : addDays(start, +t.dataset.nav); ss('roster_start', iso(start)); render(); return; }
    if (t.dataset.edit && canEdit){ var j=state.jobs.find(function(x){return x.id===t.dataset.edit;}); if(j) jobSheet(j); return; }
    if (t.dataset.act==='add'){ pendingReq=null; jobSheet(null); }
    if (t.dataset.act==='team') teamSheet();
    if (t.dataset.act==='copy') copySheet();
    if (t.dataset.act==='confirms') confirmSheet();
    if (t.dataset.act==='info') infoSheet();
    if (t.dataset.act==='paysettings') paySettingsSheet();
    if (t.dataset.act==='agents') agentsSheet();
    if (t.dataset.act==='login') loginSheet();
    if (t.dataset.act==='logout'){ key(null); canEdit=false; render(); toast('Logged out'); }
    if (t.dataset.act==='sync'){ refresh().then(function(){ toast('Up to date'); }); }
    if (t.dataset.act==='reload'){ loadErr=''; render(); refresh(); }
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeSheet(); });

  render(); refresh();
  setInterval(function(){ if(document.visibilityState==='visible' && !saving) refresh(); }, 30000);
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') refresh(); });
})();
</script>
