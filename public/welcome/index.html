<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#F5F0EB">
<title>Welcome to Bardon Clean</title>
<link rel="icon" type="image/png" href="/icons/favicon.png?v=2"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--terracotta:#C06B3C;--terracotta-dark:#A55830;--dark:#1A1A1A;--cream:#F5F0EB;--cream-dark:#EDE6DE;--meta:#6E6E6E;--line:#DDD3C8;--white:#fff;--tint:#FBF3EE;--green:#2F5A35;--green-tint:#E7F0E8;--serif:"Playfair Display",Georgia,serif;--sans:"Inter",-apple-system,BlinkMacSystemFont,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:#4A4A4A;font:400 16px/1.5 var(--sans)}
#app{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.wm{display:flex;gap:8px;align-items:center;font:700 18px/1 var(--serif);color:var(--dark)}
.wm svg{width:28px;height:28px}
h1{font:700 30px/1.15 var(--serif);color:var(--dark);margin:22px 0 6px}
h1 em,h2 em{font-style:italic;font-weight:500;color:var(--terracotta)}
h2{font:700 21px/1.2 var(--serif);color:var(--dark);margin:28px 0 10px}
.sub{color:var(--meta);font-size:15px;margin:0 0 16px}
.prog{height:6px;background:var(--cream-dark);border-radius:99px;margin:4px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--terracotta);border-radius:99px}
.pl{font:500 13px var(--sans);color:var(--meta)}
.steps{display:grid;gap:10px;margin-top:14px}
.st{display:flex;gap:12px;align-items:flex-start;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px}
.st.done{background:var(--green-tint);border-color:#C9DCCB}
.n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 14px var(--sans);background:var(--cream-dark);color:var(--dark)}
.st.done .n{background:var(--green);color:#fff}
.st .b{flex:1;min-width:0}
.st h3{margin:3px 0 2px;font:600 16px/1.3 var(--sans);color:var(--dark)}
.st p{margin:0;font-size:14px;color:var(--meta)}
.go{display:inline-flex;align-items:center;justify-content:center;margin-top:10px;min-height:46px;padding:0 18px;border-radius:8px;background:var(--terracotta);color:#fff;font:600 15px var(--sans);text-decoration:none;border:0;cursor:pointer}
.go.alt{background:var(--white);color:var(--dark);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px}
dl{margin:0;display:grid;gap:12px}
dt{font:500 12px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--meta)}
dd{margin:2px 0 0;color:var(--dark);white-space:pre-line}
a{color:var(--terracotta-dark)}
.when{font:600 17px/1.35 var(--sans);color:var(--dark);margin:0 0 12px}
.ok{display:inline-block;margin-top:10px;font:600 14px var(--sans);color:var(--green)}
.center{text-align:center;padding:60px 10px;color:var(--dark)}
.foot{margin-top:28px;font-size:14px;color:var(--meta);text-align:center}
.all{background:var(--green);color:#fff;border-radius:12px;padding:16px;margin-top:16px;font:500 15px/1.45 var(--sans)}
:focus-visible{outline:2px solid var(--terracotta);outline-offset:2px}
</style></head><body>
<div id="app"><div class="center">Loading…</div></div>
<script>
(function(){
  var app=document.getElementById('app');
  var LOGO='<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M5 21 L24 6 L43 21" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="square"/><text x="24" y="43" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-weight="700" font-size="25" fill="#1A1A1A">B</text></svg>';
  var t=(location.pathname.split('/w/')[1]||'').replace(/[^a-f0-9]/g,''), D=null, busy=false;
  try{ sessionStorage.setItem('bc_welcome',location.pathname); }catch(e){}
  var DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function day(s){ var p=String(s).split('-'), d=new Date(+p[0],+p[1]-1,+p[2]); return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]; }
  function tm(x){ if(!x) return ''; var h=+x.slice(0,2), m=x.slice(3,5); return (h%12||12)+(m==='00'?'':':'+m)+(h>=12?'pm':'am'); }
  function maps(s){ return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent([s.address,s.suburb,'QLD'].filter(Boolean).join(', ')); }
  function post(path,body){ return fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error(d.error||'That didn\'t go through. Try again.'); return d; }); }); }

  function render(){
    var steps=D.steps, done=steps.filter(function(s){return s.done;}).length, s=D.shift, i=D.info;
    var h='<div class="wm">'+LOGO+'Bardon Clean</div><h1>Welcome, <em>'+esc(D.first)+'</em></h1><p class="sub">Four quick things before your first shift. Do them in any order. Each one ticks itself off here.</p>';
    h+='<div class="prog" aria-hidden="true"><i style="width:'+Math.round(done/steps.length*100)+'%"></i></div><div class="pl">'+done+' of '+steps.length+' done</div><div class="steps">';
    steps.forEach(function(x,k){
      h+='<div class="st'+(x.done?' done':'')+'"><span class="n" aria-hidden="true">'+(x.done?'✓':k+1)+'</span><div class="b"><h3>'+esc(x.label)+(x.done?' <span class="sr" style="position:absolute;left:-9999px">(done)</span>':'')+'</h3>';
      if(x.done) h+='<p>Done. Thanks!</p>';
      else if(x.key==='shift'&&s&&s.confirmed==='no') h+='<p>You\'ve told Jack you can\'t make this one. Changed your mind? Tap yes.</p>';
      else if(x.note) h+='<p>'+esc(x.note)+'</p>';
      if(!x.done){
        if(x.key==='shift'&&s) h+='<div class="row"><button type="button" class="go" data-conf="yes">Yes, I\'ll be there</button><button type="button" class="go alt" data-conf="no">I can\'t make it</button></div>';
        else if(x.key==='firstday') h+='<a class="go alt" href="#firstday">Read it below</a>';
        else if(x.link) h+='<a class="go" href="'+esc(x.link)+'">Start</a>';
      }
      h+='</div></div>';
    });
    h+='</div>';
    if(done===steps.length) h+='<div class="all">You\'re all set. See you on '+(s?esc(day(s.date)):'your first shift')+'!</div>';
    h+='<h2 id="firstday">Your first <em>day</em></h2><div class="card">';
    if(s){
      h+='<p class="when">'+esc(day(s.date))+'. Be there by '+esc(tm(s.start))+', not later.'+(s.end?' Finishing around '+esc(tm(s.end))+'.':'')+'</p><dl>';
      if(s.address||s.suburb) h+='<div><dt>Address</dt><dd>'+esc([s.address,s.suburb].filter(Boolean).join(', '))+' · <a href="'+esc(maps(s))+'" target="_blank" rel="noopener">Open in Maps</a></dd></div>';
    } else h+='<p class="when">Jack will add your shift to the roster soon. You\'ll get a text when it\'s there.</p><dl>';
    var meet=(s&&s.meet)||i.meet;
    if(meet) h+='<div><dt>Meeting spot</dt><dd>'+esc(meet)+'</dd></div>';
    if(i.wear) h+='<div><dt>What to wear</dt><dd>'+esc(i.wear)+'</dd></div>';
    if(i.bring) h+='<div><dt>Bring</dt><dd>'+esc(i.bring)+'</dd></div>';
    if(i.extra) h+='<div><dt>Good to know</dt><dd>'+esc(i.extra)+'</dd></div>';
    h+='<div><dt>Running late or stuck?</dt><dd>Call Jack before your start time: <a href="tel:'+D.jack.replace(/ /g,'')+'">'+esc(D.jack)+'</a></dd></div></dl>';
    h+=D.firstDayRead?'<span class="ok">✓ Got it</span>':'<button type="button" class="go" data-ack style="width:100%;margin-top:16px">Got it</button>';
    h+='</div><p class="foot">Questions? Reply to Jack\'s text, or call <a href="tel:'+D.jack.replace(/ /g,'')+'">'+esc(D.jack)+'</a>.</p>';
    app.innerHTML=h;
  }
  function load(){
    return fetch('/api/welcome?t='+t,{cache:'no-store'}).then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error(d.error); return d; }); })
      .then(function(d){ D=d; render(); })
      .catch(function(e){ app.innerHTML='<div class="wm">'+LOGO+'Bardon Clean</div><div class="center">'+esc(e.message||'Something went wrong. Text Jack.')+'</div>'; });
  }
  app.addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b||busy) return;
    if(b.hasAttribute('data-ack')){ busy=true; b.textContent='Saving…'; post('/api/ack',{personId:D.teamId}).then(function(){ busy=false; return load(); }).catch(function(x){ busy=false; b.textContent='Got it'; alert(x.message); }); }
    if(b.dataset.conf){
      var body={jobId:D.shift.jobId,personId:D.teamId,status:b.dataset.conf};
      if(b.dataset.conf==='no'){ var r=window.prompt('Sorry to hear that. What\'s the reason? (Jack will see this)'); if(r===null) return; body.reason=r; }
      busy=true; b.textContent='Saving…';
      post('/api/confirm',body).then(function(){ busy=false; if(body.status==='no') alert('Thanks for letting Jack know. He\'ll be in touch.'); return load(); }).catch(function(x){ busy=false; alert(x.message); load(); });
    }
  });
  // Coming back from the contract or form: show the latest ticks.
  window.addEventListener('pageshow',function(e){ if(e.persisted&&D) load(); });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden&&D) load(); });
  if(!t){ app.innerHTML='<div class="wm">'+LOGO+'Bardon Clean</div><div class="center">This link isn\'t complete. Text Jack and he\'ll send it again.</div>'; return; }
  load();
})();
</script>
</body></html>
