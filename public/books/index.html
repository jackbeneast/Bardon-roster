<script type="module">
import { pnl, bookingsOf, priceOf, perMonth, dueDates } from '/lib/profit.mjs';

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function money(v,dp){ v=+v||0; var d=dp===0?0:2; return (v<0?'−':'')+'$'+Math.abs(v).toLocaleString('en-AU',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function m0(v){ return money(Math.round(v),0); }
function pad(n){ return (n<10?'0':'')+n; }
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function today(){ return iso(new Date()); }
function pdate(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function addD(s,n){ var d=pdate(s); d.setDate(d.getDate()+n); return iso(d); }
function fday(s,dow){ if(!s) return ''; var d=pdate(s); return (dow?DOW[d.getDay()]+' ':'')+d.getDate()+' '+MON[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''); }

}

// ---------- periods ----------
function period(m,o){
  var t=new Date(), y=t.getFullYear(), mo=t.getMonth(), s, e, label;
  if(m==='month'){ s=new Date(y,mo+o,1); e=new Date(y,mo+o+1,0); label=MON[s.getMonth()]+' '+s.getFullYear(); }
  else if(m==='quarter'){ var q=Math.floor(mo/3)+o, qs=new Date(y,q*3,1); s=qs; e=new Date(qs.getFullYear(),qs.getMonth()+3,0); label=MON[s.getMonth()]+'–'+MON[e.getMonth()]+' '+e.getFullYear(); }
  else { var fy=(mo>=6?y:y-1)+o; s=new Date(fy,6,1); e=new Date(fy+1,5,30); label='FY '+fy+'–'+String(fy+1).slice(2); }
  var sub=o===0?(m==='month'?'This month':m==='quarter'?'This BAS quarter':'This financial year'):(m==='quarter'?'BAS quarter':'');
  return {from:iso(s),to:iso(e),label:label,sub:sub};
}

  var last=D.expenses[0], days=last?Math.floor((Date.now()-Date.parse(last.at))/864e5):null;

function trend(){

  } else h+='<p class="ok-note">Every Jobber job is on the roster.</p>';

}

// ---------- sheets ----------
function sheet(inner){ closeSheet(); var s=document.createElement('div'); s.className='scrim'; s.id='scrim'; s.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+inner+'</div>'; s.addEventListener('click',function(e){ if(e.target===s||e.target.closest('[data-close]')) closeSheet(); }); document.body.appendChild(s); return s; }
function closeSheet(){ var s=document.getElementById('scrim'); if(s) s.remove(); }
function recentCats(){ var seen={}, out=[]; D.expenses.forEach(function(e){ if(!seen[e.cat]){ seen[e.cat]=1; out.push(e.cat); } }); D.cats.forEach(function(c){ if(!seen[c]){ seen[c]=1; out.push(c); } }); return out; }

function shrink(file){ return new Promise(function(res,rej){ var img=new Image(), u=URL.createObjectURL(file); img.onload=function(){ var m=1400, w=img.width, h=img.height, k=Math.min(1,m/Math.max(w,h)); var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',0.72)); }; img.onerror=function(){ rej(new Error('Couldn\'t read that photo')); }; img.src=u; }); }

function expenseSheet(e){
  var isNew=!e; e=e||{date:today(),cat:'',amt:'',who:'',note:'',job:'',gst:0};

  var h='<h3>'+(isNew?'Log an <em>expense</em>':'Edit <em>expense</em>')+'</h3><form id="ef" novalidate>';

  h+='<div style="margin-top:14px"><span class="l">What for</span><div class="cats">'+cats.map(function(c){ return '<button type="button" data-cat="'+esc(c)+'" aria-pressed="'+(c===cat)+'">'+esc(c)+'</button>'; }).join('')+'</div></div>';
  h+='<div class="grid" style="margin-top:14px"><label class="l">Date<input name="date" type="date" value="'+esc(e.date)+'"></label><label class="l">Where / who<input name="who" value="'+esc(e.who)+'" placeholder="e.g. Bunnings"></label></div>';

  h+='<label class="l" style="margin-top:12px">Note <small>(optional)</small><input name="note" value="'+esc(e.note)+'"></label>';

  h+='<div class="err" id="eErr" hidden></div><div class="actions"><button type="button" class="btn plain" data-close>Cancel</button><button type="submit" class="btn primary grow">Save expense</button></div>';
  if(!isNew) h+='<div class="actions"><button type="button" class="btn plain grow" data-del style="color:var(--terracotta-dark)">Delete expense</button></div>';
  h+='</form>';
  var s=sheet(h), f=s.querySelector('#ef'), rbox=s.querySelector('#rbox');
  if(isNew) setTimeout(function(){ f.elements.amt.focus(); },80);
  if(e.receipt) fetch('/api/books?receipt='+encodeURIComponent(e.id),{headers:{'x-admin-key':key()}}).then(function(r){ return r.ok?r.blob():null; }).then(function(b){ rbox.innerHTML=b?'<img class="rcpt" alt="Receipt" src="'+URL.createObjectURL(b)+'"><button type="button" class="ghost" data-dropr>Remove photo</button>':''; }).catch(function(){ rbox.innerHTML=''; });
  s.addEventListener('click',function(ev){
    var c=ev.target.closest('[data-cat]'); if(c){ cat=c.dataset.cat; s.querySelectorAll('[data-cat]').forEach(function(b){ b.setAttribute('aria-pressed', String(b===c)); }); if(isNew&&f.elements.gst) f.elements.gst.checked=NOGST.indexOf(cat)<0; return; }
    if(ev.target.closest('[data-dropr]')){ dropR=true; photo=null; rbox.innerHTML='<p class="sub">Photo will be removed.</p>'; return; }
  });
  f.elements.photo.onchange=function(){ var file=f.elements.photo.files[0]; if(!file) return; rbox.innerHTML='<p class="sub">Preparing photo…</p>'; shrink(file).then(function(d){ photo=d; dropR=false; rbox.innerHTML='<img class="rcpt" alt="Receipt" src="'+d+'">'; }).catch(function(x){ rbox.innerHTML='<p class="err">'+esc(x.message)+'</p>'; }); };
  f.onsubmit=function(ev){ ev.preventDefault(); var err=s.querySelector('#eErr'), btn=f.querySelector('.primary');

    if(!cat){ err.textContent='Pick what it was for.'; err.hidden=false; return; }
    btn.disabled=true; btn.textContent=photo?'Uploading…':'Saving…';
    var body={action:'expense',id:isNew?'':e.id,expense:{amt:a,date:f.elements.date.value||today(),cat:cat,who:f.elements.who.value,note:f.elements.note.value,job:f.elements.job.value,gst:D.gstReg?f.elements.gst.checked:false,gstAmt:0},receipt:photo||undefined,dropReceipt:dropR||undefined};
    api('POST',body).then(function(r){ closeSheet(); var i=D.expenses.findIndex(function(x){return x.id===r.expense.id;}); if(i>=0) D.expenses[i]=r.expense; else D.expenses.unshift(r.expense); D.expenses.sort(function(x,y){return (y.date+y.at).localeCompare(x.date+x.at);}); render(); toast(isNew?'Expense logged':'Saved'); })
      .catch(function(x){ btn.disabled=false; btn.textContent='Save expense'; err.textContent=x.message; err.hidden=false; });
  };
  var del=s.querySelector('[data-del]'); if(del) del.onclick=function(){ if(!del.dataset.sure){ del.dataset.sure=1; del.textContent='Tap again to delete'; return; } api('POST',{action:'delexpense',id:e.id}).then(function(){ D.expenses=D.expenses.filter(function(x){return x.id!==e.id;}); closeSheet(); render(); toast('Deleted'); }).catch(function(x){ toast(x.message); }); };
}

function fixedSheet(f, preset){

  h+='<label class="l">How often<select name="freq">'+Object.keys(FREQ).map(function(k){ return '<option value="'+k+'"'+(k===f.freq?' selected':'')+'>'+FREQ[k]+'</option>'; }).join('')+'</select></label>';
  h+='<label class="l">Category<select name="cat">'+D.cats.map(function(c){ return '<option'+(c===f.cat?' selected':'')+'>'+esc(c)+'</option>'; }).join('')+'</select></label>';
  h+='<label class="l">Next or last payment<input name="start" type="date" value="'+esc(f.start)+'"></label>';
  if(D.gstReg) h+='<label class="check full"><input type="checkbox" name="gst"'+(f.gst?' checked':'')+'>Amount includes GST</label>';

  h+='<div class="err full" id="fErr" hidden></div><div class="actions full"><button type="button" class="btn plain" data-close>Cancel</button><button type="submit" class="btn primary grow">Save</button></div>';
  if(!isNew) h+='<div class="actions full"><button type="button" class="btn plain grow" data-del style="color:var(--terracotta-dark)">Remove</button></div>';
  h+='</form>';
  var s=sheet(h), fm=s.querySelector('#ff');
  fm.onsubmit=function(ev){ ev.preventDefault(); var err=s.querySelector('#fErr'), a=parseFloat(fm.elements.amt.value);
    if(!fm.elements.name.value.trim()||!(a>0)){ err.textContent='Add a name and amount.'; err.hidden=false; return; }
    var o={id:f.id||'',name:fm.elements.name.value.trim(),amt:a,freq:fm.elements.freq.value,cat:fm.elements.cat.value,start:fm.elements.start.value||today(),end:fm.elements.end.value,gst:D.gstReg?fm.elements.gst.checked:false,setup:f.setup||''};
    var list=D.books.fixed.filter(function(x){return x.id!==f.id;}).concat([o]);
    saveFixed(list,null,fm.querySelector('.primary'),err,isNew?'Outgoing added':'Saved');

}
function saveFixed(list,setup,btn,err,msg){
  if(btn) btn.disabled=true;
  return api('POST',{action:'fixed',fixed:list,setup:setup||undefined}).then(function(r){ D.books=r.books; closeSheet(); render(); toast(msg||'Saved'); })
    .catch(function(x){ if(btn) btn.disabled=false; if(err){ err.textContent=x.message; err.hidden=false; } else toast(x.message); });
}

function priceSheet(key){
  var b=bookingsOf(D.jobs).filter(function(x){return x.key===key;})[0]; if(!b) return;
  var p=priceOf(b,D.books,D.quoteTotals), rec=b.days.filter(function(j){return j.rec;})[0];
  var h='<h3>'+esc(b.j.client||'Job')+'</h3><p class="sub" style="margin:-6px 0 12px">'+fday(b.date,true)+(b.days.length>1?' to '+fday(b.last,true):'')+' · '+esc(b.j.service||'')+(b.j.suburb?' · '+esc(b.j.suburb):'')+'</p><form id="xf">';
  h+='<label class="l">'+(rec?'Price for this visit':'Job price')+(D.gstReg?' <small>(inc GST)</small>':'')+'<span class="money-in" style="display:block"><input name="price" type="number" inputmode="decimal" step="0.01" min="0" value="'+(D.books.prices[key]!=null?D.books.prices[key]:(p.price!=null?p.price:''))+'"></span></label>';

// ---------- events ----------
app.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]'); if(g){ location.hash='#/'+(g.dataset.go==='profit'?'':g.dataset.go); return; }
  var md=e.target.closest('[data-mode]'); if(md){ mode=md.dataset.mode; off=0; lsSet('books_mode',mode); render(); return; }
  var of=e.target.closest('[data-off]'); if(of){ off=of.dataset.off==='0'?0:off+(+of.dataset.off); render(); return; }
  var pr=e.target.closest('[data-price]'); if(pr){ priceSheet(pr.dataset.price); return; }
  var ex=e.target.closest('[data-exp]'); if(ex){ expenseSheet(D.expenses.filter(function(x){return x.id===ex.dataset.exp;})[0]); return; }
  var fx=e.target.closest('[data-fixed]'); if(fx){ fixedSheet(fx.dataset.fixed==='new'?null:D.books.fixed.filter(function(x){return x.id===fx.dataset.fixed;})[0]); return; }
  var sa=e.target.closest('[data-setadd]'); if(sa){ var it=D.setup.filter(function(x){return x[0]===sa.dataset.setadd;})[0]; fixedSheet(null,{name:it[1],cat:it[2],freq:it[3],setup:it[0],gst:it[0]!=='workcover'&&it[0]!=='bank'}); return; }
  var sn=e.target.closest('[data-setna]'); if(sn){ var o={}; o[sn.dataset.setna]='na'; saveFixed(D.books.fixed,o,sn,null,'Ticked off'); return; }
  var su=e.target.closest('[data-setundo]'); if(su){ var u={}; u[su.dataset.setundo]=''; saveFixed(D.books.fixed,u,su,null,'Back on the list'); return; }
  var a=e.target.closest('[data-act]'); if(!a) return;
  var act=a.dataset.act;
  if(act==='refresh'){ loaded=false; render(); load(); }
  else if(act==='addexp') expenseSheet(null);
  else if(act==='sync'){ a.disabled=true; a.textContent='Syncing…'; api('POST',{action:'jobberSync'}).then(function(r){ toast(syncMsg(r)); return load(); }).catch(function(x){ a.disabled=false; a.textContent='Sync now'; toast(x.message); }); }
  else if(act==='unlink'){ if(!a.dataset.sure){ a.dataset.sure=1; a.textContent='Tap again'; return; } api('POST',{action:'jobberUrl',url:''}).then(load).then(function(){ toast('Jobber disconnected. Jobs already added stay.'); }); }
  else if(act==='xreload'){ X=null; render(); loadX(); }
  else if(act==='xcopy'){ try{ navigator.clipboard.writeText(X.redirect).then(function(){ toast('Copied'); }); }catch(x){ toast(X.redirect); } }
  else if(act==='xconnect'){ a.disabled=true; a.textContent='Opening Xero…'; xapi('POST',{action:'connect'}).then(function(r){ location.href=r.url; }).catch(function(x){ a.disabled=false; a.textContent='Connect Xero'; toast(x.message); }); }
  else if(act==='xsync'){ a.disabled=true; a.textContent='Syncing…'; xapi('POST',{action:'sync'}).then(function(r){ xMsg=null; toast(r.skipped||xSyncMsg(r)); return loadX(); }).catch(function(x){ a.disabled=false; a.textContent='Sync now'; toast(x.message); }); }
  else if(act==='xaccts'){ a.textContent='Reloading…'; xapi('POST',{action:'accounts'}).then(loadX).then(function(){ toast('Accounts reloaded'); }).catch(function(x){ toast(x.message); }); }
  else if(act==='xoff'){ if(!a.dataset.sure){ a.dataset.sure=1; a.textContent='Tap again'; return; } xapi('POST',{action:'disconnect'}).then(loadX).then(function(){ toast('Xero disconnected. What\'s already in Xero stays.'); }); }
  else if(act==='tickpast'){ a.closest('details').querySelectorAll('input[type=checkbox]').forEach(function(c){ c.checked=true; }); }
  else if(act==='ignore'){ var ids=ticked(); if(!ids.length){ toast('Tick some jobs first'); return; } a.disabled=true; api('POST',{action:'jobberSync',ignore:ids}).then(function(){ toast('Ignored '+ids.length); return load(); }).catch(function(x){ a.disabled=false; toast(x.message); }); }
});
function ticked(){ return Array.prototype.map.call(document.querySelectorAll('#pendf input:checked'),function(c){return c.value;}); }
function xSyncMsg(r){ var p=[]; if(r.added) p.push(r.added+' sent'); if(r.updated) p.push(r.updated+' updated'); if(r.deleted) p.push(r.deleted+' removed'); var m=p.length?'Xero: '+p.join(', '):'Xero is up to date'; if(r.errors&&r.errors.length) m+=' · '+r.errors.length+' problem'+(r.errors.length===1?'':'s'); if(r.left) m+=' · '+r.left+' more next sync'; return m; }
function syncMsg(r){ var p=[]; if(r.added) p.push(r.added+' added'); if(r.updated) p.push(r.updated+' moved'); if(r.removed) p.push(r.removed+' cancelled'); if(r.linked) p.push(r.linked+' matched'); return p.length?'Synced: '+p.join(', '):'Synced. Roster already up to date.'; }
app.addEventListener('submit',function(e){
  var f=e.target, btn=f.querySelector('[type=submit]');
  if(f.id==='pf'||f.id==='rf'){ e.preventDefault(); var m={}; Array.prototype.forEach.call(f.querySelectorAll('input'),function(i){ if(f.id==='rf'||i.value!=='') m[i.name]=i.value; }); if(!Object.keys(m).length){ toast('Enter at least one price'); return; } btn.disabled=true; btn.textContent='Saving…';
    priceQ=priceQ.then(function(){ return api('POST',f.id==='pf'?{action:'prices',prices:m}:{action:'prices',recur:m}); }); priceQ.then(function(){ Array.prototype.forEach.call(f.querySelectorAll('input'),function(i){ delete i.dataset.dirty; }); }).then(load).then(function(){ toast('Prices saved'); }).catch(function(x){ btn.disabled=false; btn.textContent='Save'; toast(x.message); }); return; }
  if(f.id==='xf'){ e.preventDefault(); var xe=f.querySelector('#xErr'), codes={}; Array.prototype.forEach.call(f.querySelectorAll('[data-cat]'),function(i){ codes[i.dataset.cat]=i.value; });
    btn.disabled=true; btn.textContent='Saving…';
    xapi('POST',{action:'settings',bank:f.elements.bank.value,cardBank:f.elements.cardBank.value,sales:f.elements.sales.value,from:f.elements.from.value,codes:codes}).then(loadX).then(function(){ xMsg=null; toast('Xero settings saved'); }).catch(function(x){ btn.disabled=false; btn.textContent='Save Xero settings'; xe.textContent=x.message; xe.hidden=false; }); return; }
  if(f.id==='jf'){ e.preventDefault(); var err=f.querySelector('#jErr'); btn.disabled=true; btn.textContent='Connecting…';
    api('POST',{action:'jobberUrl',url:f.elements.url.value}).then(function(r){ toast(syncMsg(r)); return load(); }).catch(function(x){ btn.disabled=false; btn.textContent='Connect and sync'; err.textContent=x.message; err.hidden=false; }); return; }
  if(f.id==='pendf'){ e.preventDefault(); var ids=ticked(); if(!ids.length){ toast('Tick the jobs to add'); return; } btn.disabled=true; btn.textContent='Adding…';
    api('POST',{action:'jobberSync',add:ids}).then(function(r){ toast(syncMsg(r)); return load(); }).catch(function(x){ btn.disabled=false; btn.textContent='Add ticked to roster'; toast(x.message); }); return; }
});
// Each price saves on its own as soon as you leave the box, one at a time so none overwrite each other.
var priceQ=Promise.resolve();
app.addEventListener('input',function(e){ var i=e.target; if(i.form&&(i.form.id==='pf'||i.form.id==='rf')){ i.dataset.dirty=1; var c=i.closest('.prow2'); if(c) c.classList.remove('saved'); } });
app.addEventListener('change',function(e){
  var i=e.target; if(!i.form||i.form.id!=='pf'||i.value==='') return;
  var k=i.name, v=i.value, row=i.closest('.prow2');
  priceQ=priceQ.then(function(){ return api('POST',{action:'price',key:k,price:+v}); }).then(function(){
    D.books.prices[k]=+v; if(i.value===v){ delete i.dataset.dirty; if(row) row.classList.add('saved'); }
  }).catch(function(x){ toast('Price not saved: '+x.message); });
});
function unsaved(){ return !!app.querySelector('#pf input[data-dirty],#rf input[data-dirty]'); }
render(); load();
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&!document.getElementById('scrim')&&!unsaved()) priceQ.then(load); });
</script>
