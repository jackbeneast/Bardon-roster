</style></head><body>
<div id="app"><div class="center">Loading…</div></div>
<script type="module">
import { pnl, bookingsOf, priceOf, perMonth, dueDates, rosteredHours, toWrap, costBasis } from '/lib/profit.mjs';
import { shiftCosts } from '/lib/wages.mjs';

var app=document.getElementById('app');
var D=null, loadErr='', loaded=false, X=null, xMsg=null, PIPE=null;
var mode=lsGet('books_mode')||'month', off=0;
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var LOGO='<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M5 21 L24 6 L43 21" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="square"/><text x="24" y="43" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-weight="700" font-size="25" fill="#1A1A1A">B</text></svg>';
var FREQ={weekly:'Weekly',fortnightly:'Fortnightly',monthly:'Monthly',quarterly:'Quarterly',yearly:'Yearly'};
var NOGST=['Bank & card fees'];

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function money(v,dp){ v=+v||0; var d=dp===0?0:2; return (v<0?'−':'')+'$'+Math.abs(v).toLocaleString('en-AU',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function m0(v){ return money(Math.round(v),0); }
function pad(n){ return (n<10?'0':'')+n; }
function iso(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function today(){ return iso(new Date()); }
function pdate(s){ var p=s.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function addD(s,n){ var d=pdate(s); d.setDate(d.getDate()+n); return iso(d); }
function fday(s,dow){ if(!s) return ''; var d=pdate(s); return (dow?DOW[d.getDay()]+' ':'')+d.getDate()+' '+MON[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():''); }
function toast(m){ var t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(function(){t.remove();},3200); }
function key(){ return lsGet('roster_admin_key')||''; }
function api(method,body,qs){
  return fetch('/api/books'+(qs||''),{method:method,headers:{'content-type':'application/json','x-admin-key':key()},body:body?JSON.stringify(body):undefined,cache:'no-store'})
    .then(function(r){ return r.json().catch(function(){return {};}).then(function(d){ if(!r.ok){ var e=new Error(d.error||'Something went wrong. Try again.'); e.status=r.status; throw e; } return d; }); });
}
function load(){
  if(!key()){ loadErr='login'; render(); return Promise.resolve(); }
  loadX();
  fetch('/api/pipeline',{headers:{'x-admin-key':key()},cache:'no-store'}).then(function(r){ return r.ok?r.json():null; }).then(function(d){ PIPE=d; if(loaded) render(); }).catch(function(){});
  return api('GET').then(function(d){ D=d; OHR=null; loaded=true; loadErr=''; render(); }).catch(function(e){ loadErr=e.status===401?'login':e.message; render(); });
}
function xapi(method,body){
  return fetch('/api/xero',{method:method,headers:{'content-type':'application/json','x-admin-key':key()},body:body?JSON.stringify(body):undefined,cache:'no-store'})
    .then(function(r){ return r.json().catch(function(){return {};}).then(function(d){ if(!r.ok) throw new Error(d.error||'Something went wrong. Try again.'); return d; }); });
}
function loadX(){ return xapi('GET').then(function(d){ X=d; if(loaded) render(); }).catch(function(e){ X={error:e.message}; if(loaded) render(); }); }
function route(){ var h=location.hash.replace(/^#\/?/,'').split('?')[0].split('/'); return h[0]||'profit'; }
(function(){ var m=location.hash.match(/[?&](ok|err)=([^&]*)/); if(m){ xMsg={ok:m[1]==='ok',text:decodeURIComponent(m[2])}; history.replaceState(null,'','#/xero'); } })();
window.addEventListener('hashchange',function(){ closeSheet(); render(); window.scrollTo(0,0); });

// ---------- periods ----------
function period(m,o){
  var t=new Date(), y=t.getFullYear(), mo=t.getMonth(), s, e, label;
  if(m==='week'){ var dw=(t.getDay()+6)%7; s=new Date(y,mo,t.getDate()-dw+7*o); e=new Date(s.getFullYear(),s.getMonth(),s.getDate()+6);
    label=s.getDate()+(s.getMonth()!==e.getMonth()?' '+MON[s.getMonth()]:'')+'–'+e.getDate()+' '+MON[e.getMonth()]+(e.getFullYear()!==y?' '+e.getFullYear():'');
    return {from:iso(s),to:iso(e),label:label,sub:o===0?'This week':o===1?'Next week':o===-1?'Last week':''}; }
  if(m==='month'){ s=new Date(y,mo+o,1); e=new Date(y,mo+o+1,0); label=MON[s.getMonth()]+' '+s.getFullYear(); }
  else if(m==='quarter'){ var q=Math.floor(mo/3)+o, qs=new Date(y,q*3,1); s=qs; e=new Date(qs.getFullYear(),qs.getMonth()+3,0); label=MON[s.getMonth()]+'–'+MON[e.getMonth()]+' '+e.getFullYear(); }
  else { var fy=(mo>=6?y:y-1)+o; s=new Date(fy,6,1); e=new Date(fy+1,5,30); label='FY '+fy+'–'+String(fy+1).slice(2); }
  var sub=o===0?(m==='month'?'This month':m==='quarter'?'This BAS quarter':'This financial year'):(m==='quarter'?'BAS quarter':'');
  return {from:iso(s),to:iso(e),label:label,sub:sub};
}
function nowHM(){ var d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function wrapList(){ return toWrap(D,today(),nowHM()); }
function nudges(p){
  var h='', t=today();
  var wl=wrapList();
  if(wl.length) h+='<button type="button" class="nudge" data-wrap="'+esc(wl[0].key)+'"><span><b>'+wl.length+' finished job'+(wl.length===1?' needs':'s need')+' actual hours.</b> '+(wl.length===1?esc(wl[0].j.client||'Job')+', '+fday(wl[0].last,true)+'. ':'')+'Log hours and costs to see what '+(wl.length===1?'it':'each one')+' really made per hour.</span><span class="go">Log ›</span></button>';
  var un=bookingsOf(D.jobs).filter(function(b){ return b.date<=addD(t,30) && priceOf(b,D.books,D.quoteTotals).price==null; });
  if(un.length) h+='<a class="nudge" href="#/prices"><span><b>'+un.length+' job'+(un.length===1?' has':'s have')+' no price.</b> Revenue and profit are short until they do.</span><span class="go">Add ›</span></a>';
  var left=D.setup.filter(function(x){ return !D.books.setup[x[0]]; }).length;
  if(left) h+='<a class="nudge" href="#/spend"><span><b>'+left+' regular outgoing'+(left===1?'':'s')+' to check.</b> Insurance, fuel, phone, software… add what you pay so profit is real.<span class="prog"><i style="width:'+Math.round((D.setup.length-left)/D.setup.length*100)+'%"></i></span></span><span class="go">Do it ›</span></a>';
  var last=D.expenses[0], days=last?Math.floor((Date.now()-Date.parse(last.at))/864e5):null;
  if(!last) h+='<button type="button" class="nudge gold" data-act="addexp"><span><b>No expenses logged yet.</b> Snap your next receipt the moment you pay. Takes 10 seconds.</span><span class="go">Add ›</span></button>';
  else if(days>=7) h+='<button type="button" class="nudge gold" data-act="addexp"><span><b>Nothing logged for '+days+' days.</b> Products, fuel, parking, a new mop? Add it now while you remember.</span><span class="go">Add ›</span></button>';
  var pend=(D.jobber.pending||[]).filter(function(x){ return x.date>=t; }).length;
  if(pend) h+='<a class="nudge" href="#/prices"><span><b>'+pend+' Jobber job'+(pend===1?'':'s')+' not on the roster.</b></span><span class="go">Review ›</span></a>';
  if(X&&X.connected&&X.last&&X.last.errors&&X.last.errors.length) h+='<a class="nudge" href="#/xero"><span><b>Xero sync needs a look.</b> '+X.last.errors.length+' item'+(X.last.errors.length===1?'':'s')+' didn\'t go across.</span><span class="go">See ›</span></a>';
  else if(X&&X.configured&&(!X.connected||!X.bank)) h+='<a class="nudge gold" href="#/xero"><span><b>'+(X.connected?'Pick your bank account in Xero settings':'Connect Xero')+'</b> so payments and expenses flow into your BAS.</span><span class="go">Set up ›</span></a>';
  if(!D.jobber.on) h+='<a class="nudge gold" href="#/prices"><span><b>Connect Jobber</b> to bring your recurring cleans onto the roster.</span><span class="go">Connect ›</span></a>';
  return h;
}

function topbar(){ return '<div class="top"><a href="/">← Hub</a><span class="wm">'+LOGO+'Bardon Clean</span><button data-act="refresh">Refresh</button></div>'; }
function tabs(r){ function b(v,l){ return '<button type="button" data-go="'+v+'" aria-pressed="'+(r===v)+'">'+l+'</button>'; } return '<div class="seg">'+b('profit','Profit')+b('spend','Spending')+b('prices','Prices &amp; apps')+'</div>'; }
function bottom(){ return '<div class="bar"><div class="in"><div class="sum">Paid for something?<b>Log it now</b></div><button type="button" class="btn plain" data-act="addexp">+ Manual</button>'+rcptBtn('btn primary','📷 Receipts')+'</div></div>'; }
function rcptBtn(cls,label,style){ return '<label class="'+cls+'"'+(style?' style="'+style+'"':'')+'>'+label+'<input type="file" accept="image/*" multiple data-rcpts hidden></label>'; }
function periodNav(p){ return '<div class="chips" style="margin-top:14px">'+['week','month','quarter','year'].map(function(m){ return '<button type="button" class="chip" data-mode="'+m+'" aria-pressed="'+(mode===m)+'">'+(m==='week'?'Week':m==='month'?'Month':m==='quarter'?'BAS quarter':'Financial year')+'</button>'; }).join('')+'</div><div class="navp"><button class="icon-btn" data-off="-1" aria-label="Previous">&larr;</button><div class="lbl">'+esc(p.label)+(p.sub?'<small>'+p.sub+'</small>':'')+'</div>'+(off?'<button class="icon-btn" data-off="0">Now</button>':'')+'<button class="icon-btn" data-off="1" aria-label="Next">&rarr;</button></div>'; }

function render(){
  if(loadErr==='login'){ app.innerHTML='<div class="center">'+LOGO.replace('<svg','<svg style="width:48px;height:48px"')+'<h1 style="margin-top:12px">Log in <em>first</em></h1><p class="sub">Open the hub, log in with your password, then come back here.</p><p><a class="btn primary" href="/">Go to the hub</a></p></div>'; return; }
  if(loadErr){ app.innerHTML='<div class="center"><p>'+esc(loadErr)+'</p><button class="btn dark" data-act="refresh">Try again</button></div>'; return; }
  if(!loaded){ app.innerHTML='<div class="center">Loading…</div>'; return; }
  var r=route();
  if(r==='add'){ history.replaceState(null,'','#/'); expenseSheet(null); r='profit'; }
  if(r==='wrap'){ var wk=decodeURIComponent(location.hash.replace(/^#\/?wrap\/?/,'').split('?')[0]); history.replaceState(null,'','#/'); r='profit'; setTimeout(function(){ var l=wrapList(); if(wk) wrapSheet(wk); else if(l.length) wrapSheet(l[0].key); else toast('All finished jobs have their hours logged'); },0); }
  var jump=r==='jobber'?'jobberCard':r==='xero'?'xeroCard':'';
  if(jump) r='prices';
  var h=topbar()+'<h1>'+(r==='profit'?'Profit':r==='spend'?'Spending':'Prices <em>&amp;</em> apps')+'</h1>'+tabs(r);
  h+= r==='spend'?renderSpend(): r==='prices'?renderPrices(): renderProfit();
  var keep={}; Array.prototype.forEach.call(app.querySelectorAll('#pf input[data-dirty],#rf input[data-dirty]'),function(i){ keep[i.form.id+'|'+i.name]=i.value; });
  app.innerHTML=h+bottom();
  Object.keys(keep).forEach(function(k){ var x=k.split('|'), f=document.getElementById(x[0]), i=f&&f.elements[x[1]]; if(i&&i.value!==keep[k]){ i.value=keep[k]; i.dataset.dirty=1; } });
  if(jump){ var jb=document.getElementById(jump); if(jb) jb.scrollIntoView(); }
}

// ---------- Profit ----------
function svcKind(s){ s=String(s||'').toLowerCase(); return /bond|lease|vacate/.test(s)?'Bond':/pre.?sale/.test(s)?'Pre-sale':/deep|move.?in/.test(s)?'Deep':/regular/.test(s)?'Regular':'Other'; }
// Which kind of clean actually pays best per hour, from jobs with hours logged.
function byService(x){
  var g={};
  x.jobs.forEach(function(b){ if(!b.actHrs||b.rev==null) return; var k=svcKind(b.j.service), o=g[k]||(g[k]={n:0,hrs:0,rev:0,profit:0}); o.n++; o.hrs+=b.actHrs; o.rev+=b.rev; o.profit+=b.profit; });
  var ks=Object.keys(g); if(!ks.length) return '';
  ks.sort(function(a,b){ return g[b].profit/g[b].hrs - g[a].profit/g[a].hrs; });
  var best=g[ks[0]].profit/g[ks[0]].hrs;
  var h='<div class="card"><h2>Per hour <em>by service</em></h2><div class="svc">';
  ks.forEach(function(k){ var o=g[k], ph=o.profit/o.hrs, w=best>0?Math.max(4,Math.round(Math.max(0,ph)/best*100)):0;
    h+='<div class="svr"><div class="svt"><b>'+esc(k)+'</b><span>'+m0(ph)+'/hr profit</span></div><div class="svb"><i style="width:'+w+'%"></i></div><small>'+o.n+' job'+(o.n===1?'':'s')+' · '+Math.round(o.hrs*10)/10+' hrs · '+m0(o.rev/o.hrs)+'/hr earned'+(D.gstReg?' ex GST':'')+'</small></div>'; });
  h+='</div><p class="hint">Only jobs with hours logged (clock-off or wrap-up). Profit is after team wages, super and job costs, before your own time and overheads.</p></div>';
  return h;
}
// What's coming: booked work over the next 4 weeks and quotes waiting on a yes.
function comingUp(){
  var t=today(), y=pnl(D,t,addD(t,27)), un=y.unpriced.length;
  var h='<div class="card"><h2>Coming <em>up</em></h2><div class="kpis" style="margin-top:0;grid-template-columns:1fr 1fr"><div class="kpi"><b>'+m0(y.revInc)+'</b><span>Booked, next 4 weeks'+(un?' · '+un+' job'+(un===1?'':'s')+' unpriced':'')+'</span></div>';
  h+='<div class="kpi"><b>'+(PIPE?m0(PIPE.totals.quoted):'…')+'</b><span>Quoted, waiting on a yes'+(PIPE?' · '+PIPE.stages.quoted.filter(function(q){return !q.draft;}).length+' quotes':'')+'</span></div></div>';
  h+='<p class="hint">Booked counts every rostered job starting in the next 28 days at its price, including GST. <a href="/?v=pipeline">Open the pipeline</a> to chase quotes.</p></div>';
  return h;
}

// ---------- Week ahead: where you stand and what to do ----------
// Forecast for a week from the roster: booked revenue against what it costs to
// run that week (rostered wages + super, products, a week's share of overheads),
// your pay target and growth margin, with the actions that close any gap.
function weekAhead(p,isNext){
  var x=pnl(D,p.from,p.to), C=costBasis(D,today()), T=D.books.pricing||{margin:20,tax:32};
  var ownerIds={}; (D.team||[]).forEach(function(t){ if(t.owner) ownerIds[t.id]=1; });
  var ownHrs=0; x.jobs.forEach(function(b){ var ro=rosteredHours(b,D.pay); Object.keys(ro).forEach(function(k){ if(ownerIds[k]) ownHrs+=ro[k]; }); });
  var allHrs=x.jobs.reduce(function(a,b){return a+b.hrs;},0);
  var labour=x.wages+x.sup, mat=allHrs*(+C.matPerHr||0), ohWk=C.ohMonth*12/52;
  var be=labour+mat+ohWk, ownerRate=T.ownerRate!=null?+T.ownerRate:+((D.pay&&D.pay.rates&&D.pay.rates.wk)||37.5);
  var you=ownHrs*ownerRate, m=(+T.margin||0)/100, goal=m<1?(be+you)/(1-m):be+you, tx=(+T.tax||0)/100;
  var rev=x.rev, left=rev-be;
  // Typical job from the last 90 days, to turn a gap into "about N jobs".
  var hist=pnl(D,addD(today(),-90),today()).jobs.filter(function(j){ return j.rev!=null&&j.hrs>0; });
  var avgRev=hist.length?hist.reduce(function(a,j){return a+j.rev;},0)/hist.length:0, avgHrs=hist.length?hist.reduce(function(a,j){return a+j.hrs;},0)/hist.length:0;
  var capWk=(C.hrsTarget||0)*12/52;
  // Staff overtime and penalty-rate days.
  var sh=shiftCosts(D.jobs,D.team,D.pay,p.from,p.to), ot={}, wkPerson={}, names={};
  (D.team||[]).forEach(function(t){ names[t.id]=t.name||'Staff'; });
  sh.forEach(function(s){ if(s.ot>0.01) ot[s.pid]=(ot[s.pid]||0)+s.ot; wkPerson[s.pid]=(wkPerson[s.pid]||0)+s.hrs; });
  var pen=x.jobs.reduce(function(a,b){ return a+b.days.filter(function(j){ var d=pdate(j.date).getDay(); return j.date>=p.from&&j.date<=p.to&&(d===0||d===6); }).length; },0);
  // Days Mon–Sat with nothing on.
  var busy={}; D.jobs.forEach(function(j){ if(!j.sample&&j.date>=p.from&&j.date<=p.to) busy[j.date]=1; });
  var free=[]; for(var i=0;i<6;i++){ var dd=addD(p.from,i); if(!busy[dd]&&dd>=today()) free.push(DOW[pdate(dd).getDay()]); }
  var bills=(x.fixedHits||[]).slice().sort(function(a,b){return a.date.localeCompare(b.date);});

  var h='<div class="card wk"><div class="hrow"><h2>'+(isNext?'Next <em>week</em>':'Where this week <em>stands</em>')+'</h2><span class="sub" style="margin:0">'+esc(p.label)+'</span></div>';
  var cls, head;
  if(!x.jobs.length){ cls='bad'; head='<b>Nothing booked yet.</b>A quiet week still costs about '+money(ohWk,0)+' in overheads.'; }
  else if(rev<be-0.5){ cls='bad'; head='<b>'+money(be-rev,0)+' below break-even.</b>Booked work doesn\'t yet cover this week\'s wages, products and overheads.'; }
  else if(rev<goal-0.5){ cls='warn'; head='<b>Covers costs, '+money(goal-rev,0)+' short of your goal.</b>'+(ownHrs?'Your '+r1(ownHrs)+' hrs are paid at '+money(Math.max(0,left)/ownHrs)+'/hr against your '+money(ownerRate)+' target.':'Short of your '+Math.round(m*100)+'% growth margin.'); }
  else { cls='ok'; head='<b>On track: '+money(rev-goal,0)+' above your goal.</b>'+(ownHrs?'Your '+r1(ownHrs)+' hrs work out at '+money(left/ownHrs)+'/hr before tax.':'Costs, your pay and margin are covered.'); }
  h+='<div class="verdict '+cls+'">'+head+'</div>';
  h+='<div class="kpis"><div class="kpi dark"><b>'+m0(rev)+'</b><span>Booked'+(D.gstReg?' ex GST':'')+' · '+x.jobs.length+' job'+(x.jobs.length===1?'':'s')+'</span></div><div class="kpi"><b>'+m0(be)+'</b><span>Break-even</span></div><div class="kpi"><b>'+m0(goal)+'</b><span>Goal</span></div></div>';
  // Meter
  var mx=Math.max(goal,rev,1), pr=Math.min(100,rev/mx*100), pb=be/mx*100, pg=goal/mx*100;
  h+='<div class="meter"><i style="width:'+pr+'%" class="'+cls+'"></i><s style="left:'+pb+'%" title="Break-even"></s><s style="left:'+pg+'%" class="g" title="Goal"></s></div><div class="mlbl"><span>$0</span><span>break-even ▲ goal ▲</span></div>';
  h+='<div class="pnl" style="margin-top:10px">';
  h+='<div class="neg"><span>Staff wages + super <small style="color:var(--meta)">'+r1(x.hrs)+' hrs rostered</small></span><span>'+money(labour)+'</span></div>';
  h+='<div class="neg"><span>Products <small style="color:var(--meta)">'+r1(allHrs)+' hrs at '+money(C.matPerHr||0)+'/hr</small></span><span>'+money(mat)+'</span></div>';
  h+='<div class="neg"><span>Overheads <small style="color:var(--meta)">a week\'s share of '+m0(C.ohMonth)+'/month</small></span><span>'+money(ohWk)+'</span></div>';

// ---------- sheets ----------
function sheet(inner){ closeSheet(); var s=document.createElement('div'); s.className='scrim'; s.id='scrim'; s.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+inner+'</div>'; s.addEventListener('click',function(e){ if(e.target===s||e.target.closest('[data-close]')) closeSheet(); }); document.body.appendChild(s); return s; }
function closeSheet(){ var s=document.getElementById('scrim'); if(s) s.remove(); }
function recentCats(){ var seen={}, out=[]; D.expenses.forEach(function(e){ if(!seen[e.cat]){ seen[e.cat]=1; out.push(e.cat); } }); D.cats.forEach(function(c){ if(!seen[c]){ seen[c]=1; out.push(c); } }); return out; }

function shrink(file,max){ return new Promise(function(res,rej){ var img=new Image(), u=URL.createObjectURL(file); img.onload=function(){ var m=max||1400, w=img.width, h=img.height, k=Math.min(1,m/Math.max(w,h)); var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',0.72)); }; img.onerror=function(){ rej(new Error('Couldn\'t read that photo')); }; img.src=u; }); }

function expenseSheet(e){
  var isNew=!e; e=e||{date:today(),cat:'',amt:'',who:'',note:'',job:'',gst:0};
  var cats=recentCats(), cat=e.cat||'', photo=null, dropR=false;
  var hasGst=!isNew ? (e.gst>0) : D.gstReg;

  var h='<h3>'+(isNew?'Log an <em>expense</em>':'Edit <em>expense</em>')+'</h3>';

  h+='<form id="ef" novalidate>';
  h+='<label class="l">Amount'+(D.gstReg?' <small>(total paid, inc GST)</small>':'')+'<span class="money-in bigw" style="display:block"><input class="big" name="amt" type="number" inputmode="decimal" step="0.01" min="0" value="'+esc(e.amt)+'" required></span></label>';
  h+='<div style="margin-top:14px"><span class="l">What for</span><div class="cats">'+cats.map(function(c){ return '<button type="button" data-cat="'+esc(c)+'" aria-pressed="'+(c===cat)+'">'+esc(c)+'</button>'; }).join('')+'</div></div>';
  h+='<div class="grid" style="margin-top:14px"><label class="l">Date<input name="date" type="date" value="'+esc(e.date)+'"></label><label class="l">Where / who<input name="who" value="'+esc(e.who)+'" placeholder="e.g. Bunnings"></label></div>';

  h+='<label class="l" style="margin-top:12px">Note <small>(optional)</small><input name="note" value="'+esc(e.note)+'"></label>';
  h+='<div style="margin-top:14px"><span class="l">Receipt</span><div id="rbox">'+(e.receipt?'<p class="sub">Loading receipt…</p>':'')+'</div><label class="btn plain" style="margin-top:8px;width:100%">'+(e.receipt?'Replace photo':'📷 Snap or choose receipt')+'<input type="file" accept="image/*" name="photo" hidden></label></div>';
  h+='<div class="err" id="eErr" hidden></div><div class="actions"><button type="button" class="btn plain" data-close>Cancel</button><button type="submit" class="btn primary grow">Save expense</button></div>';
  if(!isNew) h+='<div class="actions"><button type="button" class="btn plain grow" data-del style="color:var(--terracotta-dark)">Delete expense</button></div>';
  h+='</form>';
  var s=sheet(h), f=s.querySelector('#ef'), rbox=s.querySelector('#rbox');
  if(isNew) setTimeout(function(){ f.elements.amt.focus(); },80);
  if(e.receipt) fetch('/api/books?receipt='+encodeURIComponent(e.id),{headers:{'x-admin-key':key()}}).then(function(r){ return r.ok?r.blob():null; }).then(function(b){ rbox.innerHTML=b?'<img class="rcpt" alt="Receipt" src="'+URL.createObjectURL(b)+'"><button type="button" class="ghost" data-dropr>Remove photo</button>':''; }).catch(function(){ rbox.innerHTML=''; });
  s.addEventListener('click',function(ev){
    var c=ev.target.closest('[data-cat]'); if(c){ cat=c.dataset.cat; s.querySelectorAll('[data-cat]').forEach(function(b){ b.setAttribute('aria-pressed', String(b===c)); }); if(isNew&&f.elements.gst) f.elements.gst.checked=NOGST.indexOf(cat)<0; return; }
    if(ev.target.closest('[data-dropr]')){ dropR=true; photo=null; rbox.innerHTML='<p class="sub">Photo will be removed.</p>'; return; }
  });
  f.elements.photo.onchange=function(){ var file=f.elements.photo.files[0]; if(!file) return; rbox.innerHTML='<p class="sub">Preparing photo…</p>'; shrink(file).then(function(d){ photo=d; dropR=false; rbox.innerHTML='<img class="rcpt" alt="Receipt" src="'+d+'">'; }).catch(function(x){ rbox.innerHTML='<p class="err">'+esc(x.message)+'</p>'; }); };
  f.onsubmit=function(ev){ ev.preventDefault(); var err=s.querySelector('#eErr'), btn=f.querySelector('.primary');
    var a=parseFloat(f.elements.amt.value); if(!(a>0)){ err.textContent='Enter the amount.'; err.hidden=false; return; }

    var body={action:'expense',id:isNew?'':e.id,expense:{amt:a,date:f.elements.date.value||today(),cat:cat,who:f.elements.who.value,note:f.elements.note.value,job:f.elements.job.value,gst:D.gstReg?f.elements.gst.checked:false,gstAmt:0},receipt:photo||undefined,dropReceipt:dropR||undefined};
    api('POST',body).then(function(r){ closeSheet(); var i=D.expenses.findIndex(function(x){return x.id===r.expense.id;}); if(i>=0) D.expenses[i]=r.expense; else D.expenses.unshift(r.expense); D.expenses.sort(function(x,y){return (y.date+y.at).localeCompare(x.date+x.at);}); render(); toast(isNew?'Expense logged':'Saved'); })
      .catch(function(x){ btn.disabled=false; btn.textContent='Save expense'; err.textContent=x.message; err.hidden=false; });
  };
  var del=s.querySelector('[data-del]'); if(del) del.onclick=function(){ if(!del.dataset.sure){ del.dataset.sure=1; del.textContent='Tap again to delete'; return; } api('POST',{action:'delexpense',id:e.id}).then(function(){ D.expenses=D.expenses.filter(function(x){return x.id!==e.id;}); closeSheet(); render(); toast('Deleted'); }).catch(function(x){ toast(x.message); }); };
}


// ---------- many receipts at once ----------
// Claude reads each photo and fills in an expense; Jack checks them all on one screen and saves.
var MAXR=20, RB=null;
document.addEventListener('change',function(e){
  var i=e.target; if(!i.matches||!i.matches('input[data-rcpts]')) return;
  var files=Array.prototype.slice.call(i.files||[]); i.value='';
  if(files.length) addReceipts(files);
});
function addReceipts(files){
  var open=RB&&document.getElementById('rbatch');
  if(!open){ RB={rows:[],seq:0,busy:0,saving:false}; }
  var room=MAXR-RB.rows.filter(function(r){return !r.saved;}).length;
  if(files.length>room) toast('Up to '+MAXR+' at a time. Added the first '+Math.max(room,0)+'.');
  files.slice(0,Math.max(room,0)).forEach(function(file){
    RB.rows.push({id:'r'+(++RB.seq),file:file,st:'wait',f:{amt:'',date:'',who:'',cat:'',gstAmt:'',job:'',note:''},msg:'',skip:false,saved:false});
  });
  if(!open) batchSheet(); else { drawRows(); }
  pump();
}
function pump(){
  while(RB&&RB.busy<3){
    var r=RB.rows.filter(function(x){return x.st==='wait';})[0]; if(!r) break;
    r.st='read'; RB.busy++; drawRow(r); readOne(r);
  }
  drawFoot();
}
function readOne(r){
  var batch=RB;
  shrink(r.file,1800).then(function(d){
    r.photo=d;
    if(!D.scanOn) throw Object.assign(new Error('off'),{off:true});
    return api('POST',{action:'scan',receipt:d});
  }).then(function(res){
    var x=res.read, f=r.f;
    f.amt=x.amt!=null?x.amt.toFixed(2):''; f.date=x.date||today(); f.who=x.who||''; f.cat=x.cat||''; f.note=x.note||'';
    var gstDefault=x.gstAmt!=null?x.gstAmt:0;
    f.gstAmt=D.gstReg?gstDefault.toFixed(2):'0';
    var flags=[];
    if(!x.receipt) flags.push('Doesn\'t look like a receipt');
    if(x.foreign) flags.push('Not in Australian dollars');
    if(x.amt==null) flags.push('Couldn\'t find the total');
    if(!x.date) flags.push('No date found, set to today');
    if(D.gstReg&&x.gstAmt==null&&x.amt!=null&&NOGST.indexOf(x.cat)<0) flags.push('No GST shown, so none claimed. Add it if the receipt includes GST');
    if(x.unsure) flags.push(x.unsure);
    r.flags=flags; r.st='ok';
    if(!x.receipt) r.skip=true;
  }).catch(function(e){
    r.st='fail'; r.f.date=r.f.date||today(); if(D.gstReg) r.f.gstAmt='';
    r.msg=e.off?'':(e.message||'Couldn\'t read it');
  }).then(function(){
    batch.busy--; if(RB!==batch) return;
    checkDupes(); drawRow(r); pump();
  });
}
function sameish(a,b){ return a&&b&&Math.abs(+a.amt-+b.amt)<0.005&&a.date===b.date; }
function checkDupes(){
  var done=RB.rows.filter(function(r){ return (r.st==='ok'||r.st==='fail')&&!r.saved; });
  done.forEach(function(r,i){
    if(!(+r.f.amt>0)) return;
    var me={amt:+r.f.amt,date:r.f.date};
    var old=D.expenses.filter(function(e){ return sameish(e,me); })[0];
    var twin=done.slice(0,i).filter(function(o){ return !o.skip&&sameish({amt:+o.f.amt,date:o.f.date},me); })[0];
    var was=r.dupe;
    r.dupe=old?'Already logged: '+(old.who||old.cat)+' '+money(old.amt)+' on '+fday(old.date):twin?'Same total and date as another receipt here':'';
    if(r.dupe&&!was&&!r.touched){ r.skip=true; drawRow(r); }
    else if(!r.dupe&&was&&!r.touched){ r.skip=false; drawRow(r); }
  });
}
function batchJobs(){ var t=today(); return bookingsOf(D.jobs).filter(function(b){ return b.last>=addD(t,-60) && b.date<=addD(t,7); }).sort(function(a,b){return b.date.localeCompare(a.date);}); }
function batchSheet(){
  var h='<div id="rbatch"><h3>Check your <em>receipts</em></h3>';
  if(!D.scanOn) h+='<div class="hint-card">Receipt reading isn\'t switched on yet, so fill each one in below. Once it\'s on, Claude fills these in for you.</div>';
  else h+='<p class="sub" style="margin-top:-6px">Claude fills these in. Check anything marked, then save.</p>';
  h+='<div id="rrows"></div><div style="margin-top:12px">'+rcptBtn('btn plain','+ Add more receipts','width:100%')+'</div>';
  h+='<div class="rfoot"><div class="err" id="rErr" hidden></div><div class="actions" style="margin-top:8px"><button type="button" class="btn plain" data-rcancel>Cancel</button><button type="button" class="btn primary grow" data-rsave>Save</button></div></div></div>';
  var s=sheet(h);
  s.querySelector('.sheet').classList.add('tall');
  s.addEventListener('click',onBatchClick,true);
  s.addEventListener('input',onBatchInput);
  s.addEventListener('change',onBatchInput);
  drawRows();
}
function drawRows(){ var box=document.getElementById('rrows'); if(!box) return; box.innerHTML=''; RB.rows.forEach(function(r){ if(!r.saved){ var d=document.createElement('div'); d.id=r.id; box.appendChild(d); drawRow(r); } }); drawFoot(); }
function drawRow(r){
  var el=document.getElementById(r.id); if(!el) return;
  var f=r.f, n=RB.rows.indexOf(r)+1;
  el.className='ritem'+(r.skip?' skip':'')+(r.st==='read'||r.st==='wait'?' busy':'');
  var thumb=r.photo?'<button type="button" class="rthumb" data-zoom="'+r.id+'" aria-label="View receipt '+n+'"><img alt="" src="'+r.photo+'"></button>':'<div class="rthumb ph"></div>';
  var h='<div class="rhead">'+thumb+'<div class="rtitle"><b>'+(r.st==='ok'||r.st==='fail'?esc(f.who||'Receipt '+n):'Receipt '+n)+'</b><small>'+
    (r.st==='wait'?'Waiting…':r.st==='read'?'<span class="spin"></span> Reading…':(+f.amt>0?money(+f.amt):'No total yet')+(f.date?' · '+fday(f.date):''))+'</small></div>'+
    '<button type="button" class="rx" data-rdel="'+r.id+'" aria-label="Remove receipt '+n+'">✕</button></div>';
  if(r.st==='wait'||r.st==='read'){ el.innerHTML=h; return; }
  var notes=[];
  if(r.msg) notes.push(r.msg+'. Fill it in below.');
  if(r.dupe) notes.push(r.dupe);
  (r.flags||[]).forEach(function(x){ notes.push(x); });
  if(notes.length) h+='<ul class="rflags">'+notes.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>';
  if(r.skip){ h+='<div class="rskip"><span>Won\'t be saved</span><button type="button" class="btn plain" data-rkeep="'+r.id+'">Save it anyway</button></div>'; el.innerHTML=h; return; }
  h+='<div class="grid2">';
  h+='<label class="l">Total'+(D.gstReg?' <small>inc GST</small>':'')+'<span class="money-in" style="display:block"><input data-k="amt" type="number" inputmode="decimal" step="0.01" min="0" value="'+esc(f.amt)+'"></span></label>';
  h+='<label class="l">Date<input data-k="date" type="date" value="'+esc(f.date)+'"></label>';
  h+='<label class="l">Where / who<input data-k="who" value="'+esc(f.who)+'" placeholder="e.g. Bunnings"></label>';
  if(D.gstReg) h+='<label class="l">GST <small>in the total</small><span class="money-in" style="display:block"><input data-k="gstAmt" type="number" inputmode="decimal" step="0.01" min="0" value="'+esc(f.gstAmt)+'"></span></label>';
  h+='<label class="l'+(D.gstReg?' full':'')+'">What for<select data-k="cat"><option value="">Pick one…</option>'+D.cats.map(function(c){ return '<option'+(c===f.cat?' selected':'')+'>'+esc(c)+'</option>'; }).join('')+'</select></label>';
  h+='<label class="l full">For a job <small>(optional)</small><select data-k="job"><option value="">Business in general</option>'+batchJobs().map(function(b){ return '<option value="'+esc(b.key)+'"'+(b.key===f.job?' selected':'')+'>'+esc(b.j.client||'Job')+' · '+fday(b.date)+'</option>'; }).join('')+'</select></label>';
  h+='<label class="l full">Note <small>(optional)</small><input data-k="note" value="'+esc(f.note)+'"></label>';
  h+='</div>';
  if(D.gstReg&&+f.amt>0&&Math.abs((+f.gstAmt||0)-Math.round(+f.amt/11*100)/100)>0.004) h+='<button type="button" class="ghost rg" data-r11="'+r.id+'">Set GST to 1/11 ('+money(+f.amt/11)+')</button>';
  el.innerHTML=h;
}
function rowOf(el){ var c=el.closest('.ritem'); return c&&RB.rows.filter(function(r){return r.id===c.id;})[0]; }
function onBatchInput(e){
  var i=e.target, k=i.dataset&&i.dataset.k; if(!k) return; var r=rowOf(i); if(!r) return;
  r.f[k]=i.value; r.touched=true;
  if(k==='amt'||k==='date'){ checkDupes(); var t=document.getElementById(r.id).querySelector('.rtitle small'); if(t) t.textContent=(+r.f.amt>0?money(+r.f.amt):'No total yet')+(r.f.date?' · '+fday(r.f.date):''); }
  if(k==='who'){ var b=document.getElementById(r.id).querySelector('.rtitle b'); if(b) b.textContent=r.f.who||'Receipt'; }
  if(k==='cat'&&D.gstReg&&NOGST.indexOf(r.f.cat)>=0){ r.f.gstAmt='0'; var g=document.getElementById(r.id).querySelector('[data-k=gstAmt]'); if(g) g.value='0'; }
  drawFoot();
}
function onBatchClick(e){
  var t=e.target;
  var z=t.closest('[data-zoom]'); if(z){ e.stopPropagation(); var r=RB.rows.filter(function(x){return x.id===z.dataset.zoom;})[0]; zoom(r.photo); return; }
  var d=t.closest('[data-rdel]'); if(d){ e.stopPropagation(); RB.rows=RB.rows.filter(function(x){return x.id!==d.dataset.rdel;}); var el=document.getElementById(d.dataset.rdel); if(el) el.remove(); checkDupes(); drawFoot(); if(!RB.rows.filter(function(x){return !x.saved;}).length) endBatch(); return; }
  var k=t.closest('[data-rkeep]'); if(k){ e.stopPropagation(); var r2=rowOf(k); r2.skip=false; r2.touched=true; drawRow(r2); drawFoot(); return; }
  var g=t.closest('[data-r11]'); if(g){ e.stopPropagation(); var r3=rowOf(g); r3.f.gstAmt=(Math.round(+r3.f.amt/11*100)/100).toFixed(2); r3.touched=true; drawRow(r3); return; }
  if(t.closest('[data-rcancel]')){ e.stopPropagation(); var left=RB.rows.filter(function(x){return !x.saved&&!x.skip;}).length; if(left&&!t.dataset.sure){ t.dataset.sure=1; t.textContent='Discard '+left+'?'; return; } endBatch(); return; }
  if(t.closest('[data-rsave]')){ e.stopPropagation(); saveBatch(); return; }
  if(t.closest('[data-close]')||t.id==='scrim'){ e.stopPropagation(); e.preventDefault(); }
}
function endBatch(){ RB=null; closeSheet(); }
function zoom(src){ var z=document.createElement('div'); z.className='zoom'; z.innerHTML='<img alt="Receipt" src="'+src+'"><button type="button" class="btn dark">Close</button>'; z.onclick=function(){ z.remove(); }; document.body.appendChild(z); }
function pending(){ return RB.rows.filter(function(r){ return !r.saved&&!r.skip; }); }
function drawFoot(){
  var b=document.querySelector('[data-rsave]'); if(!b||RB.saving) return;
  var p=pending(), reading=RB.rows.filter(function(r){return r.st==='wait'||r.st==='read';}).length;
  var tot=p.reduce(function(a,r){ return a+(+r.f.amt||0); },0);
  b.disabled=!p.length||reading>0;
  b.textContent=reading?'Reading '+(RB.rows.length-reading)+' of '+RB.rows.length+'…':p.length?'Save '+p.length+' expense'+(p.length===1?'':'s')+' · '+money(tot):'Nothing to save';
}
function saveBatch(){
  var p=pending(), err=document.getElementById('rErr');
  var bad=p.filter(function(r){ return !(+r.f.amt>0)||!r.f.cat||!r.f.date; });
  if(bad.length){ err.textContent=bad.length+' still need'+(bad.length===1?'s':'')+' a total, date and category.'; err.hidden=false; document.getElementById(bad[0].id).scrollIntoView({behavior:'smooth',block:'center'}); return; }
  err.hidden=true; RB.saving=true; var b=document.querySelector('[data-rsave]'); b.disabled=true;
  var batch=RB, n=0, fails=[];
  p.reduce(function(q,r){ return q.then(function(){
    b.textContent='Saving '+(++n)+' of '+p.length+'…';
    var g=D.gstReg?Math.max(0,+r.f.gstAmt||0):0;
    return api('POST',{action:'expense',expense:{amt:+r.f.amt,date:r.f.date,cat:r.f.cat,who:r.f.who,note:r.f.note,job:r.f.job,gst:false,gstAmt:g},receipt:r.photo||undefined})
      .then(function(res){ r.saved=true; D.expenses.unshift(res.expense); var el=document.getElementById(r.id); if(el) el.remove(); })
      .catch(function(x){ fails.push(r); r.msg=x.message; drawRow(r); });
  }); },Promise.resolve()).then(function(){
    D.expenses.sort(function(x,y){return (y.date+y.at).localeCompare(x.date+x.at);});
    batch.saving=false; render();
    var ok=p.length-fails.length;
    if(!fails.length){ endBatch(); toast(ok+' expense'+(ok===1?'':'s')+' logged'); return; }
    if(RB===batch){ err.textContent=ok+' saved. '+fails.length+' didn\'t save, try again.'; err.hidden=false; drawFoot(); }
  });
}

// ---------- Job wrap-up: actual hours and costs → real hourly rate and profit ----------
var WRAP_CATS=[['Cleaning products','Products'],['Fuel','Fuel'],['Other','Parking'],['Subcontractors','Subcontractor'],['Equipment','Equipment'],['Other','Other']];
function teamName(pid){ var m=(D.team||[]).filter(function(t){return t.id===pid;})[0]; return m?(m.owner?'You':m.name):'Someone'; }
function isOwner(pid){ return (D.team||[]).some(function(t){return t.id===pid&&t.owner;}); }
function q4(v){ return Math.round(v*4)/4; }
var OHR=null;
function ohRate(){ if(OHR==null){ try{ OHR=costBasis(D,today()).ohPerHr||0; }catch(e){ OHR=0; } } return OHR; }
function ownerHrs(st){ var o=0; (D.team||[]).forEach(function(t){ if(t.owner&&st[t.id]) o+=+st[t.id]||0; }); return o; }
function r1(v){ return Math.round(v*10)/10; }
function wrapSheet(key){

  if(!people.length){ var me=(D.team||[]).filter(function(t){return t.owner;})[0]; if(me) people=[me.id]; }
  var have=D.expenses.filter(function(e){return e.job===key;});
  var h='<h3>Wrap up <em>'+esc(b.j.client||'job')+'</em></h3><p class="sub" style="margin:-6px 0 12px">'+fday(b.date,true)+(b.days.length>1?' to '+fday(b.last,true):'')+' · '+esc(b.j.service||'')+(b.j.suburb?' · '+esc(b.j.suburb):'')+'</p><form id="wf" novalidate>';
  h+='<span class="l">Hours actually worked <small>(each person, not counting unpaid lunch)</small></span><div id="wppl">';
  people.forEach(function(pid){ h+=wrapRow(pid, a?a.staff[pid]:(ro[pid]!=null?q4(ro[pid]):''), ro[pid]); });
  h+='</div>';
  var others=(D.team||[]).filter(function(t){ return people.indexOf(t.id)<0; });
  if(others.length) h+='<select id="waddp" style="margin-top:10px"><option value="">+ Someone else worked on it</option>'+others.map(function(t){ return '<option value="'+esc(t.id)+'">'+esc(t.owner?'You':t.name)+'</option>'; }).join('')+'</select>';
  h+='<div class="wtot"><span>Total hours</span><span id="wtot"></span></div>';
  h+='<label class="l" style="margin-top:16px">Job price'+(D.gstReg?' <small>(inc GST)</small>':'')+'<span class="money-in" style="display:block"><input name="price" type="number" inputmode="decimal" step="0.01" min="0" value="'+(p.price!=null?p.price:'')+'" placeholder="What the client paid"></span></label>';
  h+='<div style="margin-top:16px"><span class="l">Costs for this job <small>(products, fuel, parking, tip runs…)</small></span>';
  if(have.length) h+='<div class="pnl">'+have.map(function(e){ return '<div><span>'+esc(e.cat)+(e.note?' · '+esc(e.note):e.who?' · '+esc(e.who):'')+'</span><span>'+money(e.amt)+'</span></div>'; }).join('')+'</div>';
  h+='<div id="wcost"></div><div class="qadd">'+WRAP_CATS.map(function(c,i){ return '<button type="button" data-qc="'+i+'">+ '+esc(c[1])+'</button>'; }).join('')+'</div>';
  if(D.gstReg) h+='<label class="check"><input type="checkbox" name="gst" checked>New costs include GST</label>';
  h+='</div>';
  h+='<div class="wres" id="wres"></div>';
  h+='<div class="err" id="wErr" hidden></div><div class="actions"><button type="button" class="btn plain" data-close>Later</button><button type="submit" class="btn primary grow">Save</button></div>';
  if(!a) h+='<div class="actions"><button type="button" class="btn plain grow" data-skip style="color:var(--meta)">Don\'t ask for this job</button></div>';
  h+='</form>';
  var s=sheet(h), f=s.querySelector('#wf');
  function costs(){ return Array.prototype.map.call(s.querySelectorAll('.crow'),function(r){ return {amt:parseFloat(r.querySelector('[data-ca]').value), cat:r.querySelector('[data-cc]').value, note:r.querySelector('[data-cn]').value}; }).filter(function(c){ return c.amt>0; }); }
  function staff(){ var o={}; s.querySelectorAll('[data-h]').forEach(function(i){ if(i.value!=='') o[i.dataset.h]=parseFloat(i.value)||0; }); return o; }
  function calc(){
    var st=staff(), tot=Object.keys(st).reduce(function(x,k){return x+st[k];},0);
    s.querySelector('#wtot').textContent=(Math.round(tot*100)/100)+' hrs';
    var pv=f.elements.price.value, gst=D.gstReg&&f.elements.gst&&f.elements.gst.checked;
    var D2=Object.assign({},D,{books:Object.assign({},D.books,{actuals:Object.assign({},acts),prices:Object.assign({},D.books.prices)})});
    D2.books.actuals[key]={staff:st}; if(pv!=='') D2.books.prices[key]=+pv;
    D2.expenses=D.expenses.concat(costs().map(function(c){ return {job:key,date:b.last,amt:c.amt,gst:gst?c.amt/11:0,cat:c.cat}; }));
    var r=pnl(D2,b.date,b.last).jobs.filter(function(x){return x.key===key;})[0], out=s.querySelector('#wres');
    if(!tot){ out.innerHTML='<span style="margin:0">Enter the hours to see what this job made per hour.</span>'; return; }
    if(!r||r.rev==null){ out.innerHTML='<b>'+(Math.round(tot*100)/100)+' hrs</b><span>Add the job price to see the hourly rate and profit.</span>'; return; }
    // Overheads at the steady 90-day rate (not just what fell due on these days),
    // and the owner's hours are unpaid here, so what's left is what Jack earned.
    var oh=ohRate()*tot, net=r.profit-oh, mine=ownerHrs(st);
    var h='<b>'+(mine>0?money(net/mine)+' <small style="font:500 15px var(--sans)">per hour for you</small>':money(net)+' <small style="font:500 15px var(--sans)">profit</small>')+'</b>';
    h+='<span class="'+(net<0?'neg':'')+'">'+(mine>0?'You earned '+money(net)+' for your '+r1(mine)+' hrs, after everything':(net<0?'Loss ':'Profit ')+money(net)+' after everything')+(r.rev>0?' · '+Math.round(net/r.rev*100)+'% margin':'')+'</span>';
    h+='<span>'+money(r.rev)+(D.gstReg?' ex GST':'')+' in − '+money(r.labour)+' staff wages &amp; super − '+money(r.exp)+' job costs − '+money(oh)+' overheads ('+r1(tot)+' hrs × '+money(ohRate())+')</span>';
    h+='<span>'+money(r.rev/tot)+' earned per hour worked, all '+r1(tot)+' hrs</span>';
    if(mine>0) h+='<span>Income tax comes out of what you earned; it isn\'t taken off here.</span>';
    out.innerHTML=h;
  }
  function addCost(cat,note){ var w=s.querySelector('#wcost'), d=document.createElement('div'); d.className='crow'; d.innerHTML='<span class="money-in" style="display:block"><input data-ca type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00"></span><select data-cc>'+D.cats.map(function(c){ return '<option'+(c===cat?' selected':'')+'>'+esc(c)+'</option>'; }).join('')+'</select><button type="button" class="x" data-rm aria-label="Remove">×</button><input data-cn type="hidden" value="'+esc(note||'')+'">'; w.appendChild(d); d.querySelector('[data-ca]').focus(); }
  s.addEventListener('click',function(ev){
    var qc=ev.target.closest('[data-qc]'); if(qc){ var c=WRAP_CATS[+qc.dataset.qc]; addCost(c[0], c[1]==='Parking'?'Parking':''); return; }
    var rm=ev.target.closest('[data-rm]'); if(rm){ rm.closest('.crow,.wrow').remove(); calc(); return; }
  });
  s.addEventListener('input',calc); s.addEventListener('change',calc);
  var ad=s.querySelector('#waddp'); if(ad) ad.onchange=function(){ var pid=ad.value; if(!pid) return; s.querySelector('#wppl').insertAdjacentHTML('beforeend',wrapRow(pid,'',null)); ad.querySelector('option[value="'+pid+'"]').remove(); ad.value=''; var i=s.querySelector('[data-h="'+pid+'"]'); if(i) i.focus(); };
  calc();
  function done(r,msg){ D.books.actuals=D.books.actuals||{}; D.books.actuals[key]=r.actual; if(r.price!=null) D.books.prices[key]=r.price; (r.expenses||[]).forEach(function(e){ D.expenses.unshift(e); }); D.expenses.sort(function(x,y){return (y.date+y.at).localeCompare(x.date+x.at);}); closeSheet(); render(); if(msg==null){ var j=pnl(D,b.date,b.last).jobs.filter(function(y){return y.key===key;})[0]; var a2=(D.books.actuals||{})[key], tt=a2&&a2.staff?Object.keys(a2.staff).reduce(function(x,k){return x+a2.staff[k];},0):0, mh=a2&&a2.staff?ownerHrs(a2.staff):0, nt=j&&j.profit!=null?j.profit-ohRate()*tt:null; msg=nt!=null?(b.j.client||'Job')+': '+money(nt)+' after everything'+(mh>0?' · '+money(nt/mh)+'/hr for you':''):'Saved'; } toast(msg); var nx=wrapList()[0]; if(nx) setTimeout(function(){ wrapSheet(nx.key); },700); }
  f.onsubmit=function(ev){ ev.preventDefault(); var err=s.querySelector('#wErr'), btn=f.querySelector('.primary'), st=staff();
    if(!Object.keys(st).some(function(k){return st[k]>0;})){ err.textContent='Enter the hours worked.'; err.hidden=false; return; }
    var gst=D.gstReg&&f.elements.gst&&f.elements.gst.checked, pv=f.elements.price.value;
    btn.disabled=true; btn.textContent='Saving…';
    api('POST',{action:'wrap',key:key,staff:st,date:b.last,price:pv===''?undefined:+pv,expenses:costs().map(function(c){ return {amt:c.amt,cat:c.cat,note:c.note,gst:gst}; })})
      .then(function(r){ done(r,null); })
      .catch(function(x){ btn.disabled=false; btn.textContent='Save'; err.textContent=x.message; err.hidden=false; });
  };
  var sk=s.querySelector('[data-skip]'); if(sk) sk.onclick=function(){ api('POST',{action:'wrap',key:key,skip:true}).then(function(r){ done(r,'Won\'t ask about this one'); }).catch(function(x){ toast(x.message); }); };
}

// ---------- events ----------
app.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]'); if(g){ location.hash='#/'+(g.dataset.go==='profit'?'':g.dataset.go); return; }
  var md=e.target.closest('[data-mode]'); if(md){ mode=md.dataset.mode; off=0; lsSet('books_mode',mode); render(); return; }
  var of=e.target.closest('[data-off]'); if(of){ off=of.dataset.off==='0'?0:off+(+of.dataset.off); render(); return; }
  var pr=e.target.closest('[data-price]'); if(pr){ priceSheet(pr.dataset.price); return; }
  var wr=e.target.closest('[data-wrap]'); if(wr){ wrapSheet(wr.dataset.wrap); return; }
  var ex=e.target.closest('[data-exp]'); if(ex){ expenseSheet(D.expenses.filter(function(x){return x.id===ex.dataset.exp;})[0]); return; }
  var fx=e.target.closest('[data-fixed]'); if(fx){ fixedSheet(fx.dataset.fixed==='new'?null:D.books.fixed.filter(function(x){return x.id===fx.dataset.fixed;})[0]); return; }
  var sa=e.target.closest('[data-setadd]'); if(sa){ var it=D.setup.filter(function(x){return x[0]===sa.dataset.setadd;})[0]; fixedSheet(null,{name:it[1],cat:it[2],freq:it[3],setup:it[0],gst:it[0]!=='workcover'&&it[0]!=='bank'}); return; }
  var sn=e.target.closest('[data-setna]'); if(sn){ var o={}; o[sn.dataset.setna]='na'; saveFixed(D.books.fixed,o,sn,null,'Ticked off'); return; }
  var su=e.target.closest('[data-setundo]'); if(su){ var u={}; u[su.dataset.setundo]=''; saveFixed(D.books.fixed,u,su,null,'Back on the list'); return; }
  var a=e.target.closest('[data-act]'); if(!a) return;
  var act=a.dataset.act;
  if(act==='refresh'){ loaded=false; render(); load(); }
  else if(act==='addexp') expenseSheet(null);
  else if(act==='sync'){ a.disabled=true; a.textContent='Syncing…'; api('POST',{action:'jobberSync'}).then(function(r){ toast(syncMsg(r)); return load(); }).catch(function(x){ a.disabled=false; a.textContent='Sync now'; toast(x.message); }); }
  else if(act==='unlink'){ if(!a.dataset.sure){ a.dataset.sure=1; a.textContent='Tap again'; return; } api('POST',{action:'jobberUrl',url:''}).then(load).then(function(){ toast('Jobber disconnected. Jobs already added stay.'); }); }
  else if(act==='xreload'){ X=null; render(); loadX(); }
  else if(act==='xcopy'){ try{ navigator.clipboard.writeText(X.redirect).then(function(){ toast('Copied'); }); }catch(x){ toast(X.redirect); } }
  else if(act==='xconnect'){ a.disabled=true; a.textContent='Opening Xero…'; xapi('POST',{action:'connect'}).then(function(r){ location.href=r.url; }).catch(function(x){ a.disabled=false; a.textContent='Connect Xero'; toast(x.message); }); }
  else if(act==='xsync'){ a.disabled=true; a.textContent='Syncing…'; xapi('POST',{action:'sync'}).then(function(r){ xMsg=null; toast(r.skipped||xSyncMsg(r)); return loadX(); }).catch(function(x){ a.disabled=false; a.textContent='Sync now'; toast(x.message); }); }
  else if(act==='xaccts'){ a.textContent='Reloading…'; xapi('POST',{action:'accounts'}).then(loadX).then(function(){ toast('Accounts reloaded'); }).catch(function(x){ toast(x.message); }); }
  else if(act==='xoff'){ if(!a.dataset.sure){ a.dataset.sure=1; a.textContent='Tap again'; return; } xapi('POST',{action:'disconnect'}).then(loadX).then(function(){ toast('Xero disconnected. What\'s already in Xero stays.'); }); }
  else if(act==='tickpast'){ a.closest('details').querySelectorAll('input[type=checkbox]').forEach(function(c){ c.checked=true; }); }
  else if(act==='ignore'){ var ids=ticked(); if(!ids.length){ toast('Tick some jobs first'); return; } a.disabled=true; api('POST',{action:'jobberSync',ignore:ids}).then(function(){ toast('Ignored '+ids.length); return load(); }).catch(function(x){ a.disabled=false; toast(x.message); }); }
});
function ticked(){ return Array.prototype.map.call(document.querySelectorAll('#pendf input:checked'),function(c){return c.value;}); }
function xSyncMsg(r){ var p=[]; if(r.added) p.push(r.added+' sent'); if(r.updated) p.push(r.updated+' updated'); if(r.deleted) p.push(r.deleted+' removed'); var m=p.length?'Xero: '+p.join(', '):'Xero is up to date'; if(r.errors&&r.errors.length) m+=' · '+r.errors.length+' problem'+(r.errors.length===1?'':'s'); if(r.left) m+=' · '+r.left+' more next sync'; return m; }
function syncMsg(r){ var p=[]; if(r.added) p.push(r.added+' added'); if(r.updated) p.push(r.updated+' moved'); if(r.removed) p.push(r.removed+' cancelled'); if(r.linked) p.push(r.linked+' matched'); return p.length?'Synced: '+p.join(', '):'Synced. Roster already up to date.'; }
app.addEventListener('submit',function(e){
  var f=e.target, btn=f.querySelector('[type=submit]');
  if(f.id==='pf'||f.id==='rf'){ e.preventDefault(); var m={}; Array.prototype.forEach.call(f.querySelectorAll('input'),function(i){ if(f.id==='rf'||i.value!=='') m[i.name]=i.value; }); if(!Object.keys(m).length){ toast('Enter at least one price'); return; } btn.disabled=true; btn.textContent='Saving…';
    priceQ=priceQ.then(function(){ return api('POST',f.id==='pf'?{action:'prices',prices:m}:{action:'prices',recur:m}); }); priceQ.then(function(){ Array.prototype.forEach.call(f.querySelectorAll('input'),function(i){ delete i.dataset.dirty; }); }).then(load).then(function(){ toast('Prices saved'); }).catch(function(x){ btn.disabled=false; btn.textContent='Save'; toast(x.message); }); return; }
  if(f.id==='xf'){ e.preventDefault(); var xe=f.querySelector('#xErr'), codes={}; Array.prototype.forEach.call(f.querySelectorAll('[data-cat]'),function(i){ codes[i.dataset.cat]=i.value; });
    btn.disabled=true; btn.textContent='Saving…';
    xapi('POST',{action:'settings',bank:f.elements.bank.value,cardBank:f.elements.cardBank.value,sales:f.elements.sales.value,from:f.elements.from.value,codes:codes}).then(loadX).then(function(){ xMsg=null; toast('Xero settings saved'); }).catch(function(x){ btn.disabled=false; btn.textContent='Save Xero settings'; xe.textContent=x.message; xe.hidden=false; }); return; }
  if(f.id==='jf'){ e.preventDefault(); var err=f.querySelector('#jErr'); btn.disabled=true; btn.textContent='Connecting…';
    api('POST',{action:'jobberUrl',url:f.elements.url.value}).then(function(r){ toast(syncMsg(r)); return load(); }).catch(function(x){ btn.disabled=false; btn.textContent='Connect and sync'; err.textContent=x.message; err.hidden=false; }); return; }
  if(f.id==='pendf'){ e.preventDefault(); var ids=ticked(); if(!ids.length){ toast('Tick the jobs to add'); return; } btn.disabled=true; btn.textContent='Adding…';
    api('POST',{action:'jobberSync',add:ids}).then(function(r){ toast(syncMsg(r)); return load(); }).catch(function(x){ btn.disabled=false; btn.textContent='Add ticked to roster'; toast(x.message); }); return; }
});
// Each price saves on its own as soon as you leave the box, one at a time so none overwrite each other.
var priceQ=Promise.resolve();
app.addEventListener('input',function(e){ var i=e.target; if(i.form&&(i.form.id==='pf'||i.form.id==='rf')){ i.dataset.dirty=1; var c=i.closest('.prow2'); if(c) c.classList.remove('saved'); } });
app.addEventListener('change',function(e){
  var i=e.target; if(!i.form||i.form.id!=='pf'||i.value==='') return;
  var k=i.name, v=i.value, row=i.closest('.prow2');
  priceQ=priceQ.then(function(){ return api('POST',{action:'price',key:k,price:+v}); }).then(function(){
    D.books.prices[k]=+v; if(i.value===v){ delete i.dataset.dirty; if(row) row.classList.add('saved'); }
  }).catch(function(x){ toast('Price not saved: '+x.message); });
});
function unsaved(){ return !!app.querySelector('#pf input[data-dirty],#rf input[data-dirty]'); }
render(); load();
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&!document.getElementById('scrim')&&!unsaved()) priceQ.then(load); });
</script>
