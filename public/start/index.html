<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#F5F0EB">
<title>Bardon Clean Team Onboarding</title>
<link rel="icon" type="image/png" href="/icons/favicon.png?v=2"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--terracotta:#C06B3C;--terracotta-dark:#A55830;--dark:#1A1A1A;--cream:#F5F0EB;--cream-dark:#EDE6DE;--meta:#7A7A7A;--line:#DDD3C8;--white:#fff;--tint:#FBF3EE;--serif:"Playfair Display",Georgia,serif;--sans:"Inter",-apple-system,BlinkMacSystemFont,Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:#4A4A4A;font:400 16px/1.5 var(--sans)}
#app{max-width:560px;margin:0 auto;padding:20px 16px calc(120px + env(safe-area-inset-bottom,0px))}
.wm{display:flex;gap:8px;align-items:center;font:700 18px/1 var(--serif);color:var(--dark)}
.wm svg{width:28px;height:28px}
.prog{height:6px;background:var(--cream-dark);border-radius:99px;margin:18px 0 6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--terracotta);border-radius:99px;transition:width .3s}
.step{font:500 12px var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--meta)}
h1{font:700 28px/1.15 var(--serif);color:var(--dark);margin:6px 0 4px}
h1 em{font-style:italic;font-weight:500;color:var(--terracotta)}
.sub{color:var(--meta);font-size:14px;margin:0 0 14px}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
label.l{display:block;font:500 14px/1.3 var(--sans);color:var(--dark)}
label.l small,.q small{font-weight:400;color:var(--meta)}
input,select,textarea{width:100%;margin-top:6px;font:400 16px/1.35 var(--sans);color:var(--dark);background:var(--white);border:1px solid #CFC5BA;border-radius:6px;padding:11px;min-height:46px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,.opt:focus-within{outline:2px solid var(--terracotta);outline-offset:1px}
.q{font:500 14px var(--sans);color:var(--dark)}
.opts{display:grid;gap:8px;margin-top:8px}
.opts.row{grid-template-columns:repeat(auto-fit,minmax(70px,1fr))}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:11px 12px;cursor:pointer;font-size:15px;color:var(--dark);background:var(--white)}
.opt input{width:20px;height:20px;min-height:0;margin:0;accent-color:var(--terracotta);flex:none}
.opt:has(input:checked){border-color:var(--terracotta);background:var(--tint)}
.hint{font-size:13px;color:var(--meta);margin:4px 0 0}
.note{background:var(--tint);border-radius:8px;padding:11px 13px;font-size:14px;color:var(--dark)}
.err{color:var(--terracotta-dark);font:500 14px/1.4 var(--sans);margin-top:12px}
.hp{position:absolute;left:-9999px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{font:600 16px var(--sans);border-radius:8px;min-height:50px;padding:0 18px;cursor:pointer;border:0}
.btn.primary{background:var(--terracotta);color:#fff;flex:1}
.btn.primary:disabled{opacity:.6}
.btn.plain{background:var(--white);border:1px solid var(--line);color:var(--dark)}
.photo{display:flex;gap:12px;align-items:center}
.photo img{width:84px;height:60px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.center{text-align:center;padding:50px 10px;color:var(--dark)}
</style></head><body>
<div id="app"><div class="center">Loading…</div></div>
<script>
(function(){
  var app=document.getElementById('app');
  var LOGO='<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M5 21 L24 6 L43 21" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="square"/><text x="24" y="43" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-weight="700" font-size="25" fill="#1A1A1A">B</text></svg>';
  var t=(location.pathname.split('/start/')[1]||'').replace(/[^a-f0-9]/g,'');
  var F={days:[],state:'QLD',signDate:'',decFw:false,decConf:false,decTrue:false}, photo=null, step=0, sending=false, err='';
  var STATES=['QLD','NSW','VIC','ACT','SA','WA','TAS','NT'], DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function pad(n){ return (n<10?'0':'')+n; }
  function today(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function digits(v){ return String(v||'').replace(/\D/g,''); }
  function tfnOk(v){ var d=digits(v), w=d.length===9?[1,4,3,7,5,8,6,9,10]:d.length===8?[10,7,8,4,6,3,5,1]:null; if(!w) return false; var s=0; for(var i=0;i<d.length;i++) s+=+d[i]*w[i]; return s%11===0; }
  F.signDate=today();

  function inp(n,label,type,o){ o=o||{}; return '<label class="l">'+label+(o.opt?' <small>optional</small>':'')+'<input name="'+n+'" type="'+(type||'text')+'" value="'+esc(F[n]||'')+'"'+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+(o.im?' inputmode="'+o.im+'"':'')+(o.ac?' autocomplete="'+o.ac+'"':'')+'>'+(o.hint?'<p class="hint">'+o.hint+'</p>':'')+'</label>'; }
  function sel(n,label,opts,o){ o=o||{}; return '<label class="l">'+label+'<select name="'+n+'">'+(o.blank?'<option value="">Choose</option>':'')+opts.map(function(x){ var v=Array.isArray(x)?x[0]:x, l=Array.isArray(x)?x[1]:x; return '<option value="'+esc(v)+'"'+(F[n]===v?' selected':'')+'>'+esc(l)+'</option>'; }).join('')+'</select></label>'; }
  function radio(n,q,opts,o){ o=o||{}; return '<div><div class="q">'+q+'</div><div class="opts'+(o.row?' row':'')+'">'+opts.map(function(x){ return '<label class="opt"><input type="radio" name="'+n+'" value="'+x[0]+'"'+(F[n]===x[0]?' checked':'')+'>'+esc(x[1])+'</label>'; }).join('')+'</div></div>'; }
  function area(n,label,o){ o=o||{}; return '<label class="l">'+label+(o.opt?' <small>optional</small>':'')+'<textarea name="'+n+'">'+esc(F[n]||'')+'</textarea></label>'; }

  var STEPS=[
    ['About <em>you</em>','As it appears on your ID.',function(){ return '<div class="two">'+inp('first','First name','text',{ac:'given-name'})+inp('last','Last name','text',{ac:'family-name'})+'</div><div class="two">'+inp('middle','Middle name(s)','text',{opt:1})+inp('preferred','Preferred name','text',{opt:1})+'</div>'+inp('prevName','Previous family name','text',{opt:1})+inp('dob','Date of birth','date',{ac:'bday'})+'<div class="two">'+inp('mobile','Mobile','tel',{ph:'e.g. 0412 345 678',im:'tel',ac:'tel'})+inp('email','Email','email',{im:'email',ac:'email'})+'</div>'+inp('street','Home address','text',{ac:'street-address'})+inp('suburb','Suburb','text',{ac:'address-level2'})+'<div class="two">'+sel('state','State',STATES)+inp('postcode','Postcode','text',{im:'numeric',ac:'postal-code'})+'</div>'; },
      function(){ if(!F.first||!F.last) return 'Add your first and last name.'; if(!F.dob) return 'Add your date of birth.'; if(digits(F.mobile).replace(/^61/,'0').length!==10) return 'Check your mobile number.'; if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(F.email||'')) return 'That email doesn\'t look right.'; if(!F.street||!F.suburb) return 'Add your home address and suburb.'; if(!/^\d{4}$/.test(F.postcode||'')) return 'Postcode should be 4 digits.'; }],
    ['Emergency <em>contact</em>','Who we call if something happens at work.',function(){ return inp('emergName','Full name')+inp('emergRel','Relationship','text',{ph:'e.g. Partner, Mum'})+inp('emergPhone','Phone','tel',{im:'tel'}); },
      function(){ if(!F.emergName||!F.emergRel||!F.emergPhone) return 'Fill in all three.'; }],
    ['Tax <em>details</em>','This is your TFN declaration. It tells us how much tax to hold back.',function(){ return radio('tfnStatus','Do you have a TFN?',[['yes','Yes, I\'ll enter it below'],['applied','I\'ve applied for one and am waiting on it'],['under18','I\'m under 18 and don\'t have one']])+(F.tfnStatus==='yes'?inp('tfn','Tax file number','text',{im:'numeric',ac:'off'}):'')+radio('residency','For tax purposes, you are…',[['resident','An Australian resident'],['foreign','A foreign resident'],['whm','A working holiday maker (visa 417 or 462)']])+radio('tft','Claim the tax-free threshold?',[['yes','Yes'],['no','No']],{row:1})+'<p class="hint">Claim it if this is your only or main job. Only claim it with one employer at a time.</p>'+radio('help','Study loan (HELP, VSL, SFSS, SSL or TSL)?',[['yes','Yes'],['no','No']],{row:1}); },
      function(){ if(!F.tfnStatus) return 'Tell us about your TFN.'; if(F.tfnStatus==='yes'&&!tfnOk(F.tfn)) return 'That TFN doesn\'t check out. Check the numbers.'; if(!F.residency) return 'Pick your tax residency.'; if(!F.tft||!F.help) return 'Answer the tax-free threshold and study loan questions.'; }],
    ['Super <em>fund</em>','We pay 12% on top of your wages into your super.',function(){ return radio('superChoice','Where should we pay your super?',[['own','My existing fund (enter details below)'],['stapled','I\'m not sure. Find my existing fund through the ATO']])+(F.superChoice==='own'?inp('superFund','Fund name')+'<div class="two">'+inp('superUsi','Fund USI','text',{opt:1})+inp('superNo','Member number')+'</div>'+inp('superAbn','Fund ABN','text',{opt:1,im:'numeric'}):''); },
      function(){ if(!F.superChoice) return 'Tell us where to pay your super.'; if(F.superChoice==='own'&&(!F.superFund||!F.superNo)) return 'Add your fund name and member number.'; }],
    ['Bank <em>account</em>','Where your pay goes each week.',function(){ return inp('bankName','Account name','text',{ac:'cc-name'})+'<div class="two">'+inp('bsb','BSB','text',{im:'numeric',ph:'6 digits'})+inp('acct','Account number','text',{im:'numeric'})+'</div>'; },
      function(){ if(!F.bankName) return 'Add the account name.'; if(digits(F.bsb).length!==6) return 'BSB should be 6 digits.'; if(!/^\d{5,10}$/.test(digits(F.acct))) return 'Check the account number.'; }],
    ['Right to <em>work</em>','We have to check you can work in Australia.',function(){ return radio('work','Your status',[['citizen','Australian citizen'],['pr','Permanent resident'],['nz','New Zealand citizen'],['visa','Visa holder']])+(F.work==='visa'?inp('visaExpiry','Visa expiry','date')+'<div class="two">'+inp('passport','Passport number')+inp('passportCountry','Passport country')+'</div>'+inp('visaConditions','Work conditions on your visa','text',{opt:1}):'')+'<div><div class="q">Photo of your ID <small>driver licence front or passport photo page</small></div><div class="photo" style="margin-top:8px">'+(photo?'<img src="'+photo+'" alt="Your ID photo">':'')+'<label class="btn plain" style="display:inline-flex;align-items:center;min-height:46px">'+(photo?'Change photo':'Upload a photo of your ID')+'<input type="file" accept="image/*" id="idf" hidden></label></div></div>'; },
      function(){ if(!F.work) return 'Pick your status.'; if(F.work==='visa'&&!F.visaExpiry) return 'Add your visa expiry date.'; if(!photo) return 'Upload a photo of your ID.'; }],
    ['Driving <em>and checks</em>','',function(){ return radio('car','Own car for travel between jobs?',[['yes','Yes'],['no','No']],{row:1})+(F.car==='yes'?'<div class="two">'+inp('licenceExpiry','Licence expiry','date')+sel('licenceState','Licence state',STATES.concat(['Overseas']),{blank:1})+'</div>'+sel('carInsurance','Is the car insured?',[['Comprehensive','Comprehensive'],['Third party','Third party'],['CTP only','CTP only']],{blank:1}):'')+radio('policeCheck','National Police Check in the last 12 months?',[['yes','Yes'],['no','No']],{row:1}); },
      function(){ if(!F.car||!F.policeCheck) return 'Answer both questions.'; }],
    ['Availability <em>and kit</em>','',function(){ return '<div><div class="q">Days you can usually work</div><div class="opts row">'+DAYS.map(function(d){ return '<label class="opt"><input type="checkbox" name="days" value="'+d+'"'+(F.days.indexOf(d)>=0?' checked':'')+'>'+d+'</label>'; }).join('')+'</div></div>'+area('availNotes','Times, limits or other commitments',{opt:1})+'<div class="two">'+sel('shirt','Shirt size',['XS','S','M','L','XL','2XL','3XL'],{blank:1})+inp('earliestStart','Earliest start date','date')+'</div>'+area('allergies','Allergies or sensitivities to cleaning products',{opt:1})+area('safety','Anything we should know to keep you safe at work?',{opt:1}); },
      function(){ if(!F.days.length) return 'Pick at least one day.'; if(!F.shirt) return 'Pick your shirt size.'; }],
    ['Last <em>thing</em>','Read and sign.',function(){ return '<label class="opt"><input type="checkbox" name="decFw"'+(F.decFw?' checked':'')+'>I\'ve received and read the Fair Work Information Statement and the Casual Employment Information Statement.</label><label class="opt"><input type="checkbox" name="decConf"'+(F.decConf?' checked':'')+'>I agree to keep client information and keys confidential and secure.</label><label class="opt"><input type="checkbox" name="decTrue"'+(F.decTrue?' checked':'')+'>The information I\'ve given is true and correct.</label>'+inp('sign','Type your full name to sign')+inp('signDate','Date','date'); },
      function(){ if(!(F.decFw&&F.decConf&&F.decTrue)) return 'Tick all three boxes.'; if(!F.sign) return 'Type your full name to sign.'; }]
  ];

  function render(){
    var S=STEPS[step], last=step===STEPS.length-1;
    var h='<div class="wm">'+LOGO+'Bardon Clean</div><div class="prog" aria-hidden="true"><i style="width:'+Math.round(step/STEPS.length*100)+'%"></i></div><div class="step">Step '+(step+1)+' of '+STEPS.length+'</div><h1>'+S[0]+'</h1>'+(S[1]?'<p class="sub">'+S[1]+'</p>':'<div style="height:10px"></div>');
    if(step===0) h+='<p class="note" style="margin:0 0 14px">Your details go straight to Jack and are kept private. Nothing is saved on this device.</p>';
    h+='<form id="f" class="card" novalidate><input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">'+S[2]()+'</form>';
    h+='<div class="bar">'+(err?'<p class="err" role="alert" style="max-width:560px;margin:0 auto 8px">'+esc(err)+'</p>':'')+'<div class="in">'+(step?'<button class="btn plain" id="back">Back</button>':'')+'<button class="btn primary" id="next"'+(sending?' disabled':'')+'>'+(last?(sending?'Sending…':'Send my details to Bardon Clean'):'Next')+'</button></div></div>';
    app.innerHTML=h;
    var f=document.getElementById('f');
    f.addEventListener('input',read); f.addEventListener('change',function(e){ read(); if(e.target.type==='radio'||e.target.tagName==='SELECT') { var y=window.scrollY; render(); window.scrollTo(0,y); } });
    f.onsubmit=function(e){ e.preventDefault(); next(); };
    var idf=document.getElementById('idf'); if(idf) idf.onchange=function(){ var file=idf.files&&idf.files[0]; if(!file) return; shrink(file).then(function(d){ photo=d; err=''; render(); }).catch(function(){ err='That photo didn\'t load. Try another one.'; render(); }); };
    document.getElementById('next').onclick=next;
    var b=document.getElementById('back'); if(b) b.onclick=function(){ step--; err=''; render(); window.scrollTo(0,0); };
  }
  function read(){
    var f=document.getElementById('f'); if(!f) return;
    Array.prototype.forEach.call(f.elements,function(el){ if(!el.name) return;
      if(el.name==='days'){ return; }
      if(el.type==='radio'){ if(el.checked) F[el.name]=el.value; }
      else if(el.type==='checkbox') F[el.name]=el.checked;
      else F[el.name]=el.value.trim(); });
    var ds=f.querySelectorAll('[name=days]'); if(ds.length) F.days=Array.prototype.filter.call(ds,function(x){return x.checked;}).map(function(x){return x.value;});
  }
  function next(){
    read(); var e=STEPS[step][3](); if(e){ err=e; render(); return; }
    err='';
    if(step<STEPS.length-1){ step++; render(); window.scrollTo(0,0); return; }
    sending=true; render();
    fetch('/api/onboard',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({t:t,form:F,idPhoto:photo})})
      .then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error(d.error||'That didn\'t send. Try again.'); return d; }); })
      .then(function(){ app.innerHTML='<div class="wm">'+LOGO+'Bardon Clean</div><div class="center"><h1>Thanks, <em>'+esc(F.preferred||F.first)+'</em></h1><p>Your details are with Jack. He\'ll be in touch about your first shift.</p></div>'; window.scrollTo(0,0); })
      .catch(function(x){ sending=false; err=x.message; render(); });
  }
  function shrink(file){
    return new Promise(function(res,rej){ var img=new Image(), url=URL.createObjectURL(file);
      img.onload=function(){ var m=1600, w=img.naturalWidth, h=img.naturalHeight, k=Math.min(1,m/Math.max(w,h)), c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); var q=.82, d=c.toDataURL('image/jpeg',q); while(d.length>1150000&&q>.4){ q-=.12; d=c.toDataURL('image/jpeg',q); } res(d); };
      img.onerror=rej; img.src=url; });
  }
  if(!t){ render(); return; }
  fetch('/api/onboard?t='+t).then(function(r){ return r.json().then(function(d){ if(!r.ok) throw new Error(d.error); return d; }); })
    .then(function(d){ F.first=d.first; F.last=d.last; F.mobile=d.mobile; F.email=d.email; render(); })
    .catch(function(e){ app.innerHTML='<div class="wm">'+LOGO+'Bardon Clean</div><div class="center"><p>'+esc(e.message||'This link isn\'t right.')+'</p></div>'; });
})();
</script>
</body></html>
