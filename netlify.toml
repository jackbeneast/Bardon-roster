[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

# Agent portal: /a/<agent token> and vendor links /v/<job share token>
[[redirects]]
  from = "/a/*"
  to = "/agent/index.html"
  status = 200

[[redirects]]
  from = "/v/*"
  to = "/agent/index.html"
  status = 200

# View-only copy of a client's link that they shared: /s/<token>
[[redirects]]
  from = "/s/*"
  to = "/agent/index.html"
  status = 200

# Bond evidence pack, printable: /pack/<client link token>
[[redirects]]
  from = "/pack/*"
  to = "/pack/index.html"
  status = 200

# Public demo of the client link and agent portal (for the website): /demo, /demo/rent, /demo/agent
[[redirects]]
  from = "/demo"
  to = "/agent/index.html"
  status = 200

[[redirects]]
  from = "/demo/*"
  to = "/agent/index.html"
  status = 200

# Client quotes /q/<token> and invoices /i/<token>
[[redirects]]
  from = "/q/*"
  to = "/d/index.html"
  status = 200

[[redirects]]
  from = "/r/*"
  to = "/d/index.html"
  status = 200

[[redirects]]
  from = "/i/*"
  to = "/d/index.html"
  status = 200

# New starter form: /start (anyone) and /start/<token> (a personal, prefilled link)
[[redirects]]
  from = "/start/*"
  to = "/start/index.html"
  status = 200

# New starter's personal onboarding page: /w/<token>
[[redirects]]
  from = "/w/*"
  to = "/welcome/index.html"
  status = 200

# Employee pay link /pay/<token>: their own payslips
[[redirects]]
  from = "/pay/*"
  to = "/payslip/index.html"
  status = 200

# Public quote request form
[[redirects]]
  from = "/quote"
  to = "/request/index.html"
  status = 200

# Careers page short links
[[redirects]]
  from = "/jobs"
  to = "/careers/"
  status = 301

# Employment contract signing page
[[redirects]]
  from = "/contract"
  to = "/contract/index.html"
  status = 200

# Team app: /me (remembers who you are) and /me/<team id> (a personal link)
[[redirects]]
  from = "/me/*"
  to = "/me/index.html"
  status = 200
