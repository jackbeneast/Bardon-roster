[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

# Agent portal: /a/<agent token> and vendor links /v/<job share token>
[[redirects]]
  from = "/a/*"
  to = "/agent/index.html"
  status = 200

[[redirects]]
  from = "/v/*"
  to = "/agent/index.html"
  status = 200

# Client quotes /q/<token> and invoices /i/<token>
[[redirects]]
  from = "/q/*"
  to = "/d/index.html"
  status = 200

[[redirects]]
  from = "/r/*"
  to = "/d/index.html"
  status = 200

[[redirects]]
  from = "/i/*"
  to = "/d/index.html"
  status = 200

# Public quote request form
[[redirects]]
  from = "/quote"
  to = "/request/index.html"
  status = 200

# Careers page short links
[[redirects]]
  from = "/jobs"
  to = "/careers/"
  status = 301
